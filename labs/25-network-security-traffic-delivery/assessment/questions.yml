      Balancer, and NAT Gateway still has to meet the mandatory boundary.
    C: 'The review is governed by this fact: hierarchical policy, DNS proxy, TLS inspection decision, IDPS, threat
      intelligence, rule ownership, logging, and exception expiry are explicit. In the decision record, that outcome
