adr:
  id: ADR-LAB25-001
  status: accepted
  context: 'Fourth Coffee Health exposes appointment services globally and connects them to private clinical APIs
    in a hub-and-spoke Azure network. Security requires segmented environments, centralized inspection, application-layer
    protection, controlled east-west flows, and explicit outbound connectivity. Operations also need the correct
    load-balancing service at each layer: global HTTP entry, regional web routing, private TCP distribution, and
    deterministic egress. Earlier diagrams used a Basic Load Balancer and assumed default outbound access, creating
    retirement and reliability risk. Learners will inspect a safe PowerShell analogue built around Front Door Premium,
    Azure Firewall Premium, Application Gateway WAF v2, Standard Load Balancer, and NAT Gateway without altering
    production policy.'
  decision: 'Select Front Door Premium, Application Gateway WAF v2, Azure Firewall Premium, Standard Load Balancer,
    and NAT Gateway: Layered global, regional, east-west, and explicit outbound services provide native WAF, TLS
    inspection, FQDN policy, and failure-domain controls.'
  consequences:
  - The certificate-pinned vendor receives a narrowly governed TLS-inspection exception with an owner and review
    date.
  - Standard Load Balancer never supplies accidental outbound access; NAT and firewall routing are deliberate dependencies.
