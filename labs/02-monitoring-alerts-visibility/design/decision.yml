adr:
  id: ADR-LAB02-001
  status: accepted
  context: Fabrikam Payments has a centralized Log Analytics estate, but responders learn about customer impact
    from support tickets. Platform metrics, resource health events, query-based service-level indicators, and application
    telemetry are monitored by different teams with inconsistent thresholds. As the monitoring architect, design
    the health model, action routing, alert severity, suppression, and workbook views that turn the collection architecture
    from Lab 01 into actionable operational visibility. The solution must avoid noisy static thresholds, distinguish
    symptoms from causes, preserve independent positive and negative validation, and document ownership for every
    notification path without embedding personal addresses, secrets, or live incident data.
  decision: 'Select Service-centric alerts with shared action groups and curated workbooks: SLO-oriented multi-signal
    alerts correlate customer impact, dependency state, and deployment context while reusable action groups control
    routing.'
  consequences:
  - Service owners must maintain SLO thresholds and promotion annotations as product behavior changes.
  - Shared receiver governance becomes a platform responsibility with regular delivery tests.
