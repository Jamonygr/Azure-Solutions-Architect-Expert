  stem: 'An assurance review of ''Model scopes and inherited access'' includes internal audit. Approval requires
    a positive result plus this independent negative assertion: No individual user holds standing Owner at the reviewed
    production scope. Which response meets the need for the acceptance rule that makes LAB04-REQ-01 testable?'
  options:
    A: Select Direct user assignments on individual resources and servers before checking Model scopes and inherited
      access; next, take it as conclusive that a successful deployment will later prove the architecture constraint.
    B: Use the passing result from Delegate through groups rather than people to approve Model scopes and inherited
      access. In addition, treat it as established that one control establishes an unrelated acceptance boundary.
    C: Choose Subscription-wide custom roles mirrored into local administrator groups and skip the Model scopes
      and inherited access negative assertion; before approval, use as justification the claim that the candidate
      has the lowest implementation effort.
    D: Require the documented positive state for Model scopes and inherited access. Also, verify that no individual
      user holds standing Owner at the reviewed production scope.
  answer: D
  explanations:
    A: The architecture evidence must show that no individual user holds standing Owner at the reviewed production
      scope. That evidence means a deployment result cannot prove LAB04-REQ-01, and Direct user assignments on individual
      resources and servers still has to meet the mandatory boundary.
    B: The applicable design condition is that the operating team receives resource-group Contributor through an
      owned Microsoft Entra group. That evidence means that outcome belongs to Delegate through groups rather than
      people and leaves Model scopes and inherited access unverified.
    C: 'The review is governed by this fact: reduce standing privilege and audit ambiguity without preventing platform
      and factory teams from meeting support obligations. That evidence means implementation effort cannot justify
      skipping the negative assertion or displace LAB04-REQ-01.'
    D: The scenario makes clear that stable management scopes and group assignments explain both direct and inherited
      effective access. That evidence means the positive state and an independent negative assertion jointly make
      LAB04-REQ-01 testable.
