adr:
  id: ADR-LAB04-001
  status: accepted
  context: Adventure Works operates Azure subscriptions alongside factories whose Windows and Linux servers are
    projected through Azure Arc. Authentication is standardized, yet authorization grew through direct owner assignments,
    nested groups, and local administrator exceptions. Audit cannot explain why a principal can change a production
    resource or read a vault secret. As the authorization architect, create a scope and delegation model using Microsoft
    Entra groups, Azure RBAC, narrowly designed custom roles, resource-provider data-plane roles, and an explicit
    hybrid boundary. The design must preserve separation of duties, expose inherited access, avoid classic administrators,
    and distinguish Azure control-plane authorization from operating-system permissions on connected machines.
  decision: 'Select Group-based Azure RBAC at stable scopes with Arc-aware local delegation: Stable groups decouple
    personnel churn from role definitions and Arc-aware local delegation avoids granting subscription networking
    rights.'
  consequences:
  - Plant owners accept responsibility for time-bound activation and review decisions.
  - Local machine authorization must be monitored separately from Azure RBAC because neither proves the other.
