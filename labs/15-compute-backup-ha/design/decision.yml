adr:
  id: ADR-LAB15-001
  status: accepted
  context: Fabrikam Health runs appointment and imaging coordination on Windows and Linux virtual machines distributed
    across one Azure region. Backups exist, but recent restore testing found inconsistent policies, unprotected
    data disks, and a single application tier confined to one datacenter boundary. The clinical service must survive
    a zone outage, recover from destructive change, retain immutable recovery points, and prove that restored machines
    are isolated before reconnecting to production. A full second-region estate is too expensive for the learning
    environment, so the architecture team will evaluate the production design through read-only discovery, policy
    evidence, and a safe analogue that models failover ordering without creating standby compute.
  decision: 'Select Zone-spread virtual machine scale sets with Azure Backup and isolated restore: Zone-spread compute
    covers datacenter loss and Azure Backup supplies protected recovery points for a controlled quarantined restore.'
  consequences:
  - Backup policy must retain enough points that rejecting the newest three still leaves a recoverable candidate.
  - Security approval becomes part of the measured clinical recovery path, not a post-restore note.
