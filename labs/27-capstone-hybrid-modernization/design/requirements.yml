constraints:
- Modernization must preserve branch service, regulatory evidence, reversibility, and transparent residual risk.
- A merger adds a second tenant and regulated geography, and branch order capture must work for eight hours without
  WAN connectivity.
- Use only the Azure PowerShell + Bicep command lane for learner implementation.
- Keep all live changes behind explicit execution and acknowledgement switches.
- Retain only sanitized command evidence and synthetic fixture identifiers.
assumptions:
- Branch applications can persist orders locally with stable identifiers and synchronize through an idempotent contract.
- Tenant and geography ownership can be assigned before a workload enters a modernization wave.
- West Europe is the configurable primary example and North Europe is the configurable secondary example.
- The learner has administrator-level Azure operations knowledge but receives no pre-existing authenticated context.
- Offline fixtures demonstrate contract behavior rather than live Azure service behavior.
facts:
  data: Orders, product reference data, identities, dependency records, Arc inventory, migration evidence, and regulatory
    classifications cross distinct boundaries.
  scale: Branch count, order rate, eight-hour offline volume, application dependencies, and tenant split are measured
    in the supplied portfolio.
  latency: Local order capture remains responsive without WAN; synchronization latency is measured after connectivity
    returns.
  availability: Branch edge operation covers an eight-hour WAN loss while Azure regions, tenants, and datacenters
    remain separate failure domains.
  rto: Branch capture has effectively immediate local continuity; centralized reconciliation recovery follows an
    owner-approved target.
  rpo: Accepted offline orders require zero local loss before synchronization, with conflict resolution for updates
    from both sides.
  budget: Edge capacity and dual-tenant governance are funded where they reduce outage and regulatory risk; indefinite
    datacenter retention is not free.
