rejectedAlternatives:
- candidate: Parallel cloud rebuild followed by one enterprise-wide big-bang cutover
  reason: The combined cutover cannot expose or contain failures by wave and leaves little credible rollback time.
- candidate: Indefinite hybrid retention with lifecycle-only virtual machine rehosting
  reason: It does not deliver the modernization outcome or transparent retirement economics.
- candidate: Single-tenant big-bang migration with WAN-dependent branch order entry
  reason: It is ineligible because it cannot preserve regulated separation or branch continuity.
risks:
- risk: Offline branches can generate conflicting order updates when centralized service continues processing.
  mitigation: Use globally unique order identifiers, versioned commands, deterministic conflict policy, and an exception
    queue with business ownership.
- risk: Cross-tenant administration can create hidden shared identities or copy regulated evidence between geographies.
  mitigation: Maintain separate identity and logging boundaries, broker only approved business messages, and test
    prohibited cross-tenant paths.
