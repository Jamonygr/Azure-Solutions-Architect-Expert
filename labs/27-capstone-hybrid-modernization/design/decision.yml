  costOptimization: Wave business cases include coexistence and edge cost alongside eliminated facilities and managed-service
    value.
  operationalExcellence: Portfolio, dependency, sync, conflict, evidence, cutover, and residual-risk records make
    modernization governable.
  performanceEfficiency: Local branch writes avoid WAN latency and managed targets scale independently after each
    approved wave.
safeAnalogue: Run the complete portfolio, branch-outage, conflict, tenant-boundary, wave, and rollback simulation
