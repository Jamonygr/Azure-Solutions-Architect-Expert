adr:
  id: ADR-LAB27-001
  status: accepted
  context: Wide World Importers is modernizing a hybrid estate that includes on-premises VMware, branch services
    with intermittent links, SQL Server databases, legacy web applications, file archives, and a growing Azure footprint.
    The board wants rapid datacenter reduction, but operations require staged coexistence, business owners need
    reversible waves, and regulators require evidence before classified data moves. Learners receive a sanitized
    portfolio, dependency graph, simulated performance captures, policy results, and failure injects. They must
    design a hybrid target and migration factory, express shared Azure foundations in Bicep, and rehearse cutover
    and recovery entirely offline. No Azure sign-in, query, deployment, failover, or external setting change is
    permitted in this capstone.
  decision: 'Select Dependency-wave modernization using Azure Arc, Azure Migrate patterns, managed PaaS targets,
    and staged coexistence: Dependency waves preserve rollback and evidence while Arc inventory, migration patterns,
    and PaaS targets support deliberate modernization by workload.'
  consequences:
  - Branch software gains an offline queue and reconciliation responsibility that must be tested at the full eight-hour
    volume.
  - Two tenant and geography governance planes remain distinct even when business workflows exchange approved messages.
revisedDecision:
  changeRequestId: LAB27-CR-01
  selectedCandidate: Dependency-wave modernization using Azure Arc, Azure Migrate patterns, managed PaaS targets,
    and staged coexistence
  reason: LAB27-REQ-04 requires deterministic continuity and security injects, so dependency waves add an eight-hour
    branch outbox plus distinct tenant and geography landing-zone boundaries.
  mandatoryRequirementId: LAB27-REQ-04
  waf:
    reliability: Branch orders remain durable for eight hours and synchronize after WAN recovery.
    security: Tenant and geography planes exchange only classified, authorized business messages.
    costOptimization: Edge and dual-governance costs are visible against avoided branch outage and datacenter expense.
    operationalExcellence: Conflict queues, wave gates, rollback, and residual risk have named owners.
    performanceEfficiency: Local capture avoids WAN delay and post-recovery synchronization is paced to central
      capacity.
