adr:
  id: ADR-LAB21-001
  status: accepted
  context: Woodgrove Commerce is standardizing deployment of a multi-region storefront. Product catalog reads need
    low-latency caching, operators require centrally managed feature flags and non-secret settings, secrets must
    remain in Key Vault, and all infrastructure changes need repeatable preview and rollback evidence. The existing
    proposal relies on an aging cache service, mutable scripts, and configuration files baked into application images.
    The team must adopt Azure Managed Redis for new cache architecture, Azure App Configuration for runtime settings,
    and Bicep for declarative delivery. A bounded deployment preview is allowed, but provisioning cache capacity
    and uncontrolled feature rollout are outside the lab scope.
  decision: 'Select Azure Managed Redis with Azure App Configuration and Bicep deployment stacks: Managed Redis
    accelerates catalog reads, App Configuration versions settings, and Bicep deployment stacks make regional release
    state declarative.'
  consequences:
  - Product owners must define which catalog fields may be stale and which require emergency invalidation.
  - Releases promote a configuration snapshot and infrastructure declaration as independently verifiable artifacts.
