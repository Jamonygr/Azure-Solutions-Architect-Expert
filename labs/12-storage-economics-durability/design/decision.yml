adr:
  id: ADR-LAB12-001
  status: accepted
  context: Fourth Coffee retains media, transaction exports, and audit packages in a general-purpose storage estate.
    All objects remain in the Hot tier, replication choices differ by project, deletes are difficult to investigate,
    and monthly cost grows faster than usable data. The business needs an architecture that balances access frequency,
    retrieval delay, capacity and transaction charges, regional durability, versioning, soft delete, and immutable
    evidence. Explicit recovery objectives and failover exercises belong to Lab 17; this lab must recommend protection
    and durability characteristics without claiming recovery readiness. As the storage economics architect, encode
    lifecycle and protection decisions with Azure CLI and preserve a cost owner for every retention choice.
  decision: 'Select StorageV2 with GZRS and class-specific lifecycle policies: StorageV2 combines regional durability
    with data-class lifecycle rules and supports a dedicated immutable evidence boundary.'
  consequences:
  - Audit evidence moves to a separately approved immutable container or account with restricted administration.
  - Data producers become accountable for correct classification before lifecycle policy can act.
