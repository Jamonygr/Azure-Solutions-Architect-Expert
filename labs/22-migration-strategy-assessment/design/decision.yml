adr:
  id: ADR-LAB22-001
  status: accepted
  context: Proseware Energy must leave two leased datacenters within thirty months while improving security and
    reducing operational toil. Its portfolio contains commercial packages, custom web systems, tightly coupled databases,
    unsupported operating systems, engineering file shares, and applications whose owners or dependencies are uncertain.
    Executives initially asked for a simple server-count migration schedule, but that would hide business outcomes,
    compliance constraints, application affinity, readiness gaps, and landing-zone dependencies. The architecture
    team needs an offline assessment that follows the Cloud Adoption Framework, creates defensible rationalization
    decisions, and produces prioritized migration waves. This lab ends with approved scope and wave sequencing;
    it does not execute workload or data migration.
  decision: 'Select Cloud Adoption Framework outcome-led assessment and dependency-based waves: Outcome-led assessment
    joins readiness, value, dependency, governance, and measurable success before workloads enter waves.'
  consequences:
  - The first facility wave accelerates only workloads whose dependencies and landing-zone controls are ready.
  - Classified applications receive a documented coexistence path and cannot move on a schedule exception.
