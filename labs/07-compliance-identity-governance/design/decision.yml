adr:
  id: ADR-LAB07-001
  status: accepted
  context: Tailwind Traders can organize Azure resources, but control owners still exchange spreadsheets to prove
    compliance and retain partner access indefinitely. The organization needs Azure Policy evidence for resource
    controls and Microsoft Entra ID Governance for entitlement, access review, and privileged-role lifecycle. As
    the compliance and identity-governance architect, design initiative assignments, exemptions, remediation ownership,
    access-package catalogs, recurring reviews, and eligible rather than standing privileged access. Work exclusively
    through GA Az and Microsoft Graph PowerShell inspection surfaces in the lab. The design must explain licensing,
    delegated permissions, evidence retention, exception expiry, and the boundary between detecting noncompliance
    and changing a production tenant.
  decision: 'Select Azure Policy initiatives plus Microsoft Entra ID Governance lifecycle controls: Policy evaluates
    resource state while access packages, reviews, and workflows assign accountable identity lifecycle decisions.'
  consequences:
  - Resource owners become accountable for both access reviews and policy-exemption business justification.
  - Identity and Azure governance evidence must be correlated without assuming either system proves the other.
