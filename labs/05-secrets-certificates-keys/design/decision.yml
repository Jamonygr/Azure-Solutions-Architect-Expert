adr:
  id: ADR-LAB05-001
  status: accepted
  context: Litware Financial runs signing, encryption, and TLS-dependent services across multiple subscriptions.
    Teams store secrets in separate vaults, rotate keys inconsistently, and confuse Key Vault Premium with Managed
    HSM. A planned payment service needs hardware-protected signing keys, short-lived certificates, managed-identity
    access, private connectivity, and evidence that recovery and rotation are configured without exporting sensitive
    material. As the cryptographic-services architect, select the appropriate vault boundaries and tiers, define
    ownership and separation of duties, and produce a command-verifiable lifecycle. The design must never place
    secret values, keys, certificates, access tokens, connection strings, or recovery material in repository state
    or retained evidence.
  decision: 'Select Azure Key Vault Premium with RBAC and private endpoints: Premium vaults provide HSM-backed keys,
    secret and certificate management, managed-identity access, and a bounded private application interface.'
  consequences:
  - Platform teams operate shared premium vaults while a separate security team owns Managed HSM administration.
  - Private DNS and managed-identity readiness become deployment prerequisites for payment services.
revisedDecision:
  changeRequestId: LAB05-CR-01
  selectedCandidate: Azure Managed HSM with centralized HSM administration
  reason: LAB05-REQ-01 makes the cryptographic service boundary a mandatory decision, so the acquired processor
    selects single-tenant Managed HSM while shared secrets and certificates remain in Key Vault.
  mandatoryRequirementId: LAB05-REQ-01
  waf:
    reliability: Dedicated HSM recovery officers and drills become necessary for the acquired workload.
    security: The processor receives a nonshared HSM trust and administration boundary.
    costOptimization: Only mandated processor keys incur the continuously allocated HSM cost.
    operationalExcellence: Two service inventories and escalation paths must be maintained without mixing ownership.
    performanceEfficiency: Processor key-operation throughput is sized independently from ordinary vault transactions.
