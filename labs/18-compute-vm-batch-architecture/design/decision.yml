  id: ADR-LAB18-001
  status: accepted
  context: Tailspin Aerospace processes aerodynamic simulations in nightly bursts while a smaller licensing and
    orchestration tier must remain available during business hours. Jobs range from short CPU-bound calculations
    to memory-intensive batches that need ephemeral scratch disks, a controlled image, and deterministic retry behavior.
    Demand is seasonal, permanent peak capacity would be wasteful, and some simulations cannot run on shared infrastructure.
    The platform team needs a deployable Bicep reference that separates the highly available control plane from
    elastic workers and records quota, image, and Batch task-recovery assumptions. The lab may create a tightly
    tagged, time-limited, zero-capacity reference footprint, but it does not submit work or launch production-scale
    pools.
  decision: 'Select Zonal control virtual machines with an autoscaled Azure Batch pool: Batch supplies queue, pool,
