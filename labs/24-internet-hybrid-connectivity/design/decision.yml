adr:
  id: ADR-LAB24-001
  status: accepted
  context: Coho Bank serves customers through public web and API endpoints while core risk systems remain in two
    private datacenters. Internet users need globally accelerated TLS entry, branches need reliable access to Azure
    services, and high-volume transaction flows require predictable private connectivity with encrypted backup when
    a circuit fails. Teams currently discuss ExpressRoute, VPN, Virtual WAN, Front Door, and DNS as isolated products,
    leaving route propagation, asymmetric paths, name resolution, latency, bandwidth, and failover behavior unowned.
    The lab uses Azure CLI to inspect a safe network analogue, measure reachability, and compare designs without
    provisioning a circuit or production-scale gateway.
  decision: 'Select Front Door Premium with dual ExpressRoute connectivity, VPN failover, and Virtual WAN transit:
    Premium edge security, redundant private circuits, scaled VPN fallback, and managed transit form explicit customer
    and private failure paths.'
  consequences:
  - Network owners must operate and exercise both circuit and VPN encryption paths at production-equivalent load.
  - Effective-route evidence becomes a release artifact because nominal connection health cannot prove path choice.
