risks:
- risk: Subject-to-profile mapping could expose health attributes in tokens or directory extension fields.
  mitigation: Use an opaque subject key and assert that issued claims and external user objects contain no regulated
    fields.
- risk: Social identity-provider failure can prevent a customer cohort from signing in.
  mitigation: Define provider-specific monitoring, recovery communication, and an approved alternate authentication
    journey.
