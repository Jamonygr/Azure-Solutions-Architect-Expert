adr:
  id: ADR-LAB03-001
  status: accepted
  context: Northwind Health is modernizing an employee application, a partner collaboration site, and a new patient-facing
    application. Architects disagree whether all identities belong in the workforce tenant and whether a historical
    Azure AD B2C pattern should be copied for the patient experience. You must recommend tenant boundaries, Microsoft
    Entra External ID for the new customer identity scenario, federation and authentication methods, Conditional
    Access, application registrations, and managed workload identities. The design must account for regulated attributes,
    self-service journeys, privileged administration, protocol compatibility, and lifecycle ownership. Use GA Microsoft
    Graph PowerShell inspection commands only and leave post-authentication Azure authorization decisions to Lab
    04.
  decision: 'Select Workforce tenant plus a dedicated External ID external tenant and managed identities: Separate
    workforce and external directories establish clear policy boundaries while managed identities remove application
    secrets from service access.'
  consequences:
  - Application teams must maintain the opaque link between external subjects and health profiles.
  - Identity operations now own two tenant policy surfaces and provider-specific runbooks.
