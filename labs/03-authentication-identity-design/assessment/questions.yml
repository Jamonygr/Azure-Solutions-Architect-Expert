  stem: 'The implementation review has reached ''Establish identity population and tenant boundaries''. Approval
    requires a positive result plus this independent negative assertion: No production domain, tenant identifier,
    or live organization evidence is committed to the lab. Which proposal supplies the acceptance rule that makes
    LAB03-REQ-01 testable?'
  options:
    A: Select Single workforce tenant for employees partners and customers before checking Establish identity population
      and tenant boundaries; afterward, use the premise that a successful deployment will later prove the architecture
      constraint.
    B: Use the passing result from Select protocols and application registrations to approve Establish identity
      population and tenant boundaries; then consider it sufficient that one control establishes an unrelated acceptance
      boundary.
    C: Require the documented positive state for Establish identity population and tenant boundaries. Afterward,
      verify that no production domain, tenant identifier, or live organization evidence is committed to the lab.
    D: Choose Separate workforce tenants with custom application-managed customer credentials and skip the Establish
      identity population and tenant boundaries negative assertion. Independently, take it as conclusive that the
      candidate has the lowest implementation effort.
  answer: C
  explanations:
    A: The decision tension comes from the fact that no production domain, tenant identifier, or live organization
      evidence is committed to the lab. For this case, a deployment result cannot prove LAB03-REQ-01, and Single
      workforce tenant for employees partners and customers still has to meet the mandatory boundary.
    B: The safe operating boundary says that each application has a supported OIDC or SAML pattern, audience, redirect
      ownership, and least-privilege API consent plan. For this case, that outcome belongs to Select protocols and
      application registrations and leaves Establish identity population and tenant boundaries unverified.
    C: The retained result must be reconciled with the fact that workforce, partner, customer, and workload identities
      have explicit tenant placement and data ownership. For this case, the positive state and an independent negative
      assertion jointly make LAB03-REQ-01 testable.
    D: The traceable checkpoint outcome is that provide secure low-friction sign-in for three populations while
      reducing credential and tenant-boundary risk. For this case, implementation effort cannot justify skipping
      the negative assertion or displace LAB03-REQ-01.
  remediationAnchor: checkpoint-1
  source: https://learn.microsoft.com/en-us/entra/external-id/customers/overview-customers-ciam
  verifiedOn: '2026-09-02'
