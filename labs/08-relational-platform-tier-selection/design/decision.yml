adr:
  id: ADR-LAB08-001
  status: accepted
  context: Woodgrove Bank is replacing a small line-of-business database hosted on aging virtual machines. The application
    uses ordinary SQL transactions and predictable daytime demand, can change connection handling, and has no instance-scoped
    SQL Server dependency. Demand falls close to zero overnight, yet month-end processing needs temporary compute
    growth. Architects must compare Azure SQL Database, Azure SQL Managed Instance, and Azure Database for PostgreSQL
    rather than defaulting to the familiar engine. As the data architect, select the relational platform and service
    tier, define identity and network boundaries, and provide command evidence that the chosen compute model matches
    compatibility, operations, elasticity, latency, and cost constraints.
  decision: 'Select Azure SQL Database General Purpose serverless: Before the acquired dependency is known, serverless
    SQL Database best matches intermittent load and minimizes platform administration.'
  consequences:
  - The initial serverless recommendation is superseded for the acquired workload after compatibility evidence changes.
  - Managed Instance capacity and networking require a longer provisioning and cost-planning lead time.
