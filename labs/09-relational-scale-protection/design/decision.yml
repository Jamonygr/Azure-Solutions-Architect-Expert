  decision: 'Select Azure SQL Database Hyperscale with named read-scale replicas: Hyperscale decouples storage growth
    from named read replicas and supports intentional routing of tenant reporting load.'
  consequences:
  - Applications must classify read paths by freshness and support intentional replica routing.
  - Finance needs durable tenant dimensions in performance and cost evidence before chargeback is enforceable.
