adr:
  id: ADR-LAB20-001
  status: accepted
  context: Alpine Logistics is replacing synchronous point-to-point calls between order intake, depot systems, route
    optimization, customer notifications, and external carriers. Orders require durable, ordered processing for
    each shipment; telemetry is a high-volume stream; status changes should fan out to unknown future subscribers;
    and partner APIs need authentication, quotas, versioning, and transformation. A previous proposal placed every
    interaction on one event service and ignored delivery semantics. The architecture team needs a deployable reference
    that assigns commands, events, streams, and API traffic to suitable Azure services, then validates duplicate
    handling, dead lettering, replay, filtering, and consumer isolation without confusing service availability with
    end-to-end business success.
  decision: 'Select Service Bus for commands, Event Grid for state events, Event Hubs for telemetry, and API Management
    for partners: Purpose-specific services map ordered commands, routed events, high-throughput telemetry, and
    governed partner APIs to their native semantics.'
  consequences:
  - Teams must own four intentional service contracts rather than treating every payload as a generic event.
  - Shipment consumers become responsible for idempotency and poison-session repair evidence.
revisedDecision:
  changeRequestId: LAB20-CR-01
  selectedCandidate: Service Bus for commands, Event Grid for state events, Event Hubs for telemetry, and API Management
    for partners
  reason: LAB20-REQ-05 makes per-shipment ordering and tenfold telemetry isolation mandatory, so the selected split-service
    design adds Service Bus sessions while scaling Event Hubs separately.
  mandatoryRequirementId: LAB20-REQ-05
  waf:
    reliability: Session ordering and durable settlement protect shipment state through retries.
    security: Partner APIs and event subscribers retain separate authorization boundaries.
    costOptimization: Only telemetry processing units rise for the seasonal peak.
    operationalExcellence: Correlation and dead-letter evidence expose stalled sessions without hiding later failures.
    performanceEfficiency: Commands and telemetry scale on different units and cannot consume the same broker ceiling.
