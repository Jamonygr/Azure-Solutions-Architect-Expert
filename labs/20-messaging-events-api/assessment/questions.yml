  stem: '''Classify every interaction contract'' awaits approval from logistics product owner. Approval requires
    a positive result plus this independent negative assertion: Routing a command, event, stream, and synchronous
    API through one service without semantic justification must fail. Which response provides the acceptance rule
    that makes LAB20-REQ-01 testable?'
  options:
    A: Select Event Hubs as the transport for all commands, events, telemetry, and partner requests before checking
      Classify every interaction contract. Then, consider it sufficient that a successful deployment will later
      prove the architecture constraint.
    B: Use the passing result from Validate durable command processing to approve Classify every interaction contract;
      afterward, take it as conclusive that one control establishes an unrelated acceptance boundary.
    C: Require the documented positive state for Classify every interaction contract; for the recorded decision,
      verify that routing a command, event, stream, and synchronous API through one service without semantic justification
      must fail.
    D: Choose Storage queues and direct partner webhooks with application-owned routing and skip the Classify every
      interaction contract negative assertion; then treat it as established that the candidate has the lowest implementation
      effort.
  answer: C
  explanations:
    A: The decision tension comes from the fact that routing a command, event, stream, and synchronous API through
      one service without semantic justification must fail. The resulting architectural conclusion is that a deployment
      result cannot prove LAB20-REQ-01, and Event Hubs as the transport for all commands, events, telemetry, and
      partner requests still has to meet the mandatory boundary.
    B: The safe operating boundary says that commands use sessions where ordering is required, bounded delivery
      attempts, duplicate detection, idempotent handlers, and a governed dead-letter workflow. The resulting architectural
      conclusion is that that outcome belongs to Validate durable command processing and leaves Classify every interaction
      contract unverified.
    C: The retained result must be reconciled with the fact that every interaction records producer, consumer, temporal
      coupling, ordering, throughput, replay, fan-out, latency, and delivery requirements. The resulting architectural
      conclusion is that the positive state and an independent negative assertion jointly make LAB20-REQ-01 testable.
    D: The traceable checkpoint outcome is that decouple depot and partner changes while ensuring accepted shipments
      are processed once effectively and status events reach authorized consumers. The resulting architectural conclusion
      is that implementation effort cannot justify skipping the negative assertion or displace LAB20-REQ-01.
  remediationAnchor: checkpoint-1
  source: https://learn.microsoft.com/en-us/azure/service-bus-messaging/compare-messaging-services
  verifiedOn: '2026-09-02'
