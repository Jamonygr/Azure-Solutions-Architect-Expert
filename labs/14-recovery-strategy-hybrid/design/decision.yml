adr:
  id: ADR-LAB14-001
  status: accepted
  context: Contoso Industrial operates production-planning services in Azure and two factories that still host latency-sensitive
    control applications on VMware. A recent regional network incident exposed that recovery plans were organized
    by technology rather than by business service. The executive resilience committee now requires a single strategy
    that classifies workloads, maps dependencies, assigns measurable recovery time and recovery point objectives,
    and distinguishes backup, high availability, disaster recovery, and cyber-recovery controls. Data residency
    limits cross-border replication, factory connectivity is intermittent, and the annual resilience budget cannot
    support active-active deployment for every workload. The architecture must be testable without failing over
    production systems or provisioning the expensive target estate.
  decision: 'Select Tiered recovery using Azure Backup, Azure Site Recovery, and application-native replication:
    Tiering maps recovery technology and retained capacity to business targets while keeping residency and dependency
    decisions explicit.'
  consequences:
  - Tier owners must fund and exercise the recovery mechanism attached to their declared objective.
  - Tier 1 accepts warm capacity cost and residual same-geography correlated risk to preserve residency.
