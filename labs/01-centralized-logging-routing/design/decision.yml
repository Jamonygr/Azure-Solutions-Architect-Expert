adr:
  id: ADR-LAB01-001
  status: accepted
  context: Contoso Retail has acquired two regional brands whose Azure resources emit platform logs, application
    telemetry, and security events into unrelated destinations. Operations cannot correlate an incident across subscriptions,
    while the security team requires immutable export of selected control-plane records and regional teams need
    bounded access to their own data. You are the lead solutions architect. Design a centralized logging platform
    that uses Azure Monitor Agent, data collection rules and associations, resource diagnostic settings, and deliberate
    retention rather than a legacy agent. The design must limit duplicate ingestion, preserve data sovereignty,
    expose routing evidence through commands, and separate collection architecture from the alerting decisions owned
    by Lab 02.
  decision: 'Select Regional workspaces with cross-workspace queries and policy-driven routing: Region-bound workspaces
    satisfy residency and isolate collection failure while DCR routing and cross-workspace views preserve a common
    operating experience.'
  consequences:
  - Incident queries must name the intended regional workspace set and tolerate an unavailable region.
  - Platform owners must govern DCR association coverage and table-specific retention as separate controls.
