      Fabric Data Factory with OneLake and Fabric Warehouse still has to meet the mandatory boundary.
    B: The scenario makes clear that supported sources and sinks use the data-factory managed identity or a Key
      Vault reference with least privilege. Operationally, that outcome belongs to Use managed identity for linked
      services and leaves Select integration patterns and runtimes unverified.
    C: The architecture evidence must show that deliver traceable analytics datasets from cloud and private sources
      without creating unmanaged credentials or always-on analytics cost. Operationally, implementation effort cannot
