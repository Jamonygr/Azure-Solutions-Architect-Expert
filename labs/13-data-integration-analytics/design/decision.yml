  id: ADR-LAB13-001
  status: accepted
  context: Contoso Energy receives hourly files from field partners, change data from operational databases, and
    telemetry from regional systems. Analysts need governed SQL exploration and curated datasets, while some sources
    remain on private networks and business owners require lineage from ingestion to published data. The architecture
    board is comparing Microsoft Fabric, Azure Data Factory with Azure Synapse serverless SQL, and Azure Databricks
    with orchestration. As the integration and analytics architect, select the platform combination, integration
    runtime, identity, pipeline, transformation, serving, monitoring, and cost boundaries. The lab uses a safe analogue
    and must not claim that offline pipeline definitions prove source connectivity, data correctness, or production
    performance.
  decision: 'Select Azure Data Factory with ADLS Gen2 and Azure Synapse serverless SQL: Data Factory handles governed
    batch and private connectivity while ADLS and serverless SQL minimize idle analytics capacity.'
  consequences:
  - The analytics platform accepts a hybrid ingestion boundary instead of forcing one cadence onto every source.
  - Fabric capacity must be justified and monitored specifically for the executive telemetry experience.
