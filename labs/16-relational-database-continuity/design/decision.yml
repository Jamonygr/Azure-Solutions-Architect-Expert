adr:
  id: ADR-LAB16-001
  status: accepted
  context: Northwind Tickets uses Azure SQL Database for reservations, seat inventory, and payment-state coordination.
    The database is zone redundant in the primary region, but product leaders now require continuity through a complete
    regional outage and evidence that committed reservations remain within a five-minute data-loss window. Customer
    traffic can be redirected, yet DNS, connection-string behavior, database dependencies, and failback ownership
    are poorly documented. A continuously running duplicate application stack is outside the lab budget. The architecture
    exercise must therefore assess an existing topology with Azure CLI, model failover-group behavior, and validate
    application-aware recovery criteria without causing an actual failover or modifying production databases.
  decision: 'Select Azure SQL Database failover group with zone-redundant primary and secondary databases: Failover
    groups provide listener-based application continuity and managed regional database relationships with zonal
    protection.'
  consequences:
  - Application connections must use the failover-group listener and bounded retry behavior.
  - Both regions require capacity and dependency validation at the doubled flash-sale write rate.
