constraints:
- The launch platform needs secure global delivery, controlled regional failure, auditable governance, and a defensible
  production budget.
- Customer profiles must remain in one geography while anonymous catalog traffic survives a complete regional outage
  globally.
- Use only the Azure CLI + Bicep command lane for learner implementation.
- Keep all live changes behind explicit execution and acknowledgement switches.
- Retain only sanitized command evidence and synthetic fixture identifiers.
assumptions:
- The application separates profile identity and personalization from anonymous catalog content at API and data
  layers.
- Target regions support the selected PaaS, availability-zone, private endpoint, and monitoring capabilities.
- West Europe is the configurable primary example and North Europe is the configurable secondary example.
- The learner has administrator-level Azure operations knowledge but receives no pre-existing authenticated context.
- Offline fixtures demonstrate contract behavior rather than live Azure service behavior.
facts:
  data: Customer profiles are geography-bound; anonymous catalog, configuration, events, audit, and operational
    telemetry have separate distribution rules.
  scale: Global launch demand varies by market; request rate, profile volume, catalog size, and regional concurrency
    are measured sizing inputs.
  latency: Anonymous catalog uses global edge and regional stamps, while profile operations route only to their
    authorized geography.
  availability: Two regional PaaS stamps and global routing preserve catalog service; profile continuity remains
    inside its legal geography.
  rto: Catalog regional failover follows an owner-tested target; profile recovery cannot violate residency to improve
    restoration time.
  rpo: Profile replication stays within geography and catalog rebuild or replication has an independently approved
    freshness tolerance.
  budget: Active regional catalog capacity is justified by launch continuity, while profile stacks and premium features
    are scoped by market.
