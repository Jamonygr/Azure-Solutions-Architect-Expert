risks:
- risk: Anonymous responses can accidentally include profile-derived fields and enter the global cache or logs.
  mitigation: Enforce separate contracts, classify fields, and assert that global responses and telemetry contain
    no profile attributes.
- risk: Active-active stamps can drift in policy, secret references, or feature configuration.
  mitigation: Promote immutable Bicep and configuration versions and block release when regional evidence hashes
    differ.
waf:
  reliability: Independent stamps and global routing keep catalog service available through regional loss while
    honoring profile boundaries.
  security: Premium edge controls, private origins, managed identities, policy, and geography-scoped data reduce
    exposure.
  costOptimization: Shared global catalog capacity and market-specific profile stacks make continuity and residency
    spend attributable.
  operationalExcellence: Declarative releases, regional assertions, failover exercises, governance evidence, and
    rollback support fast controlled delivery.
  performanceEfficiency: Edge caching and regional PaaS autoscale serve anonymous demand while profile calls remain
    geography-local.
safeAnalogue: Use the self-contained Bicep template only as a bounded tagged topology analogue; validate data-boundary
  and failover decisions primarily with offline fixtures.
