rejectedAlternatives:
- candidate: Active-passive AKS clusters with database failover and a warm secondary region
  reason: The platform does not need Kubernetes-specific control enough to justify its operational burden and slower
    passive activation.
- candidate: Single-region modular PaaS platform with cross-region backups and rebuild automation
  reason: Its recovery behavior misses the anonymous-catalog continuity outcome despite attractive economics.
