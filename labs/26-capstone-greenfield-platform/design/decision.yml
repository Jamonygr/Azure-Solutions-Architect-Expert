adr:
  id: ADR-LAB26-001
  status: accepted
  context: 'Trey Research is launching a regulated consumer analytics platform in two Azure regions with no legacy
    application constraint. Customers sign in through Microsoft Entra External ID, APIs and event processors scale
    independently, operational data spans relational and document stores, global traffic must survive a regional
    outage, and product teams need safe automated delivery. Executives want high availability but require an evidence-based
    cost ceiling before funding production. Learners must integrate governance, identity, observability, data, continuity,
    compute, messaging, caching, networking, and security decisions into one coherent architecture. The supplied
    Bicep is deliberately only a non-production foundation slice for compile, lint, and subscription-level what-if:
    it does not provision the full platform and the lifecycle scripts contain no deployment command.'
  decision: 'Select Active-active regional PaaS stamps behind Front Door Premium with globally coordinated data
    services: PaaS stamps and Premium edge controls support independent regional release and routing while data
    services can be split by residency class.'
  consequences:
  - APIs and data contracts permanently separate anonymous catalog content from geography-bound customer profiles.
  - Regional releases must prove parity without copying regulated profile data across the boundary.
revisedDecision:
  changeRequestId: LAB26-CR-01
  selectedCandidate: Active-active regional PaaS stamps behind Front Door Premium with globally coordinated data
    services
  reason: LAB26-REQ-01 requires mandatory constraints to drive the architecture decision, so active-active stamps
    split into geography-specific profile planes and a separate global anonymous catalog plane.
  mandatoryRequirementId: LAB26-REQ-01
  waf:
    reliability: Anonymous catalog survives a regional loss without failing over restricted profile data unlawfully.
    security: Profile routes, stores, caches, and logs are constrained to the assigned geography.
    costOptimization: Global replication is purchased for catalog data, while profile capacity is funded per regulated
      market.
    operationalExcellence: Contract and routing assertions detect profile leakage before regional release.
    performanceEfficiency: Catalog requests use edge and nearest healthy stamp; profile calls remain within geography.
