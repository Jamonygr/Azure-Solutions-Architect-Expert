adr:
  id: ADR-LAB17-001
  status: accepted
  context: Adventure Works Media stores personalization documents in Azure Cosmos DB and millions of production
    assets in Azure Blob Storage. The service has grown across continents, but the current design confuses durability
    with availability and has no consistent method to demonstrate RPO, restore integrity, or application behavior
    when a write region is unavailable. Legal policy requires assets for one market to remain within an approved
    geography, while editorial teams need rapid access to current metadata. Running duplicate high-scale accounts
    solely for a lab is unjustified. The team will use Azure PowerShell discovery and synthetic evidence to design
    a safe analogue for multi-region reads, controlled writes, backup recovery, and storage-account failover.
  decision: 'Select Cosmos DB multi-region writes with zone redundancy plus GZRS Blob Storage: Multi-write Cosmos
    DB supports global editorial availability and explicit conflicts while GZRS protects and serves public objects.'
  consequences:
  - Storage topology becomes content-class aware and publishing must verify the classification boundary.
  - Editors own conflict outcomes; infrastructure health alone cannot declare recovery successful.
revisedDecision:
  changeRequestId: LAB17-CR-01
  selectedCandidate: Independent regional data stacks synchronized by an application-owned event log
  reason: LAB17-REQ-03 makes object replication boundaries explicit, so restricted documents move to an independent
    in-country stack while public media remains globally distributed.
  mandatoryRequirementId: LAB17-REQ-03
  waf:
    reliability: Public media stays multi-region while restricted content accepts the documented in-country failure
      domain.
    security: Rights-controlled bytes never enter the cross-region event or blob replication path.
    costOptimization: Only globally consumable media carries worldwide replication and egress cost.
    operationalExcellence: Classification and event-contract tests become mandatory publication gates.
    performanceEfficiency: Edge-served public media meets the two-second target without exporting restricted documents.
