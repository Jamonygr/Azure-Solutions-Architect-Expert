name: Documentation site

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Build digest-pinned learning image
        run: docker build --file .devcontainer/Dockerfile --tag az305-learning:pages .

      - name: Pass the complete offline quality gate before site build
        run: |
          docker run --rm --network none \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            az305-learning:pages \
            pwsh -NoLogo -NoProfile -File tools/Invoke-OfflineReleaseGate.ps1

      - name: Stage authoritative documentation
        run: |
          docker run --rm --network none \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            az305-learning:pages \
            python tools/build_docs_site.py

      - name: Build searchable site in strict mode
        run: |
          docker run --rm --network none \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            az305-learning:pages \
            python -m mkdocs build --strict --clean

      - name: Inspect built pages for accessibility and active external assets
        run: |
          docker run --rm --network none \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            az305-learning:pages \
            python tools/build_docs_site.py --check-built-site site

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZ305_ENABLE_PAGES == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZ305_ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZ305_ENABLE_PAGES == 'true'
    needs: quality-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
