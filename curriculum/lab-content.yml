      scale: Telemetry increases tenfold at peak while command volume follows shipments; measured events per second remain
        a capacity input.
      latency: Partner command acknowledgement and status-event delivery have service objectives separate from telemetry ingestion
        delay.
      availability: Durable commands survive processor interruption and subscriptions isolate a failed status consumer from
        other recipients.
      rto: Integration recovery depends on backlog age and consumer capacity; no numerical platform RTO is supplied.
      rpo: Accepted commands require durable settlement and idempotency so broker or consumer retry does not lose or double-apply
        shipment state.
      budget: Each message class uses the least expensive service that supplies its required ordering, routing, replay, and
        partner controls.
    candidateAnalyses:
    - name: Service Bus for commands, Event Grid for state events, Event Hubs for telemetry, and API Management for partners
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 5
        C3: 4
        C4: 5
        C5: 4
      rationale: Purpose-specific services map ordered commands, routed events, high-throughput telemetry, and governed partner
        APIs to their native semantics.
      rejectedReason: null
    - name: Event Hubs as the transport for all commands, events, telemetry, and partner requests
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 3
        C3: 3
        C4: 3
        C5: 4
      rationale: One event log scales well, but command settlement, session ordering, request policy, and per-consumer routing
        move into application code.
      rejectedReason: Uniform transport simplifies inventory at the cost of weak command and partner semantics.
    - name: Storage queues and direct partner webhooks with application-owned routing
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 3
        C3: 2
        C4: 2
        C5: 5
      rationale: Storage queues are economical, but session ordering, event fan-out, authorization, and webhook retry become
        bespoke responsibilities.
      rejectedReason: Custom routing and direct partner exposure produce the weakest security and operating fit.
    - name: Synchronous depot-to-carrier call chain with no durable broker
      eligible: false
      disqualifiers:
      - LAB20-REQ-02 requires accepted commands to remain durable and ordered through downstream interruption.
      scores:
        C1: 1
        C2: 1
        C3: 2
        C4: 2
        C5: 4
      rationale: Direct calls minimize components but couple depot acceptance to every carrier and processing dependency.
      rejectedReason: It is ineligible because a downstream outage can lose or reject an accepted shipment command.
    risks:
    - risk: A shipment session can block behind one poison command and delay all later updates for that shipment.
      mitigation: Bound delivery attempts, dead-letter with full correlation, and require an idempotent repair and replay
        procedure.
    - risk: Tenfold telemetry can consume shared namespace or network capacity needed by commands.
      mitigation: Isolate telemetry units and quotas from Service Bus, then load-test each path independently.
    waf:
      reliability: Durable sessions, dead letters, isolated subscriptions, and idempotent consumers preserve shipment processing.
      security: APIM policy, managed identities, and recipient-specific subscriptions constrain partner and event access.
      costOptimization: Broker features and capacity are purchased per message class instead of overengineering telemetry
        or commands.
      operationalExcellence: Correlation IDs join API acceptance, command settlement, state events, telemetry, and repair
        actions.
      performanceEfficiency: Event Hubs absorbs tenfold telemetry while Service Bus session capacity scales on ordered shipment
        demand.
    safeAnalogue: null
    adrConsequences:
    - Teams must own four intentional service contracts rather than treating every payload as a generic event.
    - Shipment consumers become responsible for idempotency and poison-session repair evidence.
    changeExpectedRevision: Enable shipment-keyed Service Bus sessions and scale Event Hubs independently for the tenfold
      telemetry peak.
    revisedDecision:
      selectedCandidate: Service Bus for commands, Event Grid for state events, Event Hubs for telemetry, and API Management
        for partners
      mandatoryRequirementId: LAB20-REQ-05
      reason: LAB20-REQ-05 makes per-shipment ordering and tenfold telemetry isolation mandatory, so the selected split-service
        design adds Service Bus sessions while scaling Event Hubs separately.
      waf:
        reliability: Session ordering and durable settlement protect shipment state through retries.
        security: Partner APIs and event subscribers retain separate authorization boundaries.
        costOptimization: Only telemetry processing units rise for the seasonal peak.
        operationalExcellence: Correlation and dead-letter evidence expose stalled sessions without hiding later failures.
        performanceEfficiency: Commands and telemetry scale on different units and cannot consume the same broker ceiling.
- number: '21'
  scenario: Woodgrove Commerce is standardizing deployment of a multi-region storefront. Product catalog reads need low-latency
    caching, operators require centrally managed feature flags and non-secret settings, secrets must remain in Key Vault,
    and all infrastructure changes need repeatable preview and rollback evidence. The existing proposal relies on an aging
    cache service, mutable scripts, and configuration files baked into application images. The team must adopt Azure Managed
    Redis for new cache architecture, Azure App Configuration for runtime settings, and Bicep for declarative delivery. A
    bounded deployment preview is allowed, but provisioning cache capacity and uncontrolled feature rollout are outside the
    lab scope.
  role: Application platform and delivery architect
  outcome: Deliver a Bicep-defined caching, configuration, and deployment architecture with safe rollout, managed identity,
    observability, and recoverable state.
  duration: 180 minutes
  difficulty: advanced
  costClass: moderate
  businessOutcome: Accelerate storefront reads and release features consistently across regions without embedding secrets
    or relying on manual configuration drift.
  stakeholders:
  - Digital commerce product owner
  - Application platform lead
  - Release engineering manager
  - Security architect
  - FinOps analyst
  primarySource:
    title: Azure Managed Redis documentation
    url: https://learn.microsoft.com/en-us/azure/redis/
  candidates:
  - Azure Managed Redis with Azure App Configuration and Bicep deployment stacks
  - Per-instance memory caches with image-baked configuration and imperative scripts
  - Cosmos DB integrated cache with Key Vault references and Terraform delivery
  selected: Azure Managed Redis with Azure App Configuration and Bicep deployment stacks
  checkpoints:
  - title: Define cache semantics and failure behavior
    requirement: LAB21-REQ-01
    command: Get-AzResource -ResourceGroupName $ResourceGroupName -ResourceType Microsoft.Cache/redisEnterprise | Select-Object
      Name, Location, ResourceId, Tags
    positiveCommand: $cache = Get-AzResource -ResourceGroupName $ResourceGroupName -ResourceType Microsoft.Cache/redisEnterprise
      | Select-Object -First 1; if (-not $cache) { throw 'No Azure Managed Redis resource was found.' }
    negativeCommand: $legacy = Get-AzResource -ResourceGroupName $ResourceGroupName -ResourceType Microsoft.Cache/Redis; if
      ($legacy) { throw 'A legacy Azure Cache for Redis resource remains in the new-design scope.' }
    expected: The design states cache-aside behavior, key ownership, TTL, eviction, invalidation, stampede control, regional
      scope, and source-of-truth fallback.
    negative: Treating cache contents as durable system of record, allowing unbounded keys, or failing closed on cache loss
      must fail.
    evidence: Preserve access-pattern calculations, key and TTL examples, failure-mode tests, and service-selection rationale.
    failure: Poor invalidation can serve stale prices while aggressive expiry overloads the database.
    retry: Adjust TTL and single-flight behavior, then replay the same read and invalidation workload.
    cleanup: Delete only run-owned synthetic cache keys; never flush a shared cache.
    waf: 'Performance Efficiency: cache-aside with measured TTL reduces source latency and load while retaining a durable
      authority.'
  - title: Separate configuration, features, and secrets
    requirement: LAB21-REQ-02
    command: Get-AzAppConfigurationStore -ResourceGroupName $ResourceGroupName -Name $AppConfigurationName | Select-Object
      Name, Location, Endpoint, PublicNetworkAccess, DisableLocalAuth, SkuName
    positiveCommand: $store = Get-AzAppConfigurationStore -ResourceGroupName $ResourceGroupName -Name $AppConfigurationName;
      if ($store.DisableLocalAuth -ne $true) { throw 'App Configuration local authentication is not disabled.' }
    negativeCommand: $store = Get-AzAppConfigurationStore -ResourceGroupName $ResourceGroupName -Name $AppConfigurationName;
      if ($store.PublicNetworkAccess -eq 'Enabled' -and $RequirePrivateAccess) { throw 'Public network access violates the
      approved configuration boundary.' }
    expected: Non-secret settings and feature flags live in App Configuration, secrets remain Key Vault references, and labels
      encode environment rather than tenant secrets.
    negative: A resolved secret value, connection string, or environment-specific credential in Bicep parameters or application
      settings must fail.
    evidence: Save redacted key naming, label and feature-filter conventions, identity access matrix, and network decision.
    failure: Mixing secrets with ordinary configuration increases disclosure risk and complicates rotation.
    retry: Replace the sensitive value with a Key Vault reference and rerun recursive sensitive-field checks.
    cleanup: Remove only run-owned non-secret keys and flags; never export or delete resolved secrets.
    waf: 'Security: managed identity, local-auth disablement, and Key Vault references keep secrets out of deployment artifacts.'
  - title: Compile the delivery contract
    requirement: LAB21-REQ-03
    command: bicep build artifacts/main.bicep --stdout | Out-Null
    positiveCommand: $template = bicep build artifacts/main.bicep --stdout | ConvertFrom-Json; $types = @($template.resources.type);
      if ('Microsoft.Cache/redisEnterprise' -notin $types -or 'Microsoft.Cache/redisEnterprise/databases' -notin $types -or
      'Microsoft.AppConfiguration/configurationStores' -notin $types) { throw 'The template lacks Managed Redis, its required
      database child, or App Configuration.' }
    negativeCommand: $templateText = bicep build artifacts/main.bicep --stdout; if ($templateText -match '(?i)password|primaryKey|connectionString')
      { throw 'The compiled delivery contract appears to expose secret material.' }
    expected: The Bicep template compiles, pins GA resource APIs, includes the required Managed Redis database child, disables
      public access on both service parents, defines secret-free outputs, and states that private endpoints and DNS remain
      a required design step outside this what-if-only analogue.
    negative: Hard-coded region names, plaintext secrets, missing expiry tags, or an unbounded production-sized cache must
      fail.
    evidence: Preserve source and parameter hashes, compiler output, resource inventory, and traceability to configuration
      requirements.
    failure: Declarative syntax alone does not prevent insecure defaults, oversized capacity, or destructive replacement.
    retry: Correct the failing declaration and repeat compile plus semantic assertions before preview.
    cleanup: Remove generated local JSON if retained; keep Bicep and the example parameter file.
    waf: 'Operational Excellence: a versioned declarative contract makes environment differences reviewable and repeatable.'
  - title: Preview a bounded deployment
    requirement: LAB21-REQ-04
    command: New-AzResourceGroupDeployment -ResourceGroupName $ResourceGroupName -Name "lab21-$RunId" -TemplateFile artifacts/main.bicep
      -TemplateParameterFile artifacts/parameters.example.json -runId $RunId -expiresOn $ExpiresOn -WhatIf
    positiveCommand: $validationErrors = Test-AzResourceGroupDeployment -ResourceGroupName $ResourceGroupName -TemplateFile
      artifacts/main.bicep -TemplateParameterFile artifacts/parameters.example.json -runId $RunId -expiresOn $ExpiresOn; if
      ($validationErrors) { throw 'The bounded reference template failed deployment validation.' }
    negativeCommand: $deployment = Get-AzResourceGroupDeployment -ResourceGroupName $ResourceGroupName -Name "lab21-$RunId"
      -ErrorAction SilentlyContinue; if ($deployment -and $deployment.ProvisioningState -eq 'Succeeded') { throw 'The safe
      analogue unexpectedly created a deployment.' }
    expected: Template validation and reviewed what-if describe only the bounded analogue, with explicit ownership, expiry,
      identity, network, and capacity settings and no mutation.
    negative: A destructive what-if, policy denial, production-scale cache, missing lifecycle tag, or persisted deployment
      from this safe analogue must fail.
    evidence: Archive template validation, reviewed what-if, cost estimate, policy outcomes, and exact source and parameter
      hashes.
    failure: An invalid scope or unsafe default can make a later authorized deployment costly or expose shared configuration.
    retry: Correct the template or parameters and rerun validation and what-if using the same deterministic inputs.
    cleanup: Delete local preview output only; the safe analogue must create no cloud object and never purge shared stores.
    waf: 'Cost Optimization: bounded capacity, expiry tags, and gated execution constrain the deployable reference footprint.'
  - title: Validate progressive configuration delivery
    requirement: LAB21-REQ-05
    command: Get-AzMetricDefinition -ResourceId $ManagedRedisResourceId | Select-Object Name, Unit, PrimaryAggregationType
    positiveCommand: $definitions = Get-AzMetricDefinition -ResourceId $ManagedRedisResourceId; if (-not ($definitions | Where-Object
      { $_.Name.Value -match 'Hit|Miss|Latency|Connected' })) { throw 'Required cache rollout metrics are unavailable.' }
    negativeCommand: $alerts = Get-AzMetricAlertRuleV2 -ResourceGroupName $ResourceGroupName; if (-not ($alerts | Where-Object
      { $_.Scopes -contains $ManagedRedisResourceId -and $_.Enabled })) { throw 'No enabled cache-health alert protects progressive
      rollout.' }
    expected: Synthetic clients refresh non-secret settings, feature exposure advances by a deterministic ring, cache fallback
      works, and a failed ring stops and rolls back.
    negative: Global flag activation, stale secret material, cache-failure outage, or rollout continuation after a failed
      assertion must fail.
    evidence: Save flag versions, ring membership, refresh timestamps, cache and source latency, assertion results, and rollback
      record.
    failure: Configuration propagation can create inconsistent behavior even after infrastructure deployment succeeds.
    retry: Restore the last approved flag state and replay only the failed ring after fixing the assertion.
    cleanup: Disable and remove run-owned flags and synthetic keys before deleting run-owned infrastructure.
    waf: 'Reliability: progressive exposure and tested fallback limit blast radius from configuration and cache faults.'
  changeRequest: A regulatory review requires the storefront to keep serving last-known-safe catalog data for thirty minutes
    during configuration-store or source-database unavailability.
  challenge: Revise TTL, refresh, stale-data labeling, circuit breaking, feature rollback, and monitoring while ensuring that
    prices beyond the allowed age are never presented as current.
  troubleshooting:
  - If Bicep compilation succeeds but semantic checks fail, inspect the compiled resource type and API version before changing
    assertions.
  - If clients observe different feature states, compare label, snapshot, refresh interval, and ring identity rather than
    forcing a global refresh.
  - If cleanup detects a tag mismatch, stop and reconcile run state; never broaden deletion scope to make cleanup pass.
  architectureAnalysis:
    permissions: Managed Redis, App Configuration, deployment, identity, and monitoring read access supports review; resource
      or key-value mutation requires separate contributor and data roles.
    licensing: Azure Managed Redis tiers, App Configuration replicas and request quotas, deployment-stack resources, private
      networking, and monitoring affect price.
    costNotes: Model cache capacity and operations, regional replicas, configuration requests, deployment resources, data
      transfer, and stale-data protection value.
    constraints:
    - Storefront reads and releases must work across regions without embedded secrets or imperative configuration drift.
    - Last-known-safe catalog data must be served for thirty minutes during configuration-store or source-database unavailability.
    assumptions:
    - Catalog entries carry version and freshness metadata and are safe to serve within an approved staleness window.
    - Application revisions can bundle a tested configuration snapshot reference without exposing secret values.
    facts:
      data: Catalog cache entries, feature and configuration values, deployment manifests, versions, and secret references
        have separate owners.
      scale: Read-heavy storefront traffic spans regions; measured working set, operations per second, and miss rate determine
        cache size.
      latency: Cache serves the interactive read target and stale-mode activation must occur before dependency timeout cascades.
      availability: Regional application stamps retain a last-known-safe cache path when App Configuration or the source database
        is unavailable.
      rto: Dependency restoration may take thirty minutes without stopping reads; write-path recovery remains a separate owner
        objective.
      rpo: The degraded read path intentionally accepts up to the approved catalog staleness boundary rather than inventing
        current source data.
      budget: Managed cache and configuration replicas are justified against database load, latency, and the value of thirty-minute
        read continuity.
    candidateAnalyses:
    - name: Azure Managed Redis with Azure App Configuration and Bicep deployment stacks
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 4
        C3: 5
        C4: 5
        C5: 5
      rationale: Managed Redis accelerates catalog reads, App Configuration versions settings, and Bicep deployment stacks
        make regional release state declarative.
      rejectedReason: null
    - name: Per-instance memory caches with image-baked configuration and imperative scripts
      eligible: true
      disqualifiers: []
      scores:
        C1: 2
        C2: 2
        C3: 2
        C4: 2
        C5: 4
      rationale: Local caches are inexpensive but fragment state across replicas and require image releases for configuration
        change or rollback.
      rejectedReason: Inconsistent caches and baked settings undermine regional release consistency and degraded-mode proof.
    - name: Cosmos DB integrated cache with Key Vault references and Terraform delivery
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 4
        C3: 5
        C4: 3
        C5: 2
      rationale: An integrated cache can suit Cosmos-backed workloads, but this catalog architecture needs a source-neutral
        cache and existing Bicep delivery contract.
      rejectedReason: Coupling cache choice to a new database platform and delivery tool expands the decision without a requirement.
    - name: New Azure Cache for Redis deployment with mutable portal configuration
      eligible: false
      disqualifiers:
      - LAB21-REQ-03 requires Azure Managed Redis for new caching designs and declarative drift-controlled delivery.
      scores:
        C1: 1
        C2: 3
        C3: 2
        C4: 1
        C5: 3
      rationale: The retiring service direction and manual configuration create lifecycle and drift risk for a new platform.
      rejectedReason: It is disqualified by the current-service and declarative-delivery requirements.
    risks:
    - risk: A stale cache can serve a recalled or legally invalid catalog item for the full thirty-minute window.
      mitigation: Define noncacheable emergency flags and a signed invalidation path independent of the source database.
    - risk: Configuration refresh failure can leave regions on different feature versions.
      mitigation: Pin a last-known-safe snapshot identifier and assert regional version convergence during every release.
    waf:
      reliability: Versioned safe snapshots and cache fallback maintain catalog reads through configuration or source failure.
      security: Managed identities, private paths, and external secret references keep credentials out of images and templates.
      costOptimization: Cache capacity is tied to the measured working set and avoids scaling the source for repeated reads.
      operationalExcellence: Declarative stacks, configuration labels, snapshot versions, and rollback evidence control regional
        drift.
      performanceEfficiency: Managed Redis handles the read working set while refresh and invalidation protect data freshness.
    safeAnalogue: Deploy only the self-contained low-cost Bicep analogue when explicitly authorized; otherwise test snapshot,
      fallback, and drift behavior with local fixtures.
    adrConsequences:
    - Product owners must define which catalog fields may be stale and which require emergency invalidation.
    - Releases promote a configuration snapshot and infrastructure declaration as independently verifiable artifacts.
    changeExpectedRevision: Add a thirty-minute last-known-safe snapshot and emergency invalidation path without treating
      stale mode as source recovery.
    revisedDecision:
      selectedCandidate: Azure Managed Redis with Azure App Configuration and Bicep deployment stacks
      mandatoryRequirementId: LAB21-REQ-01
      reason: LAB21-REQ-01 requires explicit cache failure behavior, so the selected design retains a versioned thirty-minute
        last-known-safe snapshot plus a source-independent invalidation control.
      waf:
        reliability: Catalog reads continue through temporary configuration or database loss.
        security: Emergency invalidation is narrowly authorized and does not expose configuration secrets.
        costOptimization: Existing cache capacity supplies continuity without a duplicate active database.
        operationalExcellence: Snapshot version, activation, expiry, and recovery are recorded in the release runbook.
        performanceEfficiency: Bounded stale reads prevent dependency retry storms and protect storefront latency.
- number: '22'
  scenario: Proseware Energy must leave two leased datacenters within thirty months while improving security and reducing
    operational toil. Its portfolio contains commercial packages, custom web systems, tightly coupled databases, unsupported
    operating systems, engineering file shares, and applications whose owners or dependencies are uncertain. Executives initially
    asked for a simple server-count migration schedule, but that would hide business outcomes, compliance constraints, application
    affinity, readiness gaps, and landing-zone dependencies. The architecture team needs an offline assessment that follows
    the Cloud Adoption Framework, creates defensible rationalization decisions, and produces prioritized migration waves.
    This lab ends with approved scope and wave sequencing; it does not execute workload or data migration.
  role: Cloud adoption and migration strategy architect
  outcome: Create an outcome-led migration strategy, assessed portfolio, rationalization record, business case, and dependency-aware
    wave plan ready for detailed execution design.
  duration: 165 minutes
  difficulty: advanced
  costClass: none
  businessOutcome: Exit the datacenters on schedule while prioritizing measurable value and preventing unsupported or highly
    coupled workloads from entering unsafe migration waves.
  stakeholders:
  - Chief information officer
  - Datacenter exit program lead
  - Business application owners
  - Security and compliance lead
  - Finance and procurement lead
  primarySource:
    title: Plan your migration with the Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/migrate/plan-migration
  candidates:
  - Cloud Adoption Framework outcome-led assessment and dependency-based waves
  - Datacenter-by-datacenter rehost schedule based only on server age
  - Application-team modernization projects without a shared portfolio assessment
  selected: Cloud Adoption Framework outcome-led assessment and dependency-based waves
  checkpoints:
  - title: Define strategy, outcomes, and constraints
    requirement: LAB22-REQ-01
    command: Get-AzSubscription -SubscriptionId $SubscriptionId | Select-Object Id, Name, State, TenantId
    positiveCommand: $subscription = Get-AzSubscription -SubscriptionId $SubscriptionId; if ($subscription.State -ne 'Enabled')
      { throw 'The proposed Azure subscription is not enabled.' }
    negativeCommand: $context = Get-AzContext; if ($context.Subscription.Id -ne $SubscriptionId -or $context.Tenant.Id -ne
      $TenantId) { throw 'The current context does not match the assessed landing-zone scope.' }
    expected: The strategy connects datacenter exit, resilience, security, sustainability, and cost outcomes to owners, measures,
      constraints, and decision dates.
    negative: A migration target stated only as a server count or deadline, with no measurable business outcome, must fail.
    evidence: Save the strategy brief, outcome measures, mandatory constraints, accountable owners, and approval record.
    failure: Undefined value and guardrails lead teams to optimize speed while creating risk or unnecessary cost.
    retry: Reconcile outcomes with executive and workload owners, then repeat the constraint completeness review.
    cleanup: Remove local subscription metadata from the assessment package if it is not required; no Azure state changes.
    waf: 'Operational Excellence: explicit outcomes and ownership create durable governance for migration decisions.'
  - title: Build and quality-check the portfolio inventory
    requirement: LAB22-REQ-02
    command: $portfolio = Import-Csv artifacts/portfolio.csv; $portfolio | Group-Object businessCriticality, environment |
      Select-Object Name, Count
    positiveCommand: '$portfolio = Import-Csv artifacts/portfolio.csv; $required = @(''applicationId'',''owner'',''businessCriticality'',''hosting'',''operatingSystem'',''dataClassification'',''monthlyCost'');
      foreach ($column in $required) { if ($column -notin $portfolio[0].PSObject.Properties.Name) { throw "Missing portfolio
      column: $column" } }'
    negativeCommand: $portfolio = Import-Csv artifacts/portfolio.csv; $invalid = $portfolio | Where-Object { [string]::IsNullOrWhiteSpace($_.applicationId)
      -or [string]::IsNullOrWhiteSpace($_.owner) -or $_.businessCriticality -notin @('tier-1','tier-2','tier-3') }; if ($invalid)
      { throw 'The portfolio contains incomplete or invalid records.' }
    expected: The inventory covers applications, servers, databases, file data, owners, lifecycle, support, classification,
      performance, cost, and business criticality.
    negative: Duplicate IDs, absent owners, unknown licensing, or performance estimates presented as measurements must fail
      quality review.
    evidence: Preserve the normalized portfolio, provenance per field, data-quality score, and explicit unknowns register.
    failure: False precision in incomplete inventory produces unreliable cost and wave estimates.
    retry: Resolve the highest-impact unknowns with owners and rerun deterministic completeness and uniqueness checks.
    cleanup: Delete raw exports containing sensitive hostnames after producing the approved sanitized portfolio.
    waf: 'Security: classification and support-state evidence prevents regulated or vulnerable systems from entering an unsuitable
      path.'
  - title: Assess dependencies and readiness
    requirement: LAB22-REQ-03
    command: $dependencies = Import-Csv artifacts/dependencies.csv; $dependencies | Sort-Object sourceApplicationId, targetApplicationId
      | Format-Table sourceApplicationId, targetApplicationId, protocol, criticality
    positiveCommand: $portfolio = Import-Csv artifacts/portfolio.csv; $dependencies = Import-Csv artifacts/dependencies.csv;
      $ids = @($portfolio.applicationId); if ($dependencies | Where-Object { $_.sourceApplicationId -notin $ids -or $_.targetApplicationId
      -notin $ids }) { throw 'A dependency references an unknown application.' }
    negativeCommand: $dependencies = Import-Csv artifacts/dependencies.csv; if ($dependencies | Where-Object { $_.criticality
      -eq 'required' -and [string]::IsNullOrWhiteSpace($_.protocol) }) { throw 'A required dependency has no protocol or interface
      evidence.' }
    expected: The assessment maps runtime, identity, DNS, network, database, batch, licensing, operational, and business-process
      dependencies with confidence levels.
    negative: A wave that splits a hard dependency or treats low-confidence discovery as complete must fail.
    evidence: Save the dependency graph, confidence ratings, readiness blockers, remediation owners, and discovery limitations.
    failure: Hidden coupling can extend an outage, force emergency rollback, or preserve expensive hybrid dependencies.
    retry: Run targeted owner interviews or discovery against the disputed cluster and regenerate its connected component.
    cleanup: Remove raw network-flow and hostname exports according to classification policy; retain the sanitized graph.
    waf: 'Reliability: dependency-aware waves keep recoverable business services together during transition.'
  - title: Rationalize applications and form waves
    requirement: LAB22-REQ-04
    command: $portfolio = Import-Csv artifacts/portfolio.csv; $portfolio | Group-Object disposition | Sort-Object Name | Select-Object
      Name, Count
    positiveCommand: $portfolio = Import-Csv artifacts/portfolio.csv; $allowed = @('rehost','replatform','refactor','repurchase','retain','retire');
      if ($portfolio | Where-Object { $_.disposition -notin $allowed -or [string]::IsNullOrWhiteSpace($_.wave) }) { throw
      'A portfolio record lacks a valid disposition or wave.' }
    negativeCommand: $portfolio = Import-Csv artifacts/portfolio.csv; if ($portfolio | Where-Object { $_.supportStatus -eq
      'unsupported' -and $_.disposition -eq 'rehost' -and [string]::IsNullOrWhiteSpace($_.exceptionId) }) { throw 'An unsupported
      system is slated for rehost without an exception.' }
    expected: Every application has a justified disposition, target concept, remediation, wave, exit criterion, rollback option,
      and owner; waves respect dependencies and team capacity.
    negative: Defaulting all systems to rehost, placing unresolved blockers in Wave 1, or separating a hard dependency must
      fail.
    evidence: Preserve the rationalization matrix, scored priorities, wave map, exception approvals, and rejected sequencing
      alternatives.
    failure: A migration factory cannot compensate for poor disposition choices or an overloaded wave.
    retry: Resolve mandatory blockers, regroup dependency clusters, and recompute capacity and value scores.
    cleanup: Remove superseded local wave drafts while retaining the approved decision history.
    waf: 'Cost Optimization: rationalization avoids migrating systems that should be retired or repurchased and exposes retained
      hybrid cost.'
  - title: Validate the business case and landing-zone entry criteria
    requirement: LAB22-REQ-05
    command: Get-AzPolicyAssignment -Scope "/subscriptions/$SubscriptionId" | Select-Object Name, DisplayName, EnforcementMode,
      Scope
    positiveCommand: $assignments = Get-AzPolicyAssignment -Scope "/subscriptions/$SubscriptionId"; if (-not $assignments)
      { throw 'No policy-assignment evidence supports landing-zone readiness.' }
    negativeCommand: $groups = Get-AzResourceGroup; if ($groups | Where-Object { $_.Tags.purpose -eq 'migration-target' -and
      (-not $_.Tags.owner -or -not $_.Tags.costCenter) }) { throw 'A migration target resource group lacks ownership or cost
      attribution.' }
    expected: The business case includes migration and parallel-run costs, licenses, people, risk contingency, benefits, assumptions,
      and landing-zone readiness gates.
    negative: Savings that omit dual running, remediation, support, connectivity, or decommission cost must fail.
    evidence: Archive scenario cash flows, assumptions, sensitivity ranges, required policy evidence, decision gates, and
      finance approval.
    failure: An incomplete business case can make an infeasible schedule appear economically attractive.
    retry: Correct the missing cost or readiness assumption and rerun base, downside, and delay scenarios.
    cleanup: Remove detailed billing exports from the learning package and retain only normalized synthetic figures.
    waf: 'Performance Efficiency: landing-zone capacity and service limits are validated before workload teams commit to a
      wave.'
  changeRequest: The first datacenter lease now ends six months earlier, but the regulator prohibits moving two classified
    applications until encryption evidence is approved.
  challenge: Rebalance the waves to accelerate independent workloads, retain the classified dependency cluster temporarily,
    quantify dual-running cost, and preserve a credible exit milestone without disguising the exception.
  troubleshooting:
  - If portfolio totals differ between worksheets, establish one application identifier and reconcile duplicates before scoring.
  - If dependency discovery conflicts with owner interviews, retain both sources and lower confidence until a targeted test
    resolves the difference.
  - If the business case changes dramatically with one assumption, report sensitivity rather than presenting a single deterministic
    savings number.
  architectureAnalysis:
    permissions: No Azure role is required for the portfolio simulation; production discovery would use read-only inventory,
      cost, dependency, and security evidence.
    licensing: Assessment tooling, migration services, hybrid management, target platforms, and extended datacenter operation
      require workload-specific estimates.
    costNotes: Compare lease deadlines, dual-running periods, remediation, migration factory throughput, target run cost,
      and delayed value by wave.
    constraints:
    - Migration waves must prioritize measurable outcomes and dependency safety rather than server age alone.
    - One lease ends six months earlier while two classified applications cannot move until encryption evidence is approved.
    assumptions:
    - Application owners validate dependencies, disposition, business value, and blackout periods in the portfolio register.
    - Classified workloads can remain temporarily in an approved source or coexistence location after the first lease exit.
    facts:
      data: Portfolio records contain dependency, classification, owner, cost, readiness, disposition, risk, and outcome measures.
      scale: Multiple datacenters and coupled applications form migration waves; exact server count is intentionally inventory-derived.
      latency: Migration program latency is measured as assessment-to-wave lead time and cutover outage, not end-user request
        latency.
      availability: Coexistence and rollback preserve service while dependencies move; unsupported wave splits are explicitly
        blocked.
      rto: Each workload retains its business continuity target during migration; the portfolio has no single meaningful RTO.
      rpo: Data synchronization and rollback points are chosen per workload and cannot be inferred from the wave schedule.
      budget: The earlier lease exit raises temporary coexistence and acceleration cost, which is balanced against six months
        of avoided facility expense.
    candidateAnalyses:
    - name: Cloud Adoption Framework outcome-led assessment and dependency-based waves
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 4
        C3: 5
        C4: 5
        C5: 4
      rationale: Outcome-led assessment joins readiness, value, dependency, governance, and measurable success before workloads
        enter waves.
      rejectedReason: null
    - name: Datacenter-by-datacenter rehost schedule based only on server age
      eligible: true
      disqualifiers: []
      scores:
        C1: 2
        C2: 2
        C3: 2
        C4: 4
        C5: 3
      rationale: Facility ordering supports lease planning but can split applications from dependencies and carry unresolved
        risk into Azure.
      rejectedReason: Server age is not a sufficient readiness or value measure and produces unsafe dependency cuts.
    - name: Application-team modernization projects without a shared portfolio assessment
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 3
        C3: 3
        C4: 2
        C5: 2
      rationale: Team autonomy can accelerate local redesign, though shared dependencies, landing-zone readiness, and value
        reporting become fragmented.
      rejectedReason: Uncoordinated projects cannot reliably satisfy the fixed lease exit or portfolio risk controls.
    - name: Move classified applications before encryption approval to preserve the lease schedule
      eligible: false
      disqualifiers:
      - LAB22-REQ-04 requires mandatory compliance evidence before a classified workload can enter a migration wave.
      scores:
        C1: 1
        C2: 3
        C3: 1
        C4: 3
        C5: 3
      rationale: Advancing classified systems may simplify facility closure but knowingly crosses a regulatory release gate.
      rejectedReason: It is disqualified because lease pressure cannot override mandatory encryption approval.
    risks:
    - risk: The accelerated facility wave can strand an application whose dependency is blocked by classification review.
      mitigation: Model temporary coexistence, dependency proxies, or an approved alternate hosting location before wave approval.
    - risk: Outcome measures may be replaced by completion counts once schedule pressure rises.
      mitigation: Keep value, reliability, cost, and risk measures in the wave exit gate alongside migrated-server count.
    waf:
      reliability: Dependency-based waves, coexistence, and rollback protect service during portfolio transition.
      security: Classification and encryption evidence are hard gates rather than schedule-adjustable preferences.
      costOptimization: Lease avoidance, dual running, remediation, and target run cost are evaluated in one wave business
        case.
      operationalExcellence: Owners, decisions, readiness evidence, and outcome measures make wave approval reviewable.
      performanceEfficiency: Migration-factory capacity is allocated to ready waves instead of blocked or low-value server
        batches.
    safeAnalogue: Score the supplied synthetic portfolio and dependency graph, inject the lease and compliance changes, and
      produce revised waves offline.
    adrConsequences:
    - The first facility wave accelerates only workloads whose dependencies and landing-zone controls are ready.
    - Classified applications receive a documented coexistence path and cannot move on a schedule exception.
    changeExpectedRevision: Reorder the first waves around the earlier lease while holding classified applications behind
      encryption approval.
    revisedDecision:
      selectedCandidate: Cloud Adoption Framework outcome-led assessment and dependency-based waves
      mandatoryRequirementId: LAB22-REQ-04
      reason: LAB22-REQ-04 requires dependency-safe waves and explicit readiness gates, so ready workloads advance for the
        lease exit while classified systems remain behind encryption approval.
      waf:
        reliability: Coexistence prevents an accelerated wave from severing blocked dependencies.
        security: Classified applications remain behind the encryption-evidence gate.
        costOptimization: Six months of facility cost is compared transparently with temporary hosting and acceleration expense.
        operationalExcellence: Revised wave decisions record owner, blocker, exit evidence, and outcome measure.
        performanceEfficiency: Migration teams focus on ready dependency groups instead of spending capacity on compliance-blocked
          systems.
- number: '23'
  scenario: Contoso Manufacturing has approved a migration wave containing a three-tier line-of-business application, two
    VMware servers, a SQL Server database, and twelve terabytes of engineering files. The target landing zone and wave sequence
    are already approved; the remaining work is to choose concrete migration paths, rehearse cutover, validate data, and define
    rollback. Production downtime is limited to four hours, the file set changes continuously, and the database contains regulated
    records. The learning environment cannot replicate the full estate, so learners use Azure CLI, AzCopy dry-run output,
    synthetic manifests, and read-only service evidence to model Azure Migrate, Azure Database Migration Service, and staged
    Blob transfer safely.
  role: Workload and data migration architect
  outcome: Produce an executable migration runbook for an approved wave covering IaaS, PaaS, relational database, and unstructured
    data with validation and rollback gates.
  duration: 180 minutes
  difficulty: advanced
  costClass: low
  businessOutcome: Move the approved manufacturing workload inside the outage window with provable data integrity and a controlled
    return path.
  stakeholders:
  - Plant application owner
  - Infrastructure migration lead
  - Database administrator
  - Information protection officer
  - Change manager
  primarySource:
    title: Azure Migrate service overview
    url: https://learn.microsoft.com/en-us/azure/migrate/migrate-services-overview
  candidates:
  - Azure Migrate plus Azure Database Migration Service and staged AzCopy transfer
  - Manual virtual machine rebuild plus database backup restore and one-time file copy
  - Partner replication appliance for all servers, databases, and files as one opaque unit
  selected: Azure Migrate plus Azure Database Migration Service and staged AzCopy transfer
  checkpoints:
  - title: Confirm approved wave and target prerequisites
    requirement: LAB23-REQ-01
    command: az group show --name $TargetResourceGroupName --query "{id:id,location:location,tags:tags,provisioningState:properties.provisioningState}"
      --output json --only-show-errors
    positiveCommand: $group = az group show --name $TargetResourceGroupName --output json --only-show-errors | ConvertFrom-Json;
      if ($group.properties.provisioningState -ne 'Succeeded' -or $group.tags.wave -ne $ApprovedWave) { throw 'The target
      scope is not ready for the approved wave.' }
    negativeCommand: $locks = az lock list --resource-group $TargetResourceGroupName --output json --only-show-errors | ConvertFrom-Json;
      if ($locks | Where-Object { $_.level -eq 'ReadOnly' }) { throw 'A read-only lock blocks migration deployment.' }
    expected: Scope, quotas, policy, DNS, identity, connectivity, encryption, monitoring, ownership, and rollback capacity
      satisfy the wave entry criteria.
    negative: An unapproved resource group, unresolved policy denial, missing private resolution, or absent rollback capacity
      must block migration.
    evidence: Save the entry checklist, resource-group projection, approvals, exceptions, and pre-cutover decision record.
    failure: Starting replication before target readiness can waste the outage window and create stranded resources.
    retry: Resolve the specific entry gate and repeat all prerequisite assertions before rescheduling cutover.
    cleanup: Delete local prerequisite exports; do not remove landing-zone policy, locks, or shared networking.
    waf: 'Security: entry gates verify identity, encryption, and private connectivity before regulated data moves.'
  - title: Design server replication and test migration
    requirement: LAB23-REQ-02
    command: az resource show --resource-group $MigrationResourceGroupName --resource-type Microsoft.Migrate/migrateProjects
      --name $MigrateProjectName --api-version 2020-05-01 --output json --only-show-errors
    positiveCommand: $project = az resource show --resource-group $MigrationResourceGroupName --resource-type Microsoft.Migrate/migrateProjects
      --name $MigrateProjectName --api-version 2020-05-01 --output json --only-show-errors | ConvertFrom-Json; if ($project.properties.provisioningState
      -ne 'Succeeded') { throw 'The Azure Migrate project is not ready.' }
    negativeCommand: $targets = az vm list --resource-group $TargetResourceGroupName --query "[?tags.wave=='$ApprovedWave'
      && tags.runId!='$RunId']" --output json --only-show-errors | ConvertFrom-Json; if ($targets.Count -gt 0) { throw 'The
      target contains a wave VM owned by another run.' }
    expected: Appliance placement, discovery boundary, replication cadence, rightsizing, disk handling, test network, agent
      impact, and rollback are explicit for each server.
    negative: A test migration connected to production, an unsupported disk, missing dependency, or overwrite of an existing
      target VM must fail.
    evidence: Preserve assessment recommendations, replication-health samples, test-migration assertions, target sizing, and
      exact migration IDs.
    failure: A successful boot does not prove application reachability, performance, or dependency readiness.
    retry: Correct mapping or sizing and repeat an isolated test migration while preserving the failed evidence.
    cleanup: Remove only run-owned test VMs, NICs, disks, and snapshots in dependency order; keep replication configuration.
    waf: 'Reliability: isolated test migration and rollback evidence reduce cutover uncertainty without touching the source.'
  - title: Plan online relational database migration
    requirement: LAB23-REQ-03
    command: az resource list --resource-group $MigrationResourceGroupName --resource-type Microsoft.DataMigration/services
      --query "[].{id:id,name:name,location:location,sku:sku.name,provisioningState:properties.provisioningState}" --output
      json --only-show-errors
    positiveCommand: $services = az resource list --resource-group $MigrationResourceGroupName --resource-type Microsoft.DataMigration/services
      --output json --only-show-errors | ConvertFrom-Json; if (-not ($services | Where-Object { $_.properties.provisioningState
      -eq 'Succeeded' })) { throw 'No ready database migration service was found.' }
    negativeCommand: $targets = az sql db list --resource-group $TargetResourceGroupName --server $TargetSqlServerName --output
      json --only-show-errors | ConvertFrom-Json; if ($targets | Where-Object { $_.name -eq $TargetDatabaseName -and $_.status
      -ne 'Online' }) { throw 'The target database exists but is not online.' }
    expected: Compatibility, target tier, schema, continuous synchronization, encryption, logins, jobs, cutover lag, application
      freeze, and rollback are covered.
    negative: Unresolved blocking compatibility findings, missing principals, excessive replication lag, or a writable source
      after the cutover gate must fail.
    evidence: Save compatibility results, schema hash, row and checksum samples, synchronization lag, identity mapping, and
      cutover authorization.
    failure: Data copy can complete while server-level objects or application connection behavior remain incomplete.
    retry: Resolve the failed object class, resynchronize, and rerun independent schema, data, login, and application checks.
    cleanup: Remove only run-owned migration activities and empty test databases; never drop a source or purge backups.
    waf: 'Performance Efficiency: representative workload evidence validates target tier sizing before irreversible cutover.'
  - title: Stage and verify unstructured data transfer
    requirement: LAB23-REQ-04
    command: azcopy copy $SourceDataUrl $DestinationDataUrl --recursive --dry-run
    positiveCommand: $blobs = az storage blob list --account-name $TargetStorageAccountName --container-name $TargetContainerName
      --auth-mode login --query "[?metadata.runId=='$RunId'].{name:name,size:properties.contentLength,md5:properties.contentSettings.contentMd5}"
      --output json --only-show-errors | ConvertFrom-Json; if ($blobs.Count -lt 1) { throw 'No run-owned target blobs were
      found.' }
    negativeCommand: $unexpected = az storage blob list --account-name $TargetStorageAccountName --container-name $TargetContainerName
      --auth-mode login --query "[?metadata.wave!='$ApprovedWave']" --output json --only-show-errors | ConvertFrom-Json; if
      ($unexpected.Count -gt 0) { throw 'The target container contains data outside the approved wave.' }
    expected: Baseline and delta transfers preserve hierarchy, metadata, access tier, hashes, timestamps where required, encryption,
      and an auditable manifest.
    negative: A copy count without byte totals and hashes, a source URL with embedded credentials, or data outside the approved
      prefix must fail.
    evidence: Preserve dry-run scope, sanitized transfer logs, source and target manifests, failed-object list, hash samples,
      and delta timing.
    failure: A nominally successful bulk copy can omit inaccessible files, metadata, or late source changes.
    retry: Correct only failed objects, run a final delta after write freeze, and regenerate both manifests.
    cleanup: Delete only run-owned target prefixes after manifest and ownership verification; never purge the source.
    waf: 'Cost Optimization: staged transfer, lifecycle tiering, and delta cutover reduce network and parallel-storage cost.'
  - title: Rehearse cutover, validation, and rollback
    requirement: LAB23-REQ-05
    command: az monitor metrics list --resource $TargetApplicationResourceId --metric Availability,Requests,ResponseTime --interval
      PT1M --aggregation Average --output json --only-show-errors
    positiveCommand: $metrics = az monitor metrics list --resource $TargetApplicationResourceId --metric Availability,Requests
      --interval PT1M --aggregation Average --output json --only-show-errors | ConvertFrom-Json; if (-not $metrics.value.timeseries.data)
      { throw 'No target application validation metrics were returned.' }
    negativeCommand: $failed = az monitor activity-log list --resource-group $TargetResourceGroupName --status Failed --offset
      2h --output json --only-show-errors | ConvertFrom-Json; if ($failed.Count -gt 0) { throw 'Failed target operations remain
      unresolved before cutover.' }
    expected: The runbook freezes writes, performs final deltas, redirects by an approved mechanism, validates infrastructure,
      data, security, performance, and business transactions, then gates rollback.
    negative: Proceeding after outage budget, unresolved checksum difference, failed business transaction, or uncertain authoritative
      write location must fail.
    evidence: Archive a timestamped cutover timeline, assertion-level results, data delta, decision log, communications, and
      rollback disposition.
    failure: Teams can cross the point of no return while individual technical checks still appear green.
    retry: Invoke the documented rollback while the source remains authoritative, resolve the failed gate, and schedule a
      new window.
    cleanup: Remove run-owned test targets only after rollback or acceptance is complete; decommission sources in a separately
      approved process.
    waf: 'Operational Excellence: explicit stop/go and rollback gates keep a multi-technology cutover controlled.'
  changeRequest: Plant leadership reduces the outage window from four hours to ninety minutes and requires engineering-file
    writes to continue until fifteen minutes before redirection.
  challenge: Revise continuous database synchronization, file deltas, write-freeze sequencing, validation sampling, and rollback
    deadlines while preserving integrity evidence.
  troubleshooting:
  - If test-migrated servers boot but the application fails, validate DNS, identity, certificates, and dependency reachability
    separately.
  - If database lag will not converge, inspect source transaction rate and target capacity before extending the outage assumption.
  - If AzCopy manifests differ, separate skipped, changed-during-copy, metadata-only, and hash mismatches before retrying.
  architectureAnalysis:
    permissions: Azure Migrate, Database Migration Service, storage, network, and target read access supports planning; replication,
      transfer, migration, or cutover requires separate authorization.
    licensing: Migration tooling may be free for assessment periods, while replication storage, DMS SKUs, AzCopy transfer,
      target compute, and egress can incur charges.
    costNotes: Model assessment, replication duration, target validation, transfer churn, dual running, outage labor, rollback
      retention, and post-cutover scale.
    constraints:
    - Manufacturing compute, databases, and engineering files need integrity evidence and a controlled return path.
    - The outage window drops from four hours to ninety minutes and file writes continue until fifteen minutes before redirection.
    assumptions:
    - Network throughput and source change rates can be measured before the migration event.
    - Application owners can freeze database and file changes at separately defined cutover gates.
    facts:
      data: Virtual machines, relational data, and large engineering files use distinct replication, integrity, and cutover
        mechanisms.
      scale: Bulk files are preseeded and only the final fifteen-minute delta enters the outage path; measured bytes and change
        rate determine feasibility.
      latency: The critical path includes final synchronization, validation, redirection, and business acceptance inside ninety
        minutes.
      availability: Source systems remain the rollback authority until target integrity and manufacturing transactions pass.
      rto: The migration outage ceiling is ninety minutes from the approved freeze to service redirection.
      rpo: Engineering-file writes continue until fifteen minutes before redirection, defining the maximum planned file delta
        window.
      budget: Staged replication and temporary dual running are funded to reduce outage risk and avoid emergency transfer
        capacity.
    candidateAnalyses:
    - name: Azure Migrate plus Azure Database Migration Service and staged AzCopy transfer
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 5
        C3: 4
        C4: 4
        C5: 4
      rationale: Specialized migration paths preseed each workload type, preserve assessment and integrity evidence, and constrain
        final deltas.
      rejectedReason: null
    - name: Manual virtual machine rebuild plus database backup restore and one-time file copy
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 2
        C3: 3
        C4: 2
        C5: 4
      rationale: Manual rebuild and restore are familiar but put full transfer, configuration, and troubleshooting into the
        outage window.
      rejectedReason: The shortened window cannot absorb full database and engineering-file copies plus manual validation.
    - name: Partner replication appliance for all servers, databases, and files as one opaque unit
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 4
        C3: 3
        C4: 2
        C5: 2
      rationale: An appliance can simplify bulk movement but obscures workload-specific consistency, integrity, and rollback
        evidence.
      rejectedReason: Opaque replication weakens independent database, file, and VM acceptance even if transfer completes.
    - name: Unstaged live copy with no source rollback point
      eligible: false
      disqualifiers:
      - LAB23-REQ-05 requires a timed cutover with integrity proof and an executable rollback decision.
      scores:
        C1: 1
        C2: 1
        C3: 2
        C4: 1
        C5: 4
      rationale: Copying once during outage avoids temporary storage but makes duration unpredictable and destroys a safe
        decision point.
      rejectedReason: It is ineligible because neither the ninety-minute window nor reversibility can be proven.
    risks:
    - risk: Engineering-file churn in the final fifteen minutes can exceed available transfer throughput.
      mitigation: Measure change rate, journal final deltas, set a go/no-go threshold, and preserve source write logs for
        reconciliation.
    - risk: A successful infrastructure cutover can hide database or file inconsistency.
      mitigation: Run workload-specific row, checksum, and manufacturing transaction assertions before redirecting users.
    waf:
      reliability: Preseeding, independent consistency checks, and preserved source rollback reduce cutover failure impact.
      security: Managed identities, private transfer paths, sanitized evidence, and least-privilege migration roles protect
        source data.
      costOptimization: Temporary replication and dual running are bounded to the period that buys a shorter controlled outage.
      operationalExcellence: Timed gates, owners, integrity results, redirection, and rollback criteria create an executable
        cutover record.
      performanceEfficiency: Only measured final deltas and validation remain inside the ninety-minute critical path.
    safeAnalogue: Replay synthetic VM, database, and file manifests through preseed, delta, checksum, cutover, and rollback
      gates without starting a migration.
    adrConsequences:
    - Source systems remain authoritative until every workload-specific acceptance check passes.
    - File change rate and network throughput become explicit go/no-go evidence fifteen minutes before redirection.
    changeExpectedRevision: Prestage all bulk data, journal the final file delta, and compress the ordered cutover gates into
      ninety minutes.
    revisedDecision:
      selectedCandidate: Azure Migrate plus Azure Database Migration Service and staged AzCopy transfer
      mandatoryRequirementId: LAB23-REQ-05
      reason: LAB23-REQ-05 requires a ninety-minute outage with writes continuing to minute fifteen, so staged services remain
        selected and only recorded deltas plus acceptance enter the critical path.
      waf:
        reliability: A preserved source and explicit abort threshold keep the shortened event reversible.
        security: Final deltas travel through the same approved protected transfer boundary.
        costOptimization: Temporary staging cost avoids emergency bandwidth and extended factory downtime.
        operationalExcellence: Minute-by-minute gates expose when to continue, abort, or roll back.
        performanceEfficiency: Preseeded bulk data leaves a measured fifteen-minute write delta for final transfer.
- number: '24'
  scenario: Coho Bank serves customers through public web and API endpoints while core risk systems remain in two private
    datacenters. Internet users need globally accelerated TLS entry, branches need reliable access to Azure services, and
    high-volume transaction flows require predictable private connectivity with encrypted backup when a circuit fails. Teams
    currently discuss ExpressRoute, VPN, Virtual WAN, Front Door, and DNS as isolated products, leaving route propagation,
    asymmetric paths, name resolution, latency, bandwidth, and failover behavior unowned. The lab uses Azure CLI to inspect
    a safe network analogue, measure reachability, and compare designs without provisioning a circuit or production-scale
    gateway.
  role: Hybrid connectivity architect
  outcome: Design a resilient internet and hybrid connectivity architecture with explicit routing, DNS, failover, performance,
    and operational evidence.
  duration: 165 minutes
  difficulty: advanced
  costClass: low
  businessOutcome: Provide low-latency customer entry and predictable private access to risk systems while sustaining connectivity
    through a circuit or tunnel failure.
  stakeholders:
  - Digital banking product owner
  - Enterprise network lead
  - Datacenter operations manager
  - Security architect
  - Site reliability engineering lead
  primarySource:
    title: Azure networking plan and design overview
    url: https://learn.microsoft.com/en-us/azure/networking/design-guide/overview
  candidates:
  - Front Door Premium with dual ExpressRoute connectivity, VPN failover, and Virtual WAN transit
  - Regional Application Gateway with internet VPN tunnels and manual branch routing
  - Front Door Standard with provider-managed SD-WAN and direct spoke connections
  selected: Front Door Premium with dual ExpressRoute connectivity, VPN failover, and Virtual WAN transit
  checkpoints:
  - title: Design global internet entry and DNS
    requirement: LAB24-REQ-01
    command: az rest --method get --url "https://management.azure.com/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName/providers/Microsoft.Cdn/profiles/$FrontDoorProfileName?api-version=2024-09-01"
      --query "{id:id,sku:sku.name,provisioningState:properties.provisioningState,frontDoorId:properties.frontDoorId}" --output
      json --only-show-errors
    positiveCommand: $frontDoorProfile = az rest --method get --url "https://management.azure.com/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName/providers/Microsoft.Cdn/profiles/$FrontDoorProfileName?api-version=2024-09-01"
      --output json --only-show-errors | ConvertFrom-Json; if ($frontDoorProfile.properties.provisioningState -ne 'Succeeded'
      -or $frontDoorProfile.sku.name -notin @('Standard_AzureFrontDoor','Premium_AzureFrontDoor')) { throw 'The Front Door
      profile is not a supported ready tier.' }
    negativeCommand: $response = az rest --method get --url "https://management.azure.com/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName/providers/Microsoft.Cdn/profiles/$FrontDoorProfileName/afdEndpoints?api-version=2024-09-01"
      --output json --only-show-errors | ConvertFrom-Json; if ($response.value | Where-Object { $_.properties.enabledState
      -ne 'Enabled' }) { throw 'A required Front Door endpoint is disabled.' }
    expected: The design covers authoritative DNS, Front Door Standard or Premium, TLS, origin naming, health probes, caching
      boundary, IPv4 and IPv6, and regional-origin failure.
    negative: A single regional public IP, circular DNS dependency, disabled health probe, or origin reachable outside the
      intended entry path must fail.
    evidence: Preserve the DNS chain, profile and endpoint projection, probe design, origin matrix, and failure-routing expectations.
    failure: Global service availability can still be lost through a mis-scoped DNS zone or unhealthy common origin dependency.
    retry: Correct the DNS or origin model and repeat resolution plus endpoint-health assertions from each test vantage point.
    cleanup: Remove local DNS captures; do not modify public records or Front Door configuration in the safe analogue.
    waf: 'Performance Efficiency: anycast entry and edge acceleration reduce global connection latency while health-based
      routing avoids failed origins.'
  - title: Validate private circuit and VPN failover design
    requirement: LAB24-REQ-02
    command: az network express-route show --resource-group $ResourceGroupName --name $ExpressRouteCircuitName --query "{serviceProvider:serviceProviderProperties.serviceProviderName,bandwidth:serviceProviderProperties.bandwidthInMbps,state:serviceProviderProvisioningState,circuitStatus:circuitProvisioningState,peerings:peerings[].peeringType}"
      --output json --only-show-errors
    positiveCommand: $circuit = az network express-route show --resource-group $ResourceGroupName --name $ExpressRouteCircuitName
      --output json --only-show-errors | ConvertFrom-Json; if ($circuit.serviceProviderProvisioningState -ne 'Provisioned'
      -or $circuit.circuitProvisioningState -ne 'Enabled') { throw 'The ExpressRoute circuit is not ready.' }
    negativeCommand: $gateways = az network vnet-gateway list --resource-group $ResourceGroupName --output json --only-show-errors
      | ConvertFrom-Json; if (-not ($gateways | Where-Object { $_.gatewayType -eq 'Vpn' -and $_.provisioningState -eq 'Succeeded'
      })) { throw 'No ready VPN failover gateway was found.' }
    expected: Dual private paths, diverse provider locations, BGP, gateway scale, FastPath decision, VPN encryption, and deterministic
      preference and failback are documented.
    negative: Two links sharing one provider edge, overlapping prefixes, static routes that defeat failover, or untested VPN
      capacity must fail.
    evidence: Save circuit and gateway projections, provider diversity statement, prefix table, BGP preference, and failover
      timing target.
    failure: Nominal redundancy can share a physical or routing failure domain and provide no effective continuity.
    retry: Correct path diversity or route preference in the model and replay circuit-withdrawal scenarios.
    cleanup: Delete local projections; never disconnect a circuit or tunnel during assessment.
    waf: 'Reliability: physically and logically diverse private and encrypted backup paths remove single connectivity dependencies.'
  - title: Prove transit routing and route ownership
    requirement: LAB24-REQ-03
    command: az network vhub show --resource-group $ResourceGroupName --name $VirtualHubName --query "{id:id,addressPrefix:addressPrefix,routingState:routingState,virtualRouterAsn:virtualRouterAsn,provisioningState:provisioningState}"
      --output json --only-show-errors
    positiveCommand: $hub = az network vhub show --resource-group $ResourceGroupName --name $VirtualHubName --output json
      --only-show-errors | ConvertFrom-Json; if ($hub.provisioningState -ne 'Succeeded' -or $hub.routingState -notin @('Provisioned','Provisioning'))
      { throw 'The virtual hub is not ready for transit.' }
    negativeCommand: $routes = az network vhub route-table route list --resource-group $ResourceGroupName --vhub-name $VirtualHubName
      --route-table-name $HubRouteTableName --output json --only-show-errors | ConvertFrom-Json; if ($routes | Where-Object
      { $_.destinations -contains '0.0.0.0/0' -and $_.nextHopType -eq 'ResourceId' -and -not $_.nextHops }) { throw 'A default
      route has no valid next hop.' }
    expected: Advertised and learned prefixes, propagation labels, next hops, default-route intent, DNS forwarders, and ownership
      are explicit for every path.
    negative: Overlap, an orphaned next hop, asymmetric stateful path, unintended branch transit, or DNS forwarding loop must
      fail.
    evidence: Preserve effective route projections, prefix ownership, path diagrams, DNS query flow, and asymmetric-path tests.
    failure: Control-plane connectivity can report provisioned while data follows an unintended or asymmetric route.
    retry: Correct propagation association or prefix ownership and rerun source-to-destination path evaluation.
    cleanup: Remove local route exports; do not update hub route tables during the safe analogue.
    waf: 'Security: explicit route ownership prevents accidental bypass of approved inspection and private paths.'
  - title: Test reachability and name resolution
    requirement: LAB24-REQ-04
    command: az network watcher test-connectivity --resource-group $ResourceGroupName --source-resource $SourceVmId --dest-address
      $PrivateServiceFqdn --dest-port 443 --protocol Tcp --output json --only-show-errors
    positiveCommand: $test = az network watcher test-connectivity --resource-group $ResourceGroupName --source-resource $SourceVmId
      --dest-address $PrivateServiceFqdn --dest-port 443 --protocol Tcp --output json --only-show-errors | ConvertFrom-Json;
      if ($test.connectionStatus -ne 'Reachable') { throw 'The approved private endpoint is not reachable.' }
    negativeCommand: $publicTest = az network watcher test-connectivity --resource-group $ResourceGroupName --source-resource
      $SourceVmId --dest-address $DisallowedPublicEndpoint --dest-port 443 --protocol Tcp --output json --only-show-errors
      | ConvertFrom-Json; if ($publicTest.connectionStatus -eq 'Reachable') { throw 'A disallowed public endpoint is reachable.'
      }
    expected: Independent tests prove approved branch, datacenter, spoke, private endpoint, DNS, and internet paths while
      disallowed public paths remain unreachable.
    negative: A successful ping alone, name resolution to a public address, or reachability that bypasses the required path
      must fail.
    evidence: Save source, destination, resolved addresses, hops, latency, expected path, and positive and negative assertion
      results.
    failure: Network reachability without correct name resolution and path intent can bypass security or break applications.
    retry: Diagnose DNS, effective routes, NSGs, and next-hop state separately before repeating the exact test.
    cleanup: Delete diagnostic output containing topology details; test-connectivity creates no persistent resource.
    waf: 'Operational Excellence: repeatable positive and negative probes turn connectivity intent into observable evidence.'
  - title: Establish capacity and performance baselines
    requirement: LAB24-REQ-05
    command: az monitor metrics list --resource $ExpressRouteCircuitResourceId --metric ArpAvailability,BgpAvailability,BitsInPerSecond,BitsOutPerSecond
      --interval PT5M --aggregation Average,Maximum --output json --only-show-errors
    positiveCommand: $metrics = az monitor metrics list --resource $ExpressRouteCircuitResourceId --metric ArpAvailability,BgpAvailability
      --interval PT5M --aggregation Average --output json --only-show-errors | ConvertFrom-Json; if ($metrics.value.timeseries.data.average
      | Where-Object { $_ -lt 100 }) { throw 'Circuit availability evidence is below target.' }
    negativeCommand: $throughput = az monitor metrics list --resource $ExpressRouteCircuitResourceId --metric BitsInPerSecond,BitsOutPerSecond
      --interval PT5M --aggregation Maximum --output json --only-show-errors | ConvertFrom-Json; if ($throughput.value.timeseries.data.maximum
      | Where-Object { $_ -gt $ApprovedBitsPerSecond }) { throw 'Observed throughput exceeds approved headroom.' }
    expected: Latency percentiles, jitter, loss, throughput, connection scale, gateway and circuit headroom, and failover
      convergence meet documented targets.
    negative: Relying on averages that hide saturation, measuring only Azure-side latency, or omitting backup-path capacity
      must fail.
    evidence: Archive timestamped metric samples, endpoint timings, utilization percentiles, failover convergence, and capacity
      forecast.
    failure: A path can remain reachable while congestion or failover capacity violates application objectives.
    retry: Isolate the constrained segment, correct sizing or routing in the design, and repeat the same load profile.
    cleanup: Remove synthetic performance data and sanitized captures according to evidence policy.
    waf: 'Cost Optimization: measured headroom supports the least expensive circuit and gateway capacity that still meets
      degraded-mode demand.'
  changeRequest: The payment regulator requires all private transaction traffic to remain encrypted in transit even over ExpressRoute,
    and the backup VPN must carry the full peak load for four hours.
  challenge: Add an encryption approach, recalculate gateway and tunnel scale, update route preference and failover tests,
    and quantify the performance and cost impact.
  troubleshooting:
  - If control-plane status is healthy but connectivity fails, inspect effective routes, BGP advertisements, DNS answers,
    and stateful return path separately.
  - If Front Door reports an unhealthy origin, compare probe host header, certificate name, path, response code, and origin
    firewall rules.
  - If metrics show no samples, verify resource ID, supported metric definitions, aggregation, and time window before concluding
    there is no traffic.
  architectureAnalysis:
    permissions: Front Door, ExpressRoute, VPN, Virtual WAN, routing, and network monitoring read roles support inspection;
      profile, circuit, gateway, route, or encryption changes require separate authorization.
    licensing: Front Door Premium, ExpressRoute circuits and gateways, Virtual WAN hubs, VPN gateways, bandwidth, and monitoring
      each have recurring charges.
    costNotes: Include dual circuits, provider ports, gateway scale units, VPN peak capacity, Front Door requests and transfer,
      and encrypted-path operations.
    constraints:
    - Customer entry must remain globally available while risk-system access follows predictable private paths through circuit
      or tunnel failure.
    - Private transaction traffic must be encrypted over ExpressRoute and the backup VPN must carry four hours of full peak
      load.
    assumptions:
    - Colocation and network providers support the selected ExpressRoute encryption option or application-layer encryption.
    - Branch and hub address spaces permit deterministic routing without overlapping prefixes.
    facts:
      data: Customer HTTPS traffic and private transaction flows cross distinct edge, WAN, routing, inspection, and encryption
        boundaries.
      scale: Backup VPN is sized for one hundred percent of measured peak transaction traffic for four hours; circuit throughput
        remains measured evidence.
      latency: Front Door optimizes customer entry and ExpressRoute serves private latency, with encrypted VPN failover tested
        against the workload target.
      availability: Dual circuits, independent paths, VPN fallback, and hub routing cover provider, gateway, and connection
        failures separately.
      rto: Path convergence must occur within the risk-system recovery objective; no unsupported numerical target is assigned.
      rpo: Connectivity carries transactions but does not define their data RPO; in-flight retry and idempotency remain application
        requirements.
      budget: Full-size VPN standby and encrypted circuit paths are explicit regulatory continuity costs rather than assumed
        free redundancy.
    candidateAnalyses:
    - name: Front Door Premium with dual ExpressRoute connectivity, VPN failover, and Virtual WAN transit
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 5
        C3: 5
        C4: 4
        C5: 2
      rationale: Premium edge security, redundant private circuits, scaled VPN fallback, and managed transit form explicit
        customer and private failure paths.
      rejectedReason: null
    - name: Regional Application Gateway with internet VPN tunnels and manual branch routing
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 3
        C3: 4
        C4: 2
        C5: 4
      rationale: Regional ingress and VPN can reduce cost, but global entry, route convergence, and manual branch failover
        are weaker.
      rejectedReason: It lacks the selected design's global edge and predictable automated transit behavior.
    - name: Front Door Standard with provider-managed SD-WAN and direct spoke connections
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 4
        C3: 3
        C4: 3
        C5: 3
      rationale: Provider SD-WAN may simplify branch operations, but direct spokes fragment route and security ownership and
        Standard lacks Premium private-origin capabilities.
      rejectedReason: Split provider and spoke controls make end-to-end private path evidence harder to establish.
    - name: One ExpressRoute circuit with unencrypted private traffic and undersized VPN
      eligible: false
      disqualifiers:
      - LAB24-REQ-02 requires encrypted private paths and a VPN failover design sized to the approved traffic load.
      scores:
        C1: 1
        C2: 1
        C3: 1
        C4: 3
        C5: 4
      rationale: Minimal redundant capacity lowers cost but leaves a circuit failure and unencrypted path outside the regulatory
        contract.
      rejectedReason: It is ineligible because both encryption and backup-capacity requirements are mandatory.
    risks:
    - risk: Encryption overhead can reduce effective throughput below the four-hour peak requirement.
      mitigation: Load-test encrypted circuit and VPN paths with production packet sizes and reserve measured headroom.
    - risk: Advertised routes can prefer an unintended path and bypass inspection during failover.
      mitigation: Capture effective routes and next hops for normal, circuit-loss, and recovery states before approval.
    waf:
      reliability: Independent edge, dual-circuit, VPN, gateway, and route tests expose each connectivity failure domain.
      security: Premium edge controls and encrypted private transport protect both public entry and regulated transactions.
      costOptimization: Redundant circuits and full VPN capacity are tied to regulatory continuity instead of duplicated indiscriminately.
      operationalExcellence: Route, encryption, health, failover, and restoration evidence provide a deterministic network
        runbook.
      performanceEfficiency: Measured encrypted throughput sizes gateways and tunnels for the full four-hour peak.
    safeAnalogue: Inspect synthetic topology, routes, cipher requirements, and capacity calculations; use the offline Front
      Door REST fixture and issue no network change.
    adrConsequences:
    - Network owners must operate and exercise both circuit and VPN encryption paths at production-equivalent load.
    - Effective-route evidence becomes a release artifact because nominal connection health cannot prove path choice.
    changeExpectedRevision: Add approved encryption to the ExpressRoute path and size the VPN gateway from measured encrypted
      peak throughput for four hours.
    revisedDecision:
      selectedCandidate: Front Door Premium with dual ExpressRoute connectivity, VPN failover, and Virtual WAN transit
      mandatoryRequirementId: LAB24-REQ-02
      reason: LAB24-REQ-02 requires explicit private-circuit and VPN failover design, so the selected path adds ExpressRoute
        encryption and a load-tested full-peak VPN capacity floor.
      waf:
        reliability: Full-capacity VPN prevents regulatory traffic from becoming a partial service during circuit loss.
        security: Transaction traffic remains encrypted on primary and fallback private paths.
        costOptimization: Higher gateway and encryption cost is attributed to the four-hour compliance objective.
        operationalExcellence: Normal, failure, and restoration route captures prove the intended path.
        performanceEfficiency: Gateway selection follows encrypted throughput measurements rather than nominal SKU bandwidth.
- number: '25'
  scenario: 'Fourth Coffee Health exposes appointment services globally and connects them to private clinical APIs in a hub-and-spoke
    Azure network. Security requires segmented environments, centralized inspection, application-layer protection, controlled
    east-west flows, and explicit outbound connectivity. Operations also need the correct load-balancing service at each layer:
    global HTTP entry, regional web routing, private TCP distribution, and deterministic egress. Earlier diagrams used a Basic
    Load Balancer and assumed default outbound access, creating retirement and reliability risk. Learners will inspect a safe
    PowerShell analogue built around Front Door Premium, Azure Firewall Premium, Application Gateway WAF v2, Standard Load
    Balancer, and NAT Gateway without altering production policy.'
  role: Network security and traffic-delivery architect
  outcome: Design and validate segmented, inspected traffic paths with current load-balancing services, explicit outbound
    connectivity, and independent allow and deny evidence.
  duration: 180 minutes
  difficulty: advanced
  costClass: low
  businessOutcome: Protect clinical services and maintain predictable inbound, east-west, and outbound traffic through zonal
    or regional component failure.
  stakeholders:
  - Clinical digital product owner
  - Network security lead
  - Platform networking team
  - Privacy officer
  - Site reliability engineering lead
  primarySource:
    title: Azure load-balancing options
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/load-balancing-overview
  candidates:
  - Front Door Premium, Application Gateway WAF v2, Azure Firewall Premium, Standard Load Balancer, and NAT Gateway
  - Traffic Manager, regional WAF gateways, NSG-only inspection, Standard Load Balancer, and NAT Gateway
  - Front Door Standard, third-party NVAs behind Gateway Load Balancer, and centralized proxy egress
  selected: Front Door Premium, Application Gateway WAF v2, Azure Firewall Premium, Standard Load Balancer, and NAT Gateway
  checkpoints:
  - title: Establish segmentation and least-access flows
    requirement: LAB25-REQ-01
    command: Get-AzVirtualNetwork -ResourceGroupName $ResourceGroupName | Select-Object Name, Location, AddressSpace, Subnets,
      VirtualNetworkPeerings
    positiveCommand: $vnet = Get-AzVirtualNetwork -ResourceGroupName $ResourceGroupName -Name $SpokeVnetName; if (-not ($vnet.Subnets
      | Where-Object Name -eq $ApplicationSubnetName)) { throw 'The application subnet is absent.' }
    negativeCommand: $nsgs = Get-AzNetworkSecurityGroup -ResourceGroupName $ResourceGroupName; if ($nsgs.SecurityRules | Where-Object
      { $_.Direction -eq 'Inbound' -and $_.Access -eq 'Allow' -and $_.SourceAddressPrefix -eq '*' -and $_.DestinationPortRange
      -eq '*' }) { throw 'An unrestricted inbound NSG rule exists.' }
    expected: Environment, tier, management, private endpoint, firewall, and gateway boundaries have nonoverlapping prefixes,
      owned route intent, and minimum required flows.
    negative: Flat address space, broad any-to-any rule, unmanaged peering transit, or a private endpoint sharing an application
      subnet must fail.
    evidence: Preserve the segmentation diagram, subnet and NSG projections, flow matrix, ownership, and deny-by-default rationale.
    failure: Nominal subnet separation provides little protection when routes or rules permit uncontrolled lateral movement.
    retry: Narrow the disputed flow and rerun independent required-allow and prohibited-deny tests.
    cleanup: Delete local topology exports; do not change NSGs, peerings, or subnets during assessment.
    waf: 'Security: segmentation and least-access rules constrain lateral movement and data exposure.'
  - title: Validate centralized inspection and policy hierarchy
    requirement: LAB25-REQ-02
    command: Get-AzFirewall -ResourceGroupName $ResourceGroupName -Name $FirewallName | Select-Object Name, Location, Sku,
      ThreatIntelMode, FirewallPolicy, Zones, ProvisioningState
    positiveCommand: $firewall = Get-AzFirewall -ResourceGroupName $ResourceGroupName -Name $FirewallName; if ($firewall.ProvisioningState
      -ne 'Succeeded' -or $firewall.Sku.Tier -ne 'Premium') { throw 'Azure Firewall Premium is not ready.' }
    negativeCommand: $policy = Get-AzFirewallPolicy -ResourceGroupName $ResourceGroupName -Name $FirewallPolicyName; if ($policy.ThreatIntelMode
      -eq 'Off' -or -not $policy.DnsSetting) { throw 'Threat intelligence or governed DNS proxy configuration is absent.'
      }
    expected: Hierarchical policy, DNS proxy, TLS inspection decision, IDPS, threat intelligence, rule ownership, logging,
      and exception expiry are explicit.
    negative: An application rule bypassed by a broad network rule, permanent exception, missing diagnostics, or asymmetric
      route around inspection must fail.
    evidence: Save redacted policy hierarchy, effective rule order, route projections, logging destinations, and approved
      exceptions.
    failure: A configured firewall can be bypassed by routing or an overly broad higher-priority rule.
    retry: Correct route or priority in the design fixture and repeat both permitted and prohibited flow evaluation.
    cleanup: Remove sanitized policy exports according to classification; never delete shared firewall policy.
    waf: 'Operational Excellence: centralized policy, ownership, diagnostics, and expiry make inspection changes reviewable.'
  - title: Prove global and regional HTTP protection
    requirement: LAB25-REQ-03
    command: Get-AzFrontDoorCdnProfile -ResourceGroupName $ResourceGroupName -Name $FrontDoorProfileName | Select-Object Name,
      Location, SkuName, ProvisioningState
    positiveCommand: $frontDoorProfile = Get-AzFrontDoorCdnProfile -ResourceGroupName $ResourceGroupName -Name $FrontDoorProfileName;
      if ($frontDoorProfile.SkuName -ne 'Premium_AzureFrontDoor' -or $frontDoorProfile.ProvisioningState -ne 'Succeeded')
      { throw 'Front Door Premium is not ready.' }
    negativeCommand: $gateways = Get-AzApplicationGateway -ResourceGroupName $ResourceGroupName; if ($gateways | Where-Object
      { $_.WebApplicationFirewallConfiguration.Enabled -eq $false }) { throw 'A regional application gateway has WAF disabled.'
      }
    expected: Front Door Premium provides global WAF and private origin access; Application Gateway WAF v2 provides regional
      routing, probes, TLS policy, and backend isolation.
    negative: Direct public origin reachability, WAF detection-only mode without approval, mismatched TLS name, or health
      probe that bypasses application readiness must fail.
    evidence: Preserve profile and gateway projections, WAF policy mapping, origin restrictions, TLS settings, probe results,
      and negative-request evidence.
    failure: Multiple healthy routing layers can still expose an origin directly or block legitimate clinical requests through
      inconsistent policy.
    retry: Correct the narrow WAF, certificate, host-header, or origin issue and replay the same positive and negative requests.
    cleanup: Remove only run-owned custom domains or test routes; never disable shared WAF protections.
    waf: 'Reliability: layered health probes and zone-resilient regional routing prevent failed instances from receiving traffic.'
  - title: Validate private load balancing and explicit egress
    requirement: LAB25-REQ-04
    command: Get-AzLoadBalancer -ResourceGroupName $ResourceGroupName -Name $InternalLoadBalancerName | Select-Object Name,
      Sku, FrontendIpConfigurations, BackendAddressPools, LoadBalancingRules, Probes
    positiveCommand: $lb = Get-AzLoadBalancer -ResourceGroupName $ResourceGroupName -Name $InternalLoadBalancerName; if ($lb.Sku.Name
      -ne 'Standard' -or -not $lb.Probes) { throw 'The internal load balancer is not Standard or has no probe.' }
    negativeCommand: $subnet = (Get-AzVirtualNetwork -ResourceGroupName $ResourceGroupName -Name $SpokeVnetName).Subnets |
      Where-Object Name -eq $ApplicationSubnetName; if (-not $subnet.NatGateway -and -not $ApprovedFirewallEgressRoute) {
      throw 'The application subnet lacks explicit outbound connectivity.' }
    expected: Standard Load Balancer distributes private TCP traffic with HA Ports only where justified, while NAT Gateway
      or inspected firewall egress provides stable outbound addresses and scale.
    negative: Basic Load Balancer, implicit default outbound access, shared inbound rule for egress, exhausted SNAT ports,
      or probe mismatch must fail.
    evidence: Save SKU, frontends, pools, rules, probes, outbound design, SNAT calculation, and degraded-mode capacity.
    failure: Inbound distribution can remain healthy while outbound connections intermittently fail from SNAT exhaustion.
    retry: Correct explicit egress or port allocation and replay the connection-scale scenario.
    cleanup: Delete only run-owned analogue rules and IPs after exact ownership checks; retain shared NAT and firewall resources.
    waf: 'Performance Efficiency: explicit egress sizing and appropriate layer-four distribution sustain connection volume
      predictably.'
  - title: Verify end-to-end routes and failure behavior
    requirement: LAB25-REQ-05
    command: $networkWatcher = Get-AzNetworkWatcher -ResourceGroupName $ResourceGroupName -Name $NetworkWatcherName; Test-AzNetworkWatcherIPFlow
      -NetworkWatcher $networkWatcher -TargetVirtualMachineId $SourceVmId -Direction Outbound -Protocol TCP -LocalIPAddress
      $SourceIp -LocalPort 50000 -RemoteIPAddress $DestinationIp -RemotePort 443
    positiveCommand: $networkWatcher = Get-AzNetworkWatcher -ResourceGroupName $ResourceGroupName -Name $NetworkWatcherName;
      $allow = Test-AzNetworkWatcherIPFlow -NetworkWatcher $networkWatcher -TargetVirtualMachineId $SourceVmId -Direction
      Outbound -Protocol TCP -LocalIPAddress $SourceIp -LocalPort 50000 -RemoteIPAddress $ApprovedDestinationIp -RemotePort
      443; if ($allow.Access -ne 'Allow') { throw 'The required clinical flow is denied.' }
    negativeCommand: $networkWatcher = Get-AzNetworkWatcher -ResourceGroupName $ResourceGroupName -Name $NetworkWatcherName;
      $deny = Test-AzNetworkWatcherIPFlow -NetworkWatcher $networkWatcher -TargetVirtualMachineId $SourceVmId -Direction Outbound
      -Protocol TCP -LocalIPAddress $SourceIp -LocalPort 50000 -RemoteIPAddress $DisallowedDestinationIp -RemotePort 22; if
      ($deny.Access -ne 'Deny') { throw 'A prohibited administrative flow is allowed.' }
    expected: Required flows traverse the intended WAF, firewall, or load-balancer path; prohibited flows are denied; zone
      and origin failure route only to healthy targets.
    negative: A required allow with unintended bypass, a denied health probe, a permitted prohibited flow, or asymmetric return
      path must fail.
    evidence: Archive effective route and IP-flow results, hop intent, probe health, failover timing, and identifying rule
      names.
    failure: Passing reachability without verifying the enforcing rule and path can conceal accidental exposure.
    retry: Isolate DNS, route, NSG, firewall, probe, and backend health one layer at a time, then repeat exact flows.
    cleanup: Remove diagnostic exports and run-owned synthetic endpoints; network-watcher tests create no persistent resource.
    waf: 'Cost Optimization: the selected managed controls consolidate policy while avoiding duplicate appliances at every
      spoke.'
  changeRequest: Clinical security now requires outbound allowlisting by FQDN and TLS inspection for update traffic, but one
    vendor uses certificate pinning and cannot tolerate interception.
  challenge: Revise firewall policy, routes, exception scope and expiry, logging, certificate governance, and negative tests
    while preventing a broad bypass for the pinned vendor.
  troubleshooting:
  - If IP flow verification differs from observed traffic, verify NIC, direction, source address, effective routes, and stateful
    return path.
  - If Front Door and Application Gateway disagree on health, compare probe path, host header, certificate name, status code,
    and timeout independently.
  - If outbound connections fail intermittently, measure SNAT usage and connection reuse before increasing frontend addresses.
  architectureAnalysis:
    permissions: Front Door, Application Gateway, Firewall, Load Balancer, NAT Gateway, NSG, route, and Network Watcher read
      roles support review; rule or resource changes require separate authorization.
    licensing: Premium WAF and Firewall tiers, inspection data, gateway capacity, NAT processing and addresses, logs, and
      Front Door requests contribute recurring cost.
    costNotes: Attribute global edge, regional WAF units, firewall scale, TLS inspection, outbound data, NAT ports, logs,
      and redundant-zone capacity.
    constraints:
    - Clinical ingress, east-west, and outbound traffic must remain controlled through zonal or regional component failure.
    - Outbound updates require FQDN allowlisting and TLS inspection except one certificate-pinned vendor that cannot be intercepted.
    assumptions:
    - Clinical flows have named owners, source, destination, protocol, inspection need, and failure behavior.
    - The pinned vendor endpoint can be narrowly identified and monitored without granting a broad inspection bypass.
    facts:
      data: Flow inventory covers patient-facing HTTPS, internal service paths, health probes, update destinations, logs,
        and certificate exceptions.
      scale: Gateway, firewall, and NAT capacity follow measured concurrent connections, throughput, and source-port demand.
      latency: TLS inspection and multiple traffic hops must preserve the clinical response target, which remains an owner-supplied
        value.
      availability: Global edge, zonal gateways, firewall scaling, explicit Standard Load Balancer outbound design, and NAT
        cover separate failures.
      rto: Regional ingress and egress restoration must meet the clinical service objective; no fabricated numerical RTO is
        introduced.
      rpo: Network controls do not set clinical-data RPO; connection retry must avoid duplicating state-changing requests.
      budget: Premium inspection and redundant components are limited to flows whose security and continuity classification
        requires them.
    candidateAnalyses:
    - name: Front Door Premium, Application Gateway WAF v2, Azure Firewall Premium, Standard Load Balancer, and NAT Gateway
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 5
        C3: 5
        C4: 5
        C5: 2
      rationale: Layered global, regional, east-west, and explicit outbound services provide native WAF, TLS inspection, FQDN
        policy, and failure-domain controls.
      rejectedReason: null
    - name: Traffic Manager, regional WAF gateways, NSG-only inspection, Standard Load Balancer, and NAT Gateway
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 4
        C3: 2
        C4: 4
        C5: 4
      rationale: DNS steering and NSGs lower cost but cannot provide centralized FQDN filtering or TLS inspection for outbound
        content.
      rejectedReason: The model cannot meet the new outbound inspection requirement without adding another control plane.
    - name: Front Door Standard, third-party NVAs behind Gateway Load Balancer, and centralized proxy egress
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 4
        C3: 5
        C4: 2
        C5: 2
      rationale: NVAs can deliver advanced inspection and vendor features, though appliance scaling, patching, routes, and
        support become customer responsibilities.
      rejectedReason: Equivalent controls carry greater lifecycle and routing complexity than the managed-service design.
    - name: Basic Load Balancer implicit outbound with unrestricted internet egress
      eligible: false
      disqualifiers:
      - LAB25-REQ-04 requires Standard Load Balancer with explicit outbound connectivity and governed destination policy.
      scores:
        C1: 1
        C2: 1
        C3: 1
        C4: 2
        C5: 4
      rationale: Implicit outbound and unrestricted egress avoid policy configuration but provide neither the supported availability
        baseline nor destination control.
      rejectedReason: It is ineligible because current-service and mandatory outbound requirements are unmet.
    risks:
    - risk: A broad TLS bypass for the pinned vendor can become an unmonitored exfiltration route.
      mitigation: Scope bypass to exact FQDN and flow identity, retain SNI and connection logs, and review vendor certificate
        changes.
    - risk: Centralized inspection can exhaust SNAT ports or throughput during a regional event.
      mitigation: Calculate peak concurrent flows, distribute NAT capacity, and load-test the surviving zone and regional
        path.
    waf:
      reliability: Layered health probes, zonal capacity, regional routing, and explicit outbound remove implicit traffic
        dependencies.
      security: Premium WAF, firewall FQDN policy, TLS inspection, and a narrow pinned-certificate exception enforce flow
        intent.
      costOptimization: Premium controls apply to classified clinical paths and capacity follows measured throughput and connection
        demand.
      operationalExcellence: Effective routes, rule hits, certificates, probes, NAT ports, and exception ownership form the
        network evidence set.
      performanceEfficiency: Each hop and inspection stage is measured so security does not silently consume the clinical
        latency budget.
    safeAnalogue: Evaluate synthetic flows, routes, rules, health, NAT-port, and pinned-certificate fixtures; make no network
      or policy change.
    adrConsequences:
    - The certificate-pinned vendor receives a narrowly governed TLS-inspection exception with an owner and review date.
    - Standard Load Balancer never supplies accidental outbound access; NAT and firewall routing are deliberate dependencies.
    changeExpectedRevision: Add FQDN-filtered TLS inspection and a single monitored nonintercept exception for the pinned
      vendor.
    revisedDecision:
      selectedCandidate: Front Door Premium, Application Gateway WAF v2, Azure Firewall Premium, Standard Load Balancer, and
        NAT Gateway
      mandatoryRequirementId: LAB25-REQ-02
      reason: LAB25-REQ-02 requires owned FQDN and TLS inspection policy, so the selected design adds an exact pinned-vendor
        bypass with independent logging and expiry review.
      waf:
        reliability: The vendor exception remains reachable through explicit redundant outbound paths.
        security: All other update traffic is inspected and the bypass is constrained to the exact destination.
        costOptimization: Premium inspection spend remains tied to clinical flows instead of a blanket enterprise rollout.
        operationalExcellence: Rule hits, certificates, owner, and review date make the exceptional path auditable.
        performanceEfficiency: Inspection and bypass latency are tested independently against clinical response needs.
- number: '26'
  scenario: 'Trey Research is launching a regulated consumer analytics platform in two Azure regions with no legacy application
    constraint. Customers sign in through Microsoft Entra External ID, APIs and event processors scale independently, operational
    data spans relational and document stores, global traffic must survive a regional outage, and product teams need safe
    automated delivery. Executives want high availability but require an evidence-based cost ceiling before funding production.
    Learners must integrate governance, identity, observability, data, continuity, compute, messaging, caching, networking,
    and security decisions into one coherent architecture. The supplied Bicep is deliberately only a non-production foundation
    slice for compile, lint, and subscription-level what-if: it does not provision the full platform and the lifecycle scripts
    contain no deployment command.'
  role: Lead Azure solutions architect
  outcome: Produce and validate a traceable greenfield multi-region platform design and Bicep reference that balances all
    five Well-Architected Framework pillars.
  duration: 240 minutes
  difficulty: expert
  costClass: low
  businessOutcome: Launch a secure global platform with controlled regional-failure behavior, fast product delivery, auditable
    governance, and a defensible production cost envelope.
  stakeholders:
  - Chief technology officer
  - Consumer product director
  - Data protection officer
  - Platform engineering lead
  - Site reliability engineering lead
  - FinOps lead
  primarySource:
    title: Mission-critical workload design methodology
    url: https://learn.microsoft.com/en-us/azure/well-architected/mission-critical/mission-critical-design-methodology
  candidates:
  - Active-active regional PaaS stamps behind Front Door Premium with globally coordinated data services
  - Active-passive AKS clusters with database failover and a warm secondary region
  - Single-region modular PaaS platform with cross-region backups and rebuild automation
  selected: Active-active regional PaaS stamps behind Front Door Premium with globally coordinated data services
  checkpoints:
  - title: Reconcile requirements and architecture decisions
    requirement: LAB26-REQ-01
    command: $requirements = Get-Content design/requirements.yml -Raw; $decisions = Get-Content design/decision.yml -Raw;
      if ([string]::IsNullOrWhiteSpace($requirements) -or [string]::IsNullOrWhiteSpace($decisions)) { throw 'Architecture
      inputs are empty.' }
    positiveCommand: '$text = Get-Content design/decision.yml -Raw; $requiredPillars = @(''Reliability'',''Security'',''Cost
      Optimization'',''Operational Excellence'',''Performance Efficiency''); foreach ($pillar in $requiredPillars) { if ($text
      -notmatch [regex]::Escape($pillar)) { throw "Missing WAF pillar: $pillar" } }'
    negativeCommand: $text = Get-Content design/decision.yml -Raw; if ($text -match '(?i)Azure AD B2C|Azure Cache for Redis|Basic
      Load Balancer|Log Analytics agent') { throw 'The design contains a retired or superseded default.' }
    expected: Requirements, assumptions, mandatory constraints, objective traceability, candidates, scores, risks, architecture
      decisions, and all five WAF pillars agree.
    negative: A selected service with no requirement, an unmet mandatory constraint, inconsistent RTO or RPO, or unsupported
      legacy default must fail.
    evidence: Preserve the requirement and decision hashes, traceability report, score recalculation, exception log, and architecture
      review approval.
    failure: A polished diagram can conceal contradictory decisions and unowned requirements across domains.
    retry: Resolve the smallest inconsistent decision with its stakeholder and rerun complete traceability and arithmetic
      checks.
    cleanup: Remove generated comparison output only; authoritative design sources remain tracked.
    waf: 'Operational Excellence: decision traceability turns a broad platform architecture into reviewable, owned contracts.'
  - title: Compile the multi-region Bicep reference
    requirement: LAB26-REQ-02
    command: az bicep build --file artifacts/main.bicep --stdout --only-show-errors | Out-Null
    positiveCommand: '$main = az bicep build --file artifacts/main.bicep --stdout --only-show-errors | ConvertFrom-Json; $regional
      = az bicep build --file artifacts/modules/regional-stamp.bicep --stdout --only-show-errors | ConvertFrom-Json; $global
      = az bicep build --file artifacts/modules/global-entry.bicep --stdout --only-show-errors | ConvertFrom-Json; $types
      = @($main.resources.type) + @($regional.resources.type) + @($global.resources.type); foreach ($requiredType in @(''Microsoft.Resources/resourceGroups'',''Microsoft.Cdn/profiles'',''Microsoft.ManagedIdentity/userAssignedIdentities''))
      { if ($requiredType -notin $types) { throw "Missing required resource type: $requiredType" } }; if ($main.outputs.referenceBoundary.value.productionReady
      -ne $false -or $main.outputs.referenceBoundary.value.omittedCapabilities.Count -lt 6) { throw ''The compiled foundation
      slice does not disclose its non-production boundary.'' }'
    negativeCommand: $templateText = az bicep build --file artifacts/main.bicep --stdout --only-show-errors; if ($templateText
      -match '(?i)password|clientSecret|accountKey|0\.0\.0\.0/0') { throw 'The compiled template contains a secret-like field
      or unrestricted network rule.' }
    expected: Subscription-scope Bicep compiles a bounded foundation slice with three tagged resource groups, two regional
      identity/network/empty-monitoring/storage/serverless-document/messaging scaffolds, and a disabled Front Door Standard
      endpoint; its output explicitly lists every omitted production capability.
    negative: Treating the slice as production-ready, hiding an omitted capability, embedded credentials, public data endpoints,
      or region literals outside parameters must fail.
    evidence: Save compiler output, source and parameter hashes, resource-type manifest, module dependency graph, and current-service
      guardrail results.
    failure: Individual modules can compile while cross-region outputs, scopes, identities, or dependencies remain inconsistent.
    retry: Fix the failing interface or scope and compile the root plus every module before generating a new preview.
    cleanup: Delete generated local JSON if retained; keep the Bicep source and example parameters.
    waf: 'Security: private data paths, managed identities, External ID, and secret-free outputs establish secure defaults.'
  - title: Verify foundation observability and data guardrails
    requirement: LAB26-REQ-03
    command: $template = az bicep build --file artifacts/modules/regional-stamp.bicep --stdout --only-show-errors | ConvertFrom-Json;
      $template.resources | Where-Object { $_.type -match 'diagnosticSettings|dataCollectionRules|databaseAccounts|servers/databases|backupVaults'
      } | Select-Object type, name
    positiveCommand: $template = az bicep build --file artifacts/modules/regional-stamp.bicep --stdout --only-show-errors
      | ConvertFrom-Json; if (-not ($template.resources | Where-Object type -match 'Microsoft.Insights/dataCollectionRules')
      -or -not ($template.resources | Where-Object type -match 'Microsoft.DocumentDB/databaseAccounts')) { throw 'The empty
      DCR declaration or regional serverless document-store scaffold is missing.' }
    negativeCommand: $template = az bicep build --file artifacts/modules/regional-stamp.bicep --stdout --only-show-errors
      | ConvertFrom-Json; if ($template.resources | Where-Object { $_.type -match 'databaseAccounts|servers/databases|storageAccounts'
      -and $_.properties.publicNetworkAccess -eq 'Enabled' }) { throw 'A data service permits public network access.' }
    expected: The foundation slice contains an empty DCR wired to a workspace and locked-down regional data scaffolds; DCRA,
      data sources and flows, diagnostics, alerts, backups, replication, compute, cache, private endpoints, and live recovery
      behavior are explicitly deferred to the production design.
    negative: Claiming AMA collection, global data coordination, backup, recovery, or alert coverage from these scaffold resources
      must fail.
    evidence: Preserve the resource manifest, explicit omission list, objective-to-future-signal mapping, recovery design,
      data-consistency assumptions, and cost boundaries without presenting them as deployed evidence.
    failure: Component resilience can leave the platform unavailable or inconsistent when dependency order is ignored.
    retry: Correct the missing diagnostic or continuity relationship and replay its independent positive and negative assertions.
    cleanup: Remove local compiled templates and synthetic evidence; this checkpoint changes no service.
    waf: 'Reliability: coordinated health, data, and recovery contracts protect the complete customer journey rather than
      isolated components.'
  - title: Preview cost and policy impact
    requirement: LAB26-REQ-04
    command: az deployment sub what-if --location $Location --name "lab26-$RunId" --template-file artifacts/main.bicep --parameters
      artifacts/parameters.example.json runId=$RunId expiresOn=$ExpiresOn --result-format FullResourcePayloads --only-show-errors
    positiveCommand: $preview = az deployment sub what-if --location $Location --name "lab26-$RunId" --template-file artifacts/main.bicep
      --parameters artifacts/parameters.example.json runId=$RunId expiresOn=$ExpiresOn --result-format ResourceIdOnly --output
      json --only-show-errors | ConvertFrom-Json; if (-not ($preview.changes | Where-Object changeType -in @('Create','Deploy','Modify','NoChange')))
      { throw 'What-if produced no expected platform changes.' }
    negativeCommand: $preview = az deployment sub what-if --location $Location --name "lab26-$RunId" --template-file artifacts/main.bicep
      --parameters artifacts/parameters.example.json runId=$RunId expiresOn=$ExpiresOn --result-format FullResourcePayloads
      --output json --only-show-errors | ConvertFrom-Json; if ($preview.changes | Where-Object { $_.changeType -eq 'Delete'
      -or $_.resourceId -notmatch $RunId }) { throw 'Preview contains deletion or a resource outside run ownership.' }
    expected: The reviewed what-if describes only the tagged foundation slice, reports no deletion or unrelated modification,
      exposes all three resource-group IDs for dependency-safe review, and is never followed by a deployment command.
    negative: A destructive change, production-scale tier, missing tag, undisclosed omission, unrelated resource modification,
      or any attempt to treat what-if as deployment evidence must block completion.
    evidence: Archive complete what-if output, policy results, cost estimate, reviewer disposition, and exact source and parameter
      hashes.
    failure: Cross-scope module or parameter errors can unexpectedly affect shared subscription resources.
    retry: Correct scope, tier, or policy compliance and generate a fresh preview; never waive an unexplained deletion.
    cleanup: Remove local preview output after review if it contains topology data; what-if provisions nothing.
    waf: 'Cost Optimization: the high-cost production architecture is evaluated with bounded parameters and an explicit funding
      envelope.'
  - title: Run the integrated regional-failure simulation
    requirement: LAB26-REQ-05
    command: $fixtures = Get-Content tests/fixtures/regional-failure.json -Raw | ConvertFrom-Json; $fixtures.assertions |
      Select-Object id, domain, expected, simulatedActual
    positiveCommand: $fixtures = Get-Content tests/fixtures/regional-failure.json -Raw | ConvertFrom-Json; if ($fixtures.assertions
      | Where-Object { $_.polarity -eq 'positive' -and $_.simulatedActual -ne $_.expected }) { throw 'A required platform
      behavior failed.' }
    negativeCommand: $fixtures = Get-Content tests/fixtures/regional-failure.json -Raw | ConvertFrom-Json; if ($fixtures.assertions
      | Where-Object { $_.polarity -eq 'negative' -and $_.simulatedActual -ne $_.expected }) { throw 'A prohibited platform
      behavior was observed.' }
    expected: The simulation covers identity, global routing, regional ingress, messaging, cache loss, data consistency, degraded
      capacity, alerting, business validation, recovery, and rollback.
    negative: Passing infrastructure assertions while authentication, purchase completion, data-loss, security, or cost-limit
      assertions fail must fail overall.
    evidence: Preserve the immutable fixture hash, assertion-level output, recovery timeline, architectural consequence, remediation
      owner, and retest result.
    failure: Cross-domain dependencies create emergent failures that isolated component tests do not reveal.
    retry: Correct the responsible architecture contract and rerun the same deterministic fixture before introducing another
      scenario.
    cleanup: Delete generated simulation output only; the capstone performs no deployment or live failover.
    waf: 'Performance Efficiency: degraded-mode simulation proves that surviving regional capacity protects priority journeys
      within defined limits.'
  changeRequest: A launch-market regulator now requires all customer profiles to remain in one geography, while anonymous
    catalog traffic must continue globally through a complete regional outage.
  challenge: Split customer and public data boundaries, revise External ID, routing, cache, replication, recovery, monitoring,
    and cost decisions, and update Bicep what-if evidence without weakening global catalog availability.
  troubleshooting:
  - If subscription what-if reports scope errors, inspect module target scopes and resource-group dependencies before changing
    deployment scope.
  - If a current-service assertion fails, distinguish an intentional compatibility resource from a new-design default and
    document any mandatory exception.
  - If the integrated scenario has conflicting pass results, business and security assertions take precedence over aggregate
    infrastructure health.
  architectureAnalysis:
    permissions: Architecture review uses read-only identity, policy, network, application, data, and monitoring evidence;
      the safe analogue needs only a bounded resource-group deployment role when explicitly authorized.
    licensing: Front Door Premium, regional PaaS, managed data replicas, private networking, monitoring, governance, and security
      tiers all require current regional estimates.
    costNotes: Model two regional stamps, global edge, geography-isolated profiles, anonymous catalog replicas, reserved baselines,
      burst capacity, logs, and exercises.
    constraints:
    - The launch platform needs secure global delivery, controlled regional failure, auditable governance, and a defensible
      production budget.
    - Customer profiles must remain in one geography while anonymous catalog traffic survives a complete regional outage globally.
    assumptions:
    - The application separates profile identity and personalization from anonymous catalog content at API and data layers.
    - Target regions support the selected PaaS, availability-zone, private endpoint, and monitoring capabilities.
    facts:
      data: Customer profiles are geography-bound; anonymous catalog, configuration, events, audit, and operational telemetry
        have separate distribution rules.
      scale: Global launch demand varies by market; request rate, profile volume, catalog size, and regional concurrency are
        measured sizing inputs.
      latency: Anonymous catalog uses global edge and regional stamps, while profile operations route only to their authorized
        geography.
      availability: Two regional PaaS stamps and global routing preserve catalog service; profile continuity remains inside
        its legal geography.
      rto: Catalog regional failover follows an owner-tested target; profile recovery cannot violate residency to improve
        restoration time.
      rpo: Profile replication stays within geography and catalog rebuild or replication has an independently approved freshness
        tolerance.
      budget: Active regional catalog capacity is justified by launch continuity, while profile stacks and premium features
        are scoped by market.
    candidateAnalyses:
    - name: Active-active regional PaaS stamps behind Front Door Premium with globally coordinated data services
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 5
        C3: 5
        C4: 5
        C5: 3
      rationale: PaaS stamps and Premium edge controls support independent regional release and routing while data services
        can be split by residency class.
      rejectedReason: null
    - name: Active-passive AKS clusters with database failover and a warm secondary region
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 5
        C3: 4
        C4: 2
        C5: 2
      rationale: AKS offers application portability and warm recovery but adds cluster, upgrade, policy, and capacity operations
        to launch readiness.
      rejectedReason: The platform does not need Kubernetes-specific control enough to justify its operational burden and
        slower passive activation.
    - name: Single-region modular PaaS platform with cross-region backups and rebuild automation
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 2
        C3: 5
        C4: 4
        C5: 5
      rationale: A single region lowers steady cost and keeps modules clear, but backup rebuild cannot sustain catalog traffic
        through a full regional outage.
      rejectedReason: Its recovery behavior misses the anonymous-catalog continuity outcome despite attractive economics.
    - name: One global customer-profile store replicated to every launch region
      eligible: false
      disqualifiers:
      - LAB26-REQ-01 requires mandatory residency constraints to be reconciled with the selected architecture.
      scores:
        C1: 1
        C2: 5
        C3: 1
        C4: 4
        C5: 3
      rationale: Universal profile replication simplifies failover but ignores the mandatory geography boundary.
      rejectedReason: It is ineligible because profile availability cannot override residency.
    risks:
    - risk: Anonymous responses can accidentally include profile-derived fields and enter the global cache or logs.
      mitigation: Enforce separate contracts, classify fields, and assert that global responses and telemetry contain no profile
        attributes.
    - risk: Active-active stamps can drift in policy, secret references, or feature configuration.
      mitigation: Promote immutable Bicep and configuration versions and block release when regional evidence hashes differ.
    waf:
      reliability: Independent stamps and global routing keep catalog service available through regional loss while honoring
        profile boundaries.
      security: Premium edge controls, private origins, managed identities, policy, and geography-scoped data reduce exposure.
      costOptimization: Shared global catalog capacity and market-specific profile stacks make continuity and residency spend
        attributable.
      operationalExcellence: Declarative releases, regional assertions, failover exercises, governance evidence, and rollback
        support fast controlled delivery.
      performanceEfficiency: Edge caching and regional PaaS autoscale serve anonymous demand while profile calls remain geography-local.
    safeAnalogue: Use the self-contained Bicep template only as a bounded tagged topology analogue; validate data-boundary
      and failover decisions primarily with offline fixtures.
    adrConsequences:
    - APIs and data contracts permanently separate anonymous catalog content from geography-bound customer profiles.
    - Regional releases must prove parity without copying regulated profile data across the boundary.
    changeExpectedRevision: Partition profile storage and routing by geography while leaving catalog content eligible for
      global active-active delivery.
    revisedDecision:
      selectedCandidate: Active-active regional PaaS stamps behind Front Door Premium with globally coordinated data services
      mandatoryRequirementId: LAB26-REQ-01
      reason: LAB26-REQ-01 requires mandatory constraints to drive the architecture decision, so active-active stamps split
        into geography-specific profile planes and a separate global anonymous catalog plane.
      waf:
        reliability: Anonymous catalog survives a regional loss without failing over restricted profile data unlawfully.
        security: Profile routes, stores, caches, and logs are constrained to the assigned geography.
        costOptimization: Global replication is purchased for catalog data, while profile capacity is funded per regulated
          market.
        operationalExcellence: Contract and routing assertions detect profile leakage before regional release.
        performanceEfficiency: Catalog requests use edge and nearest healthy stamp; profile calls remain within geography.
- number: '27'
  scenario: Wide World Importers is modernizing a hybrid estate that includes on-premises VMware, branch services with intermittent
    links, SQL Server databases, legacy web applications, file archives, and a growing Azure footprint. The board wants rapid
    datacenter reduction, but operations require staged coexistence, business owners need reversible waves, and regulators
    require evidence before classified data moves. Learners receive a sanitized portfolio, dependency graph, simulated performance
    captures, policy results, and failure injects. They must design a hybrid target and migration factory, express shared
    Azure foundations in Bicep, and rehearse cutover and recovery entirely offline. No Azure sign-in, query, deployment, failover,
    or external setting change is permitted in this capstone.
  role: Principal hybrid modernization architect
  outcome: Deliver an offline-validated modernization architecture, Bicep foundation, migration waves, coexistence model,
    cutover evidence, and decommission criteria spanning all AZ-305 domains.
  duration: 270 minutes
  difficulty: expert
  costClass: none
  businessOutcome: Reduce datacenter dependency through controlled modernization while maintaining branch service, regulatory
    evidence, reversibility, and transparent residual risk.
  stakeholders:
  - Chief information officer
  - Hybrid operations director
  - Business transformation lead
  - Data protection officer
  - Enterprise architecture board
  - FinOps lead
  primarySource:
    title: Prepare your organization for cloud modernization
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/modernize/prepare-organization-cloud-modernization
  candidates:
  - Dependency-wave modernization using Azure Arc, Azure Migrate patterns, managed PaaS targets, and staged coexistence
  - Parallel cloud rebuild followed by one enterprise-wide big-bang cutover
  - Indefinite hybrid retention with lifecycle-only virtual machine rehosting
  selected: Dependency-wave modernization using Azure Arc, Azure Migrate patterns, managed PaaS targets, and staged coexistence
  checkpoints:
  - title: Validate the offline evidence pack and constraints
    requirement: LAB27-REQ-01
    command: Get-ChildItem tests/fixtures -File | Sort-Object Name | Get-FileHash -Algorithm SHA256 | Select-Object Path,
      Hash
    positiveCommand: '$manifest = Get-Content tests/fixtures/manifest.json -Raw | ConvertFrom-Json; foreach ($item in $manifest.files)
      { if (-not (Test-Path $item.path)) { throw "Missing fixture: $($item.path)" }; if ((Get-FileHash $item.path -Algorithm
      SHA256).Hash -ne $item.sha256) { throw "Fixture hash mismatch: $($item.path)" } }'
    negativeCommand: $files = Get-ChildItem tests/fixtures -File -Recurse; if ($files | Select-String -Pattern '(?i)password|client_secret|account[_-]?key|[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
      | Where-Object { $_.Line -notmatch '00000000-0000-4000-8000-000000000000' }) { throw 'The offline evidence pack may
      contain sensitive or non-synthetic identifiers.' }
    expected: Every fixture is present, hash-verified, schema-valid, sanitized, time-bounded, and linked to a source, assumption,
      requirement, and scenario inject.
    negative: Missing provenance, mutable baseline, real identifier, secret-like field, or unstated unknown must fail before
      architecture work starts.
    evidence: Preserve the manifest verification output, schema report, sanitization report, assumptions, and accepted evidence
      limitations.
    failure: Decisions based on incomplete or altered evidence cannot be reproduced or safely generalized to the real estate.
    retry: Restore the canonical fixture or explicitly version the corrected evidence pack, then rerun all integrity checks.
    cleanup: Delete only generated verification output; canonical fixtures remain unchanged.
    waf: 'Security: sanitization and integrity controls make offline analysis safe without weakening evidence provenance.'
  - title: Rationalize the portfolio and hybrid coexistence model
    requirement: LAB27-REQ-02
    command: $portfolio = Import-Csv tests/fixtures/portfolio.csv; $portfolio | Group-Object wave, disposition | Sort-Object
      Name | Select-Object Name, Count
    positiveCommand: $portfolio = Import-Csv tests/fixtures/portfolio.csv; $allowed = @('rehost','replatform','refactor','repurchase','retain','retire');
      if ($portfolio | Where-Object { $_.disposition -notin $allowed -or [string]::IsNullOrWhiteSpace($_.wave) -or [string]::IsNullOrWhiteSpace($_.owner)
      }) { throw 'A portfolio record lacks a valid disposition, wave, or owner.' }
    negativeCommand: $portfolio = Import-Csv tests/fixtures/portfolio.csv; $dependencies = Import-Csv tests/fixtures/dependencies.csv;
      $waveById = @{}; $portfolio | ForEach-Object { $waveById[$_.applicationId] = [int]$_.wave }; if ($dependencies | Where-Object
      { $_.criticality -eq 'hard' -and [math]::Abs($waveById[$_.sourceApplicationId] - $waveById[$_.targetApplicationId])
      -gt 0 -and -not $_.coexistenceBridge }) { throw 'A hard dependency is split without a coexistence bridge.' }
    expected: Each workload has a justified disposition, dependency-safe wave, target concept, coexistence bridge, readiness
      remediation, rollback, decommission gate, and owner.
    negative: A big-bang sequence, unsupported rehost, classified move without evidence, or permanent hybrid bridge without
      retirement criteria must fail.
    evidence: Save the scored portfolio, dependency clusters, wave capacity, rationalization ADRs, coexistence contracts,
      and residual hybrid cost.
    failure: A technically sensible target can fail when dependency timing and operational coexistence are omitted.
    retry: Regroup the smallest affected dependency cluster and recompute wave value, risk, capacity, and cost.
    cleanup: Delete generated grouping output; retain the authoritative sanitized portfolio and decision history.
    waf: 'Cost Optimization: explicit disposition and bridge retirement avoid migrating waste or funding hybrid connectivity
      indefinitely.'
  - title: Compile and inspect the hybrid foundation
    requirement: LAB27-REQ-03
    command: bicep build artifacts/main.bicep --stdout | Out-Null
    positiveCommand: '$main = bicep build artifacts/main.bicep --stdout | ConvertFrom-Json; $foundation = bicep build artifacts/modules/hybrid-foundation.bicep
      --stdout | ConvertFrom-Json; $types = @($main.resources.type) + @($foundation.resources.type); $requiredTypes = @(''Microsoft.Resources/resourceGroups'',''Microsoft.Network/virtualNetworks'',''Microsoft.OperationalInsights/workspaces'',''Microsoft.Insights/dataCollectionRules'');
      foreach ($type in $requiredTypes) { if ($type -notin $types) { throw "Missing hybrid-foundation resource type: $type"
      } }'
    negativeCommand: $templateText = bicep build artifacts/main.bicep --stdout; if ($templateText -match '(?i)password|clientSecret|accountKey|Basic_LoadBalancer|OmsAgentForLinux|0\.0\.0\.0/0')
      { throw 'The offline template contains a secret, retired default, or unrestricted rule.' }
    expected: Bicep compiles offline and illustrates tagged resource-group, network, private-DNS, identity, workspace, and
      empty-DCR declarations plus a DoNotEnforce policy assignment; outputs explicitly separate the untaggable policy assignment,
      and no DCRA, diagnostic setting, deployment, or live behavior is claimed.
    negative: A secret, tenant-specific identifier, legacy monitoring agent, Basic Load Balancer, implicit outbound dependency,
      hidden untaggable resource, shared-resource deletion, or suggestion that the compile-only template was deployed must
      fail.
    evidence: Preserve Bicep and parameter hashes, compiler output, resource manifest, module graph, rule results, and requirement
      traceability.
    failure: A valid template can still encode unsafe migration assumptions or reference an unavailable shared platform output.
    retry: Correct the module contract or safe default and rerun compilation plus all semantic assertions offline.
    cleanup: Delete compiled JSON if retained; keep source and example parameters. No deployment is permitted.
    waf: 'Operational Excellence: a repeatable foundation contract separates shared platform readiness from workload cutover.'
  - title: Simulate migration, continuity, and security injects
    requirement: LAB27-REQ-04
    command: $scenarios = Get-Content tests/fixtures/failure-scenarios.json -Raw | ConvertFrom-Json; $scenarios | Select-Object
      id, wave, inject, expectedDecision, maximumDecisionMinutes
    positiveCommand: $scenarios = Get-Content tests/fixtures/failure-scenarios.json -Raw | ConvertFrom-Json; if ($scenarios
      | Where-Object { -not $_.expectedDecision -or $_.simulatedDecisionMinutes -gt $_.maximumDecisionMinutes -or $_.businessAssertion
      -ne 'pass' }) { throw 'A required migration or continuity behavior failed.' }
    negativeCommand: $scenarios = Get-Content tests/fixtures/failure-scenarios.json -Raw | ConvertFrom-Json; if ($scenarios
      | Where-Object { $_.prohibitedOutcomeObserved -or $_.containsAutomaticPurge -or $_.rollbackAuthority -eq $null }) {
      throw 'A prohibited outcome, purge action, or unowned rollback was detected.' }
    expected: Deterministic injects cover discovery loss, circuit failure, replication lag, corrupt recovery points, policy
      denial, identity outage, cutover overrun, data mismatch, and rollback.
    negative: Continuing after a mandatory gate, claiming success on infrastructure health alone, automatic purge, or accepting
      an unowned rollback decision must fail.
    evidence: Archive immutable scenario hashes, timestamped decisions, independent assertions, predicted RTO and RPO, rollback
      results, and remediation owners.
    failure: Migration and continuity plans often diverge at the exact moment connectivity, identity, data, and decision authority
      interact.
    retry: Correct the architecture or runbook contract and replay the identical fixture before varying any scenario input.
    cleanup: Delete generated result files only; simulation performs no sign-in, query, migration, failover, or cloud mutation.
    waf: 'Reliability: cross-domain injects prove reversible wave behavior under realistic correlated failures.'
  - title: Run the offline release and decommission review
    requirement: LAB27-REQ-05
    command: $commands = Get-Command -Module Az.Accounts,Az.Resources,Az.Network,Az.Monitor -ErrorAction Stop; $commands |
      Group-Object ModuleName | Select-Object Name, Count
    positiveCommand: $report = Get-Content tests/fixtures/release-report.json -Raw | ConvertFrom-Json; if ($report.status
      -ne 'offline-validated' -or $report.lastLiveVerified -ne $null -or ($report.assertions | Where-Object result -ne 'pass'))
      { throw 'The capstone is not fully offline validated.' }
    negativeCommand: $report = Get-Content tests/fixtures/release-report.json -Raw | ConvertFrom-Json; if ($report.claims
      | Where-Object { $_ -match '(?i)deployed|live verified|production tested' }) { throw 'The offline report overclaims
      live verification.' }
    expected: The package passes schema, Bicep, traceability, source, decision, scenario, security, cost, recovery, portability,
      and cleanup-plan checks and reports only offline validation.
    negative: Missing assertion evidence, a live-verification claim, vague decommission criteria, uncertain ownership, or
      irreversible purge instruction must fail release.
    evidence: Preserve the release report, tool versions, source hashes, assertion summary, known gaps, residual risks, and
      architecture-board disposition.
    failure: A complete-looking document set can overstate readiness or leave duplicated systems and costs with no exit gate.
    retry: Correct the failing artifact, rerun the entire deterministic offline gate, and retain the previous failed report.
    cleanup: Remove generated output and temporary copies only; never automate source-system purge or cloud-resource deletion.
    waf: 'Performance Efficiency: explicit modernization and decommission gates retire constrained legacy capacity only after
      target behavior is evidenced.'
  changeRequest: A merger adds a second tenant, a separately regulated geography, and a hard requirement to keep branch order
    capture working for eight hours without WAN connectivity.
  challenge: Revise identity boundaries, management groups, data residency, edge synchronization, conflict resolution, migration
    waves, recovery targets, Bicep parameters, cost, and offline failure scenarios without inventing live evidence.
  troubleshooting:
  - If a fixture integrity check fails, restore or explicitly version the fixture; never update the manifest hash merely to
    silence the test.
  - If Bicep inspection misses a nested resource, inspect compiled nested resources recursively before weakening the requirement.
  - If an offline scenario cannot prove a live property, record it as a required future live-validation gate rather than fabricating
    a pass.
  architectureAnalysis:
    permissions: No Azure or Graph role is needed for the capstone simulation; real discovery would use separately approved
      read-only inventory across both tenants and hybrid resources.
    licensing: Azure Arc, migration tooling, managed PaaS, connectivity, edge databases, governance, and dual-tenant operations
      require workload-specific estimates.
    costNotes: Compare coexistence, branch edge capacity, two tenant landing zones, data transfer, modernization waves, licenses,
      rollback retention, and retired datacenter cost.
    constraints:
    - Modernization must preserve branch service, regulatory evidence, reversibility, and transparent residual risk.
    - A merger adds a second tenant and regulated geography, and branch order capture must work for eight hours without WAN
      connectivity.
    assumptions:
    - Branch applications can persist orders locally with stable identifiers and synchronize through an idempotent contract.
    - Tenant and geography ownership can be assigned before a workload enters a modernization wave.
    facts:
      data: Orders, product reference data, identities, dependency records, Arc inventory, migration evidence, and regulatory
        classifications cross distinct boundaries.
      scale: Branch count, order rate, eight-hour offline volume, application dependencies, and tenant split are measured
        in the supplied portfolio.
      latency: Local order capture remains responsive without WAN; synchronization latency is measured after connectivity
        returns.
      availability: Branch edge operation covers an eight-hour WAN loss while Azure regions, tenants, and datacenters remain
        separate failure domains.
      rto: Branch capture has effectively immediate local continuity; centralized reconciliation recovery follows an owner-approved
        target.
      rpo: Accepted offline orders require zero local loss before synchronization, with conflict resolution for updates from
        both sides.
      budget: Edge capacity and dual-tenant governance are funded where they reduce outage and regulatory risk; indefinite
        datacenter retention is not free.
    candidateAnalyses:
