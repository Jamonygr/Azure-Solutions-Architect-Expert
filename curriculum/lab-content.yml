# Authoritative authored content assembled from reviewed domain and architecture-analysis fragments.
# Run tools/merge_lab_content.py --check to detect drift.
schemaVersion: 1.0.0
labs:
- number: '00'
  scenario: An architecture team needs a repeatable safety envelope before evaluating any Azure solution. Build an offline-first
    operating contract that validates tools, captures intended context without signing in, previews cost and permission gates,
    writes recovery state before a potential change, and proves cleanup ownership. The result must work with both Azure CLI
    and Azure PowerShell while keeping every live operation behind explicit switches.
  role: Lead cloud solutions architect
  outcome: A reusable safety contract that makes every later architecture exercise observable, recoverable, and deny-by-default.
  duration: 90 minutes
  difficulty: foundational
  costClass: none
  businessOutcome: Reduce accidental cloud changes and make architecture experiments reproducible and independently auditable.
  stakeholders:
  - Platform engineering
  - Security operations
  - FinOps
  - Architecture review board
  primarySource:
    title: Azure Well-Architected Framework
    url: https://learn.microsoft.com/en-us/azure/well-architected/
  candidates:
  - Manual operator checklist without persisted state
  - Shared bootstrap contract with immutable run state and explicit execution gates
  - Central automation account that executes every lab on behalf of learners
  selected: Shared bootstrap contract with immutable run state and explicit execution gates
  checkpoints:
  - title: Verify the offline tool contract
    requirement: LAB00-REQ-01
    command: pwsh ./scripts/dual-bootstrap/Preflight.ps1 -RunId demo-000001
    positiveCommand: pwsh -NoProfile -Command "$PSVersionTable.PSVersion.ToString()"
    negativeCommand: pwsh -NoProfile -Command "if (Get-Module -ListAvailable Microsoft.Graph.Beta*) { exit 1 }"
    expected: Required command families and pinned versions are reported without contacting Azure or Microsoft Graph.
    negative: No beta Graph module or unregistered executable is accepted.
    evidence: Local version output and registry validation results.
    failure: A required executable is absent or differs from the frozen compatible version.
    retry: Rebuild the pinned development container and repeat the local check.
    cleanup: No cloud object exists; remove only the run-specific local state after review.
    waf: Operational Excellence creates a reproducible operator baseline and Security excludes unsupported modules.
  - title: Declare intended context without authentication
    requirement: LAB00-REQ-02
    command: pwsh ./scripts/dual-bootstrap/Setup.ps1 -SubscriptionId 00000000-0000-0000-0000-000000000305 -TenantId 00000000-0000-0000-0000-000000000306
      -RunId demo-000001
    positiveCommand: pwsh -NoProfile -Command "Test-Path .state/demo-000001/run.json"
    negativeCommand: pwsh -NoProfile -Command "if (Test-Path .state/demo-000001/token.json) { exit 1 }"
    expected: Synthetic intended identifiers are recorded in run state before any execution path is considered.
    negative: No token, credential, account lookup, or implicit sign-in occurs.
    evidence: Schema-valid run.json with execute false and no sensitive fields.
    failure: Input identifiers are malformed or the state directory cannot be written.
    retry: Correct the synthetic input and rerun Setup with the same RunId.
    cleanup: Retain the state through validation, then remove it only after the exercise is reviewed.
    waf: Security separates intent from authenticated context and Reliability preserves recovery metadata.
  - title: Evaluate cost and tenant-change gates
    requirement: LAB00-REQ-03
    command: pwsh ./scripts/dual-bootstrap/Validate.ps1 -RunId demo-000001 -Mode Deployment
    positiveCommand: pwsh -NoProfile -Command "(Get-Content .state/demo-000001/run.json -Raw | ConvertFrom-Json).execute -eq
      $false"
    negativeCommand: pwsh -NoProfile -Command "if ($env:AZ305_ACKNOWLEDGE_COST -eq 'true') { exit 1 }"
    expected: Preview records which acknowledgements a later lab would require and performs no billable action.
    negative: Environment fallbacks do not silently convert a preview into execution.
    evidence: Independent positive and negative assertions in validation.json.
    failure: An acknowledgement is required but absent for an explicitly requested execution.
    retry: Review the cost and tenant scope, then supply acknowledgements only in an authorized environment.
    cleanup: No billable resource is created by this checkpoint.
    waf: Cost Optimization makes spend consent explicit and Security makes tenant changes independently explicit.
  - title: Prove state-before-mutation ordering
    requirement: LAB00-REQ-04
    command: pwsh -NoProfile -Command "Get-Content .state/demo-000001/run.json -Raw | ConvertFrom-Json | Select-Object status,createdAt"
    positiveCommand: pwsh -NoProfile -Command "(Get-Item .state/demo-000001/run.json).Length -gt 0"
    negativeCommand: pwsh -NoProfile -Command "if (Test-Path .state/demo-000001/cloud-call.started) { exit 1 }"
    expected: The recovery record exists, validates, and predates the first possible mutation boundary.
    negative: A failed or partial run can never lack the identifiers required for recovery.
    evidence: File timestamp, schema result, and ordered operation log.
    failure: State serialization fails before the guarded execution branch.
    retry: Repair local filesystem permissions; do not cross the execution boundary.
    cleanup: Preserve failed state until recovery decisions are complete.
    waf: Reliability supports partial-failure recovery and Operational Excellence makes ordering testable.
  - title: Exercise ownership-aware cleanup
    requirement: LAB00-REQ-05
    command: pwsh ./scripts/dual-bootstrap/Cleanup.ps1 -RunId demo-000001
    positiveCommand: pwsh ./scripts/dual-bootstrap/Validate.ps1 -RunId demo-000001 -Mode PostCleanup
    negativeCommand: pwsh -NoProfile -Command "if ((Get-Content .state/demo-000001/cleanup.json -Raw | ConvertFrom-Json).activeManagedObjects
      -ne 0) { exit 1 }"
    expected: Previewed dependency order and exact ownership checks produce a post-cleanup record with no active managed object.
    negative: Cleanup refuses any object whose ID or required ownership tag is absent or mismatched.
    evidence: Schema-valid cleanup.json and PostCleanup validation.json.
    failure: Ownership cannot be proven or a dependency cannot be safely removed.
    retry: Reconcile state against authoritative IDs; never broaden discovery or automate purge.
    cleanup: Delete only proven objects in reverse dependency order; local state remains as the audit record.
    waf: Security prevents collateral deletion and Reliability makes cleanup idempotent.
  changeRequest: Security now requires all labs to run from an isolated build worker. Revise the decision toward the shared
    bootstrap contract because its offline registries, state-first sequence, and explicit gates can be reproduced without
    tenant access.
  challenge: Explain which evidence proves preview mode is safe when a learner has active credentials in the host environment.
  troubleshooting:
  - Verify that the RunId contains only lowercase letters, digits, and hyphens.
  - Confirm state files are created beneath the copied lab rather than a shared repository location.
  - Use the pinned container when a host tool version does not match the frozen registry.
  architectureAnalysis:
    permissions: No Azure role is needed; the exercise reads local registries and creates state only beneath the copied lab.
    licensing: No Azure service license is used because every checkpoint is an offline bootstrap-contract exercise.
    costNotes: The lab has no cloud consumption; only local container compute and repository storage contribute cost.
    constraints:
    - The bootstrap must write run state before any command that could mutate an external system.
    - Design-simulation mode must refuse every Azure or Microsoft Graph request, even when Execute is supplied.
    assumptions:
    - The learner runs the copied lab inside the frozen dev container with no cached Azure context.
    - Synthetic run identifiers are sufficient to exercise validation, recovery, and cleanup behavior.
    facts:
      data: Inputs and outputs are synthetic JSON documents; secrets, tokens, tenant identifiers, and live evidence are prohibited.
      scale: The contract supports one isolated state directory per RunId and all twenty-eight fixed lab identifiers.
      latency: No service-response target applies; state persistence must complete synchronously before a mutation adapter
        can be called.
      availability: Bootstrap availability depends only on the copied lab files and frozen container, not on Azure or network
        reachability.
      rto: Recovery from an interrupted preview is immediate after reopening the persisted run document; no cloud recovery
        objective applies.
      rpo: The recoverability target is zero lost recorded mutations because every returned identifier must be persisted immediately.
      budget: Cloud spend is zero and the design does not expose a cost-acknowledgement path that can provision a resource.
    candidateAnalyses:
    - name: Shared bootstrap contract with immutable run state and explicit execution gates
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 5
        C3: 5
        C4: 4
        C5: 4
      rationale: A state-first contract gives every copied lab the same recoverable boundary while explicit execution and
        acknowledgement gates remain locally testable.
      rejectedReason: null
    - name: Manual operator checklist without persisted state
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 2
        C3: 3
        C4: 2
        C5: 5
      rationale: A checklist is inexpensive and readable but cannot prove mutation ordering or recover after a partially completed
        command.
      rejectedReason: Its low recovery and operating scores leave no machine-verifiable record of returned identifiers.
    - name: Central automation account that executes every lab on behalf of learners
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 4
        C3: 2
        C4: 4
        C5: 2
      rationale: Central execution can standardize runs, but it introduces a privileged shared identity and a runtime dependency
        on external automation.
      rejectedReason: The shared privilege boundary conflicts with isolated self-paced operation and adds an unnecessary control
        plane.
    - name: Untracked shell snippets with implicit cached credentials
      eligible: false
      disqualifiers:
      - LAB00-REQ-01 requires explicit validated inputs and durable state before any potential mutation.
      scores:
        C1: 1
        C2: 1
        C3: 1
        C4: 2
        C5: 5
      rationale: Ad hoc snippets may be quick to type but neither establish ownership nor bind activity to the requested tenant,
        subscription, and run.
      rejectedReason: The candidate is ineligible because it violates the state-first mandatory boundary.
    risks:
    - risk: A malformed or reused RunId could merge evidence from unrelated exercises.
      mitigation: Validate the RunId pattern and isolate every artifact beneath the exact run directory before command evaluation.
    - risk: A future author could add a cloud command to a simulation checkpoint.
      mitigation: Parse command surfaces in CI and force design-simulation lifecycle scripts to exit before context discovery.
    waf:
      reliability: Atomic state replacement and resumable status values preserve an intelligible recovery point after interruption.
      security: Explicit tenant and subscription inputs eliminate reliance on cached identity context and sensitive fields
        are recursively rejected.
      costOptimization: An offline simulation produces the required evidence without standing cloud resources or idle automation
        accounts.
      operationalExcellence: One lifecycle contract, fixed exit codes, and schema-validated artifacts make faults reproducible
        across copied labs.
      performanceEfficiency: Local registry lookups and bounded JSON files avoid network latency and scale work only with
        the current run.
    safeAnalogue: Exercise state creation, injected failure, validation, and idempotent cleanup entirely against synthetic
      fixtures in the copied lab.
    adrConsequences:
    - Every lab carries duplicated lifecycle helpers so portability is favored over reducing repository line count.
    - Authors must evolve schemas and generators together whenever the public run contract changes.
    changeExpectedRevision: Prove that the chosen bootstrap remains self-contained on an isolated worker and remove any dependency
      on tenant discovery.
    revisedDecision:
      selectedCandidate: Shared bootstrap contract with immutable run state and explicit execution gates
      mandatoryRequirementId: LAB00-REQ-01
      reason: LAB00-REQ-01 now requires isolated-worker reproducibility, which the local registries, persisted state, and
        pre-context simulation gate satisfy without tenant access.
      waf:
        reliability: The isolated worker can resume from the same run artifact after process loss.
        security: Removing cached-context discovery narrows the trust boundary to explicit inputs and local files.
        costOptimization: No central worker service or cloud resource must remain allocated between exercises.
        operationalExcellence: The frozen container becomes the single repeatable execution surface for release validation.
        performanceEfficiency: Dependency checks execute locally and avoid remote discovery round trips.
- number: '01'
  scenario: Contoso Retail has acquired two regional brands whose Azure resources emit platform logs, application telemetry,
    and security events into unrelated destinations. Operations cannot correlate an incident across subscriptions, while the
    security team requires immutable export of selected control-plane records and regional teams need bounded access to their
    own data. You are the lead solutions architect. Design a centralized logging platform that uses Azure Monitor Agent, data
    collection rules and associations, resource diagnostic settings, and deliberate retention rather than a legacy agent.
    The design must limit duplicate ingestion, preserve data sovereignty, expose routing evidence through commands, and separate
    collection architecture from the alerting decisions owned by Lab 02.
  role: Lead cloud solutions architect
  outcome: A defensible centralized collection and routing design with independently verifiable destinations and no legacy
    monitoring agent.
  duration: 150 minutes
  difficulty: advanced
  costClass: moderate
  businessOutcome: Reduce incident investigation time while giving security and regional operators governed access to complete,
    correctly routed telemetry.
  stakeholders:
  - Security operations
  - Regional platform teams
  - Data protection officer
  - FinOps
  primarySource:
    title: Diagnostic settings in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings
  candidates:
  - Central Log Analytics workspace with DCR-based collection and archive export
  - Regional workspaces with cross-workspace queries and policy-driven routing
  - Dedicated workspace per workload with independent retention and access
  selected: Regional workspaces with cross-workspace queries and policy-driven routing
  checkpoints:
  - title: Establish regional workspace boundaries
    requirement: LAB01-REQ-01
    command: az monitor log-analytics workspace create --resource-group $ResourceGroup --workspace-name $WorkspaceName --location
      $Location --retention-time 30 --tags purpose=az305-lab labId=LAB-01 runId=$RunId expiresOn=$ExpiresOn
    positiveCommand: az monitor log-analytics workspace show --resource-group $ResourceGroup --workspace-name $WorkspaceName
      --query "{name:name,location:location,retention:retentionInDays}" -o json
    negativeCommand: az monitor log-analytics workspace list --resource-group $ResourceGroup --query "[?name!='$WorkspaceName'].name"
      -o tsv
    expected: The workspace is in the approved data boundary with thirty-day interactive retention and ownership tags.
    negative: No unapproved workspace is selected as a destination for this run.
    evidence: Sanitized workspace name, region, retention, and resource ID.
    failure: A conflicting regional residency rule or unavailable workspace SKU blocks the chosen topology.
    retry: Re-evaluate the approved region and pricing tier, retain the same RunId, and preview before execution.
    cleanup: Remove diagnostic settings and DCR associations before deleting the workspace.
    waf: 'Reliability: regional telemetry boundaries remain available and supportable during an incident.'
  - title: Define an Azure Monitor Agent data collection rule
    requirement: LAB01-REQ-02
    command: az monitor data-collection rule create --resource-group $ResourceGroup --location $Location --name $DcrName --rule-file
      artifacts/dcr.json --tags purpose=az305-lab labId=LAB-01 runId=$RunId expiresOn=$ExpiresOn
    positiveCommand: az monitor data-collection rule show --resource-group $ResourceGroup --name $DcrName --query "{streams:dataFlows[].streams,destinations:destinations.logAnalytics[].name}"
      -o json
    negativeCommand: az monitor data-collection rule show --resource-group $ResourceGroup --name $DcrName --query "dataSources.extensions[?name=='LegacyAgent']"
      -o json
    expected: The DCR maps only the required streams to a named Log Analytics destination.
    negative: No legacy Log Analytics agent or unapproved stream is represented in the rule.
    evidence: DCR resource ID, stream names, destinations, and source file hash.
    failure: A stream name is incompatible with the selected data source or destination.
    retry: Correct artifacts/dcr.json against the current DCR schema and rerun the preview.
    cleanup: Delete all DCR associations before deleting the DCR.
    waf: 'Performance Efficiency: filtering noisy streams near the source protects ingestion and query capacity.'
  - title: Associate the rule with an explicit resource scope
    requirement: LAB01-REQ-03
    command: az monitor data-collection rule association show --name $AssociationName --resource $TargetResourceId --query
      "{name:name,dcr:dataCollectionRuleId}" -o json --only-show-errors
    positiveCommand: az monitor data-collection rule association show --name $AssociationName --resource $TargetResourceId
      --query "{name:name,dcr:dataCollectionRuleId}" -o json
    negativeCommand: az monitor data-collection rule association list --resource $TargetResourceId --query "[?dataCollectionRuleId!='$DcrId'].name"
      -o tsv
    expected: The target has one intentional association to the approved DCR.
    negative: The target is not simultaneously associated with a competing lab DCR.
    evidence: Target resource ID, association name, and DCR ID without host or user data.
    failure: The target resource type, region, or authorization scope does not support the association.
    retry: Confirm the exact target ID and regional compatibility, then recreate only the missing association.
    cleanup: Delete the association before its DCR or target resource.
    waf: 'Security: explicit DCR associations limit collection to approved assets and destinations.'
  - title: Route resource logs with diagnostic settings
    requirement: LAB01-REQ-04
    command: az monitor diagnostic-settings show --name $DiagnosticSettingName --resource $TargetResourceId --query "{workspace:workspaceId,logs:logs[?enabled].categoryGroup,metrics:metrics[?enabled].category}"
      -o json --only-show-errors
    positiveCommand: az monitor diagnostic-settings show --name $DiagnosticSettingName --resource $TargetResourceId --query
      "{workspace:workspaceId,logs:logs[?enabled].categoryGroup,metrics:metrics[?enabled].category}" -o json
    negativeCommand: az monitor diagnostic-settings show --name $DiagnosticSettingName --resource $TargetResourceId --query
      "{eventHub:eventHubAuthorizationRuleId,storage:storageAccountId}" -o json
    expected: Supported log categories and metrics route to the intended regional workspace.
    negative: Event Hubs or storage are not silently configured as extra destinations.
    evidence: Diagnostic-setting name, enabled categories, destination IDs, and export mode.
    failure: The chosen category group is unsupported by the resource provider.
    retry: Query diagnostic categories, update the design artifact, and apply the smallest corrected setting.
    cleanup: Delete the diagnostic setting before deleting either source or destination.
    waf: 'Operational Excellence: diagnostic settings create a repeatable routing contract that teams can inspect.'
  - title: Validate retention and archive economics
    requirement: LAB01-REQ-05
    command: az monitor log-analytics workspace table list --resource-group $ResourceGroup --workspace-name $WorkspaceName
      --query "[].{table:name,retention:retentionInDays,totalRetention:totalRetentionInDays}" -o json
    positiveCommand: az monitor log-analytics workspace table show --resource-group $ResourceGroup --workspace-name $WorkspaceName
      --name AzureActivity --query "{retention:retentionInDays,totalRetention:totalRetentionInDays}" -o json
    negativeCommand: az monitor log-analytics workspace table list --resource-group $ResourceGroup --workspace-name $WorkspaceName
      --query '[?retentionInDays > `30` && name != ''SecurityEvent''].name' -o tsv
    expected: Interactive and total retention match the documented use case for each reviewed table.
    negative: High-volume tables do not inherit unjustified extended interactive retention.
    evidence: Table-level retention summary and a synthetic monthly-ingestion estimate.
    failure: Workspace defaults obscure a table-specific compliance or cost requirement.
    retry: Recalculate retention by evidence class and update only the affected table plan.
    cleanup: Export required sanitized evidence before removing the workspace; never retain customer log data.
    waf: 'Cost Optimization: table-level retention aligns searchable and archived data with its continuing value.'
  changeRequest: A new regulator requires security control-plane records to remain in-region for seven years while application
    traces must stay searchable for only thirty days; revise routing and retention without duplicating every stream.
  challenge: Defend whether a central security workspace plus regional operations workspaces is preferable to the selected
    topology after the regulator change.
  troubleshooting:
  - Confirm the provider exposes a diagnostic category group before referencing allLogs.
  - Check DCR stream-to-destination mappings when an association exists but data is absent.
  - Investigate duplicate diagnostic settings and overlapping DCRs before increasing retention or ingestion capacity.
  architectureAnalysis:
    permissions: Reader plus Log Analytics Reader is sufficient for inspection; an authorized deployment separately needs
      rights to create workspaces, DCRs, DCR associations, and diagnostic settings.
    licensing: Seven-year searchable or archived retention can incur Log Analytics commitment, retention, archive, and query
      charges that must be confirmed for each region.
    costNotes: Cost is driven by regional ingestion volume, interactive-retention days, archive-retention years, cross-workspace
      queries, and export destinations.
    constraints:
    - Security control-plane records must remain in their originating region for seven years.
    - Application traces have a thirty-day searchable requirement and must not be duplicated into every workspace.
    assumptions:
    - Workloads already emit through Azure Monitor Agent and DCR-compatible sources rather than the legacy Log Analytics agent.
    - Security analysts are permitted to query multiple regional workspaces through a governed workbook scope.
    facts:
      data: Security records and application traces have different residency, retention, access, and evidentiary classifications.
      scale: The estate spans multiple regions and operations teams; measured daily gigabytes per stream remain an owner-supplied
        sizing input.
      latency: Security triage needs queryable recent records, while seven-year history may tolerate archive-search rehydration
        delay.
      availability: Regional collection must continue if another region or its workspace is unavailable, with queries degrading
        to the reachable scope.
      rto: Monitoring restoration time is an operational objective to be agreed with the security owner; the scenario specifies
        no numerical RTO.
      rpo: Loss tolerance for control-plane audit records is effectively zero after Azure accepts them into the monitoring
        pipeline.
      budget: Differentiated table plans and retention are required to avoid paying interactive rates for seven years of low-access
        evidence.
    candidateAnalyses:
    - name: Regional workspaces with cross-workspace queries and policy-driven routing
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 5
        C3: 5
        C4: 4
        C5: 3
      rationale: Region-bound workspaces satisfy residency and isolate collection failure while DCR routing and cross-workspace
        views preserve a common operating experience.
      rejectedReason: null
    - name: Central Log Analytics workspace with DCR-based collection and archive export
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 3
        C3: 3
        C4: 5
        C5: 4
      rationale: Centralization simplifies queries and governance, but exporting after ingestion does not cure an in-region
        processing requirement.
      rejectedReason: Its simpler operations do not compensate for weaker residency fit and a larger regional failure domain.
    - name: Dedicated workspace per workload with independent retention and access
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 4
        C3: 4
        C4: 2
        C5: 2
      rationale: Workload isolation gives precise access and retention control but multiplies policy, query, commitment-tier,
        and incident-correlation overhead.
      rejectedReason: Workspace proliferation raises management and ingestion cost without improving the mandated regional
        boundary.
    - name: One global workspace retaining every stream interactively for seven years
      eligible: false
      disqualifiers:
      - LAB01-REQ-01 requires the workspace boundary to remain in the approved data region with intentional retention.
      scores:
        C1: 1
        C2: 3
        C3: 1
        C4: 4
        C5: 1
      rationale: A global all-hot workspace is operationally familiar but crosses the residency boundary and applies the most
        expensive retention to low-value traces.
      rejectedReason: The candidate is disqualified by the regional security-record mandate.
    risks:
    - risk: A DCR association omission can create a silent telemetry gap for one workload or region.
      mitigation: Reconcile source inventory to DCR and DCRA resource IDs and fail the coverage assertion for any unmatched
        source.
    - risk: Cross-workspace permissions can expose regulated records to regional operators who need only application telemetry.
      mitigation: Separate table access and workbook scopes, then test both an allowed query and a denied cross-boundary query.
    waf:
      reliability: Independent regional ingestion limits correlated collection loss and makes partial query behavior explicit.
      security: Workspace and table boundaries enforce residency and least-privilege access for security evidence.
      costOptimization: Thirty-day trace search and archived audit retention align price with access frequency instead of
        duplicating streams.
      operationalExcellence: Policy-assigned DCRs and shared workbooks make coverage drift and incident handoffs observable.
      performanceEfficiency: Regional ingestion reduces collection paths, while scoped cross-workspace queries avoid scanning
        unrelated tables.
    safeAnalogue: null
    adrConsequences:
    - Incident queries must name the intended regional workspace set and tolerate an unavailable region.
    - Platform owners must govern DCR association coverage and table-specific retention as separate controls.
    changeExpectedRevision: Split control-plane and application streams by DCR and table policy, then recalculate retention
      cost without cloning either stream.
    revisedDecision:
      selectedCandidate: Regional workspaces with cross-workspace queries and policy-driven routing
      mandatoryRequirementId: LAB01-REQ-05
      reason: LAB01-REQ-05 makes the seven-year in-region evidence boundary mandatory, so the regional-workspace decision
        is retained with archive retention for security tables and thirty-day trace search.
      waf:
        reliability: Each region keeps collecting its own control-plane stream during a remote workspace outage.
        security: Long-lived records never traverse the mandated regional boundary.
        costOptimization: Only the regulated stream receives seven-year retention and application traces remain thirty-day
          searchable.
        operationalExcellence: DCR and table-policy evidence reveals exactly which stream follows each rule.
        performanceEfficiency: Routine trace queries scan short-lived regional tables instead of the seven-year archive.
- number: '02'
  scenario: Fabrikam Payments has a centralized Log Analytics estate, but responders learn about customer impact from support
    tickets. Platform metrics, resource health events, query-based service-level indicators, and application telemetry are
    monitored by different teams with inconsistent thresholds. As the monitoring architect, design the health model, action
    routing, alert severity, suppression, and workbook views that turn the collection architecture from Lab 01 into actionable
    operational visibility. The solution must avoid noisy static thresholds, distinguish symptoms from causes, preserve independent
    positive and negative validation, and document ownership for every notification path without embedding personal addresses,
    secrets, or live incident data.
  role: Monitoring and reliability architect
  outcome: An actionable monitoring design that detects customer-impacting conditions, routes owned alerts, and proves noise
    controls.
  duration: 140 minutes
  difficulty: advanced
  costClass: low
  businessOutcome: Detect and triage material service degradation before customers report it while reducing unactionable alerts.
  stakeholders:
  - Site reliability engineering
  - Application owners
  - Security operations
  - Service desk
  primarySource:
    title: Azure Monitor best practices - Alerts and automated actions
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/best-practices-alerts
  candidates:
  - Service-centric alerts with shared action groups and curated workbooks
  - Resource-by-resource static thresholds with team-specific receivers
  - External monitoring only with Azure telemetry exported downstream
  selected: Service-centric alerts with shared action groups and curated workbooks
  checkpoints:
  - title: Build a layered signal inventory
    requirement: LAB02-REQ-01
    command: Get-AzMetricDefinition -ResourceId $TargetResourceId
    positiveCommand: Get-AzMetricDefinition -ResourceId $TargetResourceId | Where-Object { $_.Name.Value -eq $RequiredMetricName
      }
    negativeCommand: Get-AzMetricDefinition -ResourceId $TargetResourceId | Where-Object { $_.Name.Value -eq $DeprecatedMetricName
      }
    expected: The design identifies platform, application, dependency, and business signals with explicit owners.
    negative: No unsupported or deprecated metric is used as a release gate.
    evidence: Metric namespace, aggregation, grain, owner, and business symptom mapping.
    failure: A desired metric is unavailable at the resource SKU or namespace.
    retry: Select a supported proxy signal and record the detection trade-off before continuing.
    cleanup: No resource cleanup is required for this read-only inventory checkpoint.
    waf: 'Performance Efficiency: signals aligned to saturation and latency expose capacity bottlenecks without indiscriminate
      telemetry.'
  - title: Design platform and resource-health alerts
    requirement: LAB02-REQ-02
    command: New-AzActivityLogAlert -Name $HealthAlertName -ResourceGroupName $ResourceGroup -Location global -Scope $TargetResourceId
      -Action (New-AzActivityLogAlertActionGroupObject -Id $ActionGroupResourceId) -Condition @((New-AzActivityLogAlertAlertRuleAnyOfOrLeafConditionObject
      -Field category -Equal ResourceHealth)) -Enabled $true -Tag @{purpose='az305-lab';labId='LAB-02';runId=$RunId;expiresOn=$ExpiresOn}
    positiveCommand: Get-AzActivityLogAlert -ResourceGroupName $ResourceGroup -Name $HealthAlertName
    negativeCommand: Get-AzActivityLogAlert -ResourceGroupName $ResourceGroup | Where-Object { $_.ConditionAllOf.Field -eq
      'category' -and $_.ConditionAllOf.Equals -eq 'Administrative' }
    expected: Resource Health and Service Health alerts are separated from routine administrative events and have owned severities.
    negative: Broad administrative activity does not page the reliability team without a material condition.
    evidence: Alert scope, category, status, severity rationale, and owner alias using synthetic contacts.
    failure: Subscription scope or action authorization is narrower than the intended failure domain.
    retry: Reduce scope to an authorized management boundary and document any coverage gap.
    cleanup: Remove test activity-log alerts before action groups when cleanup is authorized.
    waf: 'Reliability: resource and service-health signals cover failures outside the application process.'
  - title: Define a query-based service-level alert
    requirement: LAB02-REQ-03
    command: Get-AzScheduledQueryRule -ResourceGroupName $ResourceGroup -Name $ScheduledQueryRuleName
    positiveCommand: Get-AzScheduledQueryRule -ResourceGroupName $ResourceGroup -Name $ScheduledQueryRuleName
    negativeCommand: Get-AzScheduledQueryRule -ResourceGroupName $ResourceGroup | Where-Object { $_.WindowSize -lt $_.EvaluationFrequency
      }
    expected: The selected log alert evaluates an auditable customer-impact query over a suitable window and frequency.
    negative: No rule uses an evaluation cadence that can systematically miss its own observation window.
    evidence: Sanitized KQL fingerprint, window, frequency, threshold, severity, and failing-period configuration.
    failure: Query latency or ingestion delay exceeds the intended detection time.
    retry: Test against synthetic fixtures, widen the window only as needed, and document slower detection.
    cleanup: Delete the scheduled-query rule before deleting its action group or workspace dependency.
    waf: 'Cost Optimization: query cadence balances detection value against repeated log-query consumption.'
  - title: Curate an operator workbook
    requirement: LAB02-REQ-04
    command: New-AzApplicationInsightsWorkbook -ResourceGroupName $ResourceGroup -Name $WorkbookResourceName -Location $Location
      -DisplayName $WorkbookDisplayName -SourceId $TargetResourceId -Category workbook -SerializedData $WorkbookJson -Tag
      @{purpose='az305-lab';labId='LAB-02';runId=$RunId;expiresOn=$ExpiresOn}
    positiveCommand: Get-AzApplicationInsightsWorkbook -ResourceGroupName $ResourceGroup -Name $WorkbookResourceName
    negativeCommand: Get-AzApplicationInsightsWorkbook -ResourceGroupName $ResourceGroup -Category workbook | Where-Object
      { [string]::IsNullOrWhiteSpace($_.DisplayName) }
    expected: The workbook leads from business health to dependencies and resource diagnostics without exposing sensitive
      dimensions.
    negative: No panel depends on personal data, raw secrets, or an undocumented cross-workspace permission.
    evidence: Workbook resource ID, display name, query-purpose inventory, and accessibility review.
    failure: A cross-workspace query cannot resolve because the operator lacks access to one workspace.
    retry: Validate workspace-scoped RBAC and replace inaccessible panels with an explicit coverage notice.
    cleanup: Delete the workbook before its supporting workspace only when it was created by this run.
    waf: 'Security: curated views expose only the telemetry dimensions operators need for diagnosis.'
  - title: Verify action routing and noise controls
    requirement: LAB02-REQ-05
    command: Get-AzActionGroup -ResourceGroupName $ResourceGroup
    positiveCommand: Get-AzActionGroup -ResourceGroupName $ResourceGroup -Name $ActionGroupName
    negativeCommand: Get-AzActionGroup -ResourceGroupName $ResourceGroup | Where-Object { $_.EmailReceiver.EmailAddress -match
      '@(gmail|outlook)\.com$' }
    expected: Every actionable severity maps to a durable team-owned receiver and documented suppression rule.
    negative: No personal mailbox or receiver without an accountable service owner is present.
    evidence: Receiver type, synthetic endpoint label, severity routing table, suppression window, and owner.
    failure: An action group exists but a receiver is disabled, unverified, or unsupported in the region.
    retry: Correct the synthetic routing design and retest the alert-to-owner mapping without sending notifications.
    cleanup: Delete alert rules before deleting the shared action group.
    waf: 'Operational Excellence: severity and action routing send actionable work to durable, accountable teams.'
  changeRequest: The payment API adopts a bursty promotion model that triples legitimate traffic for fifteen minutes, so static
    latency and error-rate thresholds must be revised without masking genuine customer impact.
  challenge: Propose a multi-window burn-rate alert and explain how it changes severity, evaluation frequency, and operator
    context.
  troubleshooting:
  - Compare alert evaluation frequency, observation window, and ingestion delay before changing thresholds.
  - Verify action-group receiver state and rule association separately when an alert fires without notification.
  - Test workbook queries with the least-privileged operator role to expose hidden cross-workspace dependencies.
  architectureAnalysis:
    permissions: Reader and Monitoring Reader support inspection; changing alert rules, processing rules, action groups, or
      workbooks requires separately approved monitoring contributor rights.
    licensing: Metric alerts, log alerts, notification channels, and workbook queries have distinct Azure Monitor charging
      behavior that owners must validate.
    costNotes: Evaluate alert-rule evaluation frequency, log-query volume, notification fan-out, and operator time lost to
      false positives.
    constraints:
    - Legitimate promotion traffic can triple for fifteen minutes and cannot be treated automatically as an incident.
    - Customer-impact signals must continue detecting real payment failure during the same burst window.
    assumptions:
    - The service emits request rate, latency, failure rate, dependency health, and deployment annotations with consistent
      dimensions.
    - Service owners provide an approved SLO and action-group escalation roster before live alert changes.
    facts:
      data: Metric time series, log events, action-group delivery records, and workbook annotations form separate evidence
        sources.
      scale: A scheduled promotion creates a threefold fifteen-minute demand spike; absolute baseline request volume is intentionally
        left for measurement.
      latency: Detection must be fast enough to precede customer reports, but the exact alert window follows the approved
        payment-service SLO.
      availability: Alert routing needs at least one tested receiver path when a team-specific channel or integration is unavailable.
      rto: The incident-response RTO is not supplied; the exercise measures detection and notification delay for owner approval.
      rpo: Historical alert and deployment context must cover the investigation window; transactional payment RPO belongs
        to the workload design.
      budget: The preferred design trades a small curated alert set for lower query and responder cost than resource-by-resource
        duplication.
    candidateAnalyses:
    - name: Service-centric alerts with shared action groups and curated workbooks
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 4
        C3: 4
        C4: 5
        C5: 4
      rationale: SLO-oriented multi-signal alerts correlate customer impact, dependency state, and deployment context while
        reusable action groups control routing.
      rejectedReason: null
    - name: Resource-by-resource static thresholds with team-specific receivers
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 3
        C3: 4
        C4: 2
        C5: 3
      rationale: Static resource rules are easy to assign but amplify transient promotion noise and obscure end-to-end payment
        impact.
      rejectedReason: It scores poorly on operability because duplicated thresholds and receiver lists drift independently.
    - name: External monitoring only with Azure telemetry exported downstream
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 3
        C3: 3
        C4: 3
        C5: 2
      rationale: External correlation can provide an independent vantage point, although export delay and lost Azure resource
        context weaken first response.
      rejectedReason: Export-only detection adds latency and makes Azure-native dependency and deployment context harder to
        preserve.
    - name: One fixed latency threshold copied to every resource
      eligible: false
      disqualifiers:
      - LAB02-REQ-03 requires a service-level query and evaluation window grounded in auditable customer impact.
      scores:
        C1: 1
        C2: 2
        C3: 3
        C4: 2
        C5: 4
      rationale: A copied threshold is cheap to create but cannot distinguish a planned demand surge from a failing dependency.
      rejectedReason: It is ineligible because it cannot meet the independent alert-quality acceptance criteria.
    risks:
    - risk: Dynamic thresholds may learn a promotion spike and suppress a genuine payment-path failure.
      mitigation: Combine demand-aware baselines with an invariant failed-transaction or availability SLO signal.
    - risk: A shared action group can become a single notification dependency.
      mitigation: Configure and exercise independent receiver types, then retain delivery-status evidence for each route.
    waf:
      reliability: Multi-signal service alerts detect degraded customer outcomes even when individual resources report healthy.
      security: Least-privilege action-group maintenance and sanitized alert payloads limit exposure through notification
        channels.
      costOptimization: Curated rules reduce duplicate evaluations and the labor cost of unactionable pages.
      operationalExcellence: Workbooks join SLO, dependency, deployment, and alert evidence into one triage sequence.
      performanceEfficiency: Demand-relative thresholds absorb planned bursts while invariant failure signals protect sensitivity.
    safeAnalogue: null
    adrConsequences:
    - Service owners must maintain SLO thresholds and promotion annotations as product behavior changes.
    - Shared receiver governance becomes a platform responsibility with regular delivery tests.
    changeExpectedRevision: Replace static burst-sensitive thresholds with an SLO and multi-window evaluation that still pages
      on failed customer transactions.
    revisedDecision:
      selectedCandidate: Service-centric alerts with shared action groups and curated workbooks
      mandatoryRequirementId: LAB02-REQ-03
      reason: LAB02-REQ-03 requires an auditable customer-impact query, so the promotion case uses demand-relative latency
        evaluation plus an invariant failure-rate signal rather than a static resource threshold.
      waf:
        reliability: Two independent signals prevent a benign traffic surge from hiding a true outage.
        security: Receiver scopes and payload fields remain unchanged while alert logic evolves.
        costOptimization: Noise suppression avoids a threefold burst producing redundant pages and log queries.
        operationalExcellence: Promotion annotations give responders an auditable reason for changed baselines.
        performanceEfficiency: Multi-window evaluation reflects short bursts without permanently raising the latency threshold.
- number: '03'
  scenario: Northwind Health is modernizing an employee application, a partner collaboration site, and a new patient-facing
    application. Architects disagree whether all identities belong in the workforce tenant and whether a historical Azure
    AD B2C pattern should be copied for the patient experience. You must recommend tenant boundaries, Microsoft Entra External
    ID for the new customer identity scenario, federation and authentication methods, Conditional Access, application registrations,
    and managed workload identities. The design must account for regulated attributes, self-service journeys, privileged administration,
    protocol compatibility, and lifecycle ownership. Use GA Microsoft Graph PowerShell inspection commands only and leave
    post-authentication Azure authorization decisions to Lab 04.
  role: Identity and authentication architect
  outcome: A tenant and authentication architecture that separates workforce, partner, customer, and workload identities with
    modern controls.
  duration: 165 minutes
  difficulty: advanced
  costClass: low
  businessOutcome: Provide secure low-friction sign-in for three populations while reducing credential and tenant-boundary
    risk.
  stakeholders:
  - Chief information security officer
  - Patient application owner
  - Partner operations
  - Privacy counsel
  primarySource:
    title: Overview of Microsoft Entra External ID in external tenants
    url: https://learn.microsoft.com/en-us/entra/external-id/customers/overview-customers-ciam
  candidates:
  - Workforce tenant plus a dedicated External ID external tenant and managed identities
  - Single workforce tenant for employees partners and customers
  - Separate workforce tenants with custom application-managed customer credentials
  selected: Workforce tenant plus a dedicated External ID external tenant and managed identities
  checkpoints:
  - title: Establish identity population and tenant boundaries
    requirement: LAB03-REQ-01
    command: Get-MgOrganization
    positiveCommand: Get-MgOrganization -Property Id,DisplayName,VerifiedDomains,TenantType
    negativeCommand: Get-MgOrganization -Property VerifiedDomains | Where-Object { $_.VerifiedDomains.Name -like '*.invalid'
      }
    expected: Workforce, partner, customer, and workload identities have explicit tenant placement and data ownership.
    negative: No production domain, tenant identifier, or live organization evidence is committed to the lab.
    evidence: Synthetic tenant labels, boundary rationale, identity population, residency constraint, and administrative owner.
    failure: A business population has conflicting collaboration, residency, or branding requirements.
    retry: Split the population decision and evaluate the constraint against a dedicated external tenant.
    cleanup: This design checkpoint is read-only and creates no directory object.
    waf: 'Reliability: explicit tenant ownership and emergency administration make each identity control plane recoverable.'
  - title: Select protocols and application registrations
    requirement: LAB03-REQ-02
    command: Get-MgApplication -Filter "displayName eq '$AppDisplayName'" -Property Id,AppId,DisplayName,SignInAudience,Web,Spa
    positiveCommand: Get-MgApplication -Filter "displayName eq '$AppDisplayName'" -Property AppId,SignInAudience,RequiredResourceAccess
    negativeCommand: Get-MgApplication -Filter "displayName eq '$AppDisplayName'" -Property PasswordCredentials | Where-Object
      { $_.PasswordCredentials.EndDateTime -gt (Get-Date).AddYears(1) }
    expected: Each application has a supported OIDC or SAML pattern, audience, redirect ownership, and least-privilege API
      consent plan.
    negative: No long-lived client secret or unnecessarily broad multitenant audience is accepted.
    evidence: Synthetic application label, protocol, audience, redirect class, and permission rationale without credentials.
    failure: A legacy application cannot support modern federation or secure redirect handling.
    retry: Introduce an identity-aware modernization facade or isolate the legacy protocol with compensating controls.
    cleanup: No application is removed automatically; tenant changes require explicit acknowledgement and exact object ownership.
    waf: 'Performance Efficiency: standardized federation avoids duplicating credential validation and identity stores in
      each application.'
  - title: Design authentication methods and recovery
    requirement: LAB03-REQ-03
    command: Get-MgPolicyAuthenticationMethodPolicy
    positiveCommand: Get-MgPolicyAuthenticationMethodPolicy -Property Id,DisplayName,PolicyVersion,RegistrationEnforcement
    negativeCommand: Get-MgPolicyAuthenticationMethodPolicyAuthenticationMethodConfiguration | Where-Object { $_.State -eq
      'enabled' -and $_.Id -eq 'Email' }
    expected: Phishing-resistant workforce methods, customer journey methods, bootstrap, and account recovery are deliberately
      separated.
    negative: Weak recovery factors are not treated as equivalent to phishing-resistant authentication for privileged roles.
    evidence: Method-class matrix, population scope, recovery owner, rollout dependency, and exception expiry.
    failure: The target population lacks compatible devices or a safe bootstrap channel.
    retry: Phase registration with Temporary Access Pass or an approved customer method and time-bound exceptions.
    cleanup: No authentication-method policy is changed by this inspection-only checkpoint.
    waf: 'Operational Excellence: phased registration and owned recovery paths make strong authentication supportable.'
  - title: Evaluate Conditional Access architecture
    requirement: LAB03-REQ-04
    command: Get-MgIdentityConditionalAccessPolicy -All
    positiveCommand: Get-MgIdentityConditionalAccessPolicy -All | Where-Object { $_.State -in @('enabled','enabledForReportingButNotEnforced')
      }
    negativeCommand: Get-MgIdentityConditionalAccessPolicy -All | Where-Object { $_.State -eq 'enabled' -and $_.Conditions.Users.IncludeUsers
      -contains 'All' -and $_.Conditions.Users.ExcludeUsers.Count -eq 0 }
    expected: Baseline, privileged, workload, guest, and customer access controls have explicit scope, exclusions, and rollout
      mode.
    negative: No broad enforcement is accepted without emergency access exclusions and report-only evidence.
    evidence: Synthetic policy matrix, included populations, excluded emergency accounts, grant controls, and rollout stage.
    failure: Overlapping policies create an untested lockout path or contradict a customer journey.
    retry: Evaluate policies in report-only mode against synthetic personas and resolve overlap before enforcement.
    cleanup: No policy mutation or deletion occurs; real tenant values are never retained.
    waf: 'Security: contextual access policies strengthen verification while protecting an explicit emergency path.'
  - title: Prefer managed workload identities
    requirement: LAB03-REQ-05
    command: Get-MgServicePrincipal -Filter "displayName eq '$WorkloadIdentityName'" -Property Id,AppId,DisplayName,ServicePrincipalType,AlternativeNames
    positiveCommand: Get-MgServicePrincipal -Filter "displayName eq '$WorkloadIdentityName'" -Property Id,ServicePrincipalType,AccountEnabled
    negativeCommand: Get-MgServicePrincipal -Filter "displayName eq '$WorkloadIdentityName'" -Property PasswordCredentials
      | Where-Object { $_.PasswordCredentials.Count -gt 0 }
    expected: Azure-hosted components use system- or user-assigned managed identities with documented lifecycle ownership.
    negative: No reusable application secret is selected where a managed identity can satisfy the trust boundary.
    evidence: Synthetic workload identity label, identity type, lifecycle owner, token audience, and downstream dependency.
    failure: The destination service or hosting model does not support the required managed identity flow.
    retry: Evaluate workload identity federation or a certificate credential stored in Key Vault with a short rotation interval.
    cleanup: Directory objects are never deleted automatically; any future cleanup requires exact IDs and tenant-change acknowledgement.
    waf: 'Cost Optimization: reusable user-assigned identities are introduced only when their independent lifecycle justifies
      administration.'
  changeRequest: A mobile patient application now requires native authentication and social federation while a regulator forbids
    health attributes from being stored in the customer directory; revise the journey and profile-data boundary.
  challenge: Compare browser-delegated and native authentication for the changed patient journey and justify where custom
    business logic executes.
  troubleshooting:
  - Separate workforce B2B collaboration from customer CIAM when user types appear similar.
  - Validate application audience, redirect type, and consent requirements as independent decisions.
  - Preserve emergency access and report-only evaluation when diagnosing overlapping Conditional Access controls.
  architectureAnalysis:
    permissions: Directory Readers is sufficient for discovery; any External ID, application, federation, or consent change
      requires a dedicated approved directory role and tenant-change acknowledgement.
    licensing: External ID monthly active user pricing and workforce Conditional Access or governance entitlements must be
      assessed separately.
    costNotes: Compare active external-user volume, federation operations, help-desk recovery load, and custom identity-code
      maintenance.
    constraints:
    - Employees, partners, and customers require distinct trust, lifecycle, and authentication journeys.
    - Health attributes must remain outside the external directory even when the mobile journey uses native authentication
      and social federation.
    assumptions:
    - The application can resolve a directory subject to a profile held in an authorized health-data store.
    - New customer identity design uses Microsoft Entra External ID rather than Azure AD B2C.
    facts:
      data: Directory profiles contain identifiers and authentication attributes; regulated health facts remain in the application
        data boundary.
      scale: Three identity populations have different issuers and lifecycle owners; monthly active customer count remains
        a sizing input.
      latency: Interactive sign-in must avoid avoidable cross-system lookups, while profile enrichment occurs after token
        validation.
      availability: Workforce and customer sign-in failure domains are separated so an external journey incident does not
        block employee administration.
      rto: Identity-service recovery targets inherit the application access objective and require an owner decision before
        production approval.
      rpo: Directory object recovery and application-profile recovery are separate; no numerical identity RPO is supplied.
      budget: Managed federation and External ID usage are compared with the support and security cost of custom credentials.
    candidateAnalyses:
    - name: Workforce tenant plus a dedicated External ID external tenant and managed identities
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 4
        C3: 5
        C4: 4
        C5: 4
      rationale: Separate workforce and external directories establish clear policy boundaries while managed identities remove
        application secrets from service access.
      rejectedReason: null
    - name: Single workforce tenant for employees partners and customers
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 4
        C3: 2
        C4: 4
        C5: 4
      rationale: One tenant simplifies administration but couples customer journeys, workforce controls, and regulated profile
        exposure.
      rejectedReason: Its weak trust-boundary score outweighs the operational convenience of one directory.
    - name: Separate workforce tenants with custom application-managed customer credentials
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 3
        C3: 2
        C4: 2
        C5: 3
      rationale: Multiple workforce tenants isolate organizations, but custom password storage transfers authentication defense
        and recovery to the application team.
      rejectedReason: Custom customer credentials create avoidable security and lifecycle ownership that managed External
        ID provides.
    - name: New Azure AD B2C tenant storing patient profile attributes
      eligible: false
      disqualifiers:
      - LAB03-REQ-03 requires the current External ID service boundary and excludes regulated health attributes from directory
        profiles.
      scores:
        C1: 1
        C2: 3
        C3: 1
        C4: 2
        C5: 3
      rationale: This legacy-oriented proposal combines a superseded new-design direction with prohibited health-profile storage.
      rejectedReason: It is disqualified by both the current-service and data-boundary requirements.
    risks:
    - risk: Subject-to-profile mapping could expose health attributes in tokens or directory extension fields.
      mitigation: Use an opaque subject key and assert that issued claims and external user objects contain no regulated fields.
    - risk: Social identity-provider failure can prevent a customer cohort from signing in.
      mitigation: Define provider-specific monitoring, recovery communication, and an approved alternate authentication journey.
    waf:
      reliability: Separate populations and provider-aware journeys contain authentication failure to the affected trust path.
      security: External ID, minimal claims, managed identities, and isolated health profiles reduce credential and data exposure.
      costOptimization: Monthly-active-user billing and managed federation avoid funding custom password infrastructure.
      operationalExcellence: Lifecycle owners and journey-specific evidence make failed federation and provisioning easier
        to diagnose.
      performanceEfficiency: Tokens carry only authorization context and defer regulated profile retrieval to the workload
        data tier.
    safeAnalogue: Inspect synthetic tenant, app, claim, and lifecycle fixtures; do not connect to Graph or create any directory
      object.
    adrConsequences:
    - Application teams must maintain the opaque link between external subjects and health profiles.
    - Identity operations now own two tenant policy surfaces and provider-specific runbooks.
    changeExpectedRevision: Add native and social sign-in to the External ID journey while proving that health facts remain
      application-owned.
    revisedDecision:
      selectedCandidate: Workforce tenant plus a dedicated External ID external tenant and managed identities
      mandatoryRequirementId: LAB03-REQ-03
      reason: LAB03-REQ-03 makes the native and social authentication journey mandatory, so External ID is retained with opaque
        subject claims that never write health attributes to the directory.
      waf:
        reliability: Provider-specific fallback and monitoring isolate a social federation disruption.
        security: Opaque subject claims keep regulated data outside the external directory and tokens.
        costOptimization: Managed native authentication avoids developing and auditing a password service.
        operationalExcellence: Journey tests separately verify federation, token claims, and profile lookup.
        performanceEfficiency: Minimal tokens reduce sign-in payload and leave profile queries to the regional application
          store.
- number: '04'
  scenario: Adventure Works operates Azure subscriptions alongside factories whose Windows and Linux servers are projected
    through Azure Arc. Authentication is standardized, yet authorization grew through direct owner assignments, nested groups,
    and local administrator exceptions. Audit cannot explain why a principal can change a production resource or read a vault
    secret. As the authorization architect, create a scope and delegation model using Microsoft Entra groups, Azure RBAC,
    narrowly designed custom roles, resource-provider data-plane roles, and an explicit hybrid boundary. The design must preserve
    separation of duties, expose inherited access, avoid classic administrators, and distinguish Azure control-plane authorization
    from operating-system permissions on connected machines.
  role: Hybrid authorization architect
  outcome: A least-privilege Azure and hybrid authorization model with traceable scope, inheritance, and data-plane boundaries.
  duration: 150 minutes
  difficulty: advanced
  costClass: low
  businessOutcome: Reduce standing privilege and audit ambiguity without preventing platform and factory teams from meeting
    support obligations.
  stakeholders:
  - Cloud platform owner
  - Factory operations
  - Security assurance
  - Internal audit
  primarySource:
    title: Best practices for Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/best-practices
  candidates:
  - Group-based Azure RBAC at stable scopes with Arc-aware local delegation
  - Direct user assignments on individual resources and servers
  - Subscription-wide custom roles mirrored into local administrator groups
  selected: Group-based Azure RBAC at stable scopes with Arc-aware local delegation
  checkpoints:
  - title: Model scopes and inherited access
    requirement: LAB04-REQ-01
    command: az role assignment list --scope $Scope --include-inherited --all -o json
    positiveCommand: az role assignment list --scope $Scope --include-inherited --assignee-object-id $PrincipalObjectId --query
      "[].{role:roleDefinitionName,scope:scope}" -o json
    negativeCommand: az role assignment list --scope $Scope --include-inherited --query "[?principalType=='User' && roleDefinitionName=='Owner'].{principal:principalName,scope:scope}"
      -o json
    expected: Stable management scopes and group assignments explain both direct and inherited effective access.
    negative: No individual user holds standing Owner at the reviewed production scope.
    evidence: Synthetic principal labels, role names, assignment scopes, inheritance path, and business owner.
    failure: A broad inherited assignment masks the intended resource-group delegation.
    retry: Trace the assignment to its parent scope and redesign at the narrowest stable boundary.
    cleanup: Remove child assignments before groups only when exact run-owned IDs and tags are proven.
    waf: 'Operational Excellence: an explicit inheritance map makes effective access reviewable and supportable.'
  - title: Delegate through groups rather than people
    requirement: LAB04-REQ-02
    command: az role assignment list --assignee-object-id $GroupObjectId --scope $ResourceGroupId --include-inherited --query
      "[].{role:roleDefinitionName,scope:scope,principalType:principalType}" -o json
    positiveCommand: az role assignment list --assignee-object-id $GroupObjectId --scope $ResourceGroupId --query "[?roleDefinitionName=='Contributor'].id"
      -o tsv
    negativeCommand: az role assignment list --scope $ResourceGroupId --query "[?principalType=='User' && roleDefinitionName=='Contributor'].id"
      -o tsv
    expected: The operating team receives resource-group Contributor through an owned Microsoft Entra group.
    negative: No equivalent direct-user assignment remains at the delegated scope.
    evidence: Synthetic group object ID, role definition, exact scope, owner, and access-review cadence.
    failure: The caller cannot resolve the group or create assignments at the requested scope.
    retry: Validate directory read access and role-assignment permissions without broadening the target scope.
    cleanup: Delete the run-owned assignment before considering any group lifecycle action.
    waf: 'Cost Optimization: group-based delegation reduces repetitive assignment and recertification effort.'
  - title: Constrain a custom control-plane role
    requirement: LAB04-REQ-03
    command: az role definition list --name $CustomRoleName --query "[0].{name:roleName,actions:permissions[0].actions,notActions:permissions[0].notActions,assignableScopes:assignableScopes}"
      -o json
    positiveCommand: az role definition list --name $CustomRoleName --query "[0].{actions:permissions[0].actions,notActions:permissions[0].notActions,scopes:assignableScopes}"
      -o json
    negativeCommand: az role definition list --name $CustomRoleName --query "[0].permissions[0].actions[?@=='*']" -o json
    expected: The custom role contains only documented support actions and the minimum assignable scopes.
    negative: No wildcard action, role-assignment write, or destructive permission is granted.
    evidence: Role definition hash, actions, notActions, dataActions, and assignable scopes.
    failure: An operational task depends on a hidden action not represented in provider operations.
    retry: Capture the denied operation, add only its documented action, and repeat the privilege review.
    cleanup: Remove assignments that reference the custom role before deleting the definition.
    waf: 'Performance Efficiency: a task-focused role lets operators complete supported recovery work without broad authorization
      workflows.'
  - title: Separate control-plane and data-plane access
    requirement: LAB04-REQ-04
    command: az role assignment list --assignee-object-id $WorkloadPrincipalId --scope $VaultResourceId --include-inherited
      --query "[].{role:roleDefinitionName,scope:scope}" -o json
    positiveCommand: az role assignment list --assignee-object-id $WorkloadPrincipalId --scope $VaultResourceId --query "[?roleDefinitionName=='Key
      Vault Secrets User'].{role:roleDefinitionName,scope:scope}" -o json
    negativeCommand: az role assignment list --assignee-object-id $WorkloadPrincipalId --scope $VaultResourceId --query "[?contains(['Owner','Contributor'],roleDefinitionName)].roleDefinitionName"
      -o tsv
    expected: The workload identity can read secret values through a data-plane role without managing the vault.
    negative: The workload receives neither Owner nor Contributor at the vault or a parent scope.
    evidence: Synthetic workload principal, data-plane role, exact vault scope, and denied management operations.
    failure: The vault still uses access policies or an inherited management role supplies unintended power.
    retry: Document the authorization model, remove overlap in a controlled change, and validate both planes independently.
    cleanup: Remove the exact run-owned role assignment; do not alter unrelated vault access.
    waf: 'Reliability: data-plane roles let workloads consume dependencies without coupling service availability to vault
      administration.'
  - title: Define the Azure Arc authorization boundary
    requirement: LAB04-REQ-05
    command: az resource show --ids $ArcServerResourceId --api-version 2024-07-10 -o json
    positiveCommand: az role assignment list --scope $ArcServerResourceId --include-inherited --query "[].{role:roleDefinitionName,scope:scope}"
      -o json
    negativeCommand: az role assignment list --scope $ArcServerResourceId --query "[?principalType=='User' && contains(roleDefinitionName,'Administrator')].id"
      -o tsv
    expected: Azure resource actions and guest operating-system privileges have separate accountable delegation paths.
    negative: An Azure assignment is not assumed to grant local administrator access, and no direct-user exception is accepted.
    evidence: Synthetic Arc resource ID, Azure role path, local-role owner, elevation mechanism, and review cadence.
    failure: Teams conflate Arc resource management with guest configuration or local sign-in rights.
    retry: Split the permission matrix by control plane, Arc extension action, and guest operating-system action.
    cleanup: Remove only tagged run-owned Azure assignments; never alter a connected server or local group automatically.
    waf: 'Security: the hybrid boundary prevents Azure control-plane access from being mistaken for guest administrator privilege.'
  changeRequest: A managed-service provider must troubleshoot factory servers for ninety days but may not change subscription
    networking or receive permanent local administrator membership; revise delegation and expiry controls.
  challenge: Produce a responsibility matrix that distinguishes Azure RBAC, Arc extension permissions, just-in-time local
    elevation, and evidence ownership.
  troubleshooting:
  - Resolve inherited assignments from parent scopes before adding a new role.
  - Check control-plane Actions and data-plane DataActions separately when access appears inconsistent.
  - Treat Azure Arc resource permissions and guest operating-system privileges as different authorization systems.
  architectureAnalysis:
    permissions: Reader, Role Based Access Control Reader, and Azure Connected Machine Resource Administrator discovery rights
      are separated from any role-assignment or local-access mutation.
    licensing: Azure Arc-enabled server features and Microsoft Entra governance or PIM licensing must be verified for time-bound
      delegation.
    costNotes: Compare governance licensing and Arc management charges with the incident and audit cost of direct standing
      assignments.
    constraints:
    - The managed-service provider may troubleshoot factory servers for ninety days only.
    - Provider identities cannot change subscription networking or retain permanent local administrator membership.
    assumptions:
    - Factory servers are represented through Azure Arc and have an accountable plant owner.
    - Stable Entra groups can map provider personnel to approved Azure and machine-level duties.
    facts:
      data: The design handles directory groups, Azure role assignments, Arc machine scope, eligibility schedules, and access-review
        evidence.
      scale: Delegation spans multiple factories and a changing provider roster; exact server and technician counts are inventory
        inputs.
      latency: Emergency troubleshooting activation must meet the support response target while approval delay remains measured.
      availability: A deputy approver and emergency process are required if the primary plant owner is unavailable.
      rto: The service repair target is owned by plant operations; this lab measures privilege activation and revocation time
        rather than workload recovery.
      rpo: Authorization configuration must be reconstructable from exported assignments; application-data RPO is outside
        this decision.
      budget: Time-bound group governance adds license cost but reduces recurring manual assignment and quarterly audit effort.
    candidateAnalyses:
    - name: Group-based Azure RBAC at stable scopes with Arc-aware local delegation
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 4
        C3: 5
        C4: 5
        C5: 3
      rationale: Stable groups decouple personnel churn from role definitions and Arc-aware local delegation avoids granting
        subscription networking rights.
      rejectedReason: null
    - name: Direct user assignments on individual resources and servers
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 3
        C3: 2
        C4: 2
        C5: 4
      rationale: Direct grants can be narrowly scoped but are difficult to expire, review, and reconcile as technicians or
        factories change.
      rejectedReason: Assignment sprawl and person-by-person expiry weaken both auditability and operations.
    - name: Subscription-wide custom roles mirrored into local administrator groups
      eligible: true
      disqualifiers: []
      scores:
        C1: 2
        C2: 4
        C3: 2
        C4: 3
        C5: 3
      rationale: A custom role can describe tasks precisely, yet subscription scope and permanent local mirroring enlarge
        the blast radius.
      rejectedReason: The broad scope gives the provider capabilities beyond factory troubleshooting and complicates revocation.
    - name: Shared Owner account with permanent factory administrator membership
      eligible: false
      disqualifiers:
      - LAB04-REQ-05 requires accountable separation between Azure actions and persistent guest operating-system privilege.
      scores:
        C1: 1
        C2: 3
        C3: 1
        C4: 1
        C5: 4
      rationale: A shared powerful account may reduce activation steps but destroys individual attribution and least privilege.
      rejectedReason: The candidate is ineligible because standing shared privilege violates the provider boundary.
    risks:
    - risk: Azure role expiry may not remove a separately granted operating-system group membership.
      mitigation: Reconcile cloud eligibility and Arc machine authorization as two explicit controls with the same end date.
    - risk: An unavailable approver could delay urgent factory recovery.
      mitigation: Assign a trained deputy, document emergency activation, and review every emergency use after the incident.
    waf:
      reliability: Deputy approval and scoped emergency access preserve support during an identity-owner absence.
      security: Group eligibility, minimal scopes, and Arc-specific delegation remove standing subscription and local-admin
        privilege.
      costOptimization: Reusable groups reduce assignment administration while governance-license cost remains visible.
      operationalExcellence: Expiry, access reviews, and assignment exports provide one auditable provider offboarding sequence.
      performanceEfficiency: Stable group evaluation scales with personnel turnover without cloning role definitions per server.
    safeAnalogue: Evaluate synthetic role assignments, eligibility schedules, and Arc server mappings with local fixtures;
      issue no Azure or Graph mutation.
    adrConsequences:
    - Plant owners accept responsibility for time-bound activation and review decisions.
    - Local machine authorization must be monitored separately from Azure RBAC because neither proves the other.
    changeExpectedRevision: Introduce a ninety-day provider group eligibility and prove that network actions and persistent
      local membership remain absent.
    revisedDecision:
      selectedCandidate: Group-based Azure RBAC at stable scopes with Arc-aware local delegation
      mandatoryRequirementId: LAB04-REQ-05
      reason: LAB04-REQ-05 requires deterministic expiry and prohibited-network evidence, so the selected model adds ninety-day
        eligible group access plus independent Arc local-membership removal.
      waf:
        reliability: A deputy activation route supports incidents without keeping access permanently active.
        security: Provider permissions end automatically and exclude subscription-network operations.
        costOptimization: Group-based renewal replaces repeated per-user assignment work.
        operationalExcellence: Cloud and server revocation assertions expose partial offboarding.
        performanceEfficiency: One stable role mapping supports the approved server fleet as technicians rotate.
- number: '05'
  scenario: Litware Financial runs signing, encryption, and TLS-dependent services across multiple subscriptions. Teams store
    secrets in separate vaults, rotate keys inconsistently, and confuse Key Vault Premium with Managed HSM. A planned payment
    service needs hardware-protected signing keys, short-lived certificates, managed-identity access, private connectivity,
    and evidence that recovery and rotation are configured without exporting sensitive material. As the cryptographic-services
    architect, select the appropriate vault boundaries and tiers, define ownership and separation of duties, and produce a
    command-verifiable lifecycle. The design must never place secret values, keys, certificates, access tokens, connection
    strings, or recovery material in repository state or retained evidence.
  role: Cryptographic services architect
  outcome: A governed Key Vault architecture for secrets, certificates, and keys with explicit rotation, access, and network
    controls.
  duration: 160 minutes
  difficulty: advanced
  costClass: moderate
  businessOutcome: Protect payment cryptographic assets and reduce outage risk caused by unmanaged expiry or overprivileged
    access.
  stakeholders:
  - Payment engineering
  - Cryptographic governance
  - Security operations
  - Business continuity
  primarySource:
    title: Azure Key Vault best practices
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/best-practices
  candidates:
  - Azure Key Vault Premium with RBAC and private endpoints
  - Azure Managed HSM with centralized HSM administration
  - Application-owned encrypted configuration in general-purpose storage
  selected: Azure Key Vault Premium with RBAC and private endpoints
  checkpoints:
  - title: Select vault boundary and service tier
    requirement: LAB05-REQ-01
    command: New-AzKeyVault -Name $VaultName -ResourceGroupName $ResourceGroup -Location $Location -Sku Premium -DisableRbacAuthorization:$false
      -Tag @{purpose='az305-lab';labId='LAB-05';runId=$RunId;expiresOn=$ExpiresOn}
    positiveCommand: Get-AzKeyVault -VaultName $VaultName | Select-Object VaultName,Location,Sku,EnableRbacAuthorization,ResourceId
    negativeCommand: Get-AzKeyVault -VaultName $VaultName | Where-Object { -not $_.EnableRbacAuthorization -or $_.Sku -ne
      'Premium' }
    expected: A Premium vault boundary satisfies HSM-backed key needs while keeping application secrets and certificates supportable.
    negative: A software-only tier or legacy access-policy model is not silently substituted.
    evidence: Vault label, region, SKU, authorization model, business owner, and resource ID only.
    failure: A requirement actually needs single-tenant HSM control or unsupported cryptographic functionality.
    retry: Re-score Managed HSM and Key Vault Premium against key custody, API, availability, and cost requirements.
    cleanup: Remove private endpoints, assignments, certificates, secrets, and keys before the vault; never automate purge.
    waf: 'Cost Optimization: Key Vault Premium supplies required HSM-backed keys without unnecessary dedicated HSM capacity.'
  - title: Define key protection and rotation
    requirement: LAB05-REQ-02
    command: Get-AzKeyVaultKeyRotationPolicy -VaultName $VaultName -Name $KeyName
    positiveCommand: Get-AzKeyVaultKeyRotationPolicy -VaultName $VaultName -Name $KeyName
    negativeCommand: Get-AzKeyVaultKey -VaultName $VaultName -Name $KeyName | Where-Object { -not $_.Enabled -or $_.Expires
      -eq $null }
    expected: The HSM-backed key has a ninety-day lifetime and rotates thirty days before expiry with a named application
      owner.
    negative: No enabled production key lacks an expiry and rotation policy.
    evidence: Key name, key type, protection class, expiry date, rotation actions, and version count without key material.
    failure: A dependent application pins a key version and cannot tolerate automated rotation.
    retry: Test versionless key references and staged rollover before enabling automatic rotation.
    cleanup: Disable and delete only run-owned key versions; retain recoverability and never purge.
    waf: 'Reliability: scheduled rotation and versionless references turn rollover into an exercised application behavior.'
  - title: Govern certificate issuance and renewal
    requirement: LAB05-REQ-03
    command: Get-AzKeyVaultCertificatePolicy -VaultName $VaultName -Name $CertificateName
    positiveCommand: Get-AzKeyVaultCertificate -VaultName $VaultName -Name $CertificateName | Select-Object Name,Enabled,Expires,Thumbprint
    negativeCommand: Get-AzKeyVaultCertificate -VaultName $VaultName | Where-Object { $_.Enabled -and $_.Expires -lt (Get-Date).AddDays(30)
      }
    expected: Issuer, subject, validity, renewal threshold, exportability, and application binding are documented and inspectable.
    negative: No enabled certificate approaches expiry without an owned renewal path.
    evidence: Certificate name, issuer class, expiry, non-secret thumbprint, renewal threshold, and consuming service.
    failure: The issuer cannot complete validation or the application does not reload a renewed certificate.
    retry: Validate issuer permissions and exercise application rebinding with a synthetic certificate before production rollout.
    cleanup: Delete only synthetic run-owned certificates and never purge recoverable versions.
    waf: 'Operational Excellence: explicit renewal and rebind ownership prevents unmanaged certificate expiry.'
  - title: Grant managed-identity data-plane access
    requirement: LAB05-REQ-04
    command: Get-AzRoleAssignment -ObjectId $WorkloadPrincipalId -Scope $VaultResourceId | Where-Object { $_.RoleDefinitionName
      -eq 'Key Vault Secrets User' }
    positiveCommand: Get-AzRoleAssignment -ObjectId $WorkloadPrincipalId -Scope $VaultResourceId | Where-Object { $_.RoleDefinitionName
      -eq 'Key Vault Secrets User' }
    negativeCommand: Get-AzRoleAssignment -ObjectId $WorkloadPrincipalId -Scope $VaultResourceId | Where-Object { $_.RoleDefinitionName
      -in @('Owner','Contributor','Key Vault Administrator') }
    expected: The workload identity receives only the data action needed to consume its secret at the vault boundary.
    negative: The workload cannot administer the vault, roles, keys, or certificates.
    evidence: Synthetic principal ID, role name, exact scope, assignment ID, and access owner.
    failure: The application still relies on an access policy, shared principal, or embedded credential.
    retry: Remove authorization-model overlap through a separately approved migration and retest the managed identity.
    cleanup: Remove the exact assignment before deleting the run-owned identity or vault.
    waf: 'Performance Efficiency: managed identity token handling removes custom secret distribution and refresh work from
      applications.'
  - title: Enforce a private network path
    requirement: LAB05-REQ-05
    command: $vaultBeforeUpdate = Get-AzKeyVault -VaultName $VaultName -ResourceGroupName $ResourceGroup; if ($vaultBeforeUpdate.ResourceId
      -ine $VaultResourceId) { throw 'The supplied Key Vault ID is not the exact run-owned vault.' }; Update-AzKeyVault -VaultName
      $VaultName -ResourceGroupName $ResourceGroup -PublicNetworkAccess Disabled
    positiveCommand: Get-AzKeyVault -VaultName $VaultName -ResourceGroupName $ResourceGroup | Select-Object VaultName,ResourceId,PublicNetworkAccess
    negativeCommand: Get-AzKeyVault -VaultName $VaultName | Where-Object { $_.PublicNetworkAccess -ne 'Disabled' }
    expected: Approved private endpoint connectivity and private DNS support access from the intended workload network.
    negative: Public network access is not used as a fallback for DNS or routing mistakes.
    evidence: Vault resource ID, private endpoint ID, approval state, subnet, and private DNS zone label.
    failure: Name resolution returns the public endpoint or the private endpoint connection is pending.
    retry: Correct DNS linking and approval independently before keeping public access disabled.
    cleanup: Remove private DNS records and the private endpoint before the vault; preserve unrelated shared zones.
    waf: 'Security: private endpoints and denied public access reduce vault exposure and exfiltration paths.'
  changeRequest: The acquired card-processing workload requires single-tenant FIPS-validated HSM administration and cannot
    share the payment application vault boundary; revise the selected service and operating model.
  challenge: Explain which assets remain in Key Vault and which move to Managed HSM, including role separation, backup ownership,
    cost, and application compatibility.
  troubleshooting:
  - Distinguish control-plane RBAC from key, secret, and certificate data-plane permissions.
  - Check private DNS resolution and endpoint approval separately when vault requests fail.
  - Verify applications use versionless references before relying on automated key or certificate rollover.
  architectureAnalysis:
    permissions: Key Vault Reader supports configuration inspection; vault, key, role-assignment, private-endpoint, or Managed
      HSM changes require separately approved data-plane and control-plane roles.
    licensing: Premium Key Vault HSM-backed keys and Managed HSM pools use different pricing, administration, and minimum-cost
      models.
    costNotes: Include vault transactions, private connectivity, certificate renewal operations, and the continuously allocated
      Managed HSM pool.
    constraints:
    - Payment secrets and keys require private access, RBAC authorization, rotation evidence, and recoverable deletion controls.
    - The acquired card workload requires a single-tenant FIPS-validated HSM administration boundary separate from application
      vaults.
    assumptions:
    - Applications support managed identity and can rotate key or secret references without embedding credentials.
    - Security owners approve emergency recovery responsibilities before enabling a production cryptographic boundary.
    facts:
      data: The inventory distinguishes secrets, certificates, encryption keys, HSM keys, owners, expiry dates, and recovery
        settings.
      scale: Multiple applications share payment-vault operations, while the acquired processor introduces one separately
        governed HSM workload.
      latency: Cryptographic calls remain on private network paths; the owner must benchmark workload-specific operation latency
        before sizing.
      availability: Vault regional resiliency and application retry behavior are assessed separately from Managed HSM disaster-recovery
        procedures.
      rto: Key-access restoration must fit the payment-service recovery objective, but no numerical value is supplied in the
        scenario.
      rpo: Cryptographic material must remain recoverable through soft delete and purge protection; rotation history loss
        is not accepted.
      budget: Premium vaults suit shared application assets, while the fixed Managed HSM cost is justified only for the acquired
        regulated boundary.
    candidateAnalyses:
    - name: Azure Key Vault Premium with RBAC and private endpoints
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 4
        C3: 5
        C4: 4
        C5: 3
      rationale: Premium vaults provide HSM-backed keys, secret and certificate management, managed-identity access, and a
        bounded private application interface.
      rejectedReason: null
    - name: Azure Managed HSM with centralized HSM administration
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 4
        C3: 5
        C4: 3
        C5: 2
      rationale: Managed HSM creates a single-tenant cryptographic boundary and distinct administration model, but does not
        replace general secret and certificate storage.
      rejectedReason: The initial shared application scope does not justify moving every asset into a costlier key-only HSM
        pool.
    - name: Application-owned encrypted configuration in general-purpose storage
      eligible: true
      disqualifiers: []
      scores:
        C1: 2
        C2: 2
        C3: 2
        C4: 2
        C5: 4
      rationale: Application encryption can protect stored values but transfers key hierarchy, rotation, audit, and recovery
        duties to each workload.
      rejectedReason: It provides weaker centralized control and creates duplicated key-management code across payment applications.
    - name: Plaintext secrets in deployment variables and source-controlled parameters
      eligible: false
      disqualifiers:
      - LAB05-REQ-02 requires nonexportable or protected cryptographic material with least-privilege access and rotation evidence.
      scores:
        C1: 1
        C2: 1
        C3: 1
        C4: 2
        C5: 5
      rationale: Plaintext variables minimize initial setup but expose credentials to build logs, repositories, and broad
        deployment identities.
      rejectedReason: The proposal is ineligible because it cannot meet the mandatory secret-protection boundary.
    risks:
    - risk: Enabling a private endpoint without validated name resolution can make the vault unreachable to payment workloads.
      mitigation: Test private DNS resolution and a permitted managed-identity operation before disabling the public path.
    - risk: Separating Managed HSM administration can leave too few trained recovery officers.
      mitigation: Assign independent deputies, rehearse quorum and recovery procedures, and monitor administrator-role expiry.
    waf:
      reliability: Soft delete, purge protection, tested rotation, and explicit HSM recovery ownership reduce key-loss outages.
      security: RBAC, private endpoints, managed identities, and a separate single-tenant HSM boundary enforce cryptographic
        least privilege.
      costOptimization: Premium vaults remain the economical shared service and Managed HSM is limited to the workload that
        mandates it.
      operationalExcellence: Expiry inventory, rotation alerts, and recovery drills turn cryptographic lifecycle into an auditable
        runbook.
      performanceEfficiency: Applications reuse managed identities and private endpoints while key-operation throughput is
        benchmarked per service.
    safeAnalogue: null
    adrConsequences:
    - Platform teams operate shared premium vaults while a separate security team owns Managed HSM administration.
    - Private DNS and managed-identity readiness become deployment prerequisites for payment services.
    changeExpectedRevision: Split the acquired processor keys into Managed HSM while retaining Key Vault for application secrets
      and certificates.
    revisedDecision:
      selectedCandidate: Azure Managed HSM with centralized HSM administration
      mandatoryRequirementId: LAB05-REQ-01
      reason: LAB05-REQ-01 makes the cryptographic service boundary a mandatory decision, so the acquired processor selects
        single-tenant Managed HSM while shared secrets and certificates remain in Key Vault.
      waf:
        reliability: Dedicated HSM recovery officers and drills become necessary for the acquired workload.
        security: The processor receives a nonshared HSM trust and administration boundary.
        costOptimization: Only mandated processor keys incur the continuously allocated HSM cost.
        operationalExcellence: Two service inventories and escalation paths must be maintained without mixing ownership.
        performanceEfficiency: Processor key-operation throughput is sized independently from ordinary vault transactions.
- number: '06'
  scenario: Contoso Manufacturing has one tenant, twelve subscriptions, and rapidly growing regional programs. Its current
    structure mirrors temporary project teams, tags use inconsistent names, and cost, ownership, residency, and environment
    cannot be queried reliably. The platform board wants a durable Cloud Adoption Framework-aligned hierarchy that delegates
    at stable boundaries without turning management groups into an organizational chart. As the governance architect, design
    management groups, subscription placement, resource-group lifecycles, and a controlled tag vocabulary. Demonstrate scope
    inheritance and portfolio queries through Azure CLI, but leave policy compliance evidence and identity lifecycle governance
    to Lab 07.
  role: Enterprise governance architect
  outcome: A stable Azure resource hierarchy and tag model that supports delegated operations, cost allocation, and residency
    decisions.
  duration: 145 minutes
  difficulty: advanced
  costClass: low
  businessOutcome: Make ownership, environment, cost, and residency consistently discoverable across a growing subscription
    estate.
  stakeholders:
  - Cloud center of excellence
  - Business-unit technology leads
  - FinOps
  - Risk and compliance
  primarySource:
    title: Azure landing zone design area - Resource organization
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org
  candidates:
  - Archetype-based management groups with workload subscriptions and governed tags
  - Management groups that mirror the corporate reporting hierarchy
  - One shared subscription with resource groups per application
  selected: Archetype-based management groups with workload subscriptions and governed tags
  checkpoints:
  - title: Design durable management-group archetypes
    requirement: LAB06-REQ-01
    command: az account management-group list --query "[].{name:name,displayName:displayName}" -o json
    positiveCommand: az account management-group show --name $ManagementGroupId --expand --recurse --query "{name:name,displayName:displayName,children:children[].name}"
      -o json
    negativeCommand: az account management-group show --name $ManagementGroupId --query "children[?type=='Microsoft.Management/managementGroups'
      && contains(displayName,'Team')]" -o json
    expected: Platform, landing-zone, sandbox, and decommissioned archetypes reflect policy and delegation needs rather than
      team names.
    negative: Temporary projects or reporting-line names do not become durable management-group boundaries.
    evidence: Synthetic hierarchy tree, archetype purpose, owner, and inheritance rationale.
    failure: Existing scope limits or tenant-root permissions prevent the proposed parent relationship.
    retry: Model the hierarchy offline, verify the authorized deployment level, and phase the move without creating duplicates.
    cleanup: Move child subscriptions and management groups before removing a run-owned empty group.
    waf: 'Reliability: archetype-based boundaries limit disruptive hierarchy churn as teams and reporting lines change.'
  - title: Place subscriptions by workload archetype
    requirement: LAB06-REQ-02
    command: az account management-group show --name $ManagementGroupId --expand --recurse --query "{name:name,children:children[].name}"
      -o json
    positiveCommand: az account management-group subscription show --name $ManagementGroupId --subscription $SubscriptionId
      -o json
    negativeCommand: az account management-group show --name $SandboxManagementGroupId --expand --recurse --query "children[?name=='$SubscriptionId'].name"
      -o tsv
    expected: The workload subscription is attached to the production landing-zone archetype with explicit platform dependencies.
    negative: The same subscription is not represented under the sandbox archetype.
    evidence: Synthetic subscription label, parent management group, workload class, residency, and owner.
    failure: The subscription has pending operations or the caller lacks rights at old and new parents.
    retry: Verify current parent and permissions, then perform one controlled move using the same target.
    cleanup: Restore the recorded original parent before deleting a run-owned management group.
    waf: 'Security: correct subscription placement inherits the intended enterprise guardrails.'
  - title: Align resource groups with lifecycle boundaries
    requirement: LAB06-REQ-03
    command: az group create --name $ResourceGroup --location $Location --tags purpose=az305-lab labId=LAB-06 runId=$RunId
      expiresOn=$ExpiresOn workload=$WorkloadName environment=learning
    positiveCommand: az group show --name $ResourceGroup --query "{name:name,location:location,tags:tags}" -o json
    negativeCommand: az resource list --resource-group $ResourceGroup --query "[?tags.workload!='$WorkloadName'].id" -o tsv
    expected: Resources sharing deployment, ownership, and deletion lifecycles are grouped together and tagged consistently.
    negative: A resource with a different lifecycle or owner is not hidden in the group.
    evidence: Resource-group name, region, lifecycle owner, required tags, and dependency summary.
    failure: A shared dependency cannot follow the application release or deletion lifecycle.
    retry: Move the dependency to a platform-owned resource group in the architecture before deployment.
    cleanup: Delete only the exactly named and tagged run-owned resource group after child ownership verification.
    waf: 'Operational Excellence: resource groups align deployment, ownership, and deletion into a repeatable lifecycle.'
  - title: Apply a controlled tag vocabulary
    requirement: LAB06-REQ-04
    command: az tag update --resource-id $ResourceGroupId --operation Merge --tags owner=$OwnerAlias costCenter=$CostCenter
      dataClass=$DataClass environment=$Environment
    positiveCommand: az tag list --resource-id $ResourceGroupId --query "properties.tags" -o json
    negativeCommand: az tag list --resource-id $ResourceGroupId --query "{owner:properties.tags.owner,costCenter:properties.tags.costCenter,dataClass:properties.tags.dataClass,environment:properties.tags.environment}"
      -o json
    expected: Required tags use canonical names and controlled values that serve ownership, cost, data, and environment decisions.
    negative: Free-form aliases, personal data, secrets, and conflicting case variants are absent.
    evidence: Tag dictionary version, sanitized values, inheritance rule, exception owner, and expiry.
    failure: A resource type does not support tags or an inherited value conflicts with workload truth.
    retry: Record the limitation and use the nearest supported scope or resource-graph join without fabricating coverage.
    cleanup: Restore recorded original non-secret tags rather than deleting unrelated values.
    waf: 'Cost Optimization: canonical ownership and cost-center tags support accountable allocation.'
  - title: Query portfolio conformance
    requirement: LAB06-REQ-05
    command: az graph query -q "Resources | project id, type, location, owner=tostring(tags.owner), costCenter=tostring(tags.costCenter),
      dataClass=tostring(tags.dataClass)" -o json
    positiveCommand: az graph query -q "Resources | where tags['purpose'] =~ 'az305-lab' and tags['labId'] =~ 'LAB-06' | summarize
      count() by tostring(tags.runId)" -o json
    negativeCommand: az graph query -q "Resources | where tags['purpose'] =~ 'az305-lab' and (isempty(tags['owner']) or isempty(tags['costCenter']))
      | project id" -o json
    expected: Resource Graph produces an explainable inventory grouped by ownership and cost dimensions.
    negative: No in-scope lab resource lacks its required governance metadata.
    evidence: Sanitized query text, row counts, missing-tag count, scope, and query timestamp.
    failure: Resource Graph indexing delay or query scope creates an incomplete inventory.
    retry: Confirm subscription scope and retry after the documented indexing interval without adding duplicate tags.
    cleanup: The query creates no resource; remove only run-owned artifacts found through exact ownership checks.
    waf: 'Performance Efficiency: Resource Graph evaluates the portfolio without serial subscription-by-subscription enumeration.'
  changeRequest: A regulated subsidiary must retain its own administrators and billing while inheriting enterprise security
