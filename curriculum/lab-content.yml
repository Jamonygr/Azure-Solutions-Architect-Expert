      rationale: Scheduled VMs are straightforward but scale in coarse units and retain more manual task-distribution responsibility.
      rejectedReason: Fixed nightly hosts respond less efficiently to queue variation and require more orchestration work.
    - name: Analyst desktops running jobs with local result files
      eligible: false
      disqualifiers:
      - LAB18-REQ-01 requires governed compute, image, capacity, data-gravity, and availability characteristics.
      scores:
        C1: 1
        C2: 1
        C3: 1
        C4: 1
        C5: 4
      rationale: Desktop execution avoids platform setup but cannot prove access boundaries, availability, scale, or durable
        result ownership.
      rejectedReason: It is ineligible because local unmanaged execution violates the workload control boundary.
    risks:
    - risk: Dedicated node allocation may not ramp quickly enough to meet the shorter window.
      mitigation: Measure allocation lead time, maintain approved quota headroom, and begin pool scale before the job release
        gate.
    - risk: Export-controlled packages can leak through general-purpose storage or logs.
      mitigation: Use run-owned private storage, minimal sanitized telemetry, approved images, and an explicit data-placement
        assertion.
    waf:
      reliability: Zonal orchestration, durable task state, retry, and worker replacement keep the batch recoverable.
      security: Dedicated approved nodes, private data paths, and classified package handling enforce export controls.
      costOptimization: Autoscale removes dedicated workers after the five-hour batch while preserving justified control capacity.
      operationalExcellence: Queue depth, allocation, task failure, result integrity, and cleanup evidence provide one run
        ledger.
      performanceEfficiency: Measured task throughput and parallelism size dedicated capacity for the shortened completion
        window.
    safeAnalogue: null
    adrConsequences:
    - Quota and approved dedicated-node capacity become release prerequisites for export-controlled runs.
    - Batch state and result integrity, rather than individual VM uptime, define successful completion.
    changeExpectedRevision: Remove low-priority nodes and raise the bounded dedicated-pool ceiling using measured throughput
      for the five-hour deadline.
    revisedDecision:
      selectedCandidate: Zonal control virtual machines with an autoscaled Azure Batch pool
      mandatoryRequirementId: LAB18-REQ-05
      reason: LAB18-REQ-05 requires a five-hour export-controlled completion window, so Batch remains selected with dedicated-only
        nodes, quota headroom, and earlier scale-out.
      waf:
        reliability: Dedicated quota and pre-scaling reduce allocation uncertainty inside the batch window.
        security: No export-controlled task can land on low-priority or unapproved worker capacity.
        costOptimization: Dedicated nodes still scale to zero after results and ownership-checked cleanup complete.
        operationalExcellence: Allocation and queue timing become explicit go/no-go evidence before job submission.
        performanceEfficiency: Pool size derives from observed task throughput needed to compress eight hours into five.
- number: '19'
  scenario: Lucerne Insurance is decomposing a claims application into an HTTP intake API, event-triggered document processors,
    and long-running risk-scoring workers. Traffic is quiet most of the day but spikes after severe weather, some jobs require
    custom containers, and no component should hold a cloud credential. The team is debating Kubernetes, managed container
    hosting, and functions without first separating latency, execution duration, scaling, networking, and operational-control
    requirements. The lab budget rules out a production-grade cluster, so learners will use Azure PowerShell to inspect a
    small analogue and produce a decision that assigns each workload to the simplest service that satisfies its constraints.
  role: Cloud-native compute architect
  outcome: Select a container and serverless architecture with explicit workload boundaries, scaling rules, identity, network
    controls, and operational tradeoffs.
  duration: 150 minutes
  difficulty: advanced
  costClass: low
  businessOutcome: Absorb catastrophe-driven claim spikes without permanent cluster overhead or credential-bearing application
    images.
  stakeholders:
  - Claims product owner
  - Application engineering lead
  - Platform operations lead
  - Security architect
  - FinOps analyst
  primarySource:
    title: Choose an Azure container service
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/choose-azure-container-service
  candidates:
  - Azure Container Apps for APIs and workers with Azure Functions for event handlers
  - Azure Kubernetes Service for every application component
  - Azure App Service containers with WebJobs for all background processing
  selected: Azure Container Apps for APIs and workers with Azure Functions for event handlers
  checkpoints:
  - title: Partition workloads by execution characteristics
    requirement: LAB19-REQ-01
    command: Get-AzResource -ResourceGroupName $ResourceGroupName | Where-Object { $_.ResourceType -in @('Microsoft.App/containerApps','Microsoft.Web/sites')
      } | Select-Object Name, ResourceType, Location, Tags
    positiveCommand: $compute = Get-AzResource -ResourceGroupName $ResourceGroupName | Where-Object { $_.ResourceType -in
      @('Microsoft.App/containerApps','Microsoft.Web/sites') }; if (-not $compute) { throw 'No container or serverless compute
      evidence was found.' }
    negativeCommand: $unowned = Get-AzResource -ResourceGroupName $ResourceGroupName | Where-Object { $_.ResourceType -in
      @('Microsoft.App/containerApps','Microsoft.Web/sites') -and -not $_.Tags.owner }; if ($unowned) { throw 'A compute component
      has no owner tag.' }
    expected: Each component records trigger, latency, duration, state, concurrency, scaling, networking, portability, and
      operations requirements.
    negative: Selecting one service for every component without explaining mismatched execution constraints must fail.
    evidence: Save the component matrix and requirement-to-service mapping with rejected alternatives.
    failure: A hidden long-running or stateful task can exceed a serverless execution model or complicate scaling.
    retry: Split the disputed component at a stable interface and rescore only affected candidates.
    cleanup: Remove local matrices; discovery changes no cloud resource.
    waf: 'Cost Optimization: workload partitioning avoids paying cluster overhead for bursty, event-driven tasks.'
  - title: Assess Container Apps environment and revisions
    requirement: LAB19-REQ-02
    command: Get-AzResource -ResourceGroupName $ResourceGroupName -ResourceType Microsoft.App/containerApps | Select-Object
      Name, Location, ResourceId, Tags
    positiveCommand: $apps = Get-AzResource -ResourceGroupName $ResourceGroupName -ResourceType Microsoft.App/containerApps;
      if (-not $apps) { throw 'No Container Apps analogue was found.' }
    negativeCommand: $apps = Get-AzResource -ResourceGroupName $ResourceGroupName -ResourceType Microsoft.App/containerApps;
      if ($apps | Where-Object { $_.Tags.expiresOn -lt (Get-Date).ToString('yyyy-MM-dd') }) { throw 'An expired Container
      App remains active.' }
    expected: The design defines environment boundary, internal and external ingress, revision mode, Dapr need, workload profile,
      probes, and scale-to-zero behavior.
    negative: Public ingress on an internal worker, missing health probes, or a minimum replica count that defeats cost assumptions
      must fail.
    evidence: Preserve the environment diagram, sanitized resource projection, revision and ingress decisions, and scaling
      calculation.
    failure: Incorrect environment or ingress boundaries can expose internal processors and prevent independent lifecycle
      control.
    retry: Correct the topology fixture, validate the boundary again, and recalculate baseline replicas.
    cleanup: Delete only run-owned analogue resources after exact tag and state checks; leave shared environments untouched.
    waf: 'Security: explicit environment and ingress boundaries reduce unintended public exposure.'
  - title: Validate Functions triggers and scale constraints
    requirement: LAB19-REQ-03
    command: Get-AzFunctionApp -ResourceGroupName $ResourceGroupName | Select-Object Name, Location, Runtime, RuntimeVersion,
      PlanName, State
    positiveCommand: $functions = Get-AzFunctionApp -ResourceGroupName $ResourceGroupName; if (-not ($functions | Where-Object
      { $_.State -eq 'Running' })) { throw 'No running Function App was found.' }
    negativeCommand: $functions = Get-AzFunctionApp -ResourceGroupName $ResourceGroupName; if ($functions | Where-Object {
      $_.RuntimeVersion -match 'EOL|unsupported' }) { throw 'A Function App reports an unsupported runtime.' }
    expected: Trigger semantics, concurrency, timeout, cold-start tolerance, poison-message handling, idempotency, and hosting-plan
      constraints are explicit.
    negative: An unbounded retry, non-idempotent handler, or duration beyond the selected hosting limit must fail.
    evidence: Save trigger contracts, retry and poison-message examples, duration distribution, and hosting-plan rationale.
    failure: Automatic scaling can amplify duplicate side effects or downstream pressure when trigger semantics are ignored.
    retry: Add idempotency and bounded concurrency, then replay the failed synthetic messages.
    cleanup: Remove run-owned messages and local evidence; do not delete shared Function Apps or storage.
    waf: 'Performance Efficiency: bounded concurrency protects downstream systems while scaling event handling with demand.'
  - title: Prove identity, secrets, and network posture
    requirement: LAB19-REQ-04
    command: Get-AzResource -ResourceGroupName $ResourceGroupName | Where-Object { $_.ResourceType -in @('Microsoft.App/containerApps','Microsoft.Web/sites')
      } | ForEach-Object { Get-AzResource -ResourceId $_.ResourceId -ExpandProperties }
    positiveCommand: $resources = Get-AzResource -ResourceGroupName $ResourceGroupName | Where-Object { $_.ResourceType -in
      @('Microsoft.App/containerApps','Microsoft.Web/sites') }; if ($resources | Where-Object { -not (Get-AzResource -ResourceId
      $_.ResourceId -ExpandProperties).Identity }) { throw 'A compute component lacks managed identity.' }
    negativeCommand: $expanded = Get-AzResource -ResourceGroupName $ResourceGroupName -ExpandProperties; if (($expanded.Properties
      | ConvertTo-Json -Depth 30) -match '(?i)password|connectionstring.{0,20}=') { throw 'A resource property appears to
      expose an inline credential.' }
    expected: Every workload uses least-privilege managed identity, retrieves secrets at runtime, and has only the required
      ingress and egress paths.
    negative: Embedded credentials, owner-level role assignment, unrestricted administrative ingress, or undocumented egress
      must fail.
    evidence: Preserve identity IDs, role-scope matrix, network-flow assertions, and a redacted secret-reference review.
    failure: A sound compute choice can still create material compromise paths through broad identity or network access.
    retry: Narrow identity scope and network paths in the safe analogue, then repeat each independent assertion.
    cleanup: Remove only run-owned role assignments and analogue resources; never print or store resolved secrets.
    waf: 'Operational Excellence: identity and network contracts remain observable and consistent across independently deployed
      revisions.'
  - title: Model surge behavior and graceful degradation
    requirement: LAB19-REQ-05
    command: Get-AzMetricDefinition -ResourceId $ContainerAppResourceId | Select-Object Name, Unit, PrimaryAggregationType
    positiveCommand: $definitions = Get-AzMetricDefinition -ResourceId $ContainerAppResourceId; if (-not ($definitions | Where-Object
      { $_.Name.Value -match 'Request|Replica' })) { throw 'Required demand or replica metrics are unavailable.' }
    negativeCommand: $alerts = Get-AzMetricAlertRuleV2 -ResourceGroupName $ResourceGroupName; if ($alerts | Where-Object {
      -not $_.Enabled -and $_.Scopes -contains $ContainerAppResourceId }) { throw 'A compute scaling alert is disabled.' }
    expected: The load model proves scale thresholds, downstream back-pressure, degraded-mode behavior, observability, and
      recovery from a failed revision.
    negative: Meeting API latency while losing claims, overwhelming a dependency, or masking a failed revision must fail overall.
    evidence: Archive request rate, queue depth, replica trajectory, rejected work, latency percentiles, and recovery timing.
    failure: Scale-out lag or downstream saturation can violate the intake objective despite healthy compute metrics.
    retry: Adjust bounded concurrency or queue thresholds and repeat the same synthetic demand profile.
    cleanup: Delete synthetic claims and run-owned analogue resources after preserving sanitized results.
    waf: 'Reliability: queues, health probes, and graceful degradation preserve accepted work during extreme demand.'
  changeRequest: The risk-scoring worker now needs GPU acceleration for two hours after a catastrophe, but the intake API
    must still scale to zero overnight.
  challenge: Repartition the architecture, compare GPU-capable options and their operational burden, and preserve the selected
    managed approach for components that do not require specialized compute.
  troubleshooting:
  - If Az cmdlets do not expose a newly added Container Apps property, use Get-AzResource with expanded properties and record
    the API shape used.
  - If scale evidence looks healthy while queue age rises, correlate demand, concurrency, and downstream throttling rather
    than raising replicas alone.
  - If managed identity validation fails, distinguish identity absence from insufficient permission to read identity metadata.
  architectureAnalysis:
    permissions: Container Apps, Functions, container registry, identity, logging, and quota read roles support assessment;
      environment or workload deployment requires separate contributor rights.
    licensing: Container Apps workload profiles, executions, Functions plans, GPU capacity, registry, logging, and networking
      have separate cost behavior.
    costNotes: Attribute API requests, event-handler executions, worker CPU or GPU seconds, idle profile minimums, images,
      and observability ingestion.
    constraints:
    - Claim intake must absorb catastrophe spikes without permanent cluster overhead or credentials in application images.
    - GPU scoring is needed for two hours after an event while the intake API must still scale to zero overnight.
    assumptions:
    - API, event, and scoring components can be packaged independently and communicate through durable messaging.
    - GPU quota and regional availability are verified before any production design is approved.
    facts:
      data: Claim requests, documents, events, model artifacts, scoring outputs, and audit records have distinct retention
        and access needs.
      scale: Catastrophe traffic is burst-driven and GPU demand lasts two hours; measured request rate and model throughput
        remain sizing inputs.
      latency: Intake response and asynchronous risk-score completion have separate service objectives and scaling triggers.
      availability: Durable messaging decouples API availability from temporary scorer or event-handler capacity loss.
      rto: Worker recovery must preserve queued claims; the scenario does not assign a numerical platform RTO.
      rpo: Accepted intake events require durable storage before acknowledgment so scale-to-zero does not lose work.
      budget: Serverless idle behavior is preserved for intake, while scarce GPU capacity is activated only for the catastrophe
        window.
    candidateAnalyses:
    - name: Azure Container Apps for APIs and workers with Azure Functions for event handlers
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 4
        C3: 4
        C4: 4
        C5: 3
      rationale: Container Apps and Functions provide event-driven independent scaling, managed identity, revision controls,
        and low idle consumption.
      rejectedReason: null
    - name: Azure Kubernetes Service for every application component
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 5
        C3: 4
        C4: 2
        C5: 2
      rationale: AKS handles specialized GPU node pools and complex scheduling but imposes cluster capacity and operations
        on every component.
      rejectedReason: Universal AKS keeps an operational and cost baseline that conflicts with simple overnight scale-to-zero
        goals.
    - name: Azure App Service containers with WebJobs for all background processing
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 4
        C3: 4
        C4: 4
        C5: 3
      rationale: App Service is familiar for APIs and background jobs, but GPU specialization and independent event scaling
        are a weaker fit.
      rejectedReason: Coupled plan capacity makes the short GPU burst and zero-idle API less efficient.
    - name: Public webhook functions with embedded registry and queue credentials
      eligible: false
      disqualifiers:
      - LAB19-REQ-04 requires managed identity, runtime secret retrieval, and only approved network paths.
      scores:
        C1: 1
        C2: 2
        C3: 1
        C4: 2
        C5: 4
      rationale: Direct public functions can start quickly but expose secret rotation and couple acceptance to downstream
        availability.
      rejectedReason: It is ineligible because secretless durable intake is mandatory.
    risks:
    - risk: GPU capacity may be unavailable when a catastrophe causes the burst.
      mitigation: Validate quota and regions, define a CPU degraded mode, and queue work without rejecting accepted claims.
    - risk: Independent scaling can overwhelm a downstream claims database.
      mitigation: Limit concurrency from observed database capacity and monitor queue age rather than scaling only on item
        count.
    waf:
      reliability: Durable queues and independent component revisions keep intake available while scorers recover or scale.
      security: Managed identities, private registry access, and secret-free images reduce credential exposure.
      costOptimization: Intake and handlers scale to zero while GPU capacity exists only for the bounded risk-scoring interval.
      operationalExcellence: Revision, queue-age, retry, model, and dead-letter evidence separate deployment from workload
        failure.
      performanceEfficiency: Each component scales on its own demand signal and specialized GPU workers do not dictate API
        capacity.
    safeAnalogue: Replay synthetic claims through local queue and scaling fixtures, including GPU-unavailable and downstream-throttle
      cases, without deploying compute.
    adrConsequences:
    - The scoring worker needs a separately validated GPU-capable workload profile or bounded specialized execution path.
    - Intake acknowledges only durable messages and remains independent from model execution completion.
    changeExpectedRevision: Add a time-bounded GPU worker profile while retaining scale-to-zero intake and durable claim buffering.
    revisedDecision:
      selectedCandidate: Azure Container Apps for APIs and workers with Azure Functions for event handlers
      mandatoryRequirementId: LAB19-REQ-05
      reason: LAB19-REQ-05 requires both two-hour GPU scoring and overnight zero scale, so the selected design adds an approved
        GPU workload profile only for the scorer while intake remains event-driven.
      waf:
        reliability: Claims remain queued if GPU quota or model execution is temporarily unavailable.
        security: The GPU worker uses managed identity and the same private artifact boundary.
        costOptimization: Expensive accelerators are active only for the measured catastrophe backlog.
        operationalExcellence: GPU availability and CPU degraded mode are explicit runbook decisions.
        performanceEfficiency: Queue age and model throughput independently control the specialized worker profile.
- number: '20'
  scenario: Alpine Logistics is replacing synchronous point-to-point calls between order intake, depot systems, route optimization,
    customer notifications, and external carriers. Orders require durable, ordered processing for each shipment; telemetry
    is a high-volume stream; status changes should fan out to unknown future subscribers; and partner APIs need authentication,
    quotas, versioning, and transformation. A previous proposal placed every interaction on one event service and ignored
    delivery semantics. The architecture team needs a deployable reference that assigns commands, events, streams, and API
    traffic to suitable Azure services, then validates duplicate handling, dead lettering, replay, filtering, and consumer
    isolation without confusing service availability with end-to-end business success.
  role: Integration solutions architect
  outcome: Design and validate a composed integration platform using service-specific delivery semantics, governed APIs, and
    observable failure handling.
  duration: 180 minutes
  difficulty: advanced
  costClass: moderate
  businessOutcome: Decouple depot and partner changes while ensuring accepted shipments are processed once effectively and
    status events reach authorized consumers.
  stakeholders:
  - Logistics product owner
  - Integration platform lead
  - Partner engineering manager
  - Security architect
  - Site reliability engineering lead
  primarySource:
    title: Compare Azure messaging services
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/compare-messaging-services
  candidates:
  - Service Bus for commands, Event Grid for state events, Event Hubs for telemetry, and API Management for partners
  - Event Hubs as the transport for all commands, events, telemetry, and partner requests
  - Storage queues and direct partner webhooks with application-owned routing
  selected: Service Bus for commands, Event Grid for state events, Event Hubs for telemetry, and API Management for partners
  checkpoints:
  - title: Classify every interaction contract
    requirement: LAB20-REQ-01
    command: az resource list --resource-group $ResourceGroupName --query "[?type=='Microsoft.ServiceBus/namespaces' || type=='Microsoft.EventHub/namespaces'
      || type=='Microsoft.EventGrid/topics' || type=='Microsoft.ApiManagement/service'].{name:name,type:type,location:location}"
      --output table --only-show-errors
    positiveCommand: $services = az resource list --resource-group $ResourceGroupName --query "[?starts_with(type,'Microsoft.ServiceBus')
      || starts_with(type,'Microsoft.EventHub') || starts_with(type,'Microsoft.EventGrid') || starts_with(type,'Microsoft.ApiManagement')]"
      --output json --only-show-errors | ConvertFrom-Json; if ($services.Count -lt 3) { throw 'The composed integration platform
      is incomplete.' }
    negativeCommand: $untagged = az resource list --resource-group $ResourceGroupName --query "[?(starts_with(type,'Microsoft.ServiceBus')
      || starts_with(type,'Microsoft.EventHub') || starts_with(type,'Microsoft.EventGrid') || starts_with(type,'Microsoft.ApiManagement'))
      && !tags.owner]" --output json --only-show-errors | ConvertFrom-Json; if ($untagged.Count -gt 0) { throw 'An integration
      service has no owner.' }
    expected: Every interaction records producer, consumer, temporal coupling, ordering, throughput, replay, fan-out, latency,
      and delivery requirements.
    negative: Routing a command, event, stream, and synchronous API through one service without semantic justification must
      fail.
    evidence: Save the interaction catalog, semantic classification, and service-selection matrix.
    failure: Misclassified interactions create brittle retries, lost ordering, or unnecessary coupling.
    retry: Reclassify the disputed contract with producer and consumer owners, then rescore the candidates.
    cleanup: Remove local catalog exports; discovery changes no service.
    waf: 'Operational Excellence: explicit contracts make ownership and incident diagnosis clear across service boundaries.'
  - title: Validate durable command processing
    requirement: LAB20-REQ-02
    command: az servicebus queue show --resource-group $ResourceGroupName --namespace-name $ServiceBusNamespace --name $CommandQueueName
      --query "{status:status,lockDuration:lockDuration,maxDeliveryCount:maxDeliveryCount,deadLetteringOnMessageExpiration:deadLetteringOnMessageExpiration,duplicateDetection:requiresDuplicateDetection}"
      --output json --only-show-errors
    positiveCommand: $queue = az servicebus queue show --resource-group $ResourceGroupName --namespace-name $ServiceBusNamespace
      --name $CommandQueueName --output json --only-show-errors | ConvertFrom-Json; if ($queue.status -ne 'Active' -or $queue.maxDeliveryCount
      -lt 3) { throw 'The command queue is not active or has insufficient retry allowance.' }
    negativeCommand: $queue = az servicebus queue show --resource-group $ResourceGroupName --namespace-name $ServiceBusNamespace
      --name $CommandQueueName --output json --only-show-errors | ConvertFrom-Json; if (-not $queue.requiresDuplicateDetection
      -or -not $queue.deadLetteringOnMessageExpiration) { throw 'Duplicate detection or dead lettering is disabled.' }
    expected: Commands use sessions where ordering is required, bounded delivery attempts, duplicate detection, idempotent
      handlers, and a governed dead-letter workflow.
    negative: Completing a duplicate shipment, abandoning poison messages indefinitely, or ordering globally when only per-shipment
      order is needed must fail.
    evidence: Preserve sanitized message IDs, session ordering, retry counts, dead-letter reason, and handler outcome.
    failure: At-least-once delivery can create duplicate business effects despite a healthy queue.
    retry: Correct the idempotency record or session key and replay only the quarantined synthetic message.
    cleanup: Purge only run-owned synthetic messages through the documented test receiver; never purge a shared entity.
    waf: 'Reliability: sessions, dead lettering, and idempotency protect accepted commands through transient failure.'
  - title: Prove event fan-out and telemetry separation
    requirement: LAB20-REQ-03
    command: az eventgrid event-subscription list --source-resource-id $EventTopicResourceId --query "[].{name:name,endpointType:destination.endpointType,filter:filter,includedEventTypes:filter.includedEventTypes}"
      --output json --only-show-errors
    positiveCommand: $subscriptions = az eventgrid event-subscription list --source-resource-id $EventTopicResourceId --output
      json --only-show-errors | ConvertFrom-Json; if ($subscriptions.Count -lt 2) { throw 'The state-event topic does not
      demonstrate fan-out.' }
    negativeCommand: $telemetryGroups = az eventhubs eventhub consumer-group list --resource-group $ResourceGroupName --namespace-name
      $EventHubNamespace --eventhub-name $TelemetryHubName --output json --only-show-errors | ConvertFrom-Json; if (-not $telemetryGroups
      -or ($telemetryGroups.name | Group-Object | Where-Object Count -gt 1)) { throw 'Telemetry consumers are not independently
      isolated.' }
    expected: State events use filtered fan-out, telemetry uses partitioned streams and separate consumer groups, and replay
      ownership is documented.
    negative: Sending high-volume telemetry through the command queue or sharing offsets between unrelated consumers must
      fail.
    evidence: Save subscription filters, event schemas, partition-key rationale, consumer groups, and replay tests.
    failure: Poor filters or partition keys can overload subscribers or destroy the ordering consumers rely on.
    retry: Refine the event contract and filter, then replay the same synthetic event set to isolated consumers.
    cleanup: Remove only run-owned subscriptions, consumer groups, and synthetic events after ownership checks.
    waf: 'Performance Efficiency: streams and partitioning handle telemetry throughput without burdening command processing.'
  - title: Govern partner APIs
    requirement: LAB20-REQ-04
    command: az apim api show --resource-group $ResourceGroupName --service-name $ApiManagementName --api-id $PartnerApiId
      --query "{name:name,path:path,protocols:protocols,subscriptionRequired:subscriptionRequired,apiVersion:apiVersion}"
      --output json --only-show-errors
    positiveCommand: $api = az apim api show --resource-group $ResourceGroupName --service-name $ApiManagementName --api-id
      $PartnerApiId --output json --only-show-errors | ConvertFrom-Json; if (-not $api.subscriptionRequired -or $api.protocols
      -notcontains 'https') { throw 'The partner API lacks subscription enforcement or HTTPS.' }
    negativeCommand: $revisions = az apim api revision list --resource-group $ResourceGroupName --service-name $ApiManagementName
      --api-id $PartnerApiId --output json --only-show-errors | ConvertFrom-Json; if (($revisions | Where-Object isCurrent).Count
      -ne 1) { throw 'The API does not have exactly one current revision.' }
    expected: The API contract defines authentication, authorization, quota, rate limit, schema validation, versioning, transformation,
      correlation, and safe backend retry.
    negative: An anonymous operation, unbounded partner traffic, breaking in-place change, or retry of a non-idempotent request
      must fail.
    evidence: Preserve the redacted policy export, API specification hash, negative test results, and current revision mapping.
    failure: A reachable API can still expose data, overload a backend, or duplicate business transactions.
    retry: Correct the policy or revision in the controlled reference, then rerun positive and negative partner tests.
    cleanup: Remove only run-owned API revisions and synthetic subscriptions; retain shared service and production APIs.
    waf: 'Security: centralized authentication, validation, quotas, and redaction reduce partner-facing attack surface.'
  - title: Validate end-to-end failure handling
    requirement: LAB20-REQ-05
    command: az monitor metrics list --resource $ServiceBusNamespaceResourceId --metric IncomingMessages,SuccessfulRequests,ServerErrors,DeadletteredMessages
      --interval PT1M --aggregation Total --output json --only-show-errors
    positiveCommand: $metrics = az monitor metrics list --resource $ServiceBusNamespaceResourceId --metric IncomingMessages,SuccessfulRequests
      --interval PT1M --aggregation Total --output json --only-show-errors | ConvertFrom-Json; if (-not $metrics.value.timeseries.data)
      { throw 'No end-to-end messaging evidence was returned.' }
    negativeCommand: $errors = az monitor metrics list --resource $ServiceBusNamespaceResourceId --metric ServerErrors,DeadletteredMessages
      --interval PT1M --aggregation Total --output json --only-show-errors | ConvertFrom-Json; if ($errors.value.timeseries.data.total
      | Where-Object { $_ -gt 0 }) { throw 'Server errors or dead-lettered messages remain unresolved.' }
    expected: A correlated synthetic shipment crosses the API, command, state-event, and telemetry paths with bounded retries
      and observable business completion.
    negative: Infrastructure success with a missing notification, duplicate route, unresolved dead letter, or broken correlation
      must fail overall.
    evidence: Archive correlation IDs, timestamps, entity metrics, consumer acknowledgements, dead-letter checks, and business
      outcome.
    failure: Independent service dashboards can all appear healthy while the business transaction stops between boundaries.
    retry: Resume from the failed idempotent boundary using the same correlation ID and preserve the original trace.
    cleanup: Remove run-owned entities in dependency order only after proving that no synthetic message remains active.
    waf: 'Cost Optimization: service-specific tiers and retention are sized from measured interaction demand rather than a
      uniform premium choice.'
  changeRequest: A carrier contract now requires commands for each shipment to remain ordered while also sustaining ten times
