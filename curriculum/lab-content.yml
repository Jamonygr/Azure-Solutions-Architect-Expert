      rationale: Resource groups simplify the initial estate but cannot provide independent subscription billing and administrative
        isolation.
      rejectedReason: The model cannot preserve the subsidiary's required billing and administrator boundary at useful scope.
    - name: Resource-group-only tagging with no inherited policy boundary
      eligible: false
      disqualifiers:
      - LAB06-REQ-01 requires durable management-group archetypes that can inherit regional and security guardrails.
      scores:
        C1: 1
        C2: 2
        C3: 2
        C4: 2
        C5: 4
      rationale: Tags without inherited enforcement describe intent but cannot prevent a disallowed deployment or preserve
        subsidiary separation.
      rejectedReason: It is disqualified because metadata alone cannot enforce the mandatory hierarchy controls.
    risks:
    - risk: Existing assignments at lower scopes can conflict with or dilute new inherited policies.
      mitigation: Export effective policy state, resolve conflicts in a canary subscription, and move subscriptions only after
        both assertions pass.
    - risk: Tag inheritance can overwrite a valid workload-specific financial owner.
      mitigation: Define precedence per tag key and test append, inherit, and deny behavior against representative resources.
    waf:
      reliability: Stable archetypes keep critical guardrails attached through organizational change and subscription growth.
      security: Inherited security and European-location policies establish a consistent subsidiary boundary.
      costOptimization: Separate billing plus governed allocation tags makes shared and workload cost attributable.
      operationalExcellence: Versioned hierarchy, policy, and exemption records expose drift and simplify onboarding.
      performanceEfficiency: Management-group evaluation scales across subscriptions without duplicating assignments at every
        resource group.
    safeAnalogue: Score a synthetic tenant hierarchy and policy-state fixture, including conflicts and exemptions, without
      moving a subscription or assigning policy.
    adrConsequences:
    - Corporate reporting remains a metadata concern rather than controlling the technical hierarchy.
    - Subsidiary administrators gain subscription autonomy but cannot bypass inherited regional and security policy.
    changeExpectedRevision: Add a regulated-subsidiary archetype with separate billing and administration beneath immutable
      European guardrails.
    revisedDecision:
      selectedCandidate: Archetype-based management groups with workload subscriptions and governed tags
      mandatoryRequirementId: LAB06-REQ-01
      reason: LAB06-REQ-01 requires the hierarchy to follow durable governance archetypes, so the subsidiary receives its
        own regulated branch beneath inherited European controls without mirroring reporting lines.
      waf:
        reliability: The subsidiary keeps the same guardrails when its corporate reporting line changes.
        security: Approved-region and security initiatives inherit above the subsidiary subscription boundary.
        costOptimization: Billing remains directly attributable while shared services use governed allocation tags.
        operationalExcellence: A dedicated archetype documents onboarding, exemption, and administrator responsibilities.
        performanceEfficiency: One inherited policy set replaces repeated assignments across subsidiary workloads.
- number: '07'
  scenario: Tailwind Traders can organize Azure resources, but control owners still exchange spreadsheets to prove compliance
    and retain partner access indefinitely. The organization needs Azure Policy evidence for resource controls and Microsoft
    Entra ID Governance for entitlement, access review, and privileged-role lifecycle. As the compliance and identity-governance
    architect, design initiative assignments, exemptions, remediation ownership, access-package catalogs, recurring reviews,
    and eligible rather than standing privileged access. Work exclusively through GA Az and Microsoft Graph PowerShell inspection
    surfaces in the lab. The design must explain licensing, delegated permissions, evidence retention, exception expiry, and
    the boundary between detecting noncompliance and changing a production tenant.
  role: Compliance and identity governance architect
  outcome: A continuous compliance and identity lifecycle design with accountable exceptions, review evidence, and least standing
    privilege.
  duration: 170 minutes
  difficulty: advanced
  costClass: moderate
  businessOutcome: Replace manual attestations with repeatable technical evidence while ensuring access ends when business
    need ends.
  stakeholders:
  - Compliance control owners
  - Microsoft Entra administrators
  - Application sponsors
  - Internal audit
  primarySource:
    title: What is Microsoft Entra ID Governance?
    url: https://learn.microsoft.com/en-us/entra/id-governance/identity-governance-overview
  candidates:
  - Azure Policy initiatives plus Microsoft Entra ID Governance lifecycle controls
  - Azure Policy for resources with manual identity recertification
  - Third-party GRC attestations with standing directory and Azure assignments
  selected: Azure Policy initiatives plus Microsoft Entra ID Governance lifecycle controls
  checkpoints:
  - title: Map controls to policy initiatives
    requirement: LAB07-REQ-01
    command: Get-AzPolicySetDefinition | Where-Object { $_.Properties.Metadata.category -eq $PolicyCategory }
    positiveCommand: Get-AzPolicySetDefinition -Name $InitiativeName | Select-Object Name,ResourceId,Properties
    negativeCommand: Get-AzPolicySetDefinition | Where-Object { $_.Properties.PolicyDefinitions.Count -eq 0 }
    expected: Each applicable control maps to an initiative definition, effect, evaluation scope, owner, and evidence source.
    negative: No empty initiative or control without an accountable technical or manual evidence path is accepted.
    evidence: Initiative ID, control mappings, definition references, effect classes, and owner aliases.
    failure: A policy alias or effect cannot evaluate the required resource property.
    retry: Replace unsupported automation with a documented manual control and preserve the coverage gap.
    cleanup: Definitions are read-only in this checkpoint and are never removed automatically.
    waf: 'Performance Efficiency: grouped initiatives evaluate shared controls consistently instead of duplicating assignments
      at every resource.'
  - title: Evaluate assignments exemptions and compliance state
    requirement: LAB07-REQ-02
    command: Get-AzPolicyState -Filter "ComplianceState eq 'NonCompliant'" -Top 100
    positiveCommand: Get-AzPolicyAssignment -Name $PolicyAssignmentName -Scope $PolicyScope
    negativeCommand: Get-AzPolicyExemption -Scope $PolicyScope | Where-Object { $_.ExpiresOn -eq $null -or $_.ExpiresOn -lt
      (Get-Date) }
    expected: Assignment scope, noncompliant resources, exemption category, expiry, and remediation owner are reviewable independently.
    negative: No expired or non-expiring waiver is treated as valid compliance.
    evidence: Sanitized counts by state, assignment ID, exemption ID, expiry, justification, and owner.
    failure: Compliance data is stale or a managed identity lacks permissions needed for remediation.
    retry: Wait for evaluation, inspect assignment identity and scope, and keep detection separate from remediation execution.
    cleanup: Do not delete shared assignments; remove only an exact run-owned exemption after dependency review.
    waf: 'Reliability: evaluation timestamps and scoped exemptions distinguish stale evidence from an active control failure.'
  - title: Design entitlement-management catalogs
    requirement: LAB07-REQ-03
    command: Get-MgEntitlementManagementCatalog -All -Property Id,DisplayName,Description,State,IsExternallyVisible
    positiveCommand: Get-MgEntitlementManagementCatalog -AccessPackageCatalogId $CatalogId -Property Id,DisplayName,State,IsExternallyVisible
    negativeCommand: Get-MgEntitlementManagementCatalog -All | Where-Object { $_.IsExternallyVisible -and $_.State -ne 'published'
      }
    expected: A business-owned catalog contains only approved groups, applications, and sites for the partner population.
    negative: Draft or unowned catalogs are not externally visible.
    evidence: Synthetic catalog ID, display name, state, external visibility, resource classes, and sponsor.
    failure: Resources lack an accountable owner or cannot be added with the delegated Graph permission.
    retry: Resolve resource ownership and least-privileged permissions before designing access packages.
    cleanup: Never delete a tenant catalog automatically; future changes require explicit tenant acknowledgement and exact
      IDs.
    waf: 'Cost Optimization: governed catalogs focus premium identity-governance licensing and administration on populations
      that require it.'
  - title: Require recurring access reviews
    requirement: LAB07-REQ-04
    command: Get-MgIdentityGovernanceAccessReviewDefinition -All -Property Id,DisplayName,Status,Scope,Settings
    positiveCommand: Get-MgIdentityGovernanceAccessReviewDefinition -AccessReviewScheduleDefinitionId $ReviewDefinitionId
      -Property Id,DisplayName,Status,Settings
    negativeCommand: Get-MgIdentityGovernanceAccessReviewDefinition -All | Where-Object { $_.Status -eq 'InProgress' -and
      -not $_.Settings.Recurrence }
    expected: Guest, access-package, and privileged populations have recurring reviews with named reviewers and deny-by-default
      handling.
    negative: A one-time review without recurrence is not accepted for continuing partner access.
    evidence: Synthetic definition ID, scope class, reviewer role, recurrence, fallback behavior, and evidence-retention period.
    failure: Reviewer selection creates self-review or has no fallback when the sponsor leaves.
    retry: Assign resource owners or independent reviewers and add an escalation path before scheduling.
    cleanup: Access-review definitions are not deleted automatically; record the owner and proposed retirement process.
    waf: 'Operational Excellence: recurring reviews, fallback reviewers, and default decisions make recertification repeatable.'
  - title: Minimize standing privileged roles
    requirement: LAB07-REQ-05
    command: Get-MgRoleManagementDirectoryRoleEligibilitySchedule -All -Property Id,PrincipalId,RoleDefinitionId,DirectoryScopeId,ScheduleInfo
    positiveCommand: Get-MgRoleManagementDirectoryRoleAssignmentScheduleInstance -All | Where-Object { $_.AssignmentType -eq
      'Activated' }
    negativeCommand: Get-MgRoleManagementDirectoryRoleAssignmentScheduleInstance -All | Where-Object { $_.AssignmentType -eq
      'Assigned' -and $_.EndDateTime -eq $null }
    expected: Administrators are eligible for scoped, time-bound activation with approval and auditable justification where
      risk warrants it.
    negative: No unexplained permanent active privileged assignment is accepted.
    evidence: Synthetic principal label, role, scope, eligibility window, activation controls, and review owner.
    failure: A break-glass or service dependency cannot use just-in-time activation.
    retry: Document the exception, constrain scope, monitor use, and set a review and expiry rather than weakening all roles.
    cleanup: Never remove a live privileged assignment automatically; tenant mutation requires separate approval and recovery
      planning.
    waf: 'Security: eligible, scoped, time-bound roles minimize standing privilege while retaining explicit emergency exceptions.'
  changeRequest: A regulator now requires quarterly evidence that external partner access was reviewed by the resource owner
    and that every exemption expired within ninety days; revise evidence flow and escalation.
  challenge: Design the minimum licensing and Graph permission model for auditors to read results without managing access
    packages or reviews.
  troubleshooting:
  - Separate policy evaluation delay from a genuinely noncompliant resource state.
  - Verify Graph permission, license, and object ownership independently when governance objects are absent.
  - Detect self-review and missing fallback reviewers before an access review is scheduled.
  architectureAnalysis:
    permissions: Resource Policy Reader and directory governance read roles support assessment; policy assignments, access
      packages, reviews, and lifecycle workflows require separate approved roles and tenant acknowledgement.
    licensing: Microsoft Entra ID Governance capabilities can require per-user licensing; Azure Policy remediation may also
      create workload-specific service charges.
    costNotes: Compare governance licenses and evidence retention with manual attestation labor, exception chasing, and the
      risk of orphaned access.
    constraints:
    - External partner access must be reviewed quarterly by the accountable resource owner.
    - Every compliance exemption must have an expiry no later than ninety days and an escalation path.
    assumptions:
    - Each regulated resource and access package maps to a named business owner.
    - Evidence can store immutable identifiers and outcomes without retaining personal or secret fields.
    facts:
      data: Policy compliance, exemption expiry, access-package assignments, review decisions, and lifecycle events form the
        evidence chain.
      scale: External partners and regulated resources change continuously; exact user and assignment counts are inventory-derived.
      latency: Revocation must follow a denied or expired review promptly, with the acceptable processing window owned by
        compliance.
      availability: Reviewer absence needs escalation to a deputy so a quarterly campaign cannot silently auto-approve access.
      rto: Restoring the evidence workflow is a governance objective; production workload RTO is not governed by this decision.
      rpo: Review decisions and exemption history must not be lost between quarterly attestations because they support audit
        reconstruction.
      budget: Governance automation is justified by recurring campaigns and expiring exceptions rather than a one-time compliance
        snapshot.
    candidateAnalyses:
    - name: Azure Policy initiatives plus Microsoft Entra ID Governance lifecycle controls
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 4
        C3: 5
        C4: 5
        C5: 4
      rationale: Policy evaluates resource state while access packages, reviews, and workflows assign accountable identity
        lifecycle decisions.
      rejectedReason: null
    - name: Azure Policy for resources with manual identity recertification
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 3
        C3: 3
        C4: 2
        C5: 4
      rationale: Resource compliance is automatable, but spreadsheet recertification leaves expiry, escalation, and revocation
        weakly coupled.
      rejectedReason: Manual identity evidence cannot reliably prove quarterly owner action and timely revocation at scale.
    - name: Third-party GRC attestations with standing directory and Azure assignments
      eligible: true
      disqualifiers: []
      scores:
        C1: 2
        C2: 3
        C3: 2
        C4: 3
        C5: 2
      rationale: GRC attestations centralize reporting but do not themselves remove standing Azure or directory access.
      rejectedReason: The evidence system remains detached from enforcement and permits reviewed findings to stay active.
    - name: Permanent partner access with nonexpiring policy exemptions
      eligible: false
      disqualifiers:
      - LAB07-REQ-04 requires time-bounded access and exceptions with independently verified expiry.
      scores:
        C1: 1
        C2: 2
        C3: 1
        C4: 3
        C5: 4
      rationale: Permanent exceptions reduce renewal work but defeat the stated review, revocation, and expiry outcomes.
      rejectedReason: The approach is ineligible because neither partner access nor exemptions end deterministically.
    risks:
    - risk: A resource owner can ignore a review campaign until access is implicitly retained.
      mitigation: Configure explicit denial or escalation behavior, named deputies, and an assertion for overdue decisions.
    - risk: Policy exemptions can be recreated with a new identifier to evade the ninety-day limit.
      mitigation: Query all effective exemptions by scope and owner, then flag overlapping replacements in the evidence ledger.
    waf:
      reliability: Deputy reviewers and deterministic campaign outcomes prevent governance from stalling on one unavailable
        owner.
      security: Expiring access packages and exemptions reduce standing privilege and policy bypass duration.
      costOptimization: Automated recurring evidence replaces manual quarterly reconciliation while license scope remains
        explicit.
      operationalExcellence: One trace joins policy state, review decisions, revocation, owners, and escalation timestamps.
      performanceEfficiency: Campaign scoping and incremental compliance queries avoid reevaluating unrelated identities and
        resources.
    safeAnalogue: Use synthetic policy, exemption, access-review, and lifecycle fixtures to prove joins and expiry handling
      without a Graph or Azure request.
    adrConsequences:
    - Resource owners become accountable for both access reviews and policy-exemption business justification.
    - Identity and Azure governance evidence must be correlated without assuming either system proves the other.
    changeExpectedRevision: Add quarterly resource-owner campaigns, ninety-day exemption bounds, and overdue escalation to
      the evidence flow.
    revisedDecision:
      selectedCandidate: Azure Policy initiatives plus Microsoft Entra ID Governance lifecycle controls
      mandatoryRequirementId: LAB07-REQ-04
      reason: LAB07-REQ-04 requires recurring owner-attributed access review, so linked Policy and Entra governance evidence
        adds quarterly partner decisions alongside independently bounded ninety-day exemptions.
      waf:
        reliability: Deputy review and escalation prevent a campaign from failing because one owner is absent.
        security: Access and exemptions terminate automatically when their approved period ends.
        costOptimization: Targeted licensed governance replaces broad manual evidence collection.
        operationalExcellence: Correlated timestamps demonstrate review, expiry, revocation, and escalation outcomes.
        performanceEfficiency: Owner-scoped campaigns limit review volume and focus compliance queries on exceptions.
- number: 08
  scenario: Woodgrove Bank is replacing a small line-of-business database hosted on aging virtual machines. The application
    uses ordinary SQL transactions and predictable daytime demand, can change connection handling, and has no instance-scoped
    SQL Server dependency. Demand falls close to zero overnight, yet month-end processing needs temporary compute growth.
    Architects must compare Azure SQL Database, Azure SQL Managed Instance, and Azure Database for PostgreSQL rather than
    defaulting to the familiar engine. As the data architect, select the relational platform and service tier, define identity
    and network boundaries, and provide command evidence that the chosen compute model matches compatibility, operations,
    elasticity, latency, and cost constraints.
  role: Relational data platform architect
  outcome: A justified relational service and tier selection with a secure, elastic reference configuration.
  duration: 155 minutes
  difficulty: advanced
  costClass: moderate
  businessOutcome: Modernize the database with less operational toil and cost while retaining transactional correctness and
    month-end capacity.
  stakeholders:
  - Application engineering
  - Database administration
  - Information security
  - FinOps
  primarySource:
    title: Choose a data store in Azure
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/data-stores-getting-started
  candidates:
  - Azure SQL Database General Purpose serverless
  - Azure SQL Managed Instance General Purpose
  - Azure Database for PostgreSQL Flexible Server General Purpose
  selected: Azure SQL Database General Purpose serverless
  checkpoints:
  - title: Convert workload facts into platform criteria
    requirement: LAB08-REQ-01
    command: az sql db list-editions --location $Location --query "[?name=='GeneralPurpose'].{edition:name,families:supportedFamilies}"
      -o json
    positiveCommand: az sql db list-editions --location $Location --query '[?name == ''GeneralPurpose'' && zoneRedundant ==
      `true`].name' -o tsv
    negativeCommand: az sql db list-editions --location $Location --query "[?name=='Web' || name=='Business'].name" -o tsv
    expected: Compatibility, transaction, scale, latency, maintenance, and cost facts map to supported current service tiers.
    negative: Retired service tiers or unverified regional capabilities are not used in the decision.
    evidence: Sanitized workload fact sheet, edition names, supported families, region, and decision criteria.
    failure: A required feature is instance-scoped or unavailable in the target region and tier.
    retry: Reclassify the requirement as mandatory and rescore Managed Instance before choosing a larger database tier.
    cleanup: This regional capability query creates no resource.
    waf: 'Performance Efficiency: measured workload demand and compatibility select a supported service tier.'
  - title: Establish a logical server boundary
    requirement: LAB08-REQ-02
    command: az sql server create --name $SqlServerName --resource-group $ResourceGroup --location $Location --enable-ad-only-auth
      --external-admin-principal-type Group --external-admin-name $AdminGroupName --external-admin-sid $AdminGroupObjectId
      --tags purpose=az305-lab labId=LAB-08 runId=$RunId expiresOn=$ExpiresOn
    positiveCommand: az sql server show --name $SqlServerName --resource-group $ResourceGroup --query "{name:name,location:location,publicNetworkAccess:publicNetworkAccess,identity:identity.type}"
      -o json
    negativeCommand: az sql server ad-admin list --server-name $SqlServerName --resource-group $ResourceGroup --query "[?administratorType!='ActiveDirectory'].administratorType"
      -o tsv
    expected: The logical server has a group-owned Microsoft Entra administrator and no SQL authentication dependency.
    negative: No personal administrator or legacy SQL administrator is part of the access design.
    evidence: Server label, region, administrator group label, authentication mode, and resource ID without credentials.
    failure: Directory object lookup or SQL Entra-only authentication is unavailable to the executing identity.
    retry: Confirm the group object ID and delegated permission; do not substitute a committed password.
    cleanup: Delete databases and private endpoints before the run-owned logical server.
    waf: 'Security: Entra-only authentication and group administration remove personal and password-based control paths.'
  - title: Configure an elastic serverless database
    requirement: LAB08-REQ-03
    command: az sql db create --resource-group $ResourceGroup --server $SqlServerName --name $DatabaseName --edition GeneralPurpose
      --compute-model Serverless --family Gen5 --capacity 2 --min-capacity 0.5 --auto-pause-delay 60 --zone-redundant false
      --tags purpose=az305-lab labId=LAB-08 runId=$RunId expiresOn=$ExpiresOn
    positiveCommand: az sql db show --resource-group $ResourceGroup --server $SqlServerName --name $DatabaseName --query "{edition:edition,computeModel:computeModel,capacity:sku.capacity,minCapacity:minCapacity,autoPause:autoPauseDelay}"
      -o json
    negativeCommand: az sql db show --resource-group $ResourceGroup --server $SqlServerName --name $DatabaseName --query "{edition:edition,serviceObjective:currentServiceObjectiveName}"
      -o json
    expected: General Purpose serverless supplies bounded autoscaling and one-hour autopause for the intermittent workload.
    negative: A continuously provisioned premium or warehouse tier is not selected without a requirement.
    evidence: Database label, edition, family, maximum and minimum vCores, autopause delay, and zone decision.
    failure: Features such as geo replicas or sustained minimum activity prevent autopause or serverless use.
    retry: Measure the blocking dependency and compare provisioned General Purpose without changing database engine.
    cleanup: Delete the run-owned database before its logical server; do not purge backups.
    waf: 'Cost Optimization: serverless compute scales down during idle periods within an approved capacity ceiling.'
  - title: Require private application connectivity
    requirement: LAB08-REQ-04
    command: az network private-endpoint create --name $PrivateEndpointName --resource-group $ResourceGroup --location $Location
      --subnet $SubnetId --private-connection-resource-id $SqlServerResourceId --group-id sqlServer --connection-name $PrivateConnectionName
      --tags purpose=az305-lab labId=LAB-08 runId=$RunId expiresOn=$ExpiresOn
    positiveCommand: az network private-endpoint-connection list --id $SqlServerResourceId --query "[?properties.privateLinkServiceConnectionState.status=='Approved'].id"
      -o tsv
    negativeCommand: az sql server firewall-rule list --resource-group $ResourceGroup --server $SqlServerName --query "[?startIpAddress=='0.0.0.0'
      && endIpAddress=='0.0.0.0'].name" -o tsv
    expected: The application reaches the logical server through an approved private endpoint and private DNS path.
    negative: The Azure-services firewall bypass is absent and public access is not the recovery path for DNS errors.
    evidence: Private endpoint ID, connection status, subnet ID, DNS zone label, and firewall-rule count.
    failure: Private DNS resolves incorrectly or the endpoint connection remains pending.
    retry: Correct DNS linkage and approval independently before disabling or reopening any network path.
    cleanup: Delete private DNS records and endpoint connections before server cleanup; preserve shared zones.
    waf: 'Reliability: private DNS and endpoint approval are explicit, independently testable application dependencies.'
  - title: Validate the service-tier decision
    requirement: LAB08-REQ-05
    command: az sql db show --resource-group $ResourceGroup --server $SqlServerName --name $DatabaseName --query "{status:status,sku:sku,requestedServiceObjectiveName:requestedServiceObjectiveName,zoneRedundant:zoneRedundant}"
      -o json
    positiveCommand: az sql db show --resource-group $ResourceGroup --server $SqlServerName --name $DatabaseName --query "status"
      -o tsv
    negativeCommand: az sql db list-usages --resource-group $ResourceGroup --server $SqlServerName --name $DatabaseName --query
      "[?currentValue>=limit].name" -o tsv
    expected: Provisioned configuration matches the selected candidate and all mandatory compatibility and capacity requirements.
    negative: No reported database usage dimension is already at its service limit.
    evidence: SKU, status, objective, capacity bounds, utilization assumptions, and selected-candidate traceability.
    failure: Observed capacity demand contradicts the serverless cost or latency assumptions.
    retry: Re-run the decision matrix with measured demand and choose provisioned compute or another tier deliberately.
    cleanup: Retain only sanitized configuration evidence, then follow database-to-server cleanup order.
    waf: 'Operational Excellence: configuration and usage evidence tie the deployed database back to the reviewed service
      decision.'
  changeRequest: The acquired application reveals a hard dependency on SQL Agent, cross-database transactions, and instance-level
    collation; revise the platform choice without treating a larger SQL Database tier as compatibility.
  challenge: Quantify the operational and cost consequences of moving the design to Azure SQL Managed Instance General Purpose.
  troubleshooting:
  - Separate engine compatibility requirements from performance symptoms when scoring platform candidates.
  - Verify regional edition and feature availability before treating a deployment error as invalid syntax.
  - Diagnose private endpoint approval, DNS, and SQL authorization as independent connection layers.
  architectureAnalysis:
    permissions: SQL resource read access supports discovery; server, database, networking, or migration changes require a
      separately approved SQL control-plane role and database permissions.
    licensing: Azure SQL Database serverless and Azure SQL Managed Instance use different compute, storage, backup, and license-benefit
      models.
    costNotes: Compare idle auto-pause savings, month-end compute, managed-instance baseline capacity, backup storage, and
      migration effort.
    constraints:
    - Transactional correctness and month-end processing must be preserved while reducing database administration.
    - SQL Agent, cross-database transactions, and instance-level collation are mandatory after discovery of the acquired application.
    assumptions:
    - Compatibility assessment evidence is available before a target platform is provisioned.
    - The application owner can schedule migration testing without changing the source database during this lab.
    facts:
      data: The source uses relational transactions plus instance-scoped behaviors discovered through compatibility assessment.
      scale: Ordinary utilization is intermittent but month-end capacity is materially higher; measured vCore and storage
        values remain source evidence.
      latency: Transaction response and month-end batch deadlines require benchmarks; the scenario does not invent a millisecond
        target.
      availability: Managed service high availability must cover platform faults without confusing backups with service continuity.
      rto: Cutover rollback and database restoration need owner-approved targets before production migration.
      rpo: Transaction-loss tolerance is an application requirement to be measured; no numerical value is supplied here.
      budget: Serverless can reduce idle cost, whereas Managed Instance commits baseline capacity to satisfy instance compatibility.
    candidateAnalyses:
    - name: Azure SQL Database General Purpose serverless
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 4
        C3: 4
        C4: 5
        C5: 5
      rationale: Before the acquired dependency is known, serverless SQL Database best matches intermittent load and minimizes
        platform administration.
      rejectedReason: null
    - name: Azure SQL Managed Instance General Purpose
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 4
        C3: 4
        C4: 4
        C5: 2
      rationale: Managed Instance provides broader instance compatibility and managed operations, with a higher continuously
        allocated cost floor.
      rejectedReason: Its initial cost is not justified until SQL Agent and instance-level dependencies become mandatory.
    - name: Azure Database for PostgreSQL Flexible Server General Purpose
      eligible: true
      disqualifiers: []
      scores:
        C1: 2
        C2: 4
        C3: 4
        C4: 3
        C5: 3
      rationale: PostgreSQL is a capable managed relational target, but engine conversion expands schema, code, testing, and
        cutover work.
      rejectedReason: Engine migration risk is unnecessary for an application whose discovered dependencies remain SQL Server
        specific.
    - name: Larger Azure SQL Database tier without compatibility remediation
      eligible: false
      disqualifiers:
      - LAB08-REQ-01 requires mandatory engine and instance compatibility to be established before selecting a service tier.
      scores:
        C1: 1
        C2: 4
        C3: 4
        C4: 3
        C5: 2
      rationale: More database compute changes capacity but does not add missing instance-scoped compatibility features.
      rejectedReason: The candidate is disqualified because scaling cannot repair a platform compatibility gap.
    risks:
    - risk: Compatibility tooling can miss runtime jobs or infrequently used cross-database paths.
      mitigation: Reconcile assessment output with SQL Agent history, dependency telemetry, and an owner-signed feature inventory.
    - risk: Managed Instance baseline cost may exceed the modernization budget during idle periods.
      mitigation: Size from measured month-end and ordinary load, apply license benefits where eligible, and expose the fixed-cost
        delta.
    waf:
      reliability: Managed database high availability and tested rollback protect transactions during platform and migration
        failure.
      security: Private access, managed identity where supported, encryption, and least-privilege database roles remain target
        requirements.
      costOptimization: Compute model follows measured utilization while compatibility prevents false savings that reappear
        as remediation work.
      operationalExcellence: Compatibility findings, cutover gates, and post-migration assertions make the target decision
        auditable.
      performanceEfficiency: Month-end benchmarks and workload-specific sizing replace an assumption that a larger tier fixes
        incompatibility.
    safeAnalogue: null
    adrConsequences:
    - The initial serverless recommendation is superseded for the acquired workload after compatibility evidence changes.
    - Managed Instance capacity and networking require a longer provisioning and cost-planning lead time.
    changeExpectedRevision: Re-score compatibility as mandatory and select Managed Instance rather than increasing the SQL
      Database tier.
    revisedDecision:
      selectedCandidate: Azure SQL Managed Instance General Purpose
      mandatoryRequirementId: LAB08-REQ-05
      reason: LAB08-REQ-05 makes SQL Agent, cross-database transactions, and instance collation mandatory, so compatibility
        overrides the initial serverless score and selects Managed Instance.
      waf:
        reliability: Managed Instance retains managed high availability while avoiding unsupported job and transaction workarounds.
        security: The target still requires private networking and least-privilege database administration.
        costOptimization: Higher baseline compute is accepted and must be offset with measured sizing and eligible license
          benefits.
        operationalExcellence: Existing Agent jobs and instance behaviors move into a supported managed operating model.
        performanceEfficiency: Capacity is benchmarked for both ordinary and month-end demand after compatibility is established.
- number: 09
  scenario: Proseware operates a rapidly growing software-as-a-service ledger whose largest tenant is outgrowing a conventional
    Azure SQL Database service objective. Reads dominate during business hours, write volume climbs predictably, and auditors
    require encryption, database auditing, and bounded backup retention. The continuity program will define failover and recovery
    objectives later in Lab 16, so this architecture must focus on scale mechanics and protection controls rather than claim
    an untested recovery outcome. As the relational scalability architect, compare Hyperscale, elastic pools, and Managed
    Instance Business Critical, then validate capacity, read scale, transparent data encryption, auditing, and retention using
    Azure PowerShell.
  role: Relational scalability and protection architect
  outcome: A scalable Azure SQL design with auditable encryption and retention controls, clearly separated from continuity
    promises.
  duration: 165 minutes
  difficulty: advanced
  costClass: elevated
  businessOutcome: Sustain ledger growth and read demand while meeting data-protection controls without overpromising disaster
    recovery.
  stakeholders:
  - SaaS product engineering
  - Database reliability engineering
  - Audit and risk
  - FinOps
  primarySource:
    title: Hyperscale service tier
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale
  candidates:
  - Azure SQL Database Hyperscale with named read-scale replicas
  - Azure SQL Database elastic pool partitioned by tenant
  - Azure SQL Managed Instance Business Critical
  selected: Azure SQL Database Hyperscale with named read-scale replicas
  checkpoints:
  - title: Choose the scale unit and capacity ceiling
    requirement: LAB09-REQ-01
    command: Get-AzSqlDatabase -ResourceGroupName $ResourceGroup -ServerName $SqlServerName -DatabaseName $DatabaseName |
      Select-Object ResourceId,Edition,Capacity,ComputeGeneration
    positiveCommand: Get-AzSqlDatabase -ResourceGroupName $ResourceGroup -ServerName $SqlServerName -DatabaseName $DatabaseName
      | Select-Object DatabaseName,Edition,CurrentServiceObjectiveName,Capacity,MaxSizeBytes
    negativeCommand: Get-AzSqlDatabase -ResourceGroupName $ResourceGroup -ServerName $SqlServerName -DatabaseName $DatabaseName
      | Where-Object { $_.Edition -ne 'Hyperscale' -or $_.Capacity -gt $ApprovedVCoreCeiling }
    expected: The database uses Hyperscale with an approved initial vCore count and documented vertical and horizontal scale
      triggers.
    negative: Capacity does not exceed the FinOps ceiling and no incompatible edition remains selected.
    evidence: Edition, compute generation, vCores, storage limit, scale trigger, and approval owner.
    failure: Migration blockers or regional hardware availability prevent the chosen compute generation.
    retry: Validate compatibility and regional capacity, then select another supported Hyperscale hardware family.
    cleanup: Return a resized run-owned database to its recorded original objective before deletion or handoff.
    waf: 'Cost Optimization: an approved initial size and vCore ceiling constrain Hyperscale spend.'
  - title: Design read workload isolation
    requirement: LAB09-REQ-02
    command: Get-AzSqlDatabase -ResourceGroupName $ResourceGroup -ServerName $SqlServerName -DatabaseName $DatabaseName |
      Select-Object ReadScale,HighAvailabilityReplicaCount
    positiveCommand: Get-AzSqlDatabase -ResourceGroupName $ResourceGroup -ServerName $SqlServerName -DatabaseName $DatabaseName
      | Where-Object { $_.ReadScale -eq 'Enabled' }
    negativeCommand: Get-AzSqlDatabase -ResourceGroupName $ResourceGroup -ServerName $SqlServerName -DatabaseName $DatabaseName
      | Where-Object { $_.HighAvailabilityReplicaCount -gt $ApprovedReplicaCount }
    expected: Read-intent routing and replica count isolate reporting demand within an approved capacity envelope.
    negative: Replica count does not grow without a measured read-throughput requirement and cost approval.
    evidence: ReadScale state, replica count, read-intent connection design, workload split, and capacity owner.
    failure: The application connection string does not request read intent or requires read-after-write consistency.
    retry: Classify query consistency needs and route only tolerant read workloads to replicas.
    cleanup: Restore recorded read-scale and replica settings before disposing of the run-owned database.
    waf: 'Performance Efficiency: read-intent routing isolates suitable queries and protects primary write capacity.'
  - title: Verify transparent data encryption and key custody
    requirement: LAB09-REQ-03
    command: Get-AzSqlDatabaseTransparentDataEncryption -ResourceGroupName $ResourceGroup -ServerName $SqlServerName -DatabaseName
      $DatabaseName
    positiveCommand: Get-AzSqlDatabaseTransparentDataEncryption -ResourceGroupName $ResourceGroup -ServerName $SqlServerName
      -DatabaseName $DatabaseName | Where-Object { $_.State -eq 'Enabled' }
    negativeCommand: Get-AzSqlServerKeyVaultKey -ResourceGroupName $ResourceGroup -ServerName $SqlServerName | Where-Object
      { $_.Type -eq 'AzureKeyVault' -and $_.Uri -eq $null }
    expected: TDE is enabled and the Microsoft-managed or customer-managed key decision names custody, rotation, and availability
      dependencies.
    negative: No customer-managed key reference lacks a resolvable vault key URI.
    evidence: Encryption state, protector class, non-secret key URI, rotation owner, and dependency rationale.
    failure: The server identity cannot unwrap a customer-managed key or the vault path is unavailable.
    retry: Validate managed identity, Key Vault RBAC, key state, and network access independently.
    cleanup: Restore the original protector before removing a run-owned key association; never purge keys.
    waf: 'Reliability: key identity, vault reachability, and rotation ownership make the external encryption dependency operable.'
  - title: Configure tamper-resistant auditing
    requirement: LAB09-REQ-04
    command: Get-AzSqlDatabaseAudit -ResourceGroupName $ResourceGroup -ServerName $SqlServerName -DatabaseName $DatabaseName
      | Select-Object BlobStorageTargetState,StorageAccountResourceId,RetentionInDays
    positiveCommand: Get-AzSqlDatabaseAudit -ResourceGroupName $ResourceGroup -ServerName $SqlServerName -DatabaseName $DatabaseName
      | Select-Object BlobStorageTargetState,StorageAccountResourceId,RetentionInDays
    negativeCommand: Get-AzSqlDatabaseAudit -ResourceGroupName $ResourceGroup -ServerName $SqlServerName -DatabaseName $DatabaseName
      | Where-Object { $_.BlobStorageTargetState -ne 'Enabled' -or $_.RetentionInDays -lt 90 }
    expected: Database audit events route to the approved protected storage target for the mandated ninety days.
    negative: Auditing is not disabled and retention is not shorter than the control requirement.
    evidence: Audit state, sanitized storage resource ID, retention days, event categories, and control owner.
    failure: Storage authorization, firewall rules, or destination immutability prevents audit delivery.
    retry: Validate identity, network, and storage protection separately before changing the audit control.
    cleanup: Restore recorded audit settings before removing a run-owned destination; retain required evidence lawfully.
    waf: 'Security: protected auditing creates accountable evidence of material database activity.'
  - title: Bound backup retention without claiming recovery
    requirement: LAB09-REQ-05
    command: Get-AzSqlDatabaseBackupShortTermRetentionPolicy -ResourceGroupName $ResourceGroup -ServerName $SqlServerName
      -DatabaseName $DatabaseName
    positiveCommand: Get-AzSqlDatabaseBackupLongTermRetentionPolicy -ResourceGroupName $ResourceGroup -ServerName $SqlServerName
      -DatabaseName $DatabaseName
    negativeCommand: Get-AzSqlDatabaseBackupShortTermRetentionPolicy -ResourceGroupName $ResourceGroup -ServerName $SqlServerName
      -DatabaseName $DatabaseName | Where-Object { $_.RetentionDays -gt $ApprovedShortTermRetentionDays }
    expected: Short- and long-term retention satisfy legal and operational protection requirements with an identified cost
      owner.
    negative: Retention is not extended beyond approval and is not presented as proof of tested RPO or restore time.
    evidence: Retention values, backup storage redundancy choice, legal rationale, cost owner, and Lab 16 dependency.
    failure: Legal-hold needs conflict with the database-native retention limit or cost envelope.
    retry: Evaluate immutable archive evidence and revise the protection design without inventing a recovery claim.
    cleanup: Never purge service-managed backups; remove only run-owned configuration through supported retention behavior.
    waf: 'Operational Excellence: explicit retention evidence separates configured protection from recovery claims owned by
      Lab 16.'
  changeRequest: A new tenant produces unpredictable read bursts but contributes little write load and requires strict cost
    attribution; revise replica and tenancy decisions without weakening encryption or audit controls.
  challenge: Compare a named Hyperscale replica with tenant extraction into an elastic pool, including consistency, routing,
    isolation, and cost evidence.
  troubleshooting:
  - Verify application read-intent routing before adding replicas to solve a read bottleneck.
  - Diagnose TDE state, server identity, vault RBAC, and key reachability as separate layers.
  - Treat configured backup retention as protection evidence, not proof that recovery objectives were achieved.
  architectureAnalysis:
    permissions: SQL resource read access and database metadata visibility support assessment; replica, audit, key, or scaling
      changes require separate authorized roles.
    licensing: Hyperscale replicas, elastic pools, Managed Instance Business Critical replicas, audit storage, and customer-managed
      keys have different billing implications.
    costNotes: Attribute primary compute, named replica capacity, storage growth, backup retention, auditing, and tenant-specific
      burst consumption.
    constraints:
    - Ledger growth and read demand must scale without weakening encryption, auditing, or recovery evidence.
    - One low-write tenant has unpredictable read bursts and requires strict cost attribution.
    assumptions:
    - Tenant identity is available in query and telemetry dimensions without exposing ledger content.
    - Read-only workloads can be routed separately from transactional writes and tolerate documented replica lag.
    facts:
      data: An append-heavy relational ledger requires encrypted storage, immutable audit evidence, backups, and tenant-attributed
        query telemetry.
      scale: Storage and read concurrency grow independently; one tenant creates bursty reads while contributing little write
        volume.
      latency: Transaction writes need predictable primary latency and reporting reads have a separately measured replica-lag
        tolerance.
      availability: Read replicas must not be presented as disaster recovery unless failover, data-loss, and connection behavior
        are validated.
      rto: Regional recovery remains an owner-approved continuity requirement; the exercise does not assign an unsupported
        numerical RTO.
      rpo: Ledger protection requires an explicit recovery window and backup validation even when read replicas are healthy.
      budget: Dedicated burst capacity is charged to the tenant only when telemetry can separate its replica and query consumption.
    candidateAnalyses:
    - name: Azure SQL Database Hyperscale with named read-scale replicas
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 5
        C3: 4
        C4: 4
        C5: 3
      rationale: Hyperscale decouples storage growth from named read replicas and supports intentional routing of tenant reporting
        load.
      rejectedReason: null
    - name: Azure SQL Database elastic pool partitioned by tenant
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 3
        C3: 4
        C4: 3
        C5: 4
      rationale: Tenant databases in an elastic pool improve chargeback and isolation but add partition routing and cross-tenant
        reporting work.
      rejectedReason: Pool partitioning does not match the shared ledger model as cleanly and increases operational fragmentation.
    - name: Azure SQL Managed Instance Business Critical
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 5
        C3: 4
        C4: 3
        C5: 2
      rationale: Business Critical offers strong local availability and readable secondaries, but its fixed instance footprint
        is costly for variable reads.
      rejectedReason: The design pays for broad instance capability that the ledger does not require and weakens tenant-specific
        attribution.
    - name: One vertically scaled database with no read routing or tenant telemetry
      eligible: false
      disqualifiers:
      - LAB09-REQ-02 requires independent read workload isolation inside an approved and attributable capacity envelope.
      scores:
        C1: 1
        C2: 3
        C3: 2
        C4: 3
        C5: 2
      rationale: Vertical scaling is simple but couples writes, all tenant reads, and cost into one opaque capacity ceiling.
      rejectedReason: It is ineligible because it cannot isolate the burst or prove tenant cost attribution.
    risks:
    - risk: A named replica can lag and return stale ledger projections during a burst.
      mitigation: Route only approved read workloads, measure replica delay, and fall back to the primary when freshness exceeds
        the contract.
    - risk: Tenant labels in telemetry may be inconsistent and produce disputed chargeback.
      mitigation: Validate the tenant dimension at ingress and reconcile replica/query usage against the authoritative tenant
        registry.
    waf:
      reliability: Primary writes, read routing, backup recovery, and regional continuity are validated as distinct mechanisms.
      security: Encryption, auditing, and tenant-aware access remain mandatory across primary and replica endpoints.
      costOptimization: Named burst capacity and query telemetry make the exceptional tenant's demand attributable.
      operationalExcellence: Replica lag, routing, protection, and audit evidence share one tenant-labeled operating view.
      performanceEfficiency: Read replicas absorb unpredictable reporting load without scaling the transactional primary for
        every burst.
    safeAnalogue: null
    adrConsequences:
    - Applications must classify read paths by freshness and support intentional replica routing.
    - Finance needs durable tenant dimensions in performance and cost evidence before chargeback is enforceable.
    changeExpectedRevision: Isolate the bursty tenant's read workload on named capacity and make its consumption visible without
      changing ledger protection.
    revisedDecision:
      selectedCandidate: Azure SQL Database Hyperscale with named read-scale replicas
      mandatoryRequirementId: LAB09-REQ-02
      reason: LAB09-REQ-02 makes read-workload isolation mandatory, so Hyperscale is retained with a named replica and routing
        policy dedicated to the bursty tenant's attributable reads.
      waf:
        reliability: Freshness checks keep stale replica results from silently entering ledger workflows.
        security: The tenant replica preserves encryption, audit, and authorization controls from the primary design.
        costOptimization: Dedicated replica hours and queries can be assigned to the tenant that creates them.
        operationalExcellence: Tenant-tagged lag and routing telemetry expose when fallback to the primary occurs.
        performanceEfficiency: Bursty reads scale independently while write capacity remains sized for actual ledger traffic.
- number: '10'
  scenario: Alpine Ski House is designing a global product-catalog API whose items have optional attributes, localized descriptions,
    and tenant-specific extensions. Reads arrive by tenant and product category, seasonal traffic is highly variable, and
    the application needs predictable low-latency access without relational joins. The team is considering Azure Cosmos DB
    for NoSQL, Azure Table Storage, and storing JSON in Azure SQL Database. As the semi-structured data architect, select
    a model, partition key, consistency level, indexing policy, throughput mode, and network boundary. Commands must expose
    the architectural choices and avoid treating global distribution or unlimited scale as automatic consequences of selecting
    a NoSQL service.
  role: Semi-structured data architect
  outcome: A partition-aware Azure Cosmos DB design whose consistency, indexing, throughput, and security decisions match
    access patterns.
  duration: 160 minutes
  difficulty: advanced
  costClass: moderate
  businessOutcome: Serve a variable global catalog workload with predictable latency and controlled throughput cost.
  stakeholders:
  - Digital commerce engineering
  - Product data owners
  - Security architecture
  - FinOps
  primarySource:
    title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
  candidates:
  - Azure Cosmos DB for NoSQL with hierarchical tenant-aware partitioning
  - Azure Table Storage with denormalized entities and account-level scale
  - Azure SQL Database with JSON columns and relational indexes
  selected: Azure Cosmos DB for NoSQL with hierarchical tenant-aware partitioning
  checkpoints:
  - title: Choose API and consistency deliberately
    requirement: LAB10-REQ-01
    command: az cosmosdb create --name $CosmosAccountName --resource-group $ResourceGroup --locations regionName=$Location
      failoverPriority=0 isZoneRedundant=false --default-consistency-level Session --enable-free-tier false --tags purpose=az305-lab
      labId=LAB-10 runId=$RunId expiresOn=$ExpiresOn
    positiveCommand: az cosmosdb show --name $CosmosAccountName --resource-group $ResourceGroup --query "{kind:kind,consistency:consistencyPolicy.defaultConsistencyLevel,locations:locations[].locationName}"
      -o json
    negativeCommand: az cosmosdb show --name $CosmosAccountName --resource-group $ResourceGroup --query "{consistency:consistencyPolicy.defaultConsistencyLevel,regionCount:length(locations)}"
      -o json
    expected: The NoSQL API and Session consistency support session read-your-writes with documented cross-session behavior.
    negative: Strong consistency is not selected reflexively for a multi-region catalog without its latency and availability
      trade-off.
    evidence: Account label, API kind, consistency, region count, application session boundary, and rationale.
    failure: A required read guarantee cannot be expressed with Session consistency and session-token propagation.
    retry: Model the exact anomaly, then compare Bounded Staleness or Strong consistency against latency and availability.
    cleanup: Delete containers and databases before the run-owned account; never treat account deletion as data recovery.
    waf: 'Reliability: a documented consistency contract makes read behavior predictable across sessions and regions.'
  - title: Design a high-cardinality partition key
    requirement: LAB10-REQ-02
    command: $ownedCosmosId = az cosmosdb show --name $CosmosAccountName --resource-group $ResourceGroup --query id -o tsv
      --only-show-errors; if ($ownedCosmosId -ine $CosmosAccountResourceId) { throw 'The supplied Cosmos DB ID is not the
      exact run-owned account.' }; az cosmosdb sql database create --account-name $CosmosAccountName --resource-group $ResourceGroup
      --name $CosmosDatabaseName --only-show-errors | Out-Null; az cosmosdb sql container create --account-name $CosmosAccountName
      --resource-group $ResourceGroup --database-name $CosmosDatabaseName --name $ContainerName --partition-key-path /tenantId
      --max-throughput 4000 --only-show-errors
    positiveCommand: az cosmosdb sql container show --account-name $CosmosAccountName --resource-group $ResourceGroup --database-name
      $CosmosDatabaseName --name $ContainerName --query "{partitionKey:resource.partitionKey.paths,maxThroughput:resource.offerThroughput}"
      -o json
    negativeCommand: az cosmosdb sql container show --account-name $CosmosAccountName --resource-group $ResourceGroup --database-name
      $CosmosDatabaseName --name $ContainerName --query "resource.partitionKey.paths[?@=='/status']" -o json
    expected: The tenant-aware key distributes writes, supports dominant reads, and has a mitigation for exceptionally large
      tenants.
    negative: A low-cardinality mutable property such as status is not used as the partition key.
    evidence: Partition-key path, cardinality estimate, largest logical partition estimate, query patterns, and hotspot mitigation.
    failure: One tenant can exceed logical-partition storage or throughput limits.
    retry: Evaluate a hierarchical tenant-and-category key or synthetic suffix using measured access patterns.
    cleanup: Delete the run-owned container before its database and account.
    waf: 'Performance Efficiency: a high-cardinality access-aligned key distributes storage and request units.'
  - title: Minimize indexing write amplification
    requirement: LAB10-REQ-03
    command: $ownedCosmosId = az cosmosdb show --name $CosmosAccountName --resource-group $ResourceGroup --query id -o tsv
      --only-show-errors; if ($ownedCosmosId -ine $CosmosAccountResourceId) { throw 'The supplied Cosmos DB ID is not the
      exact run-owned account.' }; az cosmosdb sql container update --account-name $CosmosAccountName --resource-group $ResourceGroup
      --database-name $CosmosDatabaseName --name $ContainerName --idx @artifacts/indexing-policy.json --only-show-errors
    positiveCommand: az cosmosdb sql container show --account-name $CosmosAccountName --resource-group $ResourceGroup --database-name
      $CosmosDatabaseName --name $ContainerName --query "resource.indexingPolicy.{mode:indexingMode,included:includedPaths,excluded:excludedPaths}"
      -o json
    negativeCommand: az cosmosdb sql container show --account-name $CosmosAccountName --resource-group $ResourceGroup --database-name
      $CosmosDatabaseName --name $ContainerName --query "resource.indexingPolicy.includedPaths[?path=='/*']" -o json
    expected: Indexed paths serve known filters and ordering while large descriptive payloads are explicitly excluded.
    negative: A blanket include-all policy is not retained when measured writes and unused fields make it wasteful.
    evidence: Index-policy hash, included and excluded paths, composite indexes, query examples, and RU estimate.
    failure: A production query requires a path or composite order omitted from the policy.
    retry: Add the narrowest supported index after evaluating transformation cost and expected RU reduction.
    cleanup: Restore the original indexing policy before deleting a retained container.
    waf: 'Operational Excellence: a versioned indexing policy makes query support and write amplification reviewable.'
  - title: Bound autoscale throughput
    requirement: LAB10-REQ-04
    command: $ownedCosmosId = az cosmosdb show --name $CosmosAccountName --resource-group $ResourceGroup --query id -o tsv
      --only-show-errors; if ($ownedCosmosId -ine $CosmosAccountResourceId) { throw 'The supplied Cosmos DB ID is not the
      exact run-owned account.' }; az cosmosdb sql container throughput migrate --account-name $CosmosAccountName --resource-group
      $ResourceGroup --database-name $CosmosDatabaseName --name $ContainerName --throughput-type autoscale --only-show-errors
    positiveCommand: az cosmosdb sql container throughput show --account-name $CosmosAccountName --resource-group $ResourceGroup
      --database-name $CosmosDatabaseName --name $ContainerName --query "resource.autoscaleSettings.maxThroughput" -o tsv
    negativeCommand: az cosmosdb sql container throughput show --account-name $CosmosAccountName --resource-group $ResourceGroup
      --database-name $CosmosDatabaseName --name $ContainerName --query "resource.autoscaleSettings.maxThroughput" -o tsv
    expected: Autoscale absorbs seasonal bursts up to an approved maximum RU/s with alerts for sustained saturation.
    negative: The configured maximum does not exceed the approved cost envelope.
    evidence: Throughput mode, maximum RU/s, minimum billing implication, scale trigger, and cost owner.
    failure: Shared-container tenants cannot be attributed or one partition consumes the full maximum.
    retry: Measure normalized RU consumption by tenant and reconsider dedicated containers or partitioning before raising
      the maximum.
    cleanup: Restore recorded throughput mode only when the service supports reversal; otherwise record the limitation.
    waf: 'Cost Optimization: a governed autoscale maximum absorbs bursts while bounding throughput spend.'
  - title: Restrict the account network boundary
    requirement: LAB10-REQ-05
    command: az network private-endpoint create --name $PrivateEndpointName --resource-group $ResourceGroup --location $Location
      --subnet $SubnetId --private-connection-resource-id $CosmosAccountResourceId --group-id Sql --connection-name $PrivateConnectionName
      --tags purpose=az305-lab labId=LAB-10 runId=$RunId expiresOn=$ExpiresOn
    positiveCommand: az network private-endpoint-connection list --id $CosmosAccountResourceId --query "[?properties.privateLinkServiceConnectionState.status=='Approved'].id"
      -o tsv --only-show-errors
    negativeCommand: az cosmosdb show --name $CosmosAccountName --resource-group $ResourceGroup --query "{publicNetworkAccess:publicNetworkAccess,ipRuleCount:length(ipRules)}"
      -o json
    expected: Application access resolves through an approved private endpoint and the intended private DNS zone.
    negative: Unrestricted public network access is not retained as a fallback.
    evidence: Account ID, endpoint ID, group ID, approval state, subnet, and private DNS zone label.
    failure: The wrong subresource group or DNS zone produces a public endpoint resolution.
    retry: Validate Sql group selection, private DNS linking, and endpoint approval independently.
    cleanup: Remove DNS records and the private endpoint before the account; preserve shared network assets.
    waf: 'Security: private connectivity prevents unrestricted public access to the semi-structured data account.'
  changeRequest: One enterprise tenant grows to forty percent of all traffic and requires per-tenant cost attribution and
    data isolation; revise partition and container strategy without breaking other tenants.
  challenge: Compare hierarchical partition keys, a dedicated container, and a dedicated account for the dominant tenant using
    scale, blast radius, and cost criteria.
  troubleshooting:
  - Diagnose partition skew with normalized RU and logical-partition size before raising throughput.
  - Validate indexing-path and composite-index needs from real query shapes rather than indexing every field.
  - Check private endpoint subresource, approval, and private DNS separately when connectivity fails.
  architectureAnalysis:
    permissions: Cosmos DB Account Reader and data-plane read permissions support inspection; account, container, throughput,
      role, or partition changes require separate authorization.
    licensing: Request-unit throughput, autoscale ceilings, storage, multi-region distribution, backups, and analytical features
      are independently billed.
    costNotes: Model request units by tenant and operation, hot-partition amplification, index cost, retained data, and any
      dedicated container capacity.
    constraints:
    - The global catalog needs predictable latency under variable semi-structured demand.
    - One enterprise tenant reaches forty percent of traffic and requires both cost attribution and data isolation.
    assumptions:
    - Catalog requests include stable tenant and item hierarchy fields suitable for a partition strategy.
    - The application can route an exceptional tenant to a dedicated container without changing public identifiers.
    facts:
      data: Semi-structured catalog documents vary by product class and carry tenant, category, item, and lifecycle attributes.
      scale: One tenant generates forty percent of traffic; item count and request-unit measurements remain workload-supplied
        sizing inputs.
      latency: Customer catalog reads need predictable global response, while cross-partition administrative queries may tolerate
        higher latency.
      availability: Regional reads and writes require an explicit consistency and failover choice rather than assuming distribution
        alone guarantees continuity.
      rto: Regional service recovery follows the selected replication topology; the scenario does not specify a numerical
        RTO.
      rpo: Consistency and multi-region write choices determine accepted-write loss behavior and require business approval.
      budget: Shared autoscale capacity is economical until the dominant tenant's hot partitions and chargeback justify a
        dedicated boundary.
    candidateAnalyses:
    - name: Azure Cosmos DB for NoSQL with hierarchical tenant-aware partitioning
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 4
        C3: 4
        C4: 4
        C5: 5
      rationale: Hierarchical partition keys distribute tenant and catalog access while preserving native document evolution
        and global service capabilities.
      rejectedReason: null
    - name: Azure Table Storage with denormalized entities and account-level scale
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 3
        C3: 3
        C4: 3
        C5: 5
      rationale: Table Storage offers inexpensive key-value access but provides fewer global consistency and tenant-level
        throughput controls.
      rejectedReason: Lower unit cost does not offset weaker global behavior and limited isolation for the dominant tenant.
    - name: Azure SQL Database with JSON columns and relational indexes
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 4
        C3: 4
        C4: 4
        C5: 2
      rationale: SQL JSON supports relational governance, although schema variability and global document scaling require
        more application and index management.
      rejectedReason: It couples variable catalog structure to relational capacity and provides a less direct global partition
        model.
    - name: One fixed partition containing the entire catalog
      eligible: false
      disqualifiers:
      - LAB10-REQ-02 requires a partition design that distributes load and isolates the dominant tenant.
      scores:
        C1: 1
        C2: 2
        C3: 2
        C4: 3
        C5: 2
      rationale: A single partition simplifies queries but imposes one throughput and storage bottleneck for every tenant.
      rejectedReason: The proposal is disqualified because it cannot satisfy scale or tenant-isolation acceptance criteria.
    risks:
    - risk: A hierarchical key can still concentrate traffic if the leading tenant segment dominates requests.
      mitigation: Measure normalized RU consumption and move the exceptional tenant to a dedicated container when the threshold
        is crossed.
    - risk: Splitting a tenant can create inconsistent indexing or consistency policies across containers.
      mitigation: Version a common container baseline and compare policy hashes before routing production traffic.
    waf:
      reliability: Explicit region, consistency, and failover behavior protects accepted catalog changes beyond simple data
        distribution.
      security: Tenant-aware data roles and an optional dedicated container provide enforceable isolation boundaries.
      costOptimization: RU attribution and selective tenant separation avoid overprovisioning every catalog partition.
      operationalExcellence: Hot-partition, throttling, policy, and tenant-routing evidence supports repeatable scale decisions.
      performanceEfficiency: Hierarchical partitioning aligns common reads with physical distribution and isolates exceptional
        demand.
    safeAnalogue: null
    adrConsequences:
    - Application routing and telemetry must preserve the tenant partition dimension on every catalog request.
    - A dedicated enterprise container becomes a governed exception with independently tracked throughput and policy.
    changeExpectedRevision: Move the dominant tenant behind a dedicated container boundary while keeping hierarchical partitioning
      for the shared catalog.
    revisedDecision:
      selectedCandidate: Azure Cosmos DB for NoSQL with hierarchical tenant-aware partitioning
      mandatoryRequirementId: LAB10-REQ-02
      reason: LAB10-REQ-02 requires a partition strategy that mitigates an exceptionally large tenant, so Cosmos DB adds a
        dedicated container with independently attributable throughput.
      waf:
        reliability: Tenant separation contains throttling and partition pressure to the exceptional workload.
        security: A dedicated data-plane role and container scope strengthen enterprise-tenant isolation.
        costOptimization: Its provisioned or autoscale RU consumption is measured and charged independently.
        operationalExcellence: Versioned routing and policy checks prevent shared and dedicated containers from drifting.
        performanceEfficiency: The shared hierarchy stays balanced while the dominant tenant scales on its own ceiling.
