    candidateAnalyses:
    - name: Archetype-based management groups with workload subscriptions and governed tags
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 5
        C3: 5
        C4: 3
        C5: 4
      rationale: Archetypes provide stable inheritance for platform, sandbox, and regulated workloads while subscription ownership
        preserves billing separation.
      rejectedReason: null
    - name: Management groups that mirror the corporate reporting hierarchy
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 3
        C3: 4
        C4: 2
        C5: 3
      rationale: A reporting hierarchy appears intuitive, but reorganizations force technical inheritance changes unrelated
