  difficulty: advanced
  costClass: moderate
  businessOutcome: Consolidate unstructured content for governed analytics while preserving scalable access and clear ownership.
  stakeholders:
  - Data platform engineering
  - Supplier integration team
  - Analytics consumers
  - Information security
  primarySource:
    title: Introduction to Azure Data Lake Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction
  candidates:
  - ADLS Gen2 on a hierarchical-namespace StorageV2 account
  - Flat Azure Blob Storage containers with prefix conventions
  - Azure Files shares mounted by analytics and document clients
  selected: ADLS Gen2 on a hierarchical-namespace StorageV2 account
  checkpoints:
  - title: Match service semantics to access patterns
    requirement: LAB11-REQ-01
    command: Get-AzStorageAccountNameAvailability -Name $StorageAccountName
    positiveCommand: Get-AzStorageAccount -ResourceGroupName $ResourceGroup -Name $StorageAccountName | Select-Object StorageAccountName,Kind,PrimaryLocation,EnableHierarchicalNamespace
    negativeCommand: Get-AzStorageAccount -ResourceGroupName $ResourceGroup -Name $StorageAccountName | Where-Object { $_.Kind
      -ne 'StorageV2' -or -not $_.EnableHierarchicalNamespace }
    expected: Object scale, analytics engines, directory operations, and access patterns justify StorageV2 with hierarchical
      namespace.
    negative: SMB semantics or arbitrary relational queries are not claimed for the selected data-lake workload.
    evidence: Data classes, object-size distribution, protocol needs, namespace choice, and service-fit matrix.
    failure: A consumer has a mandatory SMB or NFS behavior not supported by the selected endpoint design.
    retry: Isolate that data class and evaluate Azure Files rather than forcing one service across incompatible protocols.
    cleanup: This selection checkpoint is read-only; subsequent cleanup follows filesystem-to-account order.
    waf: 'Performance Efficiency: hierarchical namespace semantics align directory operations with analytics access patterns.'
  - title: Create a hierarchical namespace boundary
    requirement: LAB11-REQ-02
    command: New-AzStorageAccount -ResourceGroupName $ResourceGroup -Name $StorageAccountName -Location $Location -SkuName
      Standard_ZRS -Kind StorageV2 -EnableHierarchicalNamespace $true -MinimumTlsVersion TLS1_2 -AllowBlobPublicAccess $false
      -Tag @{purpose='az305-lab';labId='LAB-11';runId=$RunId;expiresOn=$ExpiresOn}
    positiveCommand: Get-AzStorageAccount -ResourceGroupName $ResourceGroup -Name $StorageAccountName | Where-Object { $_.EnableHierarchicalNamespace
      -and -not $_.AllowBlobPublicAccess }
    negativeCommand: Get-AzStorageAccount -ResourceGroupName $ResourceGroup -Name $StorageAccountName | Where-Object { $_.MinimumTlsVersion
      -ne 'TLS1_2' -or $_.AllowSharedKeyAccess }
    expected: The account has hierarchical namespace, blocked public blob access, current TLS minimum, and run ownership tags.
    negative: Public containers and Shared Key dependence are not accepted for workload access.
    evidence: Account name, kind, namespace state, TLS version, public-access state, SKU, and ownership tags.
    failure: Hierarchical namespace cannot be enabled after an incompatible account was already created.
    retry: Stop before data ingestion, create a correctly designed account, and migrate only synthetic lab data.
    cleanup: Delete run-owned filesystems and private endpoints before deleting the account.
    waf: 'Reliability: choosing hierarchical namespace before ingestion avoids a disruptive late account migration.'
  - title: Design filesystem and directory ownership
    requirement: LAB11-REQ-03
    command: $ownedStorage = Get-AzStorageAccount -ResourceGroupName $ResourceGroup -Name $StorageAccountName; if ($ownedStorage.Id
      -ine $StorageAccountResourceId) { throw 'The supplied storage account ID is not the exact run-owned account.' }; New-AzStorageContainer
      -Context $ownedStorage.Context -Name $FileSystemName
    positiveCommand: $storageContext = (Get-AzStorageAccount -ResourceGroupName $ResourceGroup -Name $StorageAccountName).Context;
      Get-AzDataLakeGen2Item -Context $storageContext -FileSystem $FileSystemName -Path $DirectoryPath | Select-Object Path,IsDirectory,Owner,Group,Permissions
    negativeCommand: $storageContext = (Get-AzStorageAccount -ResourceGroupName $ResourceGroup -Name $StorageAccountName).Context;
      Get-AzDataLakeGen2ChildItem -Context $storageContext -FileSystem $FileSystemName -Recurse | Where-Object { $_.Permissions
      -eq 'rwxrwxrwx' }
    expected: Filesystems represent durable data-product boundaries and directories have group-owned default and access ACLs.
    negative: World-writable paths and user-owned production directories are absent.
    evidence: Synthetic filesystem and path names, owner and group labels, normalized ACL summary, and data-product owner.
    failure: Azure RBAC grants endpoint access but POSIX ACL traversal denies a child path.
    retry: Trace execute permission on every parent and apply the minimum group ACL with a corresponding default ACL.
    cleanup: Remove child paths before filesystems and retain no file content as evidence.
    waf: 'Operational Excellence: data-product filesystem ownership and inherited ACLs create a supportable namespace.'
  - title: Define encryption and key dependency
    requirement: LAB11-REQ-04
    command: Get-AzStorageAccount -ResourceGroupName $ResourceGroup -Name $StorageAccountName | Select-Object Encryption,Identity
    positiveCommand: Get-AzStorageAccount -ResourceGroupName $ResourceGroup -Name $StorageAccountName | Where-Object { $_.Encryption.Services.Blob.Enabled
      }
    negativeCommand: Get-AzStorageAccount -ResourceGroupName $ResourceGroup -Name $StorageAccountName | Where-Object { $_.Encryption.KeySource
      -eq 'Microsoft.Keyvault' -and $_.Identity.Type -eq 'None' }
    expected: Service encryption is enabled and any customer-managed-key choice includes managed identity, vault, rotation,
      and availability ownership.
    negative: A customer-managed key is not referenced without an identity capable of unwrapping it.
    evidence: Encryption services, key-source class, identity type, non-secret vault reference, and rotation owner.
    failure: The storage identity lacks key permissions or cannot reach the vault network path.
    retry: Validate identity, Key Vault RBAC, key state, DNS, and network reachability independently.
    cleanup: Restore the recorded key source before removing any run-owned key association; never purge keys.
    waf: 'Cost Optimization: customer-managed keys are adopted only when custody requirements justify their lifecycle overhead.'
  - title: Validate private endpoint access
    requirement: LAB11-REQ-05
    command: Get-AzPrivateEndpointConnection -PrivateLinkResourceId $StorageAccountResourceId
    positiveCommand: Get-AzPrivateEndpointConnection -PrivateLinkResourceId $StorageAccountResourceId | Where-Object { $_.PrivateLinkServiceConnectionState.Status
      -eq 'Approved' -and $_.GroupId -contains 'dfs' }
    negativeCommand: Get-AzStorageAccountNetworkRuleSet -ResourceGroupName $ResourceGroup -Name $StorageAccountName | Where-Object
      { $_.DefaultAction -ne 'Deny' }
    expected: The dfs private endpoint is approved, private DNS resolves correctly, and the default network action is deny.
    negative: Public network access is not retained to compensate for a missing dfs endpoint or DNS record.
    evidence: Endpoint ID, dfs group, approval state, subnet, private DNS label, and network default action.
    failure: Only a blob endpoint exists, so hierarchical namespace operations resolve or authorize inconsistently.
    retry: Add and validate the dfs private endpoint and DNS zone without opening public access.
    cleanup: Remove private DNS records and endpoints before the account; preserve shared network resources.
    waf: 'Security: denied public access and explicit dfs connectivity constrain unintended data paths.'
  changeRequest: The legal department introduces collaborative document shares that require native SMB locking and Windows
    ACL behavior, but analytics ingestion must remain object-native; revise the service boundaries.
  challenge: Design a dual-service pattern that avoids synchronizing every object while preserving classification and authoritative
    ownership.
  troubleshooting:
  - Distinguish Blob and dfs private endpoints when hierarchical namespace operations fail.
  - Trace Azure RBAC and every parent-directory ACL independently for authorization failures.
  - Re-evaluate Azure Files only for workloads with true file-protocol semantics, not familiar folder terminology.
  architectureAnalysis:
    permissions: Storage account and data-plane read roles support discovery; account, filesystem, share, ACL, network, or
      lifecycle changes need separately approved rights.
    licensing: ADLS Gen2 transactions, Azure Files provisioned or used capacity, redundancy, snapshots, and private connectivity
      use different meters.
    costNotes: Separate object-ingestion, analytics scan, namespace operation, SMB share, snapshot, egress, and retained-capacity
      costs.
    constraints:
    - Analytics content must remain object-native with hierarchical namespace and governed ownership.
    - Legal collaboration requires native SMB locking and Windows ACL behavior without converting the analytics lake into
      a file share.
    assumptions:
    - Data producers can classify objects and collaborative documents before ingestion.
    - Private DNS and network paths can reach both storage service endpoints from authorized clients.
    facts:
      data: Analytics objects and collaborative legal documents have different protocols, namespace semantics, ACLs, and lifecycle
        owners.
      scale: Object ingestion grows independently from legal share usage; exact terabytes, file counts, and operation rates
        remain measured inputs.
      latency: Analytics favors throughput and parallel scans, while interactive SMB users require responsive metadata and
        locking operations.
      availability: Redundancy and recovery are selected separately for lake data and legal shares based on their business
        impact.
      rto: Service restoration targets are owner decisions per boundary; a single combined storage RTO would hide differing
        needs.
      rpo: Lake ingestion replay and file-share snapshots provide distinct recovery points and must be validated independently.
      budget: Object storage tiers optimize analytical retention while Azure Files cost is limited to content that needs SMB
        semantics.
    candidateAnalyses:
    - name: ADLS Gen2 on a hierarchical-namespace StorageV2 account
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 4
        C3: 5
        C4: 4
        C5: 5
      rationale: ADLS Gen2 provides object-scale analytics, directory-aware ACLs, and integration with the governed data pipeline.
      rejectedReason: null
    - name: Flat Azure Blob Storage containers with prefix conventions
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 4
        C3: 3
        C4: 3
        C5: 5
      rationale: Flat blobs are economical for objects, but prefix conventions do not provide the same directory operations
        and ACL model.
      rejectedReason: It weakens analytics namespace governance without solving the legal SMB requirement.
    - name: Azure Files shares mounted by analytics and document clients
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 4
        C3: 4
        C4: 3
        C5: 2
      rationale: Azure Files supplies SMB behavior for legal users, yet mounting all analytics through file semantics limits
        object-native processing.
      rejectedReason: A universal share imposes the wrong access pattern and cost model on the analytics estate.
    - name: One unmanaged file server for lake ingestion and legal collaboration
      eligible: false
      disqualifiers:
      - LAB11-REQ-01 requires storage service semantics to match object-native analytics engines and access patterns.
      scores:
        C1: 1
        C2: 2
        C3: 2
        C4: 2
        C5: 3
      rationale: A conventional server supports SMB but creates a capacity ceiling and no native object analytics boundary.
      rejectedReason: It is ineligible because the analytics access and scale requirements cannot be met.
    risks:
    - risk: Users can copy regulated legal documents into the analytics lake and bypass share controls.
      mitigation: Classify ingress, deny unapproved paths, and reconcile file manifests across the two ownership boundaries.
    - risk: Private endpoint or DNS configuration can work for Blob while failing for File.
      mitigation: Validate each service subresource and protocol independently from every authorized network zone.
    waf:
      reliability: Independent redundancy, snapshots, and replay paths match the failure behavior of lake objects and collaborative
        files.
      security: ACLs, service-specific private endpoints, and classified ingress keep legal and analytics data in distinct
        trust boundaries.
      costOptimization: SMB-priced capacity is reserved for collaboration and lower-cost object tiers serve analytics retention.
      operationalExcellence: Separate owners, inventories, lifecycle rules, and restore assertions prevent protocol ambiguity.
      performanceEfficiency: Object-native parallelism serves analytics while Azure Files supplies locking and metadata behavior
        for users.
    safeAnalogue: null
    adrConsequences:
    - Legal collaboration becomes a separate Azure Files service boundary instead of a directory inside the data lake.
    - Pipelines need an approved transfer process when legal content is intentionally published for analytics.
    changeExpectedRevision: Retain ADLS Gen2 for analytics and add an independently governed Azure Files boundary for collaborative
      legal documents.
    revisedDecision:
      selectedCandidate: ADLS Gen2 on a hierarchical-namespace StorageV2 account
      mandatoryRequirementId: LAB11-REQ-01
      reason: LAB11-REQ-01 requires service semantics to match access patterns, so ADLS remains the object-analytics decision
        and Azure Files is added only for native SMB legal collaboration.
      waf:
        reliability: Each service uses recovery controls suited to its protocol and business owner.
        security: Transfers between legal shares and the lake become explicit classified operations.
        costOptimization: File-service charges apply only to documents that need SMB semantics.
        operationalExcellence: Separate inventories and restore tests remove ambiguity about ownership and recovery.
        performanceEfficiency: Analytics avoids SMB overhead and legal users retain native locking behavior.
- number: '12'
  scenario: Fourth Coffee retains media, transaction exports, and audit packages in a general-purpose storage estate. All
    objects remain in the Hot tier, replication choices differ by project, deletes are difficult to investigate, and monthly
    cost grows faster than usable data. The business needs an architecture that balances access frequency, retrieval delay,
    capacity and transaction charges, regional durability, versioning, soft delete, and immutable evidence. Explicit recovery
    objectives and failover exercises belong to Lab 17; this lab must recommend protection and durability characteristics
    without claiming recovery readiness. As the storage economics architect, encode lifecycle and protection decisions with
    Azure CLI and preserve a cost owner for every retention choice.
  role: Storage economics and durability architect
  outcome: A cost-aware StorageV2 design with justified redundancy, lifecycle automation, versioning, retention, and immutability.
  duration: 160 minutes
  difficulty: advanced
  costClass: moderate
  businessOutcome: Lower long-term storage cost while preserving the durability and evidentiary controls each data class requires.
  stakeholders:
  - Data owners
  - Records management
  - FinOps
  - Business continuity
  primarySource:
    title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
  candidates:
  - StorageV2 with GZRS and class-specific lifecycle policies
  - StorageV2 with LRS and application-managed secondary copies
  - Premium block blob accounts with uniform online retention
  selected: StorageV2 with GZRS and class-specific lifecycle policies
  checkpoints:
  - title: Classify access and cost drivers
    requirement: LAB12-REQ-01
    command: az storage account show --name $StorageAccountName --resource-group $ResourceGroup --query "{kind:kind,accessTier:accessTier,sku:sku.name,location:primaryLocation}"
      -o json
    positiveCommand: az storage blob list --account-name $StorageAccountName --container-name $ContainerName --auth-mode login
      --query "[].{name:name,tier:properties.blobTier,size:properties.contentLength}" -o json
    negativeCommand: az storage blob list --account-name $StorageAccountName --container-name $ContainerName --auth-mode login
      --query '[?properties.blobTier == ''Hot'' && properties.contentLength > `1073741824`].name' -o tsv
    expected: Data classes map age, access frequency, minimum retention, retrieval tolerance, object size, and transaction
      patterns to cost drivers.
    negative: Large cold objects are not left in Hot solely because no lifecycle owner was assigned.
    evidence: Synthetic object distribution, age bands, access assumptions, tier mapping, and monthly cost model.
    failure: Access telemetry is incomplete or a minimum storage duration makes an early transition uneconomic.
    retry: Use a conservative age threshold, document uncertainty, and validate costs before broadening the rule.
    cleanup: Inventory commands create no resources and retained evidence contains names and aggregates only.
    waf: 'Performance Efficiency: tier mapping respects retrieval latency, rehydration limits, and transaction patterns.'
  - title: Select regional durability
    requirement: LAB12-REQ-02
    command: az storage account create --name $StorageAccountName --resource-group $ResourceGroup --location $Location --sku
      Standard_GZRS --kind StorageV2 --access-tier Hot --https-only true --min-tls-version TLS1_2 --allow-blob-public-access
      false --tags purpose=az305-lab labId=LAB-12 runId=$RunId expiresOn=$ExpiresOn
    positiveCommand: az storage account show --name $StorageAccountName --resource-group $ResourceGroup --query "{sku:sku.name,primary:primaryLocation,secondary:secondaryLocation,status:statusOfSecondary}"
      -o json
    negativeCommand: az storage account show --name $StorageAccountName --resource-group $ResourceGroup --query "{sku:sku.name,allowBlobPublicAccess:allowBlobPublicAccess}"
      -o json
    expected: GZRS provides zonal durability in the primary region and asynchronous geo-replication to the paired secondary
      region.
    negative: Locally redundant storage is not substituted where regional durability is mandatory.
    evidence: SKU, primary and secondary regions, secondary status, durability rationale, and cost owner.
    failure: GZRS or the required account feature is unavailable in the selected region.
    retry: Compare ZRS plus a separate protected copy or an approved GRS design without overstating availability.
    cleanup: Delete child containers and endpoints before the run-owned account; geo-replicated deletion is not recovery.
    waf: 'Reliability: GZRS makes zonal and regional durability characteristics explicit.'
  - title: Automate lifecycle transitions
    requirement: LAB12-REQ-03
    command: $ownedStorageId = az storage account show --name $StorageAccountName --resource-group $ResourceGroup --query
      id -o tsv --only-show-errors; if ($ownedStorageId -ine $StorageAccountResourceId) { throw 'The supplied storage account
      ID is not the exact run-owned account.' }; az storage account management-policy create --account-name $StorageAccountName
      --resource-group $ResourceGroup --policy @artifacts/lifecycle-policy.json --only-show-errors
    positiveCommand: az storage account management-policy show --account-name $StorageAccountName --resource-group $ResourceGroup
      --query "policy.rules[?enabled].{name:name,filters:definition.filters,actions:definition.actions}" -o json
    negativeCommand: az storage account management-policy show --account-name $StorageAccountName --resource-group $ResourceGroup
      --query 'policy.rules[?enabled == `false` || definition.actions.baseBlob.delete.daysAfterModificationGreaterThan < `30`].name'
      -o tsv
    expected: Prefix- and tag-scoped rules move objects to cooler tiers and delete only after approved retention.
    negative: Disabled rules and deletion earlier than the control minimum do not satisfy the design.
    evidence: Policy hash, enabled rules, filters, transition ages, deletion ages, and exception owner.
    failure: Overlapping filters apply an unintended earlier transition or deletion to a protected data class.
    retry: Evaluate rules against synthetic object fixtures and narrow filters before enabling deletion.
    cleanup: Restore the recorded policy or delete only the run-owned policy before account cleanup.
    waf: 'Operational Excellence: versioned lifecycle rules replace manual object-by-object retention decisions.'
  - title: Layer versioning and delete protection
    requirement: LAB12-REQ-04
    command: $ownedStorageId = az storage account show --name $StorageAccountName --resource-group $ResourceGroup --query
      id -o tsv --only-show-errors; if ($ownedStorageId -ine $StorageAccountResourceId) { throw 'The supplied storage account
      ID is not the exact run-owned account.' }; az storage account blob-service-properties update --account-name $StorageAccountName
      --resource-group $ResourceGroup --enable-versioning true --enable-delete-retention true --delete-retention-days 14 --enable-container-delete-retention
      true --container-delete-retention-days 14 --only-show-errors
    positiveCommand: az storage account blob-service-properties show --account-name $StorageAccountName --resource-group $ResourceGroup
      --query "{versioning:isVersioningEnabled,blobDelete:deleteRetentionPolicy,containerDelete:containerDeleteRetentionPolicy}"
      -o json
    negativeCommand: az storage account blob-service-properties show --account-name $StorageAccountName --resource-group $ResourceGroup
      --query "{versioning:isVersioningEnabled,blobDeleteEnabled:deleteRetentionPolicy.enabled}" -o json
    expected: Versioning plus blob and container soft delete protect against routine overwrite and deletion for fourteen days.
    negative: Soft delete is not described as immutability or a substitute for a separate protected copy.
    evidence: Versioning state, retention days, data-class applicability, restore responsibility, and incremental cost estimate.
    failure: Version accumulation materially exceeds the forecast because high-churn objects lack lifecycle handling.
    retry: Add a reviewed previous-version lifecycle rule without shortening required recovery windows.
    cleanup: Restore original service properties when safe; never purge retained versions during automated cleanup.
    waf: 'Cost Optimization: bounded soft-delete and previous-version windows control protection overhead.'
  - title: Validate immutable evidence boundaries
    requirement: LAB12-REQ-05
    command: az storage container immutability-policy show --account-name $StorageAccountName --container-name $EvidenceContainerName
      --auth-mode login -o json
    positiveCommand: az storage container immutability-policy show --account-name $StorageAccountName --container-name $EvidenceContainerName
      --auth-mode login --query "{state:state,period:immutabilityPeriodSinceCreationInDays,append:allowProtectedAppendWrites}"
      -o json
    negativeCommand: az storage container legal-hold show --account-name $StorageAccountName --container-name $EvidenceContainerName
      --auth-mode login --query "tags[?name=='temporary-lab-hold']" -o json
    expected: The evidence container has a documented time-based immutability mode, retention period, and authorized lock
      procedure.
    negative: A synthetic temporary legal hold is not left behind and unlocked configuration is not called immutable evidence.
    evidence: Container label, policy state, retention days, protected-append choice, lock authority, and cost owner.
    failure: A locked policy conflicts with deletion, lifecycle, or legal retention expectations.
    retry: Validate policy behavior on a synthetic unlocked container before any authorized lock action.
    cleanup: Never automate legal-hold removal, policy unlock, or purge; report residual protected objects for review.
    waf: 'Security: time-based immutability protects evidence from unauthorized modification or deletion.'
  changeRequest: Audit packages become subject to a seven-year immutable retention mandate while media can be deleted after
    eighteen months; revise account, container, lifecycle, and cost boundaries.
  challenge: Decide whether regulated evidence deserves a separate account and explain how that affects blast radius, administration,
    billing, and cleanup.
  troubleshooting:
  - Evaluate minimum tier duration and retrieval charges before interpreting a lifecycle transition as savings.
  - Distinguish versioning, soft delete, time-based immutability, and legal holds by the failure each mitigates.
  - Treat geo-replication durability as distinct from tested failover and recovery objectives.
  architectureAnalysis:
    permissions: Storage account, blob, lifecycle, and immutability read access supports assessment; changing accounts, policies,
      locks, or redundancy requires explicit authorization.
    licensing: Redundancy, access tiers, early-deletion minimums, rehydration, versioning, immutability, and operations each
      affect StorageV2 billing.
    costNotes: Price data classes separately by capacity duration, write and read operations, replication, retrieval, rehydration
      time, and deletion timing.
    constraints:
    - Durability and evidence controls differ across active media, recoverable working data, and audit packages.
    - Audit packages require seven-year immutable retention while media can be deleted after eighteen months.
    assumptions:
    - Producers attach a validated data-class value before lifecycle evaluation.
    - Legal owners approve retention and immutability scope before a locked production policy is applied.
    facts:
      data: Media, operational objects, and audit packages have distinct retention, mutability, retrieval, and legal-evidence
        requirements.
      scale: Capacity accumulates over years, but per-class growth and retrieval rates remain measured rather than fabricated.
      latency: Active media needs immediate retrieval; archived audit evidence accepts documented rehydration delay unless
        legal sets a faster target.
      availability: GZRS protects against zone and regional failure, while immutability protects evidence from change rather
        than improving service uptime.
      rto: Restore or rehydration time is defined per data class; no single numerical RTO applies to the entire account.
      rpo: GZRS replication and versioning objectives differ from the zero-alteration requirement of locked audit evidence.
      budget: Lifecycle tiers and deletion at eighteen months limit media cost, while seven-year immutable evidence is isolated
        for transparent pricing.
    candidateAnalyses:
    - name: StorageV2 with GZRS and class-specific lifecycle policies
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 5
        C3: 5
        C4: 3
        C5: 3
      rationale: StorageV2 combines regional durability with data-class lifecycle rules and supports a dedicated immutable
        evidence boundary.
      rejectedReason: null
    - name: StorageV2 with LRS and application-managed secondary copies
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 2
        C3: 4
        C4: 2
        C5: 4
      rationale: Application copies may lower account pricing but transfer replication ordering, integrity, and failover proof
        to custom code.
      rejectedReason: The custom secondary lacks the managed regional durability and auditable behavior required by evidence
        classes.
    - name: Premium block blob accounts with uniform online retention
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 4
        C3: 4
        C4: 4
        C5: 1
      rationale: Premium online storage provides consistent low latency but overpays for cold long-lived packages and does
        not express class retention alone.
      rejectedReason: Uniform premium retention ignores different retrieval and deletion requirements and produces the weakest
        cost fit.
    - name: One mutable hot-tier container with manual seven-year deletion reminders
      eligible: false
      disqualifiers:
      - LAB12-REQ-05 requires an enforceable immutable evidence boundary with approved retention and lock procedure.
      scores:
        C1: 1
        C2: 3
        C3: 1
        C4: 2
        C5: 2
      rationale: Manual reminders and a mutable container cannot prevent premature alteration or deletion of regulated evidence.
      rejectedReason: The candidate is disqualified because procedural intent is not an immutable storage control.
    risks:
    - risk: An incorrect data-class tag can archive active media or leave audit evidence mutable.
      mitigation: Validate classification at ingestion and run policy simulations against representative objects before activation.
    - risk: Locked immutability can preserve erroneous or sensitive content for seven years.
      mitigation: Establish legal approval, narrow the immutable container, and test content validation before final locking.
    waf:
      reliability: GZRS and per-class recovery tests protect durability without confusing immutability with availability.
      security: Locked audit containers, least-privilege data roles, and private access preserve evidence integrity.
      costOptimization: Lifecycle timing follows actual retention and retrieval behavior for media and audit classes.
      operationalExcellence: Classification, policy simulation, lock approval, and exception evidence form a controlled lifecycle
        process.
      performanceEfficiency: Hot access remains available for active media while cold evidence uses capacity-efficient tiers.
    safeAnalogue: null
    adrConsequences:
    - Audit evidence moves to a separately approved immutable container or account with restricted administration.
    - Data producers become accountable for correct classification before lifecycle policy can act.
    changeExpectedRevision: Separate audit and media policy boundaries, lock audit packages for seven years, and delete eligible
      media after eighteen months.
    revisedDecision:
      selectedCandidate: StorageV2 with GZRS and class-specific lifecycle policies
      mandatoryRequirementId: LAB12-REQ-05
      reason: LAB12-REQ-05 requires enforceable seven-year immutability and eighteen-month media deletion, so class-specific
        GZRS boundaries are retained with a separately locked audit container.
      waf:
        reliability: Regional redundancy remains independent from the immutable evidence control.
        security: Audit objects cannot be altered or deleted by ordinary storage administrators.
        costOptimization: Media exits storage at eighteen months while long-lived evidence uses an intentional tier.
        operationalExcellence: Lock approval and lifecycle simulation become required release evidence.
        performanceEfficiency: Active media avoids archive delay and rarely read audit packages avoid premium capacity.
- number: '13'
  scenario: Contoso Energy receives hourly files from field partners, change data from operational databases, and telemetry
    from regional systems. Analysts need governed SQL exploration and curated datasets, while some sources remain on private
    networks and business owners require lineage from ingestion to published data. The architecture board is comparing Microsoft
    Fabric, Azure Data Factory with Azure Synapse serverless SQL, and Azure Databricks with orchestration. As the integration
    and analytics architect, select the platform combination, integration runtime, identity, pipeline, transformation, serving,
    monitoring, and cost boundaries. The lab uses a safe analogue and must not claim that offline pipeline definitions prove
    source connectivity, data correctness, or production performance.
  role: Data integration and analytics architect
  outcome: A governed integration and analytics architecture with explicit hybrid connectivity, orchestration, serving, and
    evidence boundaries.
  duration: 175 minutes
  difficulty: advanced
  costClass: elevated
  businessOutcome: Deliver traceable analytics datasets from cloud and private sources without creating unmanaged credentials
    or always-on analytics cost.
  stakeholders:
  - Data engineering
  - Analytics consumers
  - Operational system owners
  - Data governance council
  primarySource:
    title: Azure Data Architecture Guide
    url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/
  candidates:
  - Azure Data Factory with ADLS Gen2 and Azure Synapse serverless SQL
  - Microsoft Fabric Data Factory with OneLake and Fabric Warehouse
  - Azure Databricks with Azure Data Factory orchestration and Delta Lake
  selected: Azure Data Factory with ADLS Gen2 and Azure Synapse serverless SQL
  checkpoints:
  - title: Select integration patterns and runtimes
    requirement: LAB13-REQ-01
    command: Get-AzDataFactoryV2IntegrationRuntime -ResourceGroupName $ResourceGroup -DataFactoryName $DataFactoryName
    positiveCommand: Get-AzDataFactoryV2IntegrationRuntime -ResourceGroupName $ResourceGroup -DataFactoryName $DataFactoryName
      -Name $IntegrationRuntimeName | Select-Object Name,DataFactoryName,State,Description
    negativeCommand: Get-AzDataFactoryV2IntegrationRuntime -ResourceGroupName $ResourceGroup -DataFactoryName $DataFactoryName
      | Where-Object { $_.Name -like '*shared*' -and [string]::IsNullOrWhiteSpace($_.Description) }
    expected: Batch, CDC, event, and private-source needs map to appropriate Azure or self-hosted integration runtime boundaries.
    negative: An undocumented shared self-hosted runtime is not accepted as a universal connectivity solution.
    evidence: Source class, integration pattern, runtime type, network boundary, owner, and latency expectation.
    failure: A source protocol, firewall, or driver is unsupported by the selected runtime.
    retry: Validate connector and network prerequisites with synthetic endpoints before changing the platform decision.
    cleanup: Stop and remove only a run-owned synthetic runtime after linked-service dependencies are removed.
    waf: 'Reliability: explicit runtime ownership and network prerequisites make hybrid data movement recoverable.'
  - title: Use managed identity for linked services
    requirement: LAB13-REQ-02
    command: Get-AzDataFactoryV2LinkedService -ResourceGroupName $ResourceGroup -DataFactoryName $DataFactoryName
    positiveCommand: Get-AzDataFactoryV2LinkedService -ResourceGroupName $ResourceGroup -DataFactoryName $DataFactoryName
      -Name $LinkedServiceName | Select-Object Name,@{Name='ConnectorType';Expression={$_.Properties.GetType().Name}}
    negativeCommand: Get-AzDataFactoryV2LinkedService -ResourceGroupName $ResourceGroup -DataFactoryName $DataFactoryName
      | Where-Object { $_.Properties.TypeProperties.ConnectionString -or $_.Properties.TypeProperties.AccountKey } | Select-Object
      -ExpandProperty Name
    expected: Supported sources and sinks use the data-factory managed identity or a Key Vault reference with least privilege.
    negative: Inline connection strings, account keys, and embedded credentials are absent from pipeline definitions and evidence.
    evidence: Linked-service name, connector type, authentication class, Key Vault reference label, and target scope.
    failure: The connector lacks managed-identity support or the identity cannot traverse a private network boundary.
    retry: Use a Key Vault-referenced short-lived credential only where required and document rotation and runtime access.
    cleanup: Delete dependent datasets and pipelines before a run-owned linked service; never export secret properties.
    waf: 'Security: managed identity and Key Vault references keep credentials out of pipeline definitions and evidence.'
  - title: Orchestrate idempotent ingestion
    requirement: LAB13-REQ-03
    command: Get-Content -LiteralPath artifacts/pipeline.json -Raw | ConvertFrom-Json
    positiveCommand: $definition = Get-Content -LiteralPath artifacts/pipeline.json -Raw | ConvertFrom-Json; if ($definition.properties.activities.Count
      -lt 1) { throw 'The synthetic pipeline has no activity.' }
    negativeCommand: $definition = Get-Content -LiteralPath artifacts/pipeline.json -Raw | ConvertFrom-Json; if (($definition
      | ConvertTo-Json -Depth 30) -match '(?i)password|accountKey|connectionString') { throw 'The synthetic pipeline contains
      an inline credential field.' }
    expected: The pipeline uses watermarks, deterministic paths, retry policy, and quarantine handling to make reruns safe.
    negative: Empty pipelines and blind append operations without duplicate handling do not satisfy ingestion.
    evidence: Definition hash, activity graph, retry policy, watermark owner, quarantine path, and synthetic run result.
    failure: A partial copy advances the watermark or rerun duplicates already committed data.
    retry: Reconcile the checkpoint table and target partition, then rerun only the idempotent failed slice.
    cleanup: Stop triggers and delete dependent datasets before deleting a run-owned pipeline.
    waf: 'Operational Excellence: watermarks, quarantine, and idempotent replay make partial pipeline failure supportable.'
  - title: Serve governed analytical queries
    requirement: LAB13-REQ-04
    command: Get-AzSynapseWorkspace -ResourceGroupName $ResourceGroup -Name $SynapseWorkspaceName
    positiveCommand: Get-AzSynapseWorkspace -ResourceGroupName $ResourceGroup -Name $SynapseWorkspaceName | Select-Object
      Name,ConnectivityEndpoints,DefaultDataLakeStorage
    negativeCommand: Get-AzSynapseSqlPool -ResourceGroupName $ResourceGroup -WorkspaceName $SynapseWorkspaceName | Where-Object
      { $_.Sku.Name -like 'DW*' -and $_.Status -eq 'Online' -and $_.Tags.costOwner -eq $null }
    expected: Curated lake data is exposed through governed serverless SQL views, with a dedicated pool considered only for
      measured isolation or performance needs.
    negative: An always-on dedicated SQL pool without a cost owner is not introduced by default.
    evidence: Workspace label, serving mode, curated-zone path, semantic owner, authorization groups, and query-cost controls.
    failure: File layout, schema drift, or small-file volume makes serverless queries unstable or expensive.
    retry: Compact and curate files, enforce schema contracts, and measure scanned bytes before provisioning dedicated capacity.
    cleanup: Remove run-owned SQL artifacts before workspace deletion; retain no source data in evidence.
    waf: 'Performance Efficiency: curated file layout and serverless views reduce scan amplification for analytical queries.'
  - title: Validate lineage operations and spend
    requirement: LAB13-REQ-05
    command: Get-AzDataFactoryV2PipelineRun -ResourceGroupName $ResourceGroup -DataFactoryName $DataFactoryName -PipelineRunId
      $PipelineRunId
    positiveCommand: Get-AzDataFactoryV2ActivityRun -ResourceGroupName $ResourceGroup -DataFactoryName $DataFactoryName -PipelineRunId
      $PipelineRunId -RunStartedAfter $RunStartedAfter -RunStartedBefore $RunStartedBefore
    negativeCommand: Get-AzDataFactoryV2PipelineRun -ResourceGroupName $ResourceGroup -DataFactoryName $DataFactoryName -LastUpdatedAfter
      $RunStartedAfter -LastUpdatedBefore $RunStartedBefore | Where-Object { $_.Status -eq 'InProgress' -and $_.RunEnd -lt
      (Get-Date).AddHours(-2) }
    expected: A synthetic run links source slice, pipeline and activity IDs, curated output, status, duration, owner, and
      estimated service cost.
    negative: Stalled runs, sensitive input or output payloads, and unowned spend are not treated as successful evidence.
    evidence: Sanitized run and activity IDs, statuses, durations, row counts, lineage references, and cost estimate.
    failure: Monitoring records show success while downstream reconciliation detects missing or duplicate rows.
    retry: Fail the validation, quarantine the slice, and reconcile business counts before republishing.
    cleanup: Cancel run-owned triggers and remove synthetic outputs in dependency order; preserve sanitized validation only.
    waf: 'Cost Optimization: correlated run, activity, volume, and duration evidence attributes consumption to an owned pipeline.'
  changeRequest: Executives mandate near-real-time operational dashboards for one telemetry stream while partner files remain
    hourly and analysts prefer a unified Microsoft Fabric experience; revise the platform boundary without forcing every flow
    into streaming.
  challenge: Compare adding an event-streaming path, adopting Fabric for all workloads, and retaining the selected batch architecture
    with a separate real-time serving path.
  troubleshooting:
  - Diagnose connector support, runtime network reachability, and target authorization as distinct integration failures.
  - Reconcile source and sink business counts even when orchestration reports a successful activity.
  - Measure file layout and scanned bytes before solving serverless query cost with dedicated capacity.
  architectureAnalysis:
    permissions: Data Factory, storage, Synapse, and Fabric read roles support inventory; pipeline, connection, capacity,
      or identity changes require separate platform authorization.
    licensing: Data Factory activities, self-hosted integration runtime, Synapse serverless scans, Fabric capacity, and streaming
      workloads use distinct meters.
    costNotes: Attribute orchestration runs, data movement, private runtime hours, scanned terabytes, Fabric capacity time,
      and streaming retention per flow.
    constraints:
    - Cloud and private sources must move without embedded credentials and retain lineage and reconciliation evidence.
    - One telemetry stream becomes near-real-time while partner files remain hourly and executives prefer a unified Fabric
      experience.
    assumptions:
    - Private sources can reach a hardened self-hosted integration runtime without inbound exposure.
    - Source owners provide watermark, schema, and reconciliation rules for batch and stream paths.
    facts:
      data: Partner files, private operational sources, and telemetry events have different arrival, schema, lineage, and
        replay semantics.
      scale: Hourly batch volume and continuous telemetry throughput are measured per source; no unsupported row-rate estimate
        is introduced.
      latency: Executive telemetry dashboards require near-real-time updates, while partner-file freshness remains an hourly
        objective.
      availability: Failed batch slices must resume from watermarks and streaming checkpoints must recover without duplicating
        accepted events.
      rto: Pipeline restoration is set per flow; the scenario gives no single numerical recovery target.
      rpo: Batch reconciliation and stream checkpoint retention define different tolerated replay windows and require owner
        approval.
      budget: Serverless query and scheduled orchestration avoid always-on analytics cost until Fabric capacity is justified
        by unified use.
    candidateAnalyses:
    - name: Azure Data Factory with ADLS Gen2 and Azure Synapse serverless SQL
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 4
        C3: 4
        C4: 4
        C5: 4
      rationale: Data Factory handles governed batch and private connectivity while ADLS and serverless SQL minimize idle
        analytics capacity.
      rejectedReason: null
    - name: Microsoft Fabric Data Factory with OneLake and Fabric Warehouse
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 4
        C3: 4
        C4: 5
        C5: 2
      rationale: Fabric provides a unified analytics and dashboard experience, though continuously sized capacity and private-source
        fit require validation.
      rejectedReason: The initial periodic workload does not yet justify moving every flow onto a Fabric capacity commitment.
    - name: Azure Databricks with Azure Data Factory orchestration and Delta Lake
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 4
        C3: 4
        C4: 3
        C5: 2
      rationale: Databricks offers powerful stream and lake processing but adds a second engineering and cluster operating
        model.
      rejectedReason: Its flexibility exceeds the transformation need and carries more platform ownership for this team.
    - name: Self-hosted scripts with embedded source passwords and no checkpoints
      eligible: false
      disqualifiers:
      - LAB13-REQ-02 requires managed identity or protected connections plus replayable lineage evidence.
      scores:
        C1: 1
        C2: 1
        C3: 1
        C4: 2
        C5: 4
      rationale: Handwritten transfers may appear inexpensive but expose credentials and cannot prove restart or reconciliation
        behavior.
      rejectedReason: It is ineligible because secretless access and recoverable lineage are mandatory.
    risks:
    - risk: Forcing hourly partner files through a streaming design can increase cost and duplicate late-arrival handling.
      mitigation: Keep a batch contract for files and integrate its curated output into the shared semantic layer.
    - risk: A Fabric preference can create capacity lock-in before private connectivity and throughput are proven.
      mitigation: Benchmark the telemetry slice, record capacity utilization, and retain a reversible batch boundary for remaining
        flows.
    waf:
      reliability: Watermarks, checkpoints, replay rules, and reconciliation distinguish recoverable batch and streaming failures.
      security: Managed identities and hardened private runtimes keep credentials out of pipeline definitions.
      costOptimization: Batch serverless processing and targeted Fabric capacity align spend with each flow's freshness requirement.
      operationalExcellence: Lineage, schema, watermark, and reconciliation evidence give operators a common failure model.
      performanceEfficiency: Near-real-time resources serve only the telemetry stream while hourly files retain efficient
        batch movement.
    safeAnalogue: Run local batch and event fixtures through watermark, checkpoint, and reconciliation logic without creating
      a pipeline or Fabric capacity.
    adrConsequences:
    - The analytics platform accepts a hybrid ingestion boundary instead of forcing one cadence onto every source.
    - Fabric capacity must be justified and monitored specifically for the executive telemetry experience.
    changeExpectedRevision: Add a Fabric near-real-time path for telemetry while preserving hourly governed batch contracts
      for partner files.
    revisedDecision:
      selectedCandidate: Microsoft Fabric Data Factory with OneLake and Fabric Warehouse
      mandatoryRequirementId: LAB13-REQ-01
      reason: LAB13-REQ-01 requires integration patterns to follow cadence and source boundaries, so Fabric serves the near-real-time
        telemetry experience while partner files remain hourly batch.
      waf:
        reliability: Stream checkpoints and batch watermarks retain independent replay behavior.
        security: Private-source credentials remain protected even as curated output enters OneLake.
        costOptimization: Capacity is sized for the dashboard stream instead of converting every file flow to continuous processing.
        operationalExcellence: Shared lineage joins both cadences without erasing their distinct failure states.
        performanceEfficiency: Telemetry receives low-latency processing and partner files keep throughput-efficient hourly
          loads.
- number: '14'
  scenario: Contoso Industrial operates production-planning services in Azure and two factories that still host latency-sensitive
    control applications on VMware. A recent regional network incident exposed that recovery plans were organized by technology
    rather than by business service. The executive resilience committee now requires a single strategy that classifies workloads,
    maps dependencies, assigns measurable recovery time and recovery point objectives, and distinguishes backup, high availability,
    disaster recovery, and cyber-recovery controls. Data residency limits cross-border replication, factory connectivity is
    intermittent, and the annual resilience budget cannot support active-active deployment for every workload. The architecture
    must be testable without failing over production systems or provisioning the expensive target estate.
  role: Enterprise resilience architect
  outcome: Produce a tiered Azure and hybrid recovery strategy with dependency-aware recovery waves, measurable objectives,
    and an evidence-based exercise plan.
  duration: 150 minutes
  difficulty: advanced
  costClass: none
  businessOutcome: Restore safety-critical planning and factory services in the required order while controlling recovery
    cost and meeting residency obligations.
  stakeholders:
  - Chief risk officer
  - Factory operations director
  - Application owners
  - Security and compliance lead
  - Disaster recovery coordinator
  primarySource:
    title: Azure Well-Architected Framework - Recommendations for defining reliability targets
    url: https://learn.microsoft.com/en-us/azure/well-architected/reliability/metrics
  candidates:
  - Tiered recovery using Azure Backup, Azure Site Recovery, and application-native replication
  - Uniform paired-region warm standby for every business service
  - Active-active deployment across two Azure regions with independent factory edges
  selected: Tiered recovery using Azure Backup, Azure Site Recovery, and application-native replication
  checkpoints:
  - title: Classify services and recovery objectives
    requirement: LAB14-REQ-01
    command: $resources = az resource list --subscription $SubscriptionId --output json --only-show-errors | ConvertFrom-Json;
      $resources | Select-Object name, type, location, @{Name='criticality';Expression={$_.tags.criticality}}
    positiveCommand: $classified = az resource list --subscription $SubscriptionId --query "[?tags.criticality]" --output
      json --only-show-errors | ConvertFrom-Json; if ($classified.Count -lt 1) { throw 'No resource has a criticality classification.'
      }
    negativeCommand: $unclassified = az resource list --subscription $SubscriptionId --query "[?!tags.criticality]" --output
      json --only-show-errors | ConvertFrom-Json; if ($unclassified.Count -gt 0) { throw 'At least one scoped resource lacks
      a criticality classification.' }
    expected: Every business service has an owner, impact tier, RTO, RPO, maximum tolerable outage, and data-residency boundary.
    negative: A resource-only inventory with no business owner or recovery objective must fail the checkpoint.
    evidence: Export the classified service register and the signed mapping from business tier to RTO and RPO.
    failure: Conflicting objectives or missing dependencies make recovery sequencing unverifiable.
    retry: Reconcile conflicts with the service owner, then rerun the classification queries against the same scope.
    cleanup: Remove only the locally exported inventory; this design checkpoint creates no Azure resource.
    waf: 'Reliability: explicit targets prevent both under-engineering and unbounded recovery promises.'
  - title: Map hybrid dependencies and failure domains
    requirement: LAB14-REQ-02
    command: $inventory = az resource list --subscription $SubscriptionId --query "[].{id:id,type:type,location:location,dependsOn:tags.dependsOn}"
      --output json --only-show-errors | ConvertFrom-Json; $inventory | Sort-Object location, type
    positiveCommand: $mapped = az resource list --subscription $SubscriptionId --query "[?tags.dependsOn]" --output json --only-show-errors
      | ConvertFrom-Json; if ($mapped.Count -lt 1) { throw 'No dependency metadata was found.' }
    negativeCommand: $globalWithoutOwner = az resource list --subscription $SubscriptionId --query '[?location==''global''
      && !tags.owner]' --output json --only-show-errors | ConvertFrom-Json; if ($globalWithoutOwner.Count -gt 0) { throw 'A
      global dependency has no accountable owner.' }
    expected: The dependency map covers identity, DNS, connectivity, secrets, monitoring, data stores, and factory prerequisites
      across failure domains.
    negative: A recovery wave that starts an application before identity, name resolution, or its data dependency must be
      rejected.
    evidence: Save the dependency graph, failure-domain annotations, and the ordered list of recovery waves.
    failure: An undiscovered shared dependency can invalidate otherwise achievable workload recovery targets.
    retry: Add the missing dependency and rerun the inventory projection before resequencing recovery waves.
    cleanup: Delete generated local graph files after assessment if they contain confidential topology details.
    waf: 'Security: the map identifies privileged recovery dependencies and limits emergency-access sprawl.'
  - title: Select recovery patterns by tier
    requirement: LAB14-REQ-03
    command: az backup vault list --subscription $SubscriptionId --query "[].{name:name,location:location,redundancy:properties.redundancySettings.standardTierStorageRedundancy}"
      --output table --only-show-errors
    positiveCommand: $vaults = az backup vault list --subscription $SubscriptionId --output json --only-show-errors | ConvertFrom-Json;
      if ($vaults.Count -lt 1) { throw 'No backup-vault evidence is available for protected tiers.' }
    negativeCommand: $localOnly = az backup vault list --subscription $SubscriptionId --query "[?properties.redundancySettings.standardTierStorageRedundancy=='LocallyRedundant']"
      --output json --only-show-errors | ConvertFrom-Json; if ($localOnly.Count -gt 0) { throw 'Locally redundant vaults require
      an explicit tier exception.' }
    expected: Each tier receives the least costly pattern that meets its targets, with backup, replication, and rehydration
      responsibilities separated.
    negative: Treating backup retention as proof of failover readiness, or assuming a region pair removes all correlated risk,
      must fail review.
    evidence: Record the scored pattern decision, exclusions, residency checks, and cost assumptions for each service tier.
    failure: A pattern can satisfy nominal RPO while missing dependency, capacity, or cyber-recovery requirements.
    retry: Rescore the affected tier with the constraint marked mandatory and document any selection override.
    cleanup: Retain only sanitized decision evidence; no vault or protected item is changed by this checkpoint.
    waf: 'Cost Optimization: tiering reserves warm or active capacity for workloads that can justify it.'
  - title: Design recovery orchestration and communications
    requirement: LAB14-REQ-04
    command: az monitor action-group list --subscription $SubscriptionId --query "[].{name:name,enabled:enabled,emailReceivers:length(emailReceivers),smsReceivers:length(smsReceivers)}"
      --output table --only-show-errors
    positiveCommand: $enabled = az monitor action-group list --subscription $SubscriptionId --query '[?enabled==`true`]' --output
      json --only-show-errors | ConvertFrom-Json; if ($enabled.Count -lt 1) { throw 'No enabled recovery communication path
      was found.' }
    negativeCommand: $empty = az monitor action-group list --subscription $SubscriptionId --query '[?length(emailReceivers)==`0`
      && length(smsReceivers)==`0` && length(webhookReceivers)==`0`]' --output json --only-show-errors | ConvertFrom-Json;
      if ($empty.Count -gt 0) { throw 'An action group has no usable receiver.' }
    expected: The runbook assigns decision authority, recovery-wave gates, technical actions, stakeholder notifications, and
      rollback criteria.
    negative: A runbook that relies on one unavailable identity, an unnamed approver, or an untested manual handoff must fail.
    evidence: Preserve the tabletop timeline, RACI, escalation matrix, and approval record for every wave transition.
    failure: Ambiguous authority can extend downtime even when technical recovery succeeds.
    retry: Assign deputies and alternate communication paths, then replay the affected tabletop inject.
    cleanup: Remove test contact data from local evidence and leave production action groups unchanged.
    waf: 'Operational Excellence: explicit gates and communications make recovery repeatable under pressure.'
  - title: Validate objectives with an exercise scorecard
    requirement: LAB14-REQ-05
    command: az monitor metrics list-definitions --resource $RecoveryEvidenceResourceId --query "value[].{name:name.value,unit:unit}"
      --output table --only-show-errors
    positiveCommand: $definitions = az monitor metrics list-definitions --resource $RecoveryEvidenceResourceId --output json
      --only-show-errors | ConvertFrom-Json; if ($definitions.value.Count -lt 1) { throw 'No measurable recovery evidence
      source was found.' }
    negativeCommand: $alerts = az monitor metrics alert list --resource-group $ResourceGroupName --query '[?enabled==`false`]'
      --output json --only-show-errors | ConvertFrom-Json; if ($alerts.Count -gt 0) { throw 'Disabled evidence alerts need
      a documented exception before the exercise.' }
    expected: The exercise independently measures detection, decision, restore, dependency validation, data-loss window, and
      business acceptance against targets.
    negative: Declaring success solely because infrastructure reports healthy must fail without application and business assertions.
    evidence: Archive timestamped scorecards, failed assertions, improvement owners, and the next exercise date.
    failure: Missing timestamps or business acceptance prevents an auditable comparison with RTO and RPO.
    retry: Correct instrumentation and repeat only the failed recovery wave while preserving the original result.
    cleanup: Delete synthetic exercise records according to evidence policy; do not purge protected production data.
    waf: 'Performance Efficiency: measured rehydration and validation times expose recovery-capacity bottlenecks.'
  changeRequest: The board reduces the Tier 1 RTO from four hours to forty-five minutes while prohibiting any additional cross-border
    data replication.
  challenge: Revise the tiering decision and exercise plan so the new RTO is met through in-boundary warm capacity and faster
    orchestration, with the cost increase and residual regional risk made explicit.
  troubleshooting:
  - If Azure CLI queries return an empty array, verify the subscription scope and distinguish a genuinely empty inventory
    from missing Reader permissions.
  - If dependency tags contain inconsistent names, normalize them in the local register without changing production tags during
    the simulation.
  - If RTO evidence omits approval delay, add business decision timestamps rather than reporting only technical restore duration.
  architectureAnalysis:
    permissions: No Azure role is needed for the simulation; production inventory evidence would require read-only access
      to backup, replication, monitoring, and dependency metadata.
    licensing: Azure Backup, Site Recovery, replicated data, standby compute, and monitoring costs must be estimated per service
      tier before approval.
    costNotes: Price retained recovery points, replication churn, warm capacity, exercise consumption, and operator recovery
      effort by tier.
    constraints:
    - Recovery order must follow service dependencies and residency boundaries rather than treating every workload uniformly.
    - Tier 1 RTO falls from four hours to forty-five minutes without adding cross-border data replication.
    assumptions:
    - Business owners validate tier, maximum outage, data-loss tolerance, and degraded-mode capacity.
    - A synthetic dependency inventory accurately represents the recovery ordering problem for offline analysis.
    facts:
      data: Workload inventory includes dependency, region, residency, backup, replication, owner, RTO, and RPO attributes.
      scale: Multiple service tiers share identity, network, data, and notification dependencies; exact application count
        remains an inventory input.
      latency: Recovery sequencing includes detection, authority, infrastructure, data, application, and business-validation
        elapsed time.
      availability: Tier 1 must tolerate the declared failure domain with warm in-boundary capacity; lower tiers may use slower
        rehydration.
      rto: Tier 1 changes from four hours to forty-five minutes; other tier targets remain owner-approved inputs.
      rpo: Data-loss objectives remain service-specific and cross-border replication is forbidden for the affected data.
      budget: Warm capacity is funded only for Tier 1, with lower tiers retaining backup or staged recovery where their objectives
        permit.
    candidateAnalyses:
    - name: Tiered recovery using Azure Backup, Azure Site Recovery, and application-native replication
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 5
        C3: 4
        C4: 4
        C5: 4
      rationale: Tiering maps recovery technology and retained capacity to business targets while keeping residency and dependency
        decisions explicit.
      rejectedReason: null
    - name: Uniform paired-region warm standby for every business service
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 5
        C3: 3
        C4: 4
        C5: 1
      rationale: Uniform standby simplifies a headline recovery pattern but overfunds low tiers and can cross regulated data
        boundaries.
      rejectedReason: It spends continuously on workloads that tolerate slower recovery and weakens residency fit.
    - name: Active-active deployment across two Azure regions with independent factory edges
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 5
        C3: 3
        C4: 2
        C5: 1
      rationale: Active-active minimizes outage for suitable services but requires conflict handling, duplicate capacity,
        and independent edge operations.
      rejectedReason: Its cost and operational complexity exceed most tiers and do not inherently solve residency constraints.
    - name: Untested backup-only plan with no dependency or business validation
      eligible: false
      disqualifiers:
      - LAB14-REQ-05 requires measured end-to-end recovery against tier RTO and RPO objectives.
      scores:
        C1: 1
        C2: 1
        C3: 3
        C4: 1
        C5: 4
      rationale: Backup retention preserves copies but does not prove sequencing, application usability, capacity, or business
        acceptance.
      rejectedReason: It is disqualified because restore media alone cannot satisfy end-to-end recovery evidence.
    risks:
    - risk: Shared identity or network dependencies can consume most of the forty-five-minute Tier 1 window.
      mitigation: Place prerequisites in recovery wave zero, assign decision timestamps, and measure their degraded-mode startup
        independently.
    - risk: Warm in-boundary capacity can sit idle and be removed during cost optimization.
      mitigation: Tag the capacity to the Tier 1 objective, include it in exercises, and report its cost as an explicit resilience
        control.
    waf:
      reliability: Dependency waves and tier-specific mechanisms align recovery behavior with validated business targets.
      security: Residency, privileged recovery identities, and isolated evidence remain explicit in every recovery pattern.
      costOptimization: Warm capacity is limited to Tier 1 while slower tiers use lower-cost protection that meets their objectives.
      operationalExcellence: Timed authority, technical, communication, and business gates expose where recovery actually
        spends time.
      performanceEfficiency: Degraded-mode sizing reserves enough in-boundary capacity for Tier 1 without duplicating peak
        capacity everywhere.
    safeAnalogue: Traverse the synthetic dependency graph, inject failed approvals and services, and calculate recovery waves
      locally without issuing Azure queries.
    adrConsequences:
    - Tier owners must fund and exercise the recovery mechanism attached to their declared objective.
    - Tier 1 accepts warm capacity cost and residual same-geography correlated risk to preserve residency.
    changeExpectedRevision: Replace Tier 1 rehydration with in-boundary warm capacity and compress decision and dependency
      gates to forty-five minutes.
    revisedDecision:
      selectedCandidate: Tiered recovery using Azure Backup, Azure Site Recovery, and application-native replication
      mandatoryRequirementId: LAB14-REQ-05
      reason: LAB14-REQ-05 now requires a forty-five-minute Tier 1 recovery without cross-border replication, so tiering is
        retained with warm capacity inside the approved geography and faster orchestration gates.
      waf:
        reliability: Warm Tier 1 capacity removes provisioning from the critical recovery path.
        security: Data remains within the approved geography and emergency identities stay time-bound.
        costOptimization: Only Tier 1 carries the new standby premium.
        operationalExcellence: Shorter authority and dependency gates require more frequent timed exercises.
        performanceEfficiency: Degraded-mode capacity is sized to the recovery load rather than ordinary peak demand.
- number: '15'
  scenario: Fabrikam Health runs appointment and imaging coordination on Windows and Linux virtual machines distributed across
    one Azure region. Backups exist, but recent restore testing found inconsistent policies, unprotected data disks, and a
    single application tier confined to one datacenter boundary. The clinical service must survive a zone outage, recover
    from destructive change, retain immutable recovery points, and prove that restored machines are isolated before reconnecting
    to production. A full second-region estate is too expensive for the learning environment, so the architecture team will
    evaluate the production design through read-only discovery, policy evidence, and a safe analogue that models failover
    ordering without creating standby compute.
  role: Compute continuity architect
  outcome: Design a zone-resilient VM architecture and an auditable backup, isolated-restore, and failover process that meets
    clinical recovery targets.
  duration: 150 minutes
  difficulty: advanced
  costClass: low
  businessOutcome: Maintain appointment coordination through a datacenter failure and recover compromised virtual machines
    from trusted points without unsafe reconnection.
  stakeholders:
  - Clinical operations owner
  - Infrastructure engineering lead
  - Security incident commander
  - Backup service owner
  - Finance partner
  primarySource:
    title: Reliability in Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-virtual-machines
  candidates:
  - Zone-spread virtual machine scale sets with Azure Backup and isolated restore
  - Availability sets with locally redundant vault protection
  - Azure Site Recovery warm replicas in a secondary region for every virtual machine
  selected: Zone-spread virtual machine scale sets with Azure Backup and isolated restore
  checkpoints:
  - title: Establish compute failure-domain evidence
    requirement: LAB15-REQ-01
    command: Get-AzVM -ResourceGroupName $ResourceGroupName -Status | Select-Object Name, Location, Zones, @{Name='PowerState';Expression={$_.Statuses[-1].DisplayStatus}}
    positiveCommand: $running = Get-AzVM -ResourceGroupName $ResourceGroupName -Status | Where-Object { $_.Statuses.DisplayStatus
      -contains 'VM running' }; if (-not $running) { throw 'No running VM was found in the assessed scope.' }
    negativeCommand: $withoutZone = Get-AzVM -ResourceGroupName $ResourceGroupName | Where-Object { -not $_.Zones -and -not
      $_.AvailabilitySetReference }; if ($withoutZone) { throw 'A VM lacks a zone or availability-set placement decision.'
      }
    expected: Every VM is mapped to an application tier, availability target, zone or fault-domain placement, and recovery
      order.
    negative: Counting multiple VMs as highly available when they share an unexamined failure domain must fail.
    evidence: Export the VM placement matrix with tier, zone, disk, dependency, and owner fields.
    failure: Missing placement metadata can conceal a single-zone application dependency.
    retry: Confirm supported zones and SKU capacity, update the design matrix, and rerun both placement assertions.
    cleanup: Remove the local inventory export after review; do not alter VM placement during discovery.
    waf: 'Reliability: explicit zone distribution reduces correlated compute failure.'
  - title: Verify backup coverage and policy intent
    requirement: LAB15-REQ-02
    command: Get-AzRecoveryServicesVault -ResourceGroupName $ResourceGroupName | Select-Object Name, Location, Id
    positiveCommand: $vault = Get-AzRecoveryServicesVault -ResourceGroupName $ResourceGroupName | Select-Object -First 1;
      if (-not $vault) { throw 'No Recovery Services vault was found.' }
    negativeCommand: $vaults = Get-AzRecoveryServicesVault -ResourceGroupName $ResourceGroupName; if ($vaults | Where-Object
      { $_.Location -ne $Location }) { throw 'A vault location differs from the documented protection design.' }
    expected: The coverage matrix maps operating system and data disks to policy frequency, retention, vault redundancy, immutability,
      and soft-delete requirements.
    negative: A VM shown in inventory but absent from the protected-item register must fail even if another VM has a successful
      backup.
    evidence: Preserve vault configuration, policy exports, protected-item coverage, and approved exceptions.
    failure: Vault existence alone does not prove that every required disk is protected or retained correctly.
    retry: Correct the policy-to-workload mapping in the design and repeat the coverage reconciliation.
    cleanup: Remove sanitized exports only; never disable soft delete, immutability, or protection as cleanup.
    waf: 'Security: immutable, access-controlled recovery points improve resistance to destructive attacks.'
  - title: Evaluate zone-resilient capacity
    requirement: LAB15-REQ-03
    command: Get-AzComputeResourceSku -Location $Location | Where-Object { $_.ResourceType -eq 'virtualMachines' -and $_.Name
      -eq $VmSku } | Select-Object Name, Locations, LocationInfo, Restrictions
    positiveCommand: $sku = Get-AzComputeResourceSku -Location $Location | Where-Object { $_.ResourceType -eq 'virtualMachines'
      -and $_.Name -eq $VmSku -and -not $_.Restrictions }; if (-not $sku) { throw 'The selected VM SKU is unavailable or restricted.'
      }
    negativeCommand: $zonal = Get-AzComputeResourceSku -Location $Location | Where-Object { $_.ResourceType -eq 'virtualMachines'
      -and $_.Name -eq $VmSku -and $_.LocationInfo.Zones.Count -lt 2 }; if ($zonal) { throw 'The selected SKU does not expose
      the required zone spread.' }
    expected: The target design documents supported zones, surge capacity, quota, health probes, disk constraints, and degraded-mode
      capacity.
    negative: A design that needs every zone at peak capacity, or assumes quota appears during an incident, must fail.
    evidence: Save the SKU capability result, capacity calculation, and quota-request lead-time assumption.
    failure: Region-specific SKU restrictions can make a syntactically valid availability design undeployable.
    retry: Evaluate the approved fallback SKU and recalculate cost and performance before reselection.
    cleanup: Delete local calculation output; this checkpoint requests no quota and provisions no compute.
    waf: 'Performance Efficiency: right-sized degraded-mode capacity protects clinical latency without permanent overprovisioning.'
  - title: Design isolated restore and recovery validation
    requirement: LAB15-REQ-04
    command: Get-AzRecoveryServicesBackupJob -VaultId $VaultId -From (Get-Date).AddDays(-7) | Select-Object WorkloadName,
      Operation, Status, StartTime, EndTime
    positiveCommand: $completed = Get-AzRecoveryServicesBackupJob -VaultId $VaultId -From (Get-Date).AddDays(-7) | Where-Object
      { $_.Operation -match 'Backup|Restore' -and $_.Status -eq 'Completed' }; if (-not $completed) { throw 'No completed
      backup or restore evidence was found.' }
    negativeCommand: $failed = Get-AzRecoveryServicesBackupJob -VaultId $VaultId -From (Get-Date).AddDays(-7) | Where-Object
      { $_.Status -in @('Failed','PartiallySucceeded') }; if ($failed) { throw 'Failed backup or restore jobs require resolution.'
      }
    expected: The restore plan uses a quarantined network, malware inspection, identity isolation, application checks, data-consistency
      checks, and explicit release approval.
    negative: Restoring directly onto the original VM or reconnecting before security and application acceptance must fail.
    evidence: Record the selected recovery point, job timing, isolation controls, assertion results, and approval outcome.
    failure: A technically completed restore can reintroduce compromise or inconsistent application state.
    retry: Select the next trusted recovery point, preserve the failed evidence, and repeat validation in isolation.
    cleanup: Remove only disposable restored resources after exact ownership checks; retain protected recovery points.
    waf: 'Operational Excellence: a rehearsed isolated-restore workflow produces repeatable and auditable recovery.'
  - title: Exercise failover ordering and rollback
    requirement: LAB15-REQ-05
    command: Get-AzRecoveryServicesAsrRecoveryPlan -Name $RecoveryPlanName | Select-Object Name, PrimaryFabricFriendlyName,
      RecoveryFabricFriendlyName, Groups
    positiveCommand: $plan = Get-AzRecoveryServicesAsrRecoveryPlan -Name $RecoveryPlanName; if (-not $plan -or $plan.Groups.Count
      -lt 2) { throw 'The recovery plan does not contain dependency-aware groups.' }
    negativeCommand: $plan = Get-AzRecoveryServicesAsrRecoveryPlan -Name $RecoveryPlanName; if ($plan.Groups[0].ProtectedItems.FriendlyName
      -contains $WebTierVmName) { throw 'The web tier starts before its data dependency.' }
    expected: The safe analogue sequences identity, data, application, and ingress tiers, measures the RTO, and defines rollback
      and failback gates.
    negative: Passing infrastructure health while a clinical transaction or rollback assertion fails must produce an overall
      failed result.
    evidence: Save the simulated timeline, assertion-level outcomes, dependency delays, and remediation owners.
    failure: Parallel recovery without dependency gates can create misleadingly fast but unusable service restoration.
    retry: Correct the recovery group order and repeat the failed wave, not the entire exercise, unless state is uncertain.
    cleanup: Remove only run-owned simulation artifacts; do not start a test failover or delete recovery plans.
    waf: 'Cost Optimization: the safe analogue validates orchestration without maintaining a full secondary compute estate.'
  changeRequest: Security now requires a known-clean restore to be available within two hours even when the latest three recovery
    points are considered suspect.
  challenge: Revise retention, immutability, isolated-restore capacity, and recovery-point selection so the cyber-recovery
    target is credible without selecting the all-workload regional standby candidate.
  troubleshooting:
  - If vault cmdlets return no items, set the correct vault context and verify Reader access before concluding that protection
    is absent.
  - If a VM SKU reports restrictions, inspect zone and subscription restrictions separately and document the approved fallback
    SKU.
  - If backup job duration exceeds RTO, distinguish restore transfer time from application validation and approval delays.
  architectureAnalysis:
    permissions: Virtual machine, SKU, and backup read roles support assessment; protection, immutability, restore, failover,
      or compute changes require separate authorization.
    licensing: Azure Backup protected instances and storage, Site Recovery protected instances, restored disks, and temporary
      isolated compute are separately billed.
    costNotes: Compare zone-spread steady capacity, retained recovery points, cross-region replication where allowed, and
      short-lived isolated restore resources.
    constraints:
    - Clinical coordination must survive a datacenter failure and restore compromised VMs without reconnecting unsafe systems.
    - A known-clean point must be restorable within two hours even when the latest three recovery points are suspect.
    assumptions:
    - Application tiers can run across supported availability zones and have documented startup dependencies.
    - Security can classify a recovery point and approve release from a quarantined restore network.
    facts:
      data: VM inventory includes zones, disks, backup policy, recovery points, dependencies, health, and isolation evidence.
      scale: Windows and Linux tiers span several machines; exact disk size, change rate, and restore throughput remain measured
        inputs.
      latency: Clinical transaction checks and restore transfer time are measured separately from infrastructure boot time.
      availability: Zone distribution covers a datacenter fault while trusted restore handles destructive or compromised state.
      rto: Cyber recovery must deliver a known-clean restore within two hours after excluding the latest three points.
      rpo: The acceptable older recovery point depends on backup frequency and forensic confidence and requires clinical owner
        approval.
      budget: A safe analogue avoids permanent second-region compute while retaining zone capacity and temporary isolated
        restore cost.
    candidateAnalyses:
    - name: Zone-spread virtual machine scale sets with Azure Backup and isolated restore
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 5
        C3: 5
        C4: 4
        C5: 3
      rationale: Zone-spread compute covers datacenter loss and Azure Backup supplies protected recovery points for a controlled
        quarantined restore.
      rejectedReason: null
    - name: Availability sets with locally redundant vault protection
      eligible: true
      disqualifiers: []
      scores:
        C1: 3
        C2: 2
        C3: 4
        C4: 3
        C5: 4
      rationale: Availability sets distribute host faults but do not establish a zone boundary and local vault redundancy
        enlarges regional-loss exposure.
      rejectedReason: It does not meet the datacenter-failure requirement as directly as zone-spread placement.
    - name: Azure Site Recovery warm replicas in a secondary region for every virtual machine
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 5
        C3: 4
        C4: 3
        C5: 1
      rationale: Warm replicas improve regional recovery but cost more and may replicate compromised state without trusted-point
        selection.
      rejectedReason: Uniform replication exceeds the lab budget and does not replace immutable clean recovery points.
    - name: In-place production restore over the suspected virtual machines
      eligible: false
      disqualifiers:
      - LAB15-REQ-04 requires quarantine, malware inspection, application validation, and release approval before reconnection.
      scores:
        C1: 1
        C2: 2
        C3: 1
        C4: 2
        C5: 4
      rationale: An in-place restore uses fewer resources but destroys rollback evidence and can reconnect compromise to production.
      rejectedReason: It is disqualified because a trusted isolated-restore boundary is mandatory.
    risks:
    - risk: Excluding three recovery points may leave no point inside the two-hour transfer and validation window.
      mitigation: Increase protected-point frequency or pre-stage isolated restore capacity after measuring older-point restore
        duration.
    - risk: A zone-spread VM set can still depend on a single-zone database or ingress component.
      mitigation: Map and assert every upstream dependency's failure domain before accepting the compute availability result.
    waf:
      reliability: Zone placement, backup coverage, clean-point selection, and dependency-aware startup address distinct failure
        modes.
      security: Immutable recovery points and quarantined validation prevent compromised machines from rejoining automatically.
      costOptimization: Permanent capacity covers zonal availability while secondary-region and restore resources remain risk-based.
      operationalExcellence: Timed restore, forensic approval, transaction checks, and rollback form one rehearsable recovery
        record.
      performanceEfficiency: SKU and degraded-capacity evidence ensure surviving zones and restore hosts can process the clinical
        load.
    safeAnalogue: Model recovery-point rejection, isolated-network validation, startup waves, and cleanup with synthetic VM
      and backup fixtures only.
    adrConsequences:
    - Backup policy must retain enough points that rejecting the newest three still leaves a recoverable candidate.
    - Security approval becomes part of the measured clinical recovery path, not a post-restore note.
    changeExpectedRevision: Increase protected-point depth and preplan isolated restore capacity so the fourth-newest trusted
      point can pass within two hours.
    revisedDecision:
      selectedCandidate: Zone-spread virtual machine scale sets with Azure Backup and isolated restore
      mandatoryRequirementId: LAB15-REQ-04
      reason: LAB15-REQ-04 makes isolated trusted recovery mandatory, so the selected design adds enough immutable points
        and prevalidated quarantine capacity to reject three suspect copies and finish within two hours.
      waf:
        reliability: A deeper point set and measured restore throughput protect the two-hour target.
        security: Forensic rejection and quarantine remain gates before any production reconnection.
        costOptimization: Temporary restore capacity is funded instead of a full permanent secondary estate.
        operationalExcellence: Exercises record selection, transfer, validation, approval, and rollback timestamps.
        performanceEfficiency: Prevalidated restore sizing avoids discovering disk-throughput limits during a cyber event.
- number: '16'
  scenario: Northwind Tickets uses Azure SQL Database for reservations, seat inventory, and payment-state coordination. The
    database is zone redundant in the primary region, but product leaders now require continuity through a complete regional
    outage and evidence that committed reservations remain within a five-minute data-loss window. Customer traffic can be
    redirected, yet DNS, connection-string behavior, database dependencies, and failback ownership are poorly documented.
    A continuously running duplicate application stack is outside the lab budget. The architecture exercise must therefore
    assess an existing topology with Azure CLI, model failover-group behavior, and validate application-aware recovery criteria
    without causing an actual failover or modifying production databases.
  role: Relational data continuity architect
  outcome: Select and validate a relational continuity pattern that covers zonal availability, regional failover, application
    connectivity, data loss, and controlled failback.
  duration: 150 minutes
  difficulty: advanced
  costClass: low
  businessOutcome: Preserve ticket sales and prevent overselling during zone or region disruption while meeting the five-minute
    RPO.
  stakeholders:
  - Commerce product owner
  - Database engineering lead
  - Payment compliance officer
  - Site reliability engineering lead
  - Customer support manager
  primarySource:
    title: Business continuity overview with Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/business-continuity-high-availability-disaster-recover-hadr-overview
  candidates:
  - Azure SQL Database failover group with zone-redundant primary and secondary databases
  - Active geo-replication with application-managed endpoints and failover
  - SQL Server on Azure Virtual Machines with an Always On availability group
  selected: Azure SQL Database failover group with zone-redundant primary and secondary databases
  checkpoints:
  - title: Baseline database tier and availability settings
    requirement: LAB16-REQ-01
    command: az sql db show --resource-group $ResourceGroupName --server $SqlServerName --name $DatabaseName --query "{id:id,sku:sku.name,tier:sku.tier,zoneRedundant:zoneRedundant,status:status}"
      --output json --only-show-errors
    positiveCommand: $db = az sql db show --resource-group $ResourceGroupName --server $SqlServerName --name $DatabaseName
      --output json --only-show-errors | ConvertFrom-Json; if ($db.status -ne 'Online') { throw 'The primary database is not
      online.' }
    negativeCommand: $db = az sql db show --resource-group $ResourceGroupName --server $SqlServerName --name $DatabaseName
      --output json --only-show-errors | ConvertFrom-Json; if (-not $db.zoneRedundant) { throw 'The selected primary tier
      is not zone redundant.' }
    expected: The baseline identifies service tier, zone redundancy, backup redundancy, maintenance constraints, dependencies,
      and observed workload demand.
    negative: A regional design based on a tier that cannot satisfy the local availability requirement must fail before failover
      planning.
    evidence: Store the normalized database configuration and the requirement-to-capability comparison.
    failure: Unsupported tier or region combinations can invalidate the selected continuity pattern.
    retry: Evaluate the nearest qualifying tier, recalculate cost, and rerun the capability assertions.
    cleanup: Delete only the local configuration export; the source database remains unchanged.
    waf: 'Reliability: local zone resilience prevents a datacenter event from becoming an unnecessary regional failover.'
  - title: Validate failover-group topology
    requirement: LAB16-REQ-02
    command: az sql failover-group show --resource-group $ResourceGroupName --server $SqlServerName --name $FailoverGroupName
      --query "{partner:partnerServers[0].id,policy:readWriteEndpoint.failoverPolicy,grace:readWriteEndpoint.failoverWithDataLossGracePeriodMinutes,databases:databases}"
      --output json --only-show-errors
    positiveCommand: $fg = az sql failover-group show --resource-group $ResourceGroupName --server $SqlServerName --name $FailoverGroupName
      --output json --only-show-errors | ConvertFrom-Json; if ($fg.databases.Count -lt 1 -or $fg.partnerServers.Count -ne
      1) { throw 'The failover group lacks a database or a single partner.' }
    negativeCommand: $fg = az sql failover-group show --resource-group $ResourceGroupName --server $SqlServerName --name $FailoverGroupName
      --output json --only-show-errors | ConvertFrom-Json; if ($fg.readWriteEndpoint.failoverPolicy -eq 'Automatic' -and $fg.readWriteEndpoint.failoverWithDataLossGracePeriodMinutes
      -lt 60) { throw 'Automatic failover grace is below the approved safety threshold.' }
    expected: The partner region, database membership, endpoint policy, grace period, residency, and capacity assumptions
      match the approved design.
    negative: Missing database membership or an automatic policy that accepts unapproved data loss must fail.
    evidence: Preserve the failover-group projection and a diagram of primary, secondary, and listener endpoint behavior.
    failure: An incomplete group can redirect the application while leaving a required database behind.
    retry: Correct the proposed membership or policy in the design fixture and repeat the read-only comparison.
    cleanup: Remove local projections only; do not add databases or alter failover policy during assessment.
    waf: 'Security: region and membership validation keeps replicated payment data inside approved boundaries.'
  - title: Prove connection and dependency readiness
    requirement: LAB16-REQ-03
    command: az sql failover-group list --resource-group $ResourceGroupName --server $SqlServerName --query "[].{name:name,readWriteListener:readWriteEndpoint,readOnlyListener:readOnlyEndpoint}"
      --output json --only-show-errors
    positiveCommand: $groups = az sql failover-group list --resource-group $ResourceGroupName --server $SqlServerName --output
      json --only-show-errors | ConvertFrom-Json; if (-not ($groups | Where-Object { $_.name -eq $FailoverGroupName })) {
      throw 'The expected listener configuration was not found.' }
    negativeCommand: $server = az sql server show --resource-group $ResourceGroupName --name $SqlServerName --output json
      --only-show-errors | ConvertFrom-Json; if ($server.fullyQualifiedDomainName -eq $ApplicationSqlEndpoint) { throw 'The
      application is pinned to the regional server rather than the failover-group listener.' }
    expected: Applications use the read-write listener, retry transient failures, preserve idempotency, and can reach every
      regional dependency after redirection.
    negative: A hard-coded regional server name, non-idempotent retry, or missing secret in the secondary path must fail.
    evidence: Save sanitized connection settings, dependency checks, retry-policy tests, and transaction correlation IDs.
    failure: Database failover can succeed while the application remains pinned to the unavailable primary endpoint.
    retry: Correct the local configuration fixture and replay connection and idempotency tests.
    cleanup: Remove sanitized test outputs and synthetic transactions; never commit connection secrets.
    waf: 'Operational Excellence: listener-based configuration and tested retry behavior make failover operable.'
  - title: Measure replication health against RPO
    requirement: LAB16-REQ-04
    command: az monitor metrics list --resource $DatabaseResourceId --metric replication_lag_seconds --interval PT1M --aggregation
      Maximum --output json --only-show-errors
    positiveCommand: $metric = az monitor metrics list --resource $DatabaseResourceId --metric replication_lag_seconds --interval
      PT1M --aggregation Maximum --output json --only-show-errors | ConvertFrom-Json; if ($metric.value.timeseries.data.maximum
      | Where-Object { $_ -gt 300 }) { throw 'Observed replication lag exceeds the five-minute RPO.' }
    negativeCommand: $metric = az monitor metrics list --resource $DatabaseResourceId --metric replication_lag_seconds --interval
      PT1M --aggregation Maximum --output json --only-show-errors | ConvertFrom-Json; if (-not $metric.value.timeseries.data)
      { throw 'Replication lag has no evidence samples.' }
    expected: Replication lag and business transaction markers are measured independently and remain within the five-minute
      RPO under the modeled load.
    negative: Missing samples, averaged-away spikes, or infrastructure-only lag with no transaction watermark must fail.
    evidence: Archive metric samples, transaction watermarks, timestamps, and the calculated worst-case data-loss interval.
    failure: Aggregate metrics can hide short lag spikes that violate the business RPO.
    retry: Query maximum granularity for the affected window and rerun the synthetic transaction comparison.
    cleanup: Delete synthetic business records according to the test-data policy; retain sanitized metric evidence.
    waf: 'Performance Efficiency: lag measurement shows whether secondary capacity can sustain the write and replication rate.'
  - title: Rehearse failover decision and failback
    requirement: LAB16-REQ-05
    command: az sql failover-group show --resource-group $ResourceGroupName --server $SqlServerName --name $FailoverGroupName
      --query "{replicationRole:replicationRole,policy:readWriteEndpoint.failoverPolicy,partner:partnerServers[0].id}" --output
      table --only-show-errors
    positiveCommand: $fg = az sql failover-group show --resource-group $ResourceGroupName --server $SqlServerName --name $FailoverGroupName
      --output json --only-show-errors | ConvertFrom-Json; if ($fg.replicationRole -notin @('Primary','Secondary')) { throw
      'The failover role cannot be established.' }
    negativeCommand: $alerts = az monitor metrics alert list --resource-group $ResourceGroupName --query '[?contains(name,''sql'')
      && enabled==`false`]' --output json --only-show-errors | ConvertFrom-Json; if ($alerts.Count -gt 0) { throw 'A required
      SQL continuity alert is disabled.' }
    expected: The exercise defines detection, business authorization, forced-versus-planned choice, validation, stabilization,
      and data-safe failback gates.
    negative: Automatic failback, an unmeasured forced failover, or success without reservation and payment assertions must
      fail.
    evidence: Preserve the tabletop decision log, predicted data-loss window, application assertions, and failback checklist.
    failure: Premature failback can cause a second outage or overwrite the most current data path.
    retry: Reconcile the authoritative data copy and repeat the decision exercise from the failed gate.
    cleanup: Delete local exercise artifacts; never issue a failover command as part of this safe analogue.
    waf: 'Cost Optimization: the model validates regional readiness without running a duplicate application tier for the lab.'
  changeRequest: A new flash-sale contract doubles peak write volume and requires the reservation API to recover within fifteen
    minutes rather than one hour.
  challenge: Recalculate secondary capacity and failover timing, then justify whether the selected failover-group design still
    wins over active geo-replication with application-managed recovery.
  troubleshooting:
  - If a metric name is unavailable for the selected resource type, enumerate metric definitions and map the closest supported
    replication-health signal.
  - If the listener test still resolves to the primary region, distinguish expected DNS behavior from an application connection
    string pinned to a server.
  - If failover-group membership is incomplete, report the gap but do not modify production membership during the safe analogue.
  architectureAnalysis:
    permissions: SQL account and failover configuration read access supports assessment; database creation, replication, failover,
      DNS, or connection changes require separate authorization.
    licensing: Primary and secondary database compute, backup storage, zone redundancy, geo-replication traffic, and test
      capacity affect price.
    costNotes: Model both regions, readable secondary use, peak write tier, backup retention, failover exercises, and duplicate
      application dependencies.
    constraints:
    - Committed reservations must remain inside a five-minute data-loss window through regional disruption.
    - Peak writes double and the reservation API recovery target drops from one hour to fifteen minutes.
    assumptions:
    - Applications use a failover-group listener and retry transient connection changes safely.
    - Dependent identity, network, and secret services have compatible regional recovery behavior.
    facts:
      data: Reservation, seat inventory, and payment-state transactions require consistency plus measurable replication and
        failover evidence.
      scale: A flash sale doubles peak write volume; baseline transactions, database size, and log rate remain measured inputs.
      latency: Write latency and replication delay must stay compatible with the five-minute RPO during doubled demand.
      availability: Zone-redundant primary and secondary databases plus controlled regional failover cover separate fault
        domains.
      rto: The end-to-end reservation API recovery target changes from one hour to fifteen minutes.
      rpo: Accepted reservations may lose no more than five minutes, including replication backlog at peak write rate.
      budget: Continuous secondary compute is accepted for regional continuity, but duplicate application capacity can use
        a bounded warm strategy.
    candidateAnalyses:
    - name: Azure SQL Database failover group with zone-redundant primary and secondary databases
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 5
        C3: 4
        C4: 5
        C5: 3
      rationale: Failover groups provide listener-based application continuity and managed regional database relationships
        with zonal protection.
      rejectedReason: null
    - name: Active geo-replication with application-managed endpoints and failover
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 4
        C3: 4
        C4: 2
        C5: 3
      rationale: Active geo-replication supports flexible database relationships but shifts endpoint selection and coordinated
        failover into application operations.
      rejectedReason: Application-managed endpoint and database coordination adds recovery steps that threaten the shorter
        RTO.
    - name: SQL Server on Azure Virtual Machines with an Always On availability group
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 5
        C3: 4
        C4: 2
        C5: 1
      rationale: Always On offers deep control but adds operating systems, clustering, patching, quorum, and listener ownership.
      rejectedReason: The extra infrastructure operations are unnecessary for the managed-database workload and increase recovery
        complexity.
    - name: Backups with manual DNS switching and no continuously replicated secondary
      eligible: false
      disqualifiers:
      - LAB16-REQ-04 requires measured regional replication health to remain inside the five-minute RPO.
      scores:
        C1: 1
        C2: 2
        C3: 3
        C4: 2
        C5: 4
      rationale: Restore-based recovery lowers standby cost but cannot reliably restore and redirect the API inside the new
        target.
      rejectedReason: It is ineligible because backup restore cannot prove the mandatory RTO and RPO combination.
    risks:
    - risk: Doubled log generation can increase replication lag beyond the five-minute data-loss window.
      mitigation: Load-test the peak write profile, monitor lag, and size both databases and network dependencies for the
        observed rate.
    - risk: The database listener can fail over while application configuration or secrets remain region-bound.
      mitigation: Test the API transaction through all regional dependencies and treat any failed business assertion as recovery
        failure.
    waf:
      reliability: Zonal databases, regional replication, listener failover, and application checks cover layered failure
        domains.
      security: Encrypted connections, private access, identity, and audit controls apply in both primary and secondary regions.
      costOptimization: Secondary capacity is a funded RPO/RTO control and can serve approved reads rather than remain entirely
        idle.
      operationalExcellence: Lag, failover, DNS, API transaction, and failback timestamps form the recovery scorecard.
      performanceEfficiency: Both regions are sized and tested for doubled write throughput instead of assuming replication
        keeps pace.
    safeAnalogue: Use local topology, lag, connection, and transaction fixtures to simulate failover and failback without
      invoking a database operation.
    adrConsequences:
    - Application connections must use the failover-group listener and bounded retry behavior.
    - Both regions require capacity and dependency validation at the doubled flash-sale write rate.
    changeExpectedRevision: Resize both sides and automate the listener-based recovery sequence to demonstrate fifteen-minute
      API restoration at doubled writes.
    revisedDecision:
      selectedCandidate: Azure SQL Database failover group with zone-redundant primary and secondary databases
      mandatoryRequirementId: LAB16-REQ-05
      reason: LAB16-REQ-05 now requires fifteen-minute application recovery under doubled writes, so the failover group is
        retained with peak-tested secondary capacity and prevalidated dependency routing.
      waf:
        reliability: Peak-tested lag and application failover protect both the five-minute RPO and fifteen-minute RTO.
        security: Secondary-region identities, private paths, and auditing are validated before an incident.
        costOptimization: Higher standby capacity is explicitly tied to the contracted flash-sale continuity target.
        operationalExcellence: Automated connection and business checks replace manual endpoint edits.
        performanceEfficiency: Capacity evidence covers doubled writes and the replication work they generate.
- number: '17'
  scenario: Adventure Works Media stores personalization documents in Azure Cosmos DB and millions of production assets in
    Azure Blob Storage. The service has grown across continents, but the current design confuses durability with availability
    and has no consistent method to demonstrate RPO, restore integrity, or application behavior when a write region is unavailable.
    Legal policy requires assets for one market to remain within an approved geography, while editorial teams need rapid access
    to current metadata. Running duplicate high-scale accounts solely for a lab is unjustified. The team will use Azure PowerShell
    discovery and synthetic evidence to design a safe analogue for multi-region reads, controlled writes, backup recovery,
    and storage-account failover.
  role: Nonrelational data resilience architect
  outcome: Design and assess coordinated resilience for Cosmos DB documents and Blob assets, including region placement, consistency,
    backup, failover, and restore validation.
  duration: 165 minutes
  difficulty: advanced
  costClass: low
  businessOutcome: Keep the media platform usable through regional disruption without violating content residency or silently
    losing accepted editorial changes.
  stakeholders:
  - Digital media product owner
  - Data platform lead
  - Content rights counsel
  - Site reliability engineering lead
  - Editorial operations manager
  primarySource:
    title: Reliability in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-cosmos-db
  candidates:
  - Cosmos DB multi-region writes with zone redundancy plus GZRS Blob Storage
  - Single write region with secondary reads plus RA-GRS Blob Storage and manual failover
  - Independent regional data stacks synchronized by an application-owned event log
  selected: Cosmos DB multi-region writes with zone redundancy plus GZRS Blob Storage
  checkpoints:
  - title: Inventory nonrelational region placement
    requirement: LAB17-REQ-01
    command: Get-AzCosmosDBAccount -ResourceGroupName $ResourceGroupName -Name $CosmosAccountName | Select-Object Name, Location,
      EnableMultipleWriteLocations, EnableAutomaticFailover, ConsistencyPolicy
    positiveCommand: $account = Get-AzCosmosDBAccount -ResourceGroupName $ResourceGroupName -Name $CosmosAccountName; if ($account.Locations.Count
      -lt 2) { throw 'The account has fewer than two configured regions.' }
    negativeCommand: $account = Get-AzCosmosDBAccount -ResourceGroupName $ResourceGroupName -Name $CosmosAccountName; if ($account.Locations
      | Where-Object { $_.LocationName -notin $ApprovedCosmosRegions }) { throw 'A Cosmos DB region is outside the approved
      geography.' }
    expected: Region order, write mode, zone redundancy, consistency, automatic failover, and residency are explicit for the
      document workload.
    negative: Multiple regions without a documented write-conflict or consistency decision must fail.
    evidence: Export a sanitized account projection and map each region to latency, residency, and failure-domain requirements.
    failure: Region count alone can conceal an unsafe write topology or an unapproved data boundary.
    retry: Correct the proposed region and consistency design, then rerun discovery and policy comparisons.
    cleanup: Remove the local account projection; do not add, remove, or reprioritize regions.
    waf: 'Reliability: deliberate region ordering and write behavior reduce ambiguous failover outcomes.'
  - title: Validate document consistency and conflict behavior
    requirement: LAB17-REQ-02
    command: Get-AzCosmosDBSqlDatabase -ResourceGroupName $ResourceGroupName -AccountName $CosmosAccountName | Select-Object
      Name, Resource, AutoscaleSettings
    positiveCommand: $account = Get-AzCosmosDBAccount -ResourceGroupName $ResourceGroupName -Name $CosmosAccountName; if ($account.ConsistencyPolicy.DefaultConsistencyLevel
      -notin @('Session','BoundedStaleness')) { throw 'Consistency does not match the approved editorial model.' }
    negativeCommand: $account = Get-AzCosmosDBAccount -ResourceGroupName $ResourceGroupName -Name $CosmosAccountName; if ($account.EnableMultipleWriteLocations
      -and -not $ConflictResolutionProcedureApproved) { throw 'Multi-write is enabled without an approved conflict-resolution
      procedure.' }
    expected: The selected consistency level, session-token handling, idempotency key, and conflict-resolution ownership preserve
      accepted edits.
    negative: Last-write-wins without a suitable ordering property, or retry without idempotency, must fail.
    evidence: Save synthetic concurrent-write cases, expected winners, session-read results, and conflict-handling records.
    failure: A healthy account can still return stale content or resolve concurrent edits contrary to business intent.
    retry: Correct the conflict rule or application token handling and rerun the failed synthetic case.
    cleanup: Delete only synthetic documents bearing the exact lab run identifier.
    waf: 'Performance Efficiency: consistency is chosen from business semantics instead of paying unnecessary latency for
      stronger guarantees.'
  - title: Assess Blob durability and failover readiness
    requirement: LAB17-REQ-03
    command: Get-AzStorageAccount -ResourceGroupName $ResourceGroupName -Name $StorageAccountName | Select-Object StorageAccountName,
      Location, Sku, PrimaryLocation, SecondaryLocation, StatusOfPrimary, StatusOfSecondary
    positiveCommand: $storage = Get-AzStorageAccount -ResourceGroupName $ResourceGroupName -Name $StorageAccountName; if ($storage.Sku.Name
      -notmatch 'GZRS|RAGZRS|GRS|RAGRS') { throw 'The storage account lacks approved geo-redundancy.' }
    negativeCommand: $storage = Get-AzStorageAccount -ResourceGroupName $ResourceGroupName -Name $StorageAccountName; if (-not
      $storage.SecondaryLocation -or $storage.SecondaryLocation -notin $ApprovedBlobRegions) { throw 'The secondary location
      is absent or outside the approved geography.' }
    expected: Replication SKU, paired geography, read access, object replication boundaries, failover effects, and endpoint
      behavior are documented.
    negative: Treating geo-replication as backup, or approving account failover without the last-sync exposure, must fail.
    evidence: Preserve the storage projection, replication comparison, and worst-case unreplicated-write calculation.
    failure: Account failover can convert an availability incident into permanent loss of not-yet-replicated writes.
    retry: Reassess the write-freeze and business authorization gates with the latest sync evidence.
    cleanup: Remove local evidence only; do not initiate account failover or change the redundancy SKU.
    waf: 'Cost Optimization: GZRS protects zonal and regional failure without duplicating the entire media application.'
  - title: Prove backup and restore integrity
    requirement: LAB17-REQ-04
    command: Get-AzStorageBlobServiceProperty -ResourceGroupName $ResourceGroupName -StorageAccountName $StorageAccountName
      | Select-Object DeleteRetentionPolicy, ContainerDeleteRetentionPolicy, IsVersioningEnabled, RestorePolicy
    positiveCommand: $properties = Get-AzStorageBlobServiceProperty -ResourceGroupName $ResourceGroupName -StorageAccountName
      $StorageAccountName; if (-not $properties.IsVersioningEnabled -or -not $properties.DeleteRetentionPolicy.Enabled) {
      throw 'Blob versioning or soft delete is not enabled.' }
    negativeCommand: $properties = Get-AzStorageBlobServiceProperty -ResourceGroupName $ResourceGroupName -StorageAccountName
      $StorageAccountName; if ($properties.DeleteRetentionPolicy.Days -lt $RequiredRetentionDays) { throw 'Blob soft-delete
      retention is below the requirement.' }
    expected: Cosmos DB backup mode and retention plus Blob versioning, soft delete, point-in-time restore, and integrity
      hashing meet recovery requirements.
    negative: Successful API restoration without record counts, referential checks, and asset hashes must fail.
    evidence: Store synthetic manifest counts, hashes, restore timestamps, and per-assertion pass or fail results.
    failure: Retained data can be unusable when metadata and binary assets represent different recovery points.
    retry: Choose a mutually consistent recovery timestamp and repeat document, manifest, and hash validation.
    cleanup: Remove run-owned restored copies after ownership verification; never purge retained versions.
    waf: 'Security: versioning, soft delete, and controlled restore reduce destructive-change risk.'
  - title: Rehearse coordinated regional recovery
    requirement: LAB17-REQ-05
    command: Get-AzCosmosDBAccount -ResourceGroupName $ResourceGroupName -Name $CosmosAccountName | Select-Object -ExpandProperty
      Locations | Sort-Object FailoverPriority
    positiveCommand: $locations = (Get-AzCosmosDBAccount -ResourceGroupName $ResourceGroupName -Name $CosmosAccountName).Locations;
      if (($locations | Sort-Object FailoverPriority | Select-Object -First 1).ProvisioningState -ne 'Succeeded') { throw
      'The preferred Cosmos DB region is not ready.' }
    negativeCommand: $storage = Get-AzStorageAccount -ResourceGroupName $ResourceGroupName -Name $StorageAccountName; if ($storage.StatusOfSecondary
      -and $storage.StatusOfSecondary -ne 'Available') { throw 'The Blob secondary is not available for the recovery scenario.'
      }
    expected: The tabletop coordinates Cosmos DB write-region behavior, Blob write freeze and failover, endpoint changes,
      cache invalidation, validation, and rollback.
    negative: Independent component success must not pass when document metadata points to an unavailable or mismatched asset
      version.
    evidence: Archive the recovery timeline, cross-store consistency assertions, business acceptance, and residual data-loss
      statement.
    failure: Uncoordinated recovery can expose mixed generations of documents and media files.
    retry: Return to the last consistent synthetic manifest and replay only after both data services meet entry criteria.
    cleanup: Delete local simulation records and run-owned synthetic data; perform no live regional failover.
    waf: 'Operational Excellence: coordinated gates keep two independently resilient data services consistent at the application
      boundary.'
  changeRequest: A new rights agreement forbids document replication outside one country, but global consumers must still
    retrieve public media within two seconds.
  challenge: Separate regulated editorial metadata from public delivery assets, revise region and caching choices, and explain
    why the selected design still meets availability without replicating protected documents globally.
  troubleshooting:
  - If account properties use a different region-name format, normalize names before comparing them with the approved geography
    list.
  - If metric or backup evidence is unavailable, record the permission gap as a failed assertion rather than assuming a healthy
    state.
  - If cross-store hashes disagree, preserve both manifests and locate the last mutually consistent timestamp before retrying.
  architectureAnalysis:
    permissions: Cosmos DB and Storage read access supports topology review; region, failover, consistency, container, or
      replication changes require separately approved data roles.
    licensing: Multi-region Cosmos DB throughput, multi-write regions, zone redundancy, storage replication, egress, and backups
      all affect recurring cost.
    costNotes: Separate document request units and replicated writes from public-media capacity, retrieval, CDN transfer,
      and restricted-content storage.
    constraints:
    - Accepted editorial changes cannot be silently lost during a regional disruption.
    - Rights-controlled documents cannot replicate outside one country, while public media must remain globally retrievable
      within two seconds.
    assumptions:
    - Editorial applications implement conflict resolution and expose committed-version evidence.
    - Content classification reliably separates restricted documents from public media before storage.
    facts:
      data: Editorial documents, conflict metadata, restricted rights files, and public media require different consistency
        and replication boundaries.
      scale: Global consumers heavily read public media while editorial writes are smaller; measured RU and object volume
        remain owner inputs.
      latency: Public media retrieval has a two-second target; editorial consistency and conflict handling use a separate
        latency contract.
      availability: Public media needs multi-region delivery, while restricted documents remain available only within their
        approved country boundary.
      rto: Regional editorial recovery is defined by tested failover; the rights agreement may accept longer restricted-document
        outage than unlawful replication.
      rpo: Accepted editorial changes require explicit consistency and conflict rules rather than an assumed zero-loss promise.
      budget: Global replication is funded for public media and editorial metadata, not automatically for every rights-controlled
        object.
    candidateAnalyses:
    - name: Cosmos DB multi-region writes with zone redundancy plus GZRS Blob Storage
      eligible: true
      disqualifiers: []
      scores:
        C1: 5
        C2: 5
        C3: 4
        C4: 4
        C5: 5
      rationale: Multi-write Cosmos DB supports global editorial availability and explicit conflicts while GZRS protects and
        serves public objects.
      rejectedReason: null
    - name: Single write region with secondary reads plus RA-GRS Blob Storage and manual failover
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 3
        C3: 4
        C4: 3
        C5: 4
      rationale: A single writer simplifies consistency and cost, but manual promotion increases outage and accepted-write
        risk.
      rejectedReason: Its slower recovery and manual decision path are weaker for active global editorial operations.
    - name: Independent regional data stacks synchronized by an application-owned event log
      eligible: true
      disqualifiers: []
      scores:
        C1: 4
        C2: 4
        C3: 5
        C4: 2
        C5: 2
      rationale: Independent stacks can enforce geography boundaries precisely but transfer ordering, replay, and conflict
        correctness to application code.
      rejectedReason: The custom synchronization burden is not justified before the new restricted-content boundary appears.
    - name: Replicate every document and media object to all regions
      eligible: false
      disqualifiers:
      - LAB17-REQ-03 requires explicit object-replication boundaries and documented geography behavior.
      scores:
        C1: 1
        C2: 5
        C3: 1
        C4: 4
        C5: 2
      rationale: Universal replication maximizes reach but ignores content-specific legal boundaries and egress cost.
      rejectedReason: It is disqualified because restricted-document replication would breach the mandatory rights agreement.
    risks:
    - risk: Misclassification can send a restricted document into globally replicated public storage.
      mitigation: Enforce classification at ingestion and assert account, container, and replication placement before publication.
    - risk: Multi-write conflict resolution can preserve a technically valid but editorially wrong version.
      mitigation: Use deterministic domain rules, retain conflicting versions, and require an editor-owned reconciliation
        workflow.
    waf:
      reliability: Multi-region document writes and global public media delivery reduce regional outage while exposing conflict
        behavior.
      security: Classification and country-bound storage keep rights-controlled content out of global replication paths.
      costOptimization: Replication and throughput are allocated by content class instead of copying every object worldwide.
      operationalExcellence: Conflict, classification, failover, and publication evidence make regional recovery auditable.
      performanceEfficiency: Public objects use globally distributed retrieval while restricted content avoids unnecessary
        egress and replicas.
    safeAnalogue: Simulate classification, conflict resolution, regional unavailability, and public-media timing with synthetic
      documents and object manifests.
    adrConsequences:
    - Storage topology becomes content-class aware and publishing must verify the classification boundary.
    - Editors own conflict outcomes; infrastructure health alone cannot declare recovery successful.
    changeExpectedRevision: Split restricted documents into a country-bound stack while retaining global distribution for
      public media and permitted metadata.
    revisedDecision:
      selectedCandidate: Independent regional data stacks synchronized by an application-owned event log
      mandatoryRequirementId: LAB17-REQ-03
      reason: LAB17-REQ-03 makes object replication boundaries explicit, so restricted documents move to an independent in-country
        stack while public media remains globally distributed.
      waf:
        reliability: Public media stays multi-region while restricted content accepts the documented in-country failure domain.
        security: Rights-controlled bytes never enter the cross-region event or blob replication path.
        costOptimization: Only globally consumable media carries worldwide replication and egress cost.
        operationalExcellence: Classification and event-contract tests become mandatory publication gates.
        performanceEfficiency: Edge-served public media meets the two-second target without exporting restricted documents.
- number: '18'
  scenario: Tailspin Aerospace processes aerodynamic simulations in nightly bursts while a smaller licensing and orchestration
    tier must remain available during business hours. Jobs range from short CPU-bound calculations to memory-intensive batches
    that need ephemeral scratch disks, a controlled image, and deterministic retry behavior. Demand is seasonal, permanent
    peak capacity would be wasteful, and some simulations cannot run on shared infrastructure. The platform team needs a deployable
    Bicep reference that separates the highly available control plane from elastic workers and records quota, image, and Batch
    task-recovery assumptions. The lab may create a tightly tagged, time-limited, zero-capacity reference footprint, but it
    does not submit work or launch production-scale pools.
  role: Compute platform architect
  outcome: Build and assess a Bicep-defined architecture that matches compute requirements to zonal virtual machines and an
    autoscaled Azure Batch worker pool.
  duration: 180 minutes
  difficulty: advanced
  costClass: moderate
  businessOutcome: Complete simulation batches inside the overnight window while keeping orchestration available and paying
    for burst capacity only when jobs require it.
  stakeholders:
  - Aerospace simulation lead
  - Compute platform owner
  - Security engineering lead
  - FinOps analyst
  - Operations manager
  primarySource:
    title: Choose an Azure compute service
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/compute-decision-tree
  candidates:
  - Zonal control virtual machines with an autoscaled Azure Batch pool
  - Flexible Virtual Machine Scale Sets running custom queue workers
  - Dedicated zonal virtual machines scheduled for the nightly processing window
  selected: Zonal control virtual machines with an autoscaled Azure Batch pool
  checkpoints:
  - title: Translate workload demand into compute requirements
    requirement: LAB18-REQ-01
    command: az vm list-skus --location $Location --resource-type virtualMachines --query '[?capabilities[?name==''vCPUs''
      && to_number(value)>=`4`]].{name:name,zones:locationInfo[0].zones,restrictions:restrictions}' --output table --only-show-errors
    positiveCommand: $skus = az vm list-skus --location $Location --size $ControlVmSku --all --output json --only-show-errors
      | ConvertFrom-Json; if (-not $skus -or $skus[0].restrictions.Count -gt 0) { throw 'The selected control VM SKU is unavailable
      or restricted.' }
    negativeCommand: $skus = az vm list-skus --location $Location --size $WorkerVmSku --all --output json --only-show-errors
      | ConvertFrom-Json; if (-not ($skus[0].locationInfo.zones)) { throw 'The worker SKU has no documented zone capability.'
      }
    expected: The requirement matrix captures instruction set, vCPU, memory, scratch space, network, image, job duration,
      concurrency, availability, quota, and data-gravity needs.
    negative: Selecting a familiar SKU before checking batch-window throughput, quota, or regional restrictions must fail.
    evidence: Save the demand model, SKU capability output, benchmark assumption, and normal-versus-peak capacity calculation.
    failure: A technically supported SKU can miss the batch window or be unavailable at the required quota.
    retry: Substitute the approved fallback SKU, rerun the throughput model, and update the cost comparison.
    cleanup: Remove local SKU exports; this checkpoint creates no compute or quota request.
    waf: 'Performance Efficiency: requirements drive heterogeneous sizing instead of one oversized worker profile.'
  - title: Compile and lint the compute Bicep design
    requirement: LAB18-REQ-02
    command: az bicep build --file artifacts/main.bicep --stdout --only-show-errors | Out-Null
    positiveCommand: $template = az bicep build --file artifacts/main.bicep --stdout --only-show-errors | ConvertFrom-Json;
      $types = @($template.resources.type); $vmss = $template.resources | Where-Object type -eq 'Microsoft.Compute/virtualMachineScaleSets';
      if ('Microsoft.Batch/batchAccounts' -notin $types -or 'Microsoft.Batch/batchAccounts/pools' -notin $types -or -not $vmss.properties.virtualMachineProfile)
      { throw 'The compiled template lacks the Batch pool or complete VMSS profile.' }
    negativeCommand: $template = az bicep build --file artifacts/main.bicep --stdout --only-show-errors | ConvertFrom-Json;
      if ($template.resources | Where-Object { $_.properties -and ($_.properties | ConvertTo-Json -Depth 20) -match 'password|accountKey'
      }) { throw 'The template appears to contain an inline secret.' }
    expected: Compilation succeeds and the template contains a tagged, parameterized, three-zone-capable VMSS at zero capacity
      plus a private, zero-node Batch pool, networking, identity, and no embedded secret.
    negative: An unpinned image, unrestricted management ingress, missing shutdown control, or plaintext credential must fail
      lint review.
    evidence: Preserve the Bicep source hash, compiler output, parameter review, and architecture traceability record.
    failure: A template can compile while violating security, ownership, or lifecycle requirements.
    retry: Correct the smallest failing module and rerun compilation plus semantic assertions before deployment preview.
    cleanup: Delete generated local JSON if retained; keep the authored Bicep source.
    waf: 'Security: managed identity, restricted ingress, and secret-free templates reduce control-plane exposure.'
  - title: Preview the tagged reference deployment
    requirement: LAB18-REQ-03
    command: az deployment group what-if --resource-group $ResourceGroupName --template-file artifacts/main.bicep --parameters
      artifacts/parameters.example.json runId=$RunId expiresOn=$ExpiresOn --result-format FullResourcePayloads --output json
      --only-show-errors
    positiveCommand: $preview = az deployment group what-if --resource-group $ResourceGroupName --template-file artifacts/main.bicep
      --parameters artifacts/parameters.example.json runId=$RunId expiresOn=$ExpiresOn --result-format ResourceIdOnly --output
      json --only-show-errors | ConvertFrom-Json; if (-not ($preview.changes | Where-Object changeType -eq 'Create')) { throw
      'What-if produced no owned resource creation.' }
    negativeCommand: $preview = az deployment group what-if --resource-group $ResourceGroupName --template-file artifacts/main.bicep
      --parameters artifacts/parameters.example.json runId=$RunId expiresOn=$ExpiresOn --result-format FullResourcePayloads
      --output json --only-show-errors | ConvertFrom-Json; if ($preview.changes | Where-Object changeType -ne 'Create') {
      throw 'What-if would modify, delete, or reuse a pre-existing resource.' }; if (($preview | ConvertTo-Json -Depth 50)
      -match '0\.0\.0\.0/0') { throw 'What-if exposes unrestricted network access.' }
    expected: What-if contains only new run-owned resources, zero control and worker capacity, no public IP allocation, and
      the required ownership and expiry tags.
    negative: Any destructive change, unbounded autoscale maximum, untagged resource, or unrelated scope must block execution.
    evidence: Archive the complete what-if result, reviewer decision, estimated hourly ceiling, and template and parameter
      hashes.
    failure: Parameter drift can expand cost or affect a pre-existing resource despite a valid template.
    retry: Correct parameters, regenerate state before any mutation, and obtain a fresh reviewed what-if result.
    cleanup: Remove preview output if it contains sensitive topology; what-if itself creates no resource.
    waf: 'Cost Optimization: bounded autoscale and reviewed preview make the maximum spend visible before deployment.'
  - title: Deploy and verify the compute reference
    requirement: LAB18-REQ-04
    command: az deployment group create --resource-group $ResourceGroupName --name "lab18-$RunId" --template-file artifacts/main.bicep
      --parameters artifacts/parameters.example.json runId=$RunId expiresOn=$ExpiresOn --output json --only-show-errors
    positiveCommand: $deployment = az deployment group show --resource-group $ResourceGroupName --name "lab18-$RunId" --output
      json --only-show-errors | ConvertFrom-Json; if ($deployment.properties.provisioningState -ne 'Succeeded') { throw 'The
      reference deployment did not succeed.' }
    negativeCommand: $foreign = az resource list --resource-group $ResourceGroupName --query "[?tags.runId!='$RunId' || tags.labId!='LAB-18'
      || tags.purpose!='az305-lab']" --output json --only-show-errors | ConvertFrom-Json; if ($foreign.Count -gt 0) { throw
      'The resource group contains an ownership mismatch.' }
    expected: The bounded reference footprint deploys only after execution and cost acknowledgements, and returned IDs are
      persisted immediately in run state.
    negative: Missing pre-mutation state, a failed ownership assertion, or an unrecorded returned resource ID makes the deployment
      unsafe.
    evidence: Preserve deployment operations, schema-valid run state, exact resource IDs, effective tags, and assertion outcomes.
    failure: Partial deployment can leave chargeable workers or dependencies even when the top-level operation fails.
    retry: Reconcile deployment operations with run state, correct the failure, and redeploy idempotently with the same RunId.
    cleanup: Delete only exact run-state IDs whose purpose, labId, runId, and expiresOn tags all match; follow reverse dependency
      order.
    waf: 'Operational Excellence: declarative deployment and immediate state capture make partial failure recoverable.'
  - title: Validate Batch behavior and graceful degradation
    requirement: LAB18-REQ-05
    command: $PoolResourceId = az deployment group show --resource-group $ResourceGroupName --name "lab18-$RunId" --query
      "properties.outputs.cleanupResourceIds.value[?contains(@, '/pools/')]|[0]" --output tsv --only-show-errors; az resource
      show --ids $PoolResourceId --api-version 2024-07-01 --query "{id:id,vmSize:properties.vmSize,fixedScale:properties.scaleSettings.fixedScale,publicIp:properties.networkConfiguration.publicIPAddressConfiguration.provision}"
      --output json --only-show-errors
    positiveCommand: $PoolResourceId = az deployment group show --resource-group $ResourceGroupName --name "lab18-$RunId"
      --query "properties.outputs.cleanupResourceIds.value[?contains(@, '/pools/')]|[0]" --output tsv --only-show-errors;
      $pool = az resource show --ids $PoolResourceId --api-version 2024-07-01 --output json --only-show-errors | ConvertFrom-Json;
      if (-not $pool -or $pool.properties.scaleSettings.fixedScale.targetDedicatedNodes -ne 0 -or $pool.properties.scaleSettings.fixedScale.targetLowPriorityNodes
      -ne 0) { throw 'The included Batch pool is absent or has nonzero target capacity.' }
    negativeCommand: $PoolResourceId = az deployment group show --resource-group $ResourceGroupName --name "lab18-$RunId"
      --query "properties.outputs.cleanupResourceIds.value[?contains(@, '/pools/')]|[0]" --output tsv --only-show-errors;
      $pool = az resource show --ids $PoolResourceId --api-version 2024-07-01 --output json --only-show-errors | ConvertFrom-Json;
      if ($pool.properties.networkConfiguration.publicIPAddressConfiguration.provision -ne 'NoPublicIPAddresses' -or $pool.properties.scaleSettings.autoScale)
      { throw 'The bounded pool permits public node IPs or unbounded autoscale.' }
    expected: The exact pool emitted by the deployment remains at zero nodes, uses no public node IPs, and records the image,
      VM size, subnet, and later scale prerequisites without running a job.
    negative: A nonzero node target, public node IP, autoscale formula, unsupported image pair, or implicit outbound dependency
      must fail the bounded reference review.
    evidence: Store the exact pool ARM ID, zero-node scale settings, image and node-agent pair, subnet, public-IP mode, and
      documented outbound prerequisite.
    failure: A syntactically valid pool can allocate billable or unreachable nodes when scale and outbound prerequisites are
      not checked together.
    retry: Restore both node targets to zero, validate the current image/SKU pair, and document explicit NAT or inspected-firewall
      egress before any separately authorized scale test.
    cleanup: Stop and delete the run-owned pool before other dependencies, then verify no active managed object remains.
    waf: 'Reliability: idempotent tasks and resilient orchestration tolerate individual worker and zone failures.'
