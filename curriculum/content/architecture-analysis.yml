          rationale: Purpose-specific services map ordered commands, routed events, high-throughput telemetry, and governed partner APIs to their native semantics.
          rejectedReason: null
        - name: Event Hubs as the transport for all commands, events, telemetry, and partner requests
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 3, C3: 3, C4: 3, C5: 4}
          rationale: One event log scales well, but command settlement, session ordering, request policy, and per-consumer routing move into application code.
