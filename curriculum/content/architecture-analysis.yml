          rejectedReason: It couples variable catalog structure to relational capacity and provides a less direct global partition model.
        - name: One fixed partition containing the entire catalog
          eligible: false
          disqualifiers:
            - LAB10-REQ-02 requires a partition design that distributes load and isolates the dominant tenant.
          scores: {C1: 1, C2: 2, C3: 2, C4: 3, C5: 2}
