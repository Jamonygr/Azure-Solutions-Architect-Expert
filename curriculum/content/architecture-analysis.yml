schemaVersion: 1.0.0
labs:
  - number: '00'
    architectureAnalysis:
      permissions: No Azure role is needed; the exercise reads local registries and creates state only beneath the copied lab.
      licensing: No Azure service license is used because every checkpoint is an offline bootstrap-contract exercise.
      costNotes: The lab has no cloud consumption; only local container compute and repository storage contribute cost.
      constraints:
        - The bootstrap must write run state before any command that could mutate an external system.
        - Design-simulation mode must refuse every Azure or Microsoft Graph request, even when Execute is supplied.
      assumptions:
        - The learner runs the copied lab inside the frozen dev container with no cached Azure context.
        - Synthetic run identifiers are sufficient to exercise validation, recovery, and cleanup behavior.
      facts:
        data: Inputs and outputs are synthetic JSON documents; secrets, tokens, tenant identifiers, and live evidence are prohibited.
        scale: The contract supports one isolated state directory per RunId and all twenty-eight fixed lab identifiers.
        latency: No service-response target applies; state persistence must complete synchronously before a mutation adapter can be called.
        availability: Bootstrap availability depends only on the copied lab files and frozen container, not on Azure or network reachability.
        rto: Recovery from an interrupted preview is immediate after reopening the persisted run document; no cloud recovery objective applies.
        rpo: The recoverability target is zero lost recorded mutations because every returned identifier must be persisted immediately.
        budget: Cloud spend is zero and the design does not expose a cost-acknowledgement path that can provision a resource.
      candidateAnalyses:
        - name: Shared bootstrap contract with immutable run state and explicit execution gates
          eligible: true
          disqualifiers: []
          scores: {C1: 5, C2: 5, C3: 5, C4: 4, C5: 4}
          rationale: A state-first contract gives every copied lab the same recoverable boundary while explicit execution and acknowledgement gates remain locally testable.
          rejectedReason: null
        - name: Manual operator checklist without persisted state
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 2, C3: 3, C4: 2, C5: 5}
          rationale: A checklist is inexpensive and readable but cannot prove mutation ordering or recover after a partially completed command.
          rejectedReason: Its low recovery and operating scores leave no machine-verifiable record of returned identifiers.
        - name: Central automation account that executes every lab on behalf of learners
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 4, C3: 2, C4: 4, C5: 2}
          rationale: Central execution can standardize runs, but it introduces a privileged shared identity and a runtime dependency on external automation.
          rejectedReason: The shared privilege boundary conflicts with isolated self-paced operation and adds an unnecessary control plane.
        - name: Untracked shell snippets with implicit cached credentials
          eligible: false
          disqualifiers:
            - LAB00-REQ-01 requires explicit validated inputs and durable state before any potential mutation.
          scores: {C1: 1, C2: 1, C3: 1, C4: 2, C5: 5}
          rationale: Ad hoc snippets may be quick to type but neither establish ownership nor bind activity to the requested tenant, subscription, and run.
          rejectedReason: The candidate is ineligible because it violates the state-first mandatory boundary.
      risks:
        - risk: A malformed or reused RunId could merge evidence from unrelated exercises.
          mitigation: Validate the RunId pattern and isolate every artifact beneath the exact run directory before command evaluation.
        - risk: A future author could add a cloud command to a simulation checkpoint.
          mitigation: Parse command surfaces in CI and force design-simulation lifecycle scripts to exit before context discovery.
      waf:
        reliability: Atomic state replacement and resumable status values preserve an intelligible recovery point after interruption.
        security: Explicit tenant and subscription inputs eliminate reliance on cached identity context and sensitive fields are recursively rejected.
        costOptimization: An offline simulation produces the required evidence without standing cloud resources or idle automation accounts.
        operationalExcellence: One lifecycle contract, fixed exit codes, and schema-validated artifacts make faults reproducible across copied labs.
        performanceEfficiency: Local registry lookups and bounded JSON files avoid network latency and scale work only with the current run.
      safeAnalogue: Exercise state creation, injected failure, validation, and idempotent cleanup entirely against synthetic fixtures in the copied lab.
      adrConsequences:
        - Every lab carries duplicated lifecycle helpers so portability is favored over reducing repository line count.
        - Authors must evolve schemas and generators together whenever the public run contract changes.
      changeExpectedRevision: Prove that the chosen bootstrap remains self-contained on an isolated worker and remove any dependency on tenant discovery.
      revisedDecision:
        selectedCandidate: Shared bootstrap contract with immutable run state and explicit execution gates
        mandatoryRequirementId: LAB00-REQ-01
        reason: LAB00-REQ-01 now requires isolated-worker reproducibility, which the local registries, persisted state, and pre-context simulation gate satisfy without tenant access.
        waf:
          reliability: The isolated worker can resume from the same run artifact after process loss.
          security: Removing cached-context discovery narrows the trust boundary to explicit inputs and local files.
          costOptimization: No central worker service or cloud resource must remain allocated between exercises.
          operationalExcellence: The frozen container becomes the single repeatable execution surface for release validation.
          performanceEfficiency: Dependency checks execute locally and avoid remote discovery round trips.

  - number: '01'
    architectureAnalysis:
      permissions: Reader plus Log Analytics Reader is sufficient for inspection; an authorized deployment separately needs rights to create workspaces, DCRs, DCR associations, and diagnostic settings.
      licensing: Seven-year searchable or archived retention can incur Log Analytics commitment, retention, archive, and query charges that must be confirmed for each region.
      costNotes: Cost is driven by regional ingestion volume, interactive-retention days, archive-retention years, cross-workspace queries, and export destinations.
      constraints:
        - Security control-plane records must remain in their originating region for seven years.
        - Application traces have a thirty-day searchable requirement and must not be duplicated into every workspace.
      assumptions:
        - Workloads already emit through Azure Monitor Agent and DCR-compatible sources rather than the legacy Log Analytics agent.
        - Security analysts are permitted to query multiple regional workspaces through a governed workbook scope.
      facts:
        data: Security records and application traces have different residency, retention, access, and evidentiary classifications.
        scale: The estate spans multiple regions and operations teams; measured daily gigabytes per stream remain an owner-supplied sizing input.
        latency: Security triage needs queryable recent records, while seven-year history may tolerate archive-search rehydration delay.
        availability: Regional collection must continue if another region or its workspace is unavailable, with queries degrading to the reachable scope.
        rto: Monitoring restoration time is an operational objective to be agreed with the security owner; the scenario specifies no numerical RTO.
        rpo: Loss tolerance for control-plane audit records is effectively zero after Azure accepts them into the monitoring pipeline.
        budget: Differentiated table plans and retention are required to avoid paying interactive rates for seven years of low-access evidence.
      candidateAnalyses:
        - name: Regional workspaces with cross-workspace queries and policy-driven routing
          eligible: true
          disqualifiers: []
          scores: {C1: 5, C2: 5, C3: 5, C4: 4, C5: 3}
          rationale: Region-bound workspaces satisfy residency and isolate collection failure while DCR routing and cross-workspace views preserve a common operating experience.
          rejectedReason: null
        - name: Central Log Analytics workspace with DCR-based collection and archive export
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 3, C3: 3, C4: 5, C5: 4}
          rationale: Centralization simplifies queries and governance, but exporting after ingestion does not cure an in-region processing requirement.
          rejectedReason: Its simpler operations do not compensate for weaker residency fit and a larger regional failure domain.
        - name: Dedicated workspace per workload with independent retention and access
          eligible: true
          disqualifiers: []
          scores: {C1: 4, C2: 4, C3: 4, C4: 2, C5: 2}
          rationale: Workload isolation gives precise access and retention control but multiplies policy, query, commitment-tier, and incident-correlation overhead.
          rejectedReason: Workspace proliferation raises management and ingestion cost without improving the mandated regional boundary.
        - name: One global workspace retaining every stream interactively for seven years
          eligible: false
          disqualifiers:
            - LAB01-REQ-01 requires the workspace boundary to remain in the approved data region with intentional retention.
          scores: {C1: 1, C2: 3, C3: 1, C4: 4, C5: 1}
          rationale: A global all-hot workspace is operationally familiar but crosses the residency boundary and applies the most expensive retention to low-value traces.
          rejectedReason: The candidate is disqualified by the regional security-record mandate.
      risks:
        - risk: A DCR association omission can create a silent telemetry gap for one workload or region.
          mitigation: Reconcile source inventory to DCR and DCRA resource IDs and fail the coverage assertion for any unmatched source.
        - risk: Cross-workspace permissions can expose regulated records to regional operators who need only application telemetry.
          mitigation: Separate table access and workbook scopes, then test both an allowed query and a denied cross-boundary query.
      waf:
        reliability: Independent regional ingestion limits correlated collection loss and makes partial query behavior explicit.
        security: Workspace and table boundaries enforce residency and least-privilege access for security evidence.
        costOptimization: Thirty-day trace search and archived audit retention align price with access frequency instead of duplicating streams.
        operationalExcellence: Policy-assigned DCRs and shared workbooks make coverage drift and incident handoffs observable.
        performanceEfficiency: Regional ingestion reduces collection paths, while scoped cross-workspace queries avoid scanning unrelated tables.
      safeAnalogue: null
      adrConsequences:
        - Incident queries must name the intended regional workspace set and tolerate an unavailable region.
        - Platform owners must govern DCR association coverage and table-specific retention as separate controls.
      changeExpectedRevision: Split control-plane and application streams by DCR and table policy, then recalculate retention cost without cloning either stream.
      revisedDecision:
        selectedCandidate: Regional workspaces with cross-workspace queries and policy-driven routing
        mandatoryRequirementId: LAB01-REQ-05
        reason: LAB01-REQ-05 makes the seven-year in-region evidence boundary mandatory, so the regional-workspace decision is retained with archive retention for security tables and thirty-day trace search.
        waf:
          reliability: Each region keeps collecting its own control-plane stream during a remote workspace outage.
          security: Long-lived records never traverse the mandated regional boundary.
          costOptimization: Only the regulated stream receives seven-year retention and application traces remain thirty-day searchable.
          operationalExcellence: DCR and table-policy evidence reveals exactly which stream follows each rule.
          performanceEfficiency: Routine trace queries scan short-lived regional tables instead of the seven-year archive.

  - number: '02'
    architectureAnalysis:
      permissions: Reader and Monitoring Reader support inspection; changing alert rules, processing rules, action groups, or workbooks requires separately approved monitoring contributor rights.
      licensing: Metric alerts, log alerts, notification channels, and workbook queries have distinct Azure Monitor charging behavior that owners must validate.
      costNotes: Evaluate alert-rule evaluation frequency, log-query volume, notification fan-out, and operator time lost to false positives.
      constraints:
        - Legitimate promotion traffic can triple for fifteen minutes and cannot be treated automatically as an incident.
        - Customer-impact signals must continue detecting real payment failure during the same burst window.
      assumptions:
        - The service emits request rate, latency, failure rate, dependency health, and deployment annotations with consistent dimensions.
        - Service owners provide an approved SLO and action-group escalation roster before live alert changes.
      facts:
        data: Metric time series, log events, action-group delivery records, and workbook annotations form separate evidence sources.
        scale: A scheduled promotion creates a threefold fifteen-minute demand spike; absolute baseline request volume is intentionally left for measurement.
        latency: Detection must be fast enough to precede customer reports, but the exact alert window follows the approved payment-service SLO.
        availability: Alert routing needs at least one tested receiver path when a team-specific channel or integration is unavailable.
        rto: The incident-response RTO is not supplied; the exercise measures detection and notification delay for owner approval.
        rpo: Historical alert and deployment context must cover the investigation window; transactional payment RPO belongs to the workload design.
        budget: The preferred design trades a small curated alert set for lower query and responder cost than resource-by-resource duplication.
      candidateAnalyses:
        - name: Service-centric alerts with shared action groups and curated workbooks
          eligible: true
          disqualifiers: []
          scores: {C1: 5, C2: 4, C3: 4, C4: 5, C5: 4}
          rationale: SLO-oriented multi-signal alerts correlate customer impact, dependency state, and deployment context while reusable action groups control routing.
          rejectedReason: null
        - name: Resource-by-resource static thresholds with team-specific receivers
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 3, C3: 4, C4: 2, C5: 3}
          rationale: Static resource rules are easy to assign but amplify transient promotion noise and obscure end-to-end payment impact.
          rejectedReason: It scores poorly on operability because duplicated thresholds and receiver lists drift independently.
        - name: External monitoring only with Azure telemetry exported downstream
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 3, C3: 3, C4: 3, C5: 2}
          rationale: External correlation can provide an independent vantage point, although export delay and lost Azure resource context weaken first response.
          rejectedReason: Export-only detection adds latency and makes Azure-native dependency and deployment context harder to preserve.
        - name: One fixed latency threshold copied to every resource
          eligible: false
          disqualifiers:
            - LAB02-REQ-03 requires a service-level query and evaluation window grounded in auditable customer impact.
          scores: {C1: 1, C2: 2, C3: 3, C4: 2, C5: 4}
          rationale: A copied threshold is cheap to create but cannot distinguish a planned demand surge from a failing dependency.
          rejectedReason: It is ineligible because it cannot meet the independent alert-quality acceptance criteria.
      risks:
        - risk: Dynamic thresholds may learn a promotion spike and suppress a genuine payment-path failure.
          mitigation: Combine demand-aware baselines with an invariant failed-transaction or availability SLO signal.
        - risk: A shared action group can become a single notification dependency.
          mitigation: Configure and exercise independent receiver types, then retain delivery-status evidence for each route.
      waf:
        reliability: Multi-signal service alerts detect degraded customer outcomes even when individual resources report healthy.
        security: Least-privilege action-group maintenance and sanitized alert payloads limit exposure through notification channels.
        costOptimization: Curated rules reduce duplicate evaluations and the labor cost of unactionable pages.
        operationalExcellence: Workbooks join SLO, dependency, deployment, and alert evidence into one triage sequence.
        performanceEfficiency: Demand-relative thresholds absorb planned bursts while invariant failure signals protect sensitivity.
      safeAnalogue: null
      adrConsequences:
        - Service owners must maintain SLO thresholds and promotion annotations as product behavior changes.
        - Shared receiver governance becomes a platform responsibility with regular delivery tests.
      changeExpectedRevision: Replace static burst-sensitive thresholds with an SLO and multi-window evaluation that still pages on failed customer transactions.
      revisedDecision:
        selectedCandidate: Service-centric alerts with shared action groups and curated workbooks
        mandatoryRequirementId: LAB02-REQ-03
        reason: LAB02-REQ-03 requires an auditable customer-impact query, so the promotion case uses demand-relative latency evaluation plus an invariant failure-rate signal rather than a static resource threshold.
        waf:
          reliability: Two independent signals prevent a benign traffic surge from hiding a true outage.
          security: Receiver scopes and payload fields remain unchanged while alert logic evolves.
          costOptimization: Noise suppression avoids a threefold burst producing redundant pages and log queries.
          operationalExcellence: Promotion annotations give responders an auditable reason for changed baselines.
          performanceEfficiency: Multi-window evaluation reflects short bursts without permanently raising the latency threshold.

  - number: '03'
    architectureAnalysis:
      permissions: Directory Readers is sufficient for discovery; any External ID, application, federation, or consent change requires a dedicated approved directory role and tenant-change acknowledgement.
      licensing: External ID monthly active user pricing and workforce Conditional Access or governance entitlements must be assessed separately.
      costNotes: Compare active external-user volume, federation operations, help-desk recovery load, and custom identity-code maintenance.
      constraints:
        - Employees, partners, and customers require distinct trust, lifecycle, and authentication journeys.
        - Health attributes must remain outside the external directory even when the mobile journey uses native authentication and social federation.
      assumptions:
        - The application can resolve a directory subject to a profile held in an authorized health-data store.
        - New customer identity design uses Microsoft Entra External ID rather than Azure AD B2C.
      facts:
        data: Directory profiles contain identifiers and authentication attributes; regulated health facts remain in the application data boundary.
        scale: Three identity populations have different issuers and lifecycle owners; monthly active customer count remains a sizing input.
        latency: Interactive sign-in must avoid avoidable cross-system lookups, while profile enrichment occurs after token validation.
        availability: Workforce and customer sign-in failure domains are separated so an external journey incident does not block employee administration.
        rto: Identity-service recovery targets inherit the application access objective and require an owner decision before production approval.
        rpo: Directory object recovery and application-profile recovery are separate; no numerical identity RPO is supplied.
        budget: Managed federation and External ID usage are compared with the support and security cost of custom credentials.
      candidateAnalyses:
        - name: Workforce tenant plus a dedicated External ID external tenant and managed identities
          eligible: true
          disqualifiers: []
          scores: {C1: 5, C2: 4, C3: 5, C4: 4, C5: 4}
          rationale: Separate workforce and external directories establish clear policy boundaries while managed identities remove application secrets from service access.
          rejectedReason: null
        - name: Single workforce tenant for employees partners and customers
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 4, C3: 2, C4: 4, C5: 4}
          rationale: One tenant simplifies administration but couples customer journeys, workforce controls, and regulated profile exposure.
          rejectedReason: Its weak trust-boundary score outweighs the operational convenience of one directory.
        - name: Separate workforce tenants with custom application-managed customer credentials
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 3, C3: 2, C4: 2, C5: 3}
          rationale: Multiple workforce tenants isolate organizations, but custom password storage transfers authentication defense and recovery to the application team.
          rejectedReason: Custom customer credentials create avoidable security and lifecycle ownership that managed External ID provides.
        - name: New Azure AD B2C tenant storing patient profile attributes
          eligible: false
          disqualifiers:
            - LAB03-REQ-03 requires the current External ID service boundary and excludes regulated health attributes from directory profiles.
          scores: {C1: 1, C2: 3, C3: 1, C4: 2, C5: 3}
          rationale: This legacy-oriented proposal combines a superseded new-design direction with prohibited health-profile storage.
          rejectedReason: It is disqualified by both the current-service and data-boundary requirements.
      risks:
        - risk: Subject-to-profile mapping could expose health attributes in tokens or directory extension fields.
          mitigation: Use an opaque subject key and assert that issued claims and external user objects contain no regulated fields.
        - risk: Social identity-provider failure can prevent a customer cohort from signing in.
          mitigation: Define provider-specific monitoring, recovery communication, and an approved alternate authentication journey.
      waf:
        reliability: Separate populations and provider-aware journeys contain authentication failure to the affected trust path.
        security: External ID, minimal claims, managed identities, and isolated health profiles reduce credential and data exposure.
        costOptimization: Monthly-active-user billing and managed federation avoid funding custom password infrastructure.
        operationalExcellence: Lifecycle owners and journey-specific evidence make failed federation and provisioning easier to diagnose.
        performanceEfficiency: Tokens carry only authorization context and defer regulated profile retrieval to the workload data tier.
      safeAnalogue: Inspect synthetic tenant, app, claim, and lifecycle fixtures; do not connect to Graph or create any directory object.
      adrConsequences:
        - Application teams must maintain the opaque link between external subjects and health profiles.
        - Identity operations now own two tenant policy surfaces and provider-specific runbooks.
      changeExpectedRevision: Add native and social sign-in to the External ID journey while proving that health facts remain application-owned.
      revisedDecision:
        selectedCandidate: Workforce tenant plus a dedicated External ID external tenant and managed identities
        mandatoryRequirementId: LAB03-REQ-03
        reason: LAB03-REQ-03 makes the native and social authentication journey mandatory, so External ID is retained with opaque subject claims that never write health attributes to the directory.
        waf:
          reliability: Provider-specific fallback and monitoring isolate a social federation disruption.
          security: Opaque subject claims keep regulated data outside the external directory and tokens.
          costOptimization: Managed native authentication avoids developing and auditing a password service.
          operationalExcellence: Journey tests separately verify federation, token claims, and profile lookup.
          performanceEfficiency: Minimal tokens reduce sign-in payload and leave profile queries to the regional application store.

  - number: '04'
    architectureAnalysis:
      permissions: Reader, Role Based Access Control Reader, and Azure Connected Machine Resource Administrator discovery rights are separated from any role-assignment or local-access mutation.
      licensing: Azure Arc-enabled server features and Microsoft Entra governance or PIM licensing must be verified for time-bound delegation.
      costNotes: Compare governance licensing and Arc management charges with the incident and audit cost of direct standing assignments.
      constraints:
        - The managed-service provider may troubleshoot factory servers for ninety days only.
        - Provider identities cannot change subscription networking or retain permanent local administrator membership.
      assumptions:
        - Factory servers are represented through Azure Arc and have an accountable plant owner.
        - Stable Entra groups can map provider personnel to approved Azure and machine-level duties.
      facts:
        data: The design handles directory groups, Azure role assignments, Arc machine scope, eligibility schedules, and access-review evidence.
        scale: Delegation spans multiple factories and a changing provider roster; exact server and technician counts are inventory inputs.
        latency: Emergency troubleshooting activation must meet the support response target while approval delay remains measured.
        availability: A deputy approver and emergency process are required if the primary plant owner is unavailable.
        rto: The service repair target is owned by plant operations; this lab measures privilege activation and revocation time rather than workload recovery.
        rpo: Authorization configuration must be reconstructable from exported assignments; application-data RPO is outside this decision.
        budget: Time-bound group governance adds license cost but reduces recurring manual assignment and quarterly audit effort.
      candidateAnalyses:
        - name: Group-based Azure RBAC at stable scopes with Arc-aware local delegation
          eligible: true
          disqualifiers: []
          scores: {C1: 5, C2: 4, C3: 5, C4: 5, C5: 3}
          rationale: Stable groups decouple personnel churn from role definitions and Arc-aware local delegation avoids granting subscription networking rights.
          rejectedReason: null
        - name: Direct user assignments on individual resources and servers
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 3, C3: 2, C4: 2, C5: 4}
          rationale: Direct grants can be narrowly scoped but are difficult to expire, review, and reconcile as technicians or factories change.
          rejectedReason: Assignment sprawl and person-by-person expiry weaken both auditability and operations.
        - name: Subscription-wide custom roles mirrored into local administrator groups
          eligible: true
          disqualifiers: []
          scores: {C1: 2, C2: 4, C3: 2, C4: 3, C5: 3}
          rationale: A custom role can describe tasks precisely, yet subscription scope and permanent local mirroring enlarge the blast radius.
          rejectedReason: The broad scope gives the provider capabilities beyond factory troubleshooting and complicates revocation.
        - name: Shared Owner account with permanent factory administrator membership
          eligible: false
          disqualifiers:
            - LAB04-REQ-05 requires accountable separation between Azure actions and persistent guest operating-system privilege.
          scores: {C1: 1, C2: 3, C3: 1, C4: 1, C5: 4}
          rationale: A shared powerful account may reduce activation steps but destroys individual attribution and least privilege.
          rejectedReason: The candidate is ineligible because standing shared privilege violates the provider boundary.
      risks:
        - risk: Azure role expiry may not remove a separately granted operating-system group membership.
          mitigation: Reconcile cloud eligibility and Arc machine authorization as two explicit controls with the same end date.
        - risk: An unavailable approver could delay urgent factory recovery.
          mitigation: Assign a trained deputy, document emergency activation, and review every emergency use after the incident.
      waf:
        reliability: Deputy approval and scoped emergency access preserve support during an identity-owner absence.
        security: Group eligibility, minimal scopes, and Arc-specific delegation remove standing subscription and local-admin privilege.
        costOptimization: Reusable groups reduce assignment administration while governance-license cost remains visible.
        operationalExcellence: Expiry, access reviews, and assignment exports provide one auditable provider offboarding sequence.
        performanceEfficiency: Stable group evaluation scales with personnel turnover without cloning role definitions per server.
      safeAnalogue: Evaluate synthetic role assignments, eligibility schedules, and Arc server mappings with local fixtures; issue no Azure or Graph mutation.
      adrConsequences:
        - Plant owners accept responsibility for time-bound activation and review decisions.
        - Local machine authorization must be monitored separately from Azure RBAC because neither proves the other.
      changeExpectedRevision: Introduce a ninety-day provider group eligibility and prove that network actions and persistent local membership remain absent.
      revisedDecision:
        selectedCandidate: Group-based Azure RBAC at stable scopes with Arc-aware local delegation
        mandatoryRequirementId: LAB04-REQ-05
        reason: LAB04-REQ-05 requires deterministic expiry and prohibited-network evidence, so the selected model adds ninety-day eligible group access plus independent Arc local-membership removal.
        waf:
          reliability: A deputy activation route supports incidents without keeping access permanently active.
          security: Provider permissions end automatically and exclude subscription-network operations.
          costOptimization: Group-based renewal replaces repeated per-user assignment work.
          operationalExcellence: Cloud and server revocation assertions expose partial offboarding.
          performanceEfficiency: One stable role mapping supports the approved server fleet as technicians rotate.

  - number: '05'
    architectureAnalysis:
      permissions: Key Vault Reader supports configuration inspection; vault, key, role-assignment, private-endpoint, or Managed HSM changes require separately approved data-plane and control-plane roles.
      licensing: Premium Key Vault HSM-backed keys and Managed HSM pools use different pricing, administration, and minimum-cost models.
      costNotes: Include vault transactions, private connectivity, certificate renewal operations, and the continuously allocated Managed HSM pool.
      constraints:
        - Payment secrets and keys require private access, RBAC authorization, rotation evidence, and recoverable deletion controls.
        - The acquired card workload requires a single-tenant FIPS-validated HSM administration boundary separate from application vaults.
      assumptions:
        - Applications support managed identity and can rotate key or secret references without embedding credentials.
        - Security owners approve emergency recovery responsibilities before enabling a production cryptographic boundary.
      facts:
        data: The inventory distinguishes secrets, certificates, encryption keys, HSM keys, owners, expiry dates, and recovery settings.
        scale: Multiple applications share payment-vault operations, while the acquired processor introduces one separately governed HSM workload.
        latency: Cryptographic calls remain on private network paths; the owner must benchmark workload-specific operation latency before sizing.
        availability: Vault regional resiliency and application retry behavior are assessed separately from Managed HSM disaster-recovery procedures.
        rto: Key-access restoration must fit the payment-service recovery objective, but no numerical value is supplied in the scenario.
        rpo: Cryptographic material must remain recoverable through soft delete and purge protection; rotation history loss is not accepted.
        budget: Premium vaults suit shared application assets, while the fixed Managed HSM cost is justified only for the acquired regulated boundary.
      candidateAnalyses:
        - name: Azure Key Vault Premium with RBAC and private endpoints
          eligible: true
          disqualifiers: []
          scores: {C1: 5, C2: 4, C3: 5, C4: 4, C5: 3}
          rationale: Premium vaults provide HSM-backed keys, secret and certificate management, managed-identity access, and a bounded private application interface.
          rejectedReason: null
        - name: Azure Managed HSM with centralized HSM administration
          eligible: true
          disqualifiers: []
          scores: {C1: 4, C2: 4, C3: 5, C4: 3, C5: 2}
          rationale: Managed HSM creates a single-tenant cryptographic boundary and distinct administration model, but does not replace general secret and certificate storage.
          rejectedReason: The initial shared application scope does not justify moving every asset into a costlier key-only HSM pool.
        - name: Application-owned encrypted configuration in general-purpose storage
          eligible: true
          disqualifiers: []
          scores: {C1: 2, C2: 2, C3: 2, C4: 2, C5: 4}
          rationale: Application encryption can protect stored values but transfers key hierarchy, rotation, audit, and recovery duties to each workload.
          rejectedReason: It provides weaker centralized control and creates duplicated key-management code across payment applications.
        - name: Plaintext secrets in deployment variables and source-controlled parameters
          eligible: false
          disqualifiers:
            - LAB05-REQ-02 requires nonexportable or protected cryptographic material with least-privilege access and rotation evidence.
          scores: {C1: 1, C2: 1, C3: 1, C4: 2, C5: 5}
          rationale: Plaintext variables minimize initial setup but expose credentials to build logs, repositories, and broad deployment identities.
          rejectedReason: The proposal is ineligible because it cannot meet the mandatory secret-protection boundary.
      risks:
        - risk: Enabling a private endpoint without validated name resolution can make the vault unreachable to payment workloads.
          mitigation: Test private DNS resolution and a permitted managed-identity operation before disabling the public path.
        - risk: Separating Managed HSM administration can leave too few trained recovery officers.
          mitigation: Assign independent deputies, rehearse quorum and recovery procedures, and monitor administrator-role expiry.
      waf:
        reliability: Soft delete, purge protection, tested rotation, and explicit HSM recovery ownership reduce key-loss outages.
        security: RBAC, private endpoints, managed identities, and a separate single-tenant HSM boundary enforce cryptographic least privilege.
        costOptimization: Premium vaults remain the economical shared service and Managed HSM is limited to the workload that mandates it.
        operationalExcellence: Expiry inventory, rotation alerts, and recovery drills turn cryptographic lifecycle into an auditable runbook.
        performanceEfficiency: Applications reuse managed identities and private endpoints while key-operation throughput is benchmarked per service.
      safeAnalogue: null
      adrConsequences:
