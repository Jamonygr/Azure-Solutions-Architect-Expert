  - number: '15'
    architectureAnalysis:
      permissions: Virtual machine, SKU, and backup read roles support assessment; protection, immutability, restore, failover, or compute changes require separate authorization.
      licensing: Azure Backup protected instances and storage, Site Recovery protected instances, restored disks, and temporary isolated compute are separately billed.
      costNotes: Compare zone-spread steady capacity, retained recovery points, cross-region replication where allowed, and short-lived isolated restore resources.
      constraints:
        - Clinical coordination must survive a datacenter failure and restore compromised VMs without reconnecting unsafe systems.
        - A known-clean point must be restorable within two hours even when the latest three recovery points are suspect.
      assumptions:
        - Application tiers can run across supported availability zones and have documented startup dependencies.
        - Security can classify a recovery point and approve release from a quarantined restore network.
      facts:
        data: VM inventory includes zones, disks, backup policy, recovery points, dependencies, health, and isolation evidence.
        scale: Windows and Linux tiers span several machines; exact disk size, change rate, and restore throughput remain measured inputs.
        latency: Clinical transaction checks and restore transfer time are measured separately from infrastructure boot time.
        availability: Zone distribution covers a datacenter fault while trusted restore handles destructive or compromised state.
        rto: Cyber recovery must deliver a known-clean restore within two hours after excluding the latest three points.
        rpo: The acceptable older recovery point depends on backup frequency and forensic confidence and requires clinical owner approval.
        budget: A safe analogue avoids permanent second-region compute while retaining zone capacity and temporary isolated restore cost.
      candidateAnalyses:
        - name: Zone-spread virtual machine scale sets with Azure Backup and isolated restore
          eligible: true
          disqualifiers: []
          scores: {C1: 5, C2: 5, C3: 5, C4: 4, C5: 3}
          rationale: Zone-spread compute covers datacenter loss and Azure Backup supplies protected recovery points for a controlled quarantined restore.
          rejectedReason: null
        - name: Availability sets with locally redundant vault protection
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 2, C3: 4, C4: 3, C5: 4}
          rationale: Availability sets distribute host faults but do not establish a zone boundary and local vault redundancy enlarges regional-loss exposure.
          rejectedReason: It does not meet the datacenter-failure requirement as directly as zone-spread placement.
        - name: Azure Site Recovery warm replicas in a secondary region for every virtual machine
          eligible: true
          disqualifiers: []
          scores: {C1: 4, C2: 5, C3: 4, C4: 3, C5: 1}
          rationale: Warm replicas improve regional recovery but cost more and may replicate compromised state without trusted-point selection.
          rejectedReason: Uniform replication exceeds the lab budget and does not replace immutable clean recovery points.
        - name: In-place production restore over the suspected virtual machines
          eligible: false
          disqualifiers:
            - LAB15-REQ-04 requires quarantine, malware inspection, application validation, and release approval before reconnection.
          scores: {C1: 1, C2: 2, C3: 1, C4: 2, C5: 4}
          rationale: An in-place restore uses fewer resources but destroys rollback evidence and can reconnect compromise to production.
          rejectedReason: It is disqualified because a trusted isolated-restore boundary is mandatory.
      risks:
        - risk: Excluding three recovery points may leave no point inside the two-hour transfer and validation window.
          mitigation: Increase protected-point frequency or pre-stage isolated restore capacity after measuring older-point restore duration.
        - risk: A zone-spread VM set can still depend on a single-zone database or ingress component.
          mitigation: Map and assert every upstream dependency's failure domain before accepting the compute availability result.
      waf:
        reliability: Zone placement, backup coverage, clean-point selection, and dependency-aware startup address distinct failure modes.
        security: Immutable recovery points and quarantined validation prevent compromised machines from rejoining automatically.
        costOptimization: Permanent capacity covers zonal availability while secondary-region and restore resources remain risk-based.
        operationalExcellence: Timed restore, forensic approval, transaction checks, and rollback form one rehearsable recovery record.
        performanceEfficiency: SKU and degraded-capacity evidence ensure surviving zones and restore hosts can process the clinical load.
      safeAnalogue: Model recovery-point rejection, isolated-network validation, startup waves, and cleanup with synthetic VM and backup fixtures only.
      adrConsequences:
        - Backup policy must retain enough points that rejecting the newest three still leaves a recoverable candidate.
        - Security approval becomes part of the measured clinical recovery path, not a post-restore note.
      changeExpectedRevision: Increase protected-point depth and preplan isolated restore capacity so the fourth-newest trusted point can pass within two hours.
      revisedDecision:
        selectedCandidate: Zone-spread virtual machine scale sets with Azure Backup and isolated restore
        mandatoryRequirementId: LAB15-REQ-04
        reason: LAB15-REQ-04 makes isolated trusted recovery mandatory, so the selected design adds enough immutable points and prevalidated quarantine capacity to reject three suspect copies and finish within two hours.
        waf:
          reliability: A deeper point set and measured restore throughput protect the two-hour target.
          security: Forensic rejection and quarantine remain gates before any production reconnection.
          costOptimization: Temporary restore capacity is funded instead of a full permanent secondary estate.
          operationalExcellence: Exercises record selection, transfer, validation, approval, and rollback timestamps.
          performanceEfficiency: Prevalidated restore sizing avoids discovering disk-throughput limits during a cyber event.

