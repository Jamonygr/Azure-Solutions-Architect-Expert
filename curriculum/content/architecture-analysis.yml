        data: Virtual machines, relational data, and large engineering files use distinct replication, integrity, and cutover mechanisms.
        scale: Bulk files are preseeded and only the final fifteen-minute delta enters the outage path; measured bytes and change rate determine feasibility.
        latency: The critical path includes final synchronization, validation, redirection, and business acceptance inside ninety minutes.
        availability: Source systems remain the rollback authority until target integrity and manufacturing transactions pass.
        rto: The migration outage ceiling is ninety minutes from the approved freeze to service redirection.
        rpo: Engineering-file writes continue until fifteen minutes before redirection, defining the maximum planned file delta window.
        budget: Staged replication and temporary dual running are funded to reduce outage risk and avoid emergency transfer capacity.
      candidateAnalyses:
        - name: Azure Migrate plus Azure Database Migration Service and staged AzCopy transfer
          eligible: true
          disqualifiers: []
          scores: {C1: 5, C2: 5, C3: 4, C4: 4, C5: 4}
          rationale: Specialized migration paths preseed each workload type, preserve assessment and integrity evidence, and constrain final deltas.
          rejectedReason: null
        - name: Manual virtual machine rebuild plus database backup restore and one-time file copy
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 2, C3: 3, C4: 2, C5: 4}
          rationale: Manual rebuild and restore are familiar but put full transfer, configuration, and troubleshooting into the outage window.
          rejectedReason: The shortened window cannot absorb full database and engineering-file copies plus manual validation.
        - name: Partner replication appliance for all servers, databases, and files as one opaque unit
          eligible: true
          disqualifiers: []
          scores: {C1: 4, C2: 4, C3: 3, C4: 2, C5: 2}
          rationale: An appliance can simplify bulk movement but obscures workload-specific consistency, integrity, and rollback evidence.
          rejectedReason: Opaque replication weakens independent database, file, and VM acceptance even if transfer completes.
        - name: Unstaged live copy with no source rollback point
          eligible: false
          disqualifiers:
            - LAB23-REQ-05 requires a timed cutover with integrity proof and an executable rollback decision.
          scores: {C1: 1, C2: 1, C3: 2, C4: 1, C5: 4}
          rationale: Copying once during outage avoids temporary storage but makes duration unpredictable and destroys a safe decision point.
          rejectedReason: It is ineligible because neither the ninety-minute window nor reversibility can be proven.
      risks:
        - risk: Engineering-file churn in the final fifteen minutes can exceed available transfer throughput.
          mitigation: Measure change rate, journal final deltas, set a go/no-go threshold, and preserve source write logs for reconciliation.
        - risk: A successful infrastructure cutover can hide database or file inconsistency.
          mitigation: Run workload-specific row, checksum, and manufacturing transaction assertions before redirecting users.
      waf:
        reliability: Preseeding, independent consistency checks, and preserved source rollback reduce cutover failure impact.
        security: Managed identities, private transfer paths, sanitized evidence, and least-privilege migration roles protect source data.
        costOptimization: Temporary replication and dual running are bounded to the period that buys a shorter controlled outage.
        operationalExcellence: Timed gates, owners, integrity results, redirection, and rollback criteria create an executable cutover record.
        performanceEfficiency: Only measured final deltas and validation remain inside the ninety-minute critical path.
      safeAnalogue: Replay synthetic VM, database, and file manifests through preseed, delta, checksum, cutover, and rollback gates without starting a migration.
      adrConsequences:
        - Source systems remain authoritative until every workload-specific acceptance check passes.
        - File change rate and network throughput become explicit go/no-go evidence fifteen minutes before redirection.
      changeExpectedRevision: Prestage all bulk data, journal the final file delta, and compress the ordered cutover gates into ninety minutes.
      revisedDecision:
        selectedCandidate: Azure Migrate plus Azure Database Migration Service and staged AzCopy transfer
        mandatoryRequirementId: LAB23-REQ-05
        reason: LAB23-REQ-05 requires a ninety-minute outage with writes continuing to minute fifteen, so staged services remain selected and only recorded deltas plus acceptance enter the critical path.
        waf:
          reliability: A preserved source and explicit abort threshold keep the shortened event reversible.
          security: Final deltas travel through the same approved protected transfer boundary.
          costOptimization: Temporary staging cost avoids emergency bandwidth and extended factory downtime.
          operationalExcellence: Minute-by-minute gates expose when to continue, abort, or roll back.
          performanceEfficiency: Preseeded bulk data leaves a measured fifteen-minute write delta for final transfer.

  - number: '24'
    architectureAnalysis:
      permissions: Front Door, ExpressRoute, VPN, Virtual WAN, routing, and network monitoring read roles support inspection; profile, circuit, gateway, route, or encryption changes require separate authorization.
      licensing: Front Door Premium, ExpressRoute circuits and gateways, Virtual WAN hubs, VPN gateways, bandwidth, and monitoring each have recurring charges.
      costNotes: Include dual circuits, provider ports, gateway scale units, VPN peak capacity, Front Door requests and transfer, and encrypted-path operations.
      constraints:
        - Customer entry must remain globally available while risk-system access follows predictable private paths through circuit or tunnel failure.
        - Private transaction traffic must be encrypted over ExpressRoute and the backup VPN must carry four hours of full peak load.
      assumptions:
        - Colocation and network providers support the selected ExpressRoute encryption option or application-layer encryption.
        - Branch and hub address spaces permit deterministic routing without overlapping prefixes.
      facts:
        data: Customer HTTPS traffic and private transaction flows cross distinct edge, WAN, routing, inspection, and encryption boundaries.
        scale: Backup VPN is sized for one hundred percent of measured peak transaction traffic for four hours; circuit throughput remains measured evidence.
        latency: Front Door optimizes customer entry and ExpressRoute serves private latency, with encrypted VPN failover tested against the workload target.
        availability: Dual circuits, independent paths, VPN fallback, and hub routing cover provider, gateway, and connection failures separately.
        rto: Path convergence must occur within the risk-system recovery objective; no unsupported numerical target is assigned.
        rpo: Connectivity carries transactions but does not define their data RPO; in-flight retry and idempotency remain application requirements.
        budget: Full-size VPN standby and encrypted circuit paths are explicit regulatory continuity costs rather than assumed free redundancy.
      candidateAnalyses:
        - name: Front Door Premium with dual ExpressRoute connectivity, VPN failover, and Virtual WAN transit
          eligible: true
          disqualifiers: []
          scores: {C1: 5, C2: 5, C3: 5, C4: 4, C5: 2}
          rationale: Premium edge security, redundant private circuits, scaled VPN fallback, and managed transit form explicit customer and private failure paths.
          rejectedReason: null
        - name: Regional Application Gateway with internet VPN tunnels and manual branch routing
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 3, C3: 4, C4: 2, C5: 4}
          rationale: Regional ingress and VPN can reduce cost, but global entry, route convergence, and manual branch failover are weaker.
          rejectedReason: It lacks the selected design's global edge and predictable automated transit behavior.
        - name: Front Door Standard with provider-managed SD-WAN and direct spoke connections
          eligible: true
          disqualifiers: []
          scores: {C1: 4, C2: 4, C3: 3, C4: 3, C5: 3}
          rationale: Provider SD-WAN may simplify branch operations, but direct spokes fragment route and security ownership and Standard lacks Premium private-origin capabilities.
          rejectedReason: Split provider and spoke controls make end-to-end private path evidence harder to establish.
        - name: One ExpressRoute circuit with unencrypted private traffic and undersized VPN
          eligible: false
          disqualifiers:
            - LAB24-REQ-02 requires encrypted private paths and a VPN failover design sized to the approved traffic load.
          scores: {C1: 1, C2: 1, C3: 1, C4: 3, C5: 4}
          rationale: Minimal redundant capacity lowers cost but leaves a circuit failure and unencrypted path outside the regulatory contract.
          rejectedReason: It is ineligible because both encryption and backup-capacity requirements are mandatory.
      risks:
        - risk: Encryption overhead can reduce effective throughput below the four-hour peak requirement.
          mitigation: Load-test encrypted circuit and VPN paths with production packet sizes and reserve measured headroom.
        - risk: Advertised routes can prefer an unintended path and bypass inspection during failover.
          mitigation: Capture effective routes and next hops for normal, circuit-loss, and recovery states before approval.
      waf:
        reliability: Independent edge, dual-circuit, VPN, gateway, and route tests expose each connectivity failure domain.
        security: Premium edge controls and encrypted private transport protect both public entry and regulated transactions.
        costOptimization: Redundant circuits and full VPN capacity are tied to regulatory continuity instead of duplicated indiscriminately.
        operationalExcellence: Route, encryption, health, failover, and restoration evidence provide a deterministic network runbook.
        performanceEfficiency: Measured encrypted throughput sizes gateways and tunnels for the full four-hour peak.
      safeAnalogue: Inspect synthetic topology, routes, cipher requirements, and capacity calculations; use the offline Front Door REST fixture and issue no network change.
      adrConsequences:
        - Network owners must operate and exercise both circuit and VPN encryption paths at production-equivalent load.
        - Effective-route evidence becomes a release artifact because nominal connection health cannot prove path choice.
      changeExpectedRevision: Add approved encryption to the ExpressRoute path and size the VPN gateway from measured encrypted peak throughput for four hours.
      revisedDecision:
        selectedCandidate: Front Door Premium with dual ExpressRoute connectivity, VPN failover, and Virtual WAN transit
        mandatoryRequirementId: LAB24-REQ-02
        reason: LAB24-REQ-02 requires explicit private-circuit and VPN failover design, so the selected path adds ExpressRoute encryption and a load-tested full-peak VPN capacity floor.
        waf:
          reliability: Full-capacity VPN prevents regulatory traffic from becoming a partial service during circuit loss.
          security: Transaction traffic remains encrypted on primary and fallback private paths.
          costOptimization: Higher gateway and encryption cost is attributed to the four-hour compliance objective.
          operationalExcellence: Normal, failure, and restoration route captures prove the intended path.
          performanceEfficiency: Gateway selection follows encrypted throughput measurements rather than nominal SKU bandwidth.

  - number: '25'
    architectureAnalysis:
      permissions: Front Door, Application Gateway, Firewall, Load Balancer, NAT Gateway, NSG, route, and Network Watcher read roles support review; rule or resource changes require separate authorization.
      licensing: Premium WAF and Firewall tiers, inspection data, gateway capacity, NAT processing and addresses, logs, and Front Door requests contribute recurring cost.
      costNotes: Attribute global edge, regional WAF units, firewall scale, TLS inspection, outbound data, NAT ports, logs, and redundant-zone capacity.
      constraints:
        - Clinical ingress, east-west, and outbound traffic must remain controlled through zonal or regional component failure.
        - Outbound updates require FQDN allowlisting and TLS inspection except one certificate-pinned vendor that cannot be intercepted.
      assumptions:
        - Clinical flows have named owners, source, destination, protocol, inspection need, and failure behavior.
        - The pinned vendor endpoint can be narrowly identified and monitored without granting a broad inspection bypass.
      facts:
        data: Flow inventory covers patient-facing HTTPS, internal service paths, health probes, update destinations, logs, and certificate exceptions.
        scale: Gateway, firewall, and NAT capacity follow measured concurrent connections, throughput, and source-port demand.
        latency: TLS inspection and multiple traffic hops must preserve the clinical response target, which remains an owner-supplied value.
        availability: Global edge, zonal gateways, firewall scaling, explicit Standard Load Balancer outbound design, and NAT cover separate failures.
        rto: Regional ingress and egress restoration must meet the clinical service objective; no fabricated numerical RTO is introduced.
        rpo: Network controls do not set clinical-data RPO; connection retry must avoid duplicating state-changing requests.
        budget: Premium inspection and redundant components are limited to flows whose security and continuity classification requires them.
      candidateAnalyses:
        - name: Front Door Premium, Application Gateway WAF v2, Azure Firewall Premium, Standard Load Balancer, and NAT Gateway
          eligible: true
          disqualifiers: []
          scores: {C1: 5, C2: 5, C3: 5, C4: 5, C5: 2}
          rationale: Layered global, regional, east-west, and explicit outbound services provide native WAF, TLS inspection, FQDN policy, and failure-domain controls.
          rejectedReason: null
        - name: Traffic Manager, regional WAF gateways, NSG-only inspection, Standard Load Balancer, and NAT Gateway
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 4, C3: 2, C4: 4, C5: 4}
          rationale: DNS steering and NSGs lower cost but cannot provide centralized FQDN filtering or TLS inspection for outbound content.
          rejectedReason: The model cannot meet the new outbound inspection requirement without adding another control plane.
        - name: Front Door Standard, third-party NVAs behind Gateway Load Balancer, and centralized proxy egress
          eligible: true
          disqualifiers: []
          scores: {C1: 4, C2: 4, C3: 5, C4: 2, C5: 2}
          rationale: NVAs can deliver advanced inspection and vendor features, though appliance scaling, patching, routes, and support become customer responsibilities.
          rejectedReason: Equivalent controls carry greater lifecycle and routing complexity than the managed-service design.
        - name: Basic Load Balancer implicit outbound with unrestricted internet egress
          eligible: false
          disqualifiers:
            - LAB25-REQ-04 requires Standard Load Balancer with explicit outbound connectivity and governed destination policy.
          scores: {C1: 1, C2: 1, C3: 1, C4: 2, C5: 4}
          rationale: Implicit outbound and unrestricted egress avoid policy configuration but provide neither the supported availability baseline nor destination control.
          rejectedReason: It is ineligible because current-service and mandatory outbound requirements are unmet.
      risks:
        - risk: A broad TLS bypass for the pinned vendor can become an unmonitored exfiltration route.
          mitigation: Scope bypass to exact FQDN and flow identity, retain SNI and connection logs, and review vendor certificate changes.
        - risk: Centralized inspection can exhaust SNAT ports or throughput during a regional event.
          mitigation: Calculate peak concurrent flows, distribute NAT capacity, and load-test the surviving zone and regional path.
      waf:
        reliability: Layered health probes, zonal capacity, regional routing, and explicit outbound remove implicit traffic dependencies.
        security: Premium WAF, firewall FQDN policy, TLS inspection, and a narrow pinned-certificate exception enforce flow intent.
        costOptimization: Premium controls apply to classified clinical paths and capacity follows measured throughput and connection demand.
        operationalExcellence: Effective routes, rule hits, certificates, probes, NAT ports, and exception ownership form the network evidence set.
        performanceEfficiency: Each hop and inspection stage is measured so security does not silently consume the clinical latency budget.
      safeAnalogue: Evaluate synthetic flows, routes, rules, health, NAT-port, and pinned-certificate fixtures; make no network or policy change.
      adrConsequences:
        - The certificate-pinned vendor receives a narrowly governed TLS-inspection exception with an owner and review date.
        - Standard Load Balancer never supplies accidental outbound access; NAT and firewall routing are deliberate dependencies.
      changeExpectedRevision: Add FQDN-filtered TLS inspection and a single monitored nonintercept exception for the pinned vendor.
      revisedDecision:
        selectedCandidate: Front Door Premium, Application Gateway WAF v2, Azure Firewall Premium, Standard Load Balancer, and NAT Gateway
        mandatoryRequirementId: LAB25-REQ-02
        reason: LAB25-REQ-02 requires owned FQDN and TLS inspection policy, so the selected design adds an exact pinned-vendor bypass with independent logging and expiry review.
        waf:
          reliability: The vendor exception remains reachable through explicit redundant outbound paths.
          security: All other update traffic is inspected and the bypass is constrained to the exact destination.
          costOptimization: Premium inspection spend remains tied to clinical flows instead of a blanket enterprise rollout.
          operationalExcellence: Rule hits, certificates, owner, and review date make the exceptional path auditable.
          performanceEfficiency: Inspection and bypass latency are tested independently against clinical response needs.

  - number: '26'
    architectureAnalysis:
      permissions: Architecture review uses read-only identity, policy, network, application, data, and monitoring evidence; the safe analogue needs only a bounded resource-group deployment role when explicitly authorized.
      licensing: Front Door Premium, regional PaaS, managed data replicas, private networking, monitoring, governance, and security tiers all require current regional estimates.
      costNotes: Model two regional stamps, global edge, geography-isolated profiles, anonymous catalog replicas, reserved baselines, burst capacity, logs, and exercises.
      constraints:
        - The launch platform needs secure global delivery, controlled regional failure, auditable governance, and a defensible production budget.
        - Customer profiles must remain in one geography while anonymous catalog traffic survives a complete regional outage globally.
      assumptions:
        - The application separates profile identity and personalization from anonymous catalog content at API and data layers.
        - Target regions support the selected PaaS, availability-zone, private endpoint, and monitoring capabilities.
      facts:
        data: Customer profiles are geography-bound; anonymous catalog, configuration, events, audit, and operational telemetry have separate distribution rules.
        scale: Global launch demand varies by market; request rate, profile volume, catalog size, and regional concurrency are measured sizing inputs.
        latency: Anonymous catalog uses global edge and regional stamps, while profile operations route only to their authorized geography.
        availability: Two regional PaaS stamps and global routing preserve catalog service; profile continuity remains inside its legal geography.
        rto: Catalog regional failover follows an owner-tested target; profile recovery cannot violate residency to improve restoration time.
        rpo: Profile replication stays within geography and catalog rebuild or replication has an independently approved freshness tolerance.
        budget: Active regional catalog capacity is justified by launch continuity, while profile stacks and premium features are scoped by market.
      candidateAnalyses:
        - name: Active-active regional PaaS stamps behind Front Door Premium with globally coordinated data services
          eligible: true
          disqualifiers: []
          scores: {C1: 5, C2: 5, C3: 5, C4: 5, C5: 3}
          rationale: PaaS stamps and Premium edge controls support independent regional release and routing while data services can be split by residency class.
          rejectedReason: null
        - name: Active-passive AKS clusters with database failover and a warm secondary region
          eligible: true
          disqualifiers: []
          scores: {C1: 4, C2: 5, C3: 4, C4: 2, C5: 2}
          rationale: AKS offers application portability and warm recovery but adds cluster, upgrade, policy, and capacity operations to launch readiness.
          rejectedReason: The platform does not need Kubernetes-specific control enough to justify its operational burden and slower passive activation.
        - name: Single-region modular PaaS platform with cross-region backups and rebuild automation
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 2, C3: 5, C4: 4, C5: 5}
          rationale: A single region lowers steady cost and keeps modules clear, but backup rebuild cannot sustain catalog traffic through a full regional outage.
          rejectedReason: Its recovery behavior misses the anonymous-catalog continuity outcome despite attractive economics.
        - name: One global customer-profile store replicated to every launch region
          eligible: false
          disqualifiers:
            - LAB26-REQ-01 requires mandatory residency constraints to be reconciled with the selected architecture.
          scores: {C1: 1, C2: 5, C3: 1, C4: 4, C5: 3}
          rationale: Universal profile replication simplifies failover but ignores the mandatory geography boundary.
          rejectedReason: It is ineligible because profile availability cannot override residency.
      risks:
        - risk: Anonymous responses can accidentally include profile-derived fields and enter the global cache or logs.
          mitigation: Enforce separate contracts, classify fields, and assert that global responses and telemetry contain no profile attributes.
        - risk: Active-active stamps can drift in policy, secret references, or feature configuration.
          mitigation: Promote immutable Bicep and configuration versions and block release when regional evidence hashes differ.
      waf:
        reliability: Independent stamps and global routing keep catalog service available through regional loss while honoring profile boundaries.
        security: Premium edge controls, private origins, managed identities, policy, and geography-scoped data reduce exposure.
        costOptimization: Shared global catalog capacity and market-specific profile stacks make continuity and residency spend attributable.
        operationalExcellence: Declarative releases, regional assertions, failover exercises, governance evidence, and rollback support fast controlled delivery.
        performanceEfficiency: Edge caching and regional PaaS autoscale serve anonymous demand while profile calls remain geography-local.
      safeAnalogue: Use the self-contained Bicep template only as a bounded tagged topology analogue; validate data-boundary and failover decisions primarily with offline fixtures.
      adrConsequences:
        - APIs and data contracts permanently separate anonymous catalog content from geography-bound customer profiles.
        - Regional releases must prove parity without copying regulated profile data across the boundary.
      changeExpectedRevision: Partition profile storage and routing by geography while leaving catalog content eligible for global active-active delivery.
      revisedDecision:
        selectedCandidate: Active-active regional PaaS stamps behind Front Door Premium with globally coordinated data services
        mandatoryRequirementId: LAB26-REQ-01
        reason: LAB26-REQ-01 requires mandatory constraints to drive the architecture decision, so active-active stamps split into geography-specific profile planes and a separate global anonymous catalog plane.
        waf:
          reliability: Anonymous catalog survives a regional loss without failing over restricted profile data unlawfully.
          security: Profile routes, stores, caches, and logs are constrained to the assigned geography.
          costOptimization: Global replication is purchased for catalog data, while profile capacity is funded per regulated market.
          operationalExcellence: Contract and routing assertions detect profile leakage before regional release.
          performanceEfficiency: Catalog requests use edge and nearest healthy stamp; profile calls remain within geography.

  - number: '27'
    architectureAnalysis:
      permissions: No Azure or Graph role is needed for the capstone simulation; real discovery would use separately approved read-only inventory across both tenants and hybrid resources.
      licensing: Azure Arc, migration tooling, managed PaaS, connectivity, edge databases, governance, and dual-tenant operations require workload-specific estimates.
      costNotes: Compare coexistence, branch edge capacity, two tenant landing zones, data transfer, modernization waves, licenses, rollback retention, and retired datacenter cost.
      constraints:
        - Modernization must preserve branch service, regulatory evidence, reversibility, and transparent residual risk.
        - A merger adds a second tenant and regulated geography, and branch order capture must work for eight hours without WAN connectivity.
      assumptions:
        - Branch applications can persist orders locally with stable identifiers and synchronize through an idempotent contract.
        - Tenant and geography ownership can be assigned before a workload enters a modernization wave.
      facts:
        data: Orders, product reference data, identities, dependency records, Arc inventory, migration evidence, and regulatory classifications cross distinct boundaries.
        scale: Branch count, order rate, eight-hour offline volume, application dependencies, and tenant split are measured in the supplied portfolio.
        latency: Local order capture remains responsive without WAN; synchronization latency is measured after connectivity returns.
        availability: Branch edge operation covers an eight-hour WAN loss while Azure regions, tenants, and datacenters remain separate failure domains.
        rto: Branch capture has effectively immediate local continuity; centralized reconciliation recovery follows an owner-approved target.
        rpo: Accepted offline orders require zero local loss before synchronization, with conflict resolution for updates from both sides.
        budget: Edge capacity and dual-tenant governance are funded where they reduce outage and regulatory risk; indefinite datacenter retention is not free.
      candidateAnalyses:
        - name: Dependency-wave modernization using Azure Arc, Azure Migrate patterns, managed PaaS targets, and staged coexistence
          eligible: true
          disqualifiers: []
          scores: {C1: 5, C2: 5, C3: 5, C4: 4, C5: 4}
          rationale: Dependency waves preserve rollback and evidence while Arc inventory, migration patterns, and PaaS targets support deliberate modernization by workload.
          rejectedReason: null
        - name: Parallel cloud rebuild followed by one enterprise-wide big-bang cutover
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 2, C3: 3, C4: 2, C5: 2}
          rationale: A parallel rebuild can produce a clean target but concentrates dependency, tenant, data, and branch risk in one irreversible event.
          rejectedReason: The combined cutover cannot expose or contain failures by wave and leaves little credible rollback time.
        - name: Indefinite hybrid retention with lifecycle-only virtual machine rehosting
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 4, C3: 3, C4: 3, C5: 2}
          rationale: Long-lived hybrid and rehosting reduce near-term change but preserve datacenter dependency, duplicated governance, and technical debt.
          rejectedReason: It does not deliver the modernization outcome or transparent retirement economics.
        - name: Single-tenant big-bang migration with WAN-dependent branch order entry
          eligible: false
          disqualifiers:
            - LAB27-REQ-04 requires two-tenant geography separation and eight hours of offline branch order capture.
          scores: {C1: 1, C2: 1, C3: 1, C4: 2, C5: 3}
          rationale: Ignoring the merger and edge requirement simplifies a diagram but fails the two newest mandatory business boundaries.
          rejectedReason: It is ineligible because it cannot preserve regulated separation or branch continuity.
      risks:
        - risk: Offline branches can generate conflicting order updates when centralized service continues processing.
          mitigation: Use globally unique order identifiers, versioned commands, deterministic conflict policy, and an exception queue with business ownership.
        - risk: Cross-tenant administration can create hidden shared identities or copy regulated evidence between geographies.
          mitigation: Maintain separate identity and logging boundaries, broker only approved business messages, and test prohibited cross-tenant paths.
      waf:
        reliability: Edge persistence, staged coexistence, dependency waves, and rollback contain WAN, workload, and migration failure.
        security: Tenant and geography boundaries, Arc governance, classified message contracts, and least privilege preserve regulatory separation.
        costOptimization: Wave business cases include coexistence and edge cost alongside eliminated facilities and managed-service value.
        operationalExcellence: Portfolio, dependency, sync, conflict, evidence, cutover, and residual-risk records make modernization governable.
        performanceEfficiency: Local branch writes avoid WAN latency and managed targets scale independently after each approved wave.
      safeAnalogue: Run the complete portfolio, branch-outage, conflict, tenant-boundary, wave, and rollback simulation locally; Lab 27 never queries or deploys Azure.
      adrConsequences:
        - Branch software gains an offline queue and reconciliation responsibility that must be tested at the full eight-hour volume.
        - Two tenant and geography governance planes remain distinct even when business workflows exchange approved messages.
      changeExpectedRevision: Add a second regulated landing-zone boundary and place offline-capable branch order capture ahead of WAN-dependent modernization waves.
      revisedDecision:
        selectedCandidate: Dependency-wave modernization using Azure Arc, Azure Migrate patterns, managed PaaS targets, and staged coexistence
        mandatoryRequirementId: LAB27-REQ-04
        reason: LAB27-REQ-04 requires deterministic continuity and security injects, so dependency waves add an eight-hour branch outbox plus distinct tenant and geography landing-zone boundaries.
        waf:
          reliability: Branch orders remain durable for eight hours and synchronize after WAN recovery.
          security: Tenant and geography planes exchange only classified, authorized business messages.
          costOptimization: Edge and dual-governance costs are visible against avoided branch outage and datacenter expense.
          operationalExcellence: Conflict queues, wave gates, rollback, and residual risk have named owners.
          performanceEfficiency: Local capture avoids WAN delay and post-recovery synchronization is paced to central capacity.
