          rationale: Before the acquired dependency is known, serverless SQL Database best matches intermittent load and minimizes platform administration.
          rejectedReason: null
        - name: Azure SQL Managed Instance General Purpose
          eligible: true
          disqualifiers: []
          scores: {C1: 4, C2: 4, C3: 4, C4: 4, C5: 2}
          rationale: Managed Instance provides broader instance compatibility and managed operations, with a higher continuously allocated cost floor.
          rejectedReason: Its initial cost is not justified until SQL Agent and instance-level dependencies become mandatory.
        - name: Azure Database for PostgreSQL Flexible Server General Purpose
          eligible: true
          disqualifiers: []
          scores: {C1: 2, C2: 4, C3: 4, C4: 3, C5: 3}
          rationale: PostgreSQL is a capable managed relational target, but engine conversion expands schema, code, testing, and cutover work.
          rejectedReason: Engine migration risk is unnecessary for an application whose discovered dependencies remain SQL Server specific.
        - name: Larger Azure SQL Database tier without compatibility remediation
          eligible: false
          disqualifiers:
            - LAB08-REQ-01 requires mandatory engine and instance compatibility to be established before selecting a service tier.
          scores: {C1: 1, C2: 4, C3: 4, C4: 3, C5: 2}
          rationale: More database compute changes capacity but does not add missing instance-scoped compatibility features.
          rejectedReason: The candidate is disqualified because scaling cannot repair a platform compatibility gap.
      risks:
        - risk: Compatibility tooling can miss runtime jobs or infrequently used cross-database paths.
          mitigation: Reconcile assessment output with SQL Agent history, dependency telemetry, and an owner-signed feature inventory.
