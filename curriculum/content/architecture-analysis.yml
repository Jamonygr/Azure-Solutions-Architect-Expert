          rejectedReason: null
        - name: Azure Table Storage with denormalized entities and account-level scale
          eligible: true
          disqualifiers: []
          scores: {C1: 3, C2: 3, C3: 3, C4: 3, C5: 5}
          rationale: Table Storage offers inexpensive key-value access but provides fewer global consistency and tenant-level throughput controls.
          rejectedReason: Lower unit cost does not offset weaker global behavior and limited isolation for the dominant tenant.
