siteInfographics:
  - id: "VIS-LEARNING-LOOP"
    title: "Architecture learning loop"
    caption: "Move from requirements to an evidence-backed decision, validate it safely, and revise it when facts change."
    alt: "Five-stage circular learning loop linking requirements, options, decisions, validation evidence, and revision."
    paletteId: "FOUNDATION"
    kind: "cycle"
    usage: ["docs/site/index.md", "docs/site/paths/quick-start.md"]
    stages:
      - {id: "requirements", label: "Frame requirements", detail: "Separate mandatory facts from preferences."}
      - {id: "options", label: "Compare options", detail: "Apply weights, disqualifiers, and constraints."}
      - {id: "decision", label: "Record the decision", detail: "Select one candidate and state consequences."}
      - {id: "evidence", label: "Validate evidence", detail: "Run independent positive and negative checks."}
      - {id: "revision", label: "Revise deliberately", detail: "Respond to the material change request."}
  - id: "VIS-DOMAIN-COVERAGE"
    title: "AZ-305 domain coverage"
    caption: "The practice sequence mirrors the blueprint weights while preserving one primary lab for every objective."
    alt: "Four proportional domain bars for identity and governance, data, continuity, and infrastructure coverage."
    paletteId: "FOUNDATION"
    kind: "stacked-bars"
    usage: ["docs/site/paths/full-exam.md", "docs/site/catalog.md"]
    stages:
      - {id: "igm", label: "Identity and governance", detail: "Seven labs cover eleven primary objectives."}
      - {id: "data", label: "Data storage", detail: "Six labs cover ten primary objectives."}
      - {id: "bc", label: "Business continuity", detail: "Four labs cover seven primary objectives."}
      - {id: "inf", label: "Infrastructure", detail: "Eight labs cover twenty-one primary objectives."}
  - id: "VIS-JOB-READY"
    title: "Job-ready architecture pathway"
    caption: "Build reusable design habits through focused labs, integrated capstones, and a defensible evidence record."
    alt: "Roadmap from focused design labs through cross-domain capstones to an architecture evidence portfolio."
    paletteId: "CAPSTONE"
    kind: "roadmap"
    usage: ["docs/site/paths/job-ready.md"]
    stages:
      - {id: "focus", label: "Focused decisions", detail: "Practice bounded service and platform choices."}
      - {id: "integrate", label: "Integrated systems", detail: "Connect identity, data, continuity, and infrastructure."}
      - {id: "challenge", label: "Change pressure", detail: "Revise architecture when a mandatory fact changes."}
      - {id: "portfolio", label: "Evidence portfolio", detail: "Retain ADRs, diagrams, checks, and consequences."}
  - id: "VIS-OBJECTIVE-TRACE"
    title: "Objective traceability chain"
    caption: "Every official objective owns one primary lab and connects to requirements, checkpoints, evidence, and assessment items."
    alt: "Traceability flow from an official objective to a primary lab, requirement, checkpoint, evidence, and question."
    paletteId: "FOUNDATION"
    kind: "flow"
    usage: ["docs/site/objective-map.md"]
    stages:
      - {id: "objective", label: "Objective", detail: "Use the exact official blueprint wording."}
      - {id: "lab", label: "Primary lab", detail: "Assign exactly one lab as objective owner."}
      - {id: "requirement", label: "Requirement", detail: "Translate the objective into an architecture need."}
      - {id: "checkpoint", label: "Checkpoint", detail: "Produce independently verifiable evidence."}
      - {id: "assessment", label: "Assessment", detail: "Test the same decision without exposing answers."}
  - id: "VIS-STUDY-ROADMAP"
    title: "Eight-week study roadmap"
    caption: "A paced route moves from safe foundations through four domain waves and finishes with integrated capstone rehearsal."
    alt: "Eight-step roadmap showing foundation, four domain waves, mixed assessment, and two capstone rehearsals."
    paletteId: "FOUNDATION"
    kind: "roadmap"
    usage: ["docs/site/study-plan.md"]
    stages:
      - {id: "week-one", label: "Foundation and identity", detail: "Establish safety, logging, monitoring, and identity."}
      - {id: "week-two", label: "Governance", detail: "Complete authorization, keys, hierarchy, and compliance."}
      - {id: "week-three", label: "Relational data", detail: "Compare relational platform, scale, and protection."}
      - {id: "week-four", label: "Data services", detail: "Cover nonrelational storage, integration, and analytics."}
      - {id: "week-five", label: "Continuity", detail: "Model recovery, availability, backup, and resilience."}
      - {id: "weeks-six-eight", label: "Infrastructure and capstones", detail: "Integrate compute, apps, migration, and networks."}
  - id: "VIS-ASSESSMENT-FLOW"
    title: "Assessment feedback cycle"
    caption: "Questions map to objectives and checkpoints, then direct weak areas back to the exact remediation anchor."
    alt: "Assessment flow from a question through answer evidence, objective coverage, remediation, and a new attempt."
    paletteId: "FOUNDATION"
    kind: "cycle"
    usage: ["docs/site/assessment-dashboard.md"]
    stages:
      - {id: "attempt", label: "Attempt", detail: "Answer without consulting the protected key."}
      - {id: "explain", label: "Explain", detail: "Compare every option-specific rationale."}
      - {id: "map", label: "Map the gap", detail: "Locate the primary objective and checkpoint."}
      - {id: "remediate", label: "Remediate", detail: "Revisit the linked lab decision evidence."}
      - {id: "retry", label: "Retry", detail: "Confirm improvement with a later question set."}
  - id: "VIS-ADR-LOOP"
    title: "Architecture decision record workflow"
    caption: "An ADR preserves context, options, decision logic, consequences, and the trigger for a controlled revision."
    alt: "Decision workflow linking context, candidate analysis, selected option, consequences, and revised decision."
    paletteId: "CAPSTONE"
    kind: "flow"
    usage: ["docs/site/guidance/architecture-decisions.md"]
    stages:
      - {id: "context", label: "Context", detail: "Capture stakeholders, facts, constraints, and assumptions."}
      - {id: "candidates", label: "Candidates", detail: "Score eligible choices and apply disqualifiers."}
      - {id: "selection", label: "Selection", detail: "Choose the highest defensible eligible candidate."}
      - {id: "consequences", label: "Consequences", detail: "State tradeoffs, risks, and mitigations."}
      - {id: "change", label: "Controlled revision", detail: "Cite the mandatory requirement that changed."}
  - id: "VIS-WAF-PILLARS"
    title: "Well-Architected review lenses"
    caption: "Every checkpoint and decision is reviewed through all five Well-Architected Framework pillars."
    alt: "Five equal cards representing reliability, security, cost optimization, operational excellence, and performance efficiency."
    paletteId: "CAPSTONE"
    kind: "pillars"
    usage: ["docs/site/guidance/well-architected.md"]
    stages:
      - {id: "reliability", label: "Reliability", detail: "Meet availability and recovery commitments."}
      - {id: "security", label: "Security", detail: "Protect identities, data, networks, and operations."}
      - {id: "cost", label: "Cost optimization", detail: "Align spend to business value and demand."}
      - {id: "operations", label: "Operational excellence", detail: "Make change observable, repeatable, and safe."}
      - {id: "performance", label: "Performance efficiency", detail: "Match capacity and architecture to workload behavior."}
  - id: "VIS-EVIDENCE-CHAIN"
    title: "Evidence confidence ladder"
    caption: "Confidence rises when an expected result, a negative assertion, provenance, and cleanup state agree."
    alt: "Evidence ladder progressing from expected output to negative assertion, provenance, and verified cleanup."
    paletteId: "IGM"
    kind: "roadmap"
    usage: ["docs/site/guidance/evidence.md"]
    stages:
      - {id: "expected", label: "Expected result", detail: "Record the precise positive condition."}
      - {id: "negative", label: "Negative assertion", detail: "Prove a prohibited or unsafe state is absent."}
      - {id: "provenance", label: "Provenance", detail: "Bind evidence to lab, run, source, and command."}
      - {id: "cleanup", label: "Cleanup proof", detail: "Show that no active managed object remains."}
  - id: "VIS-COMMAND-LANES"
    title: "Command lane lifecycle"
    caption: "Azure CLI and Azure PowerShell follow the same guarded lifecycle while keeping commands lane-correct."
    alt: "Two parallel command lanes moving through preview, state capture, execution, validation, and cleanup."
    paletteId: "INF"
    kind: "swimlanes"
    usage: ["docs/site/guides/azure-cli.md", "docs/site/guides/azure-powershell.md"]
    stages:
      - {id: "preview", label: "Preview", detail: "Validate inputs without a cloud call or state file."}
      - {id: "state", label: "State first", detail: "Write the run record before potential mutation."}
      - {id: "execute", label: "Execute", detail: "Require explicit cost and tenant acknowledgements."}
      - {id: "validate", label: "Validate", detail: "Run independent deployment assertions."}
      - {id: "cleanup", label: "Cleanup", detail: "Verify ownership and remove in dependency order."}
  - id: "VIS-CONTINUITY"
    title: "Continuity objective stack"
    caption: "Business impact establishes RTO and RPO, which drive protection, recovery order, and exercise evidence."
    alt: "Continuity target flow from business impact to RTO and RPO, protection pattern, recovery sequence, and exercise evidence."
    paletteId: "BC"
    kind: "target"
    usage: ["docs/site/guides/continuity.md"]
    stages:
      - {id: "impact", label: "Business impact", detail: "Classify critical services and tolerated loss."}
      - {id: "objectives", label: "RTO and RPO", detail: "Set measurable time and data-loss targets."}
      - {id: "protection", label: "Protection pattern", detail: "Choose backup, replication, availability, or a mix."}
      - {id: "orchestration", label: "Recovery order", detail: "Respect dependencies and communication gates."}
      - {id: "exercise", label: "Exercise evidence", detail: "Measure outcomes without assuming recoverability."}
  - id: "VIS-COST"
    title: "Architecture cost levers"
    caption: "Design costs respond to demand shape, service tier, resilience, data movement, operations, and licensing."
    alt: "Six cost levers surrounding an architecture decision: demand, tier, resilience, transfer, operations, and licensing."
    paletteId: "DATA"
    kind: "levers"
    usage: ["docs/site/guides/cost.md"]
    stages:
      - {id: "demand", label: "Demand shape", detail: "Separate steady, burst, seasonal, and batch load."}
      - {id: "tier", label: "Service tier", detail: "Pay for only the capabilities requirements mandate."}
      - {id: "resilience", label: "Resilience", detail: "Price replicas, zones, regions, and retained backups."}
      - {id: "transfer", label: "Data movement", detail: "Account for ingress patterns, egress, and replication."}
      - {id: "operations", label: "Operations", detail: "Include monitoring, support, and engineering effort."}
      - {id: "licensing", label: "Licensing", detail: "Validate plan and entitlement dependencies."}
  - id: "VIS-LICENSING"
    title: "Licensing decision boundary"
    caption: "A sound recommendation separates technical fit from tenant entitlement, feature plan, and commercial verification."
    alt: "Boundary diagram separating technical architecture fit, required feature plan, tenant entitlement, and commercial verification."
    paletteId: "IGM"
    kind: "boundary"
    usage: ["docs/site/guides/licensing.md"]
    stages:
      - {id: "technical", label: "Technical fit", detail: "Confirm that the service meets functional needs."}
      - {id: "feature", label: "Feature plan", detail: "Identify the specific plan-dependent capability."}
      - {id: "tenant", label: "Tenant entitlement", detail: "Verify who is licensed and where it applies."}
      - {id: "commercial", label: "Commercial check", detail: "Record pricing assumptions without inventing terms."}
  - id: "VIS-MIGRATION"
    title: "Dependency-aware migration waves"
    caption: "Discovery and rationalization shape waves that progress through readiness, rehearsal, cutover, and decommissioning."
    alt: "Migration waves flowing from discovery and dependency mapping through target readiness, rehearsal, cutover, and decommissioning."
    paletteId: "INF"
    kind: "waves"
    usage: ["docs/site/guides/migration.md"]
    stages:
      - {id: "discover", label: "Discover", detail: "Inventory servers, applications, data, owners, and facts."}
      - {id: "dependencies", label: "Map dependencies", detail: "Find technical and business sequence constraints."}
      - {id: "rationalize", label: "Rationalize", detail: "Choose retain, rehost, replatform, refactor, or retire."}
      - {id: "rehearse", label: "Ready and rehearse", detail: "Validate landing zones, replication, and rollback."}
      - {id: "cutover", label: "Cut over", detail: "Use acceptance gates and measured stabilization."}
      - {id: "decommission", label: "Decommission", detail: "Remove legacy dependencies only after evidence."}
  - id: "VIS-PERMISSIONS"
    title: "Permission scope model"
    caption: "Permission design distinguishes identity, control plane, data plane, scope, delegation, and time boundary."
    alt: "Nested permission boundaries for identity, control plane, data plane, scope, delegated group, and eligible activation."
    paletteId: "IGM"
    kind: "boundary"
    usage: ["docs/site/guides/permissions.md"]
    stages:
      - {id: "identity", label: "Identity", detail: "Prefer workload identity or stable governed groups."}
      - {id: "plane", label: "Access plane", detail: "Separate management operations from data access."}
      - {id: "scope", label: "Narrow scope", detail: "Assign at the lowest durable boundary."}
      - {id: "delegation", label: "Delegation", detail: "Use role definitions that omit unrelated actions."}
      - {id: "time", label: "Time boundary", detail: "Prefer eligible and reviewed access over standing rights."}
  - id: "VIS-TROUBLESHOOTING"
    title: "Evidence-led troubleshooting tree"
    caption: "Troubleshooting starts with the failed assertion, isolates ownership and dependency state, then retries safely."
    alt: "Decision tree from a failed assertion through input, ownership, dependency, retry, cleanup, and evidence outcomes."
    paletteId: "BC"
    kind: "decision-tree"
    usage: ["docs/site/guides/troubleshooting.md"]
    stages:
      - {id: "assertion", label: "Locate failed assertion", detail: "Start from the exact positive or negative check."}
      - {id: "inputs", label: "Verify inputs", detail: "Confirm run ID, context, mode, and acknowledgements."}
      - {id: "ownership", label: "Check ownership", detail: "Match exact IDs, tags, and recorded state."}
      - {id: "dependencies", label: "Inspect dependencies", detail: "Identify partial completion and removal order."}
      - {id: "retry", label: "Retry safely", detail: "Use idempotent commands and retain recovery evidence."}

labs:
  - id: "LAB-00"
    folder: "00-safe-architect-bootstrap"
    paletteId: "FOUNDATION"
    banner:
      title: "Safe Bootstrap and Dual-Command Lab Contract"
      eyebrow: "Foundation · guarded lifecycle"
      caption: "Establish the state-first, acknowledgement-gated contract used by every architecture lab."
      alt: "Foundation banner showing a guarded progression from local preflight through state capture, execution, validation, and cleanup."
    topology:
      title: "State-before-mutation safety envelope"
      caption: "Validated inputs and explicit gates create a run record before a bounded operation can begin."
      alt: "Topology showing local preflight and context inputs feeding gates, a run-state record, a bounded operation, and ownership-aware cleanup."
      boundaries:
        - {id: "learner-workstation", label: "Learner workstation"}
        - {id: "run-state", label: "Private run state"}
        - {id: "azure-scope", label: "Intended Azure scope"}
      nodes:
        - {id: "preflight", label: "Toolchain preflight", iconKey: "azure:automation-accounts", boundaryId: "learner-workstation"}
        - {id: "inputs", label: "Declared context", iconKey: "azure:subscriptions", boundaryId: "learner-workstation"}
        - {id: "gates", label: "Cost and tenant gates", iconKey: "azure:cost-management", boundaryId: "learner-workstation"}
        - {id: "state-record", label: "Immutable run record", iconKey: "azure:storage-accounts", boundaryId: "run-state"}
        - {id: "operation", label: "Bounded lab operation", iconKey: "azure:resource-groups", boundaryId: "azure-scope"}
        - {id: "cleanup", label: "Ownership-aware cleanup", iconKey: "azure:resource-groups", boundaryId: "learner-workstation"}
      edges:
        - {from: "preflight", to: "inputs", label: "validated tools"}
        - {from: "inputs", to: "gates", label: "declared IDs and regions"}
        - {from: "gates", to: "state-record", label: "authorize run record"}
        - {from: "state-record", to: "operation", label: "state precedes mutation"}
        - {from: "operation", to: "cleanup", label: "returned IDs and tags"}
        - {from: "cleanup", to: "state-record", label: "post-cleanup status"}
    decisionMatrix:
      title: "Bootstrap contract candidate scorecard"
      caption: "Render weights, scores, eligibility, disqualifiers, and the selected safety contract from the lab decision record."
      alt: "Decision matrix comparing bootstrap safety contracts and highlighting the selected state-first guarded lifecycle."
      sourcePath: "labs/00-safe-architect-bootstrap/design/decision.yml"

  - id: "LAB-01"
    folder: "01-centralized-logging-routing"
    paletteId: "IGM"
    banner:
      title: "Centralized Logging and Diagnostic Routing"
      eyebrow: "Identity, governance, and monitoring · logging"
      caption: "Design regional collection boundaries, policy-driven routing, retention, and economical archive."
      alt: "Identity and monitoring banner connecting Azure resource telemetry to regional workspaces, archive storage, and operators."
    topology:
      title: "Regional logging and routing topology"
      caption: "Azure Monitor Agent and diagnostic settings route workload signals into regional workspaces and governed archive."
